<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D;--surface:#161616;--surface2:#1E1E1E;--border:#2A2A2A;
  --green:#00E676;--green-dim:#00E67615;--red:#FF5252;--red-dim:#FF525215;
  --amber:#FFB300;--amber-dim:#FFB30015;--text:#F0F0F0;--text2:#888;--text3:#444;
}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior:none}
::-webkit-scrollbar{width:0}
input,button{font-family:inherit}
input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:14px 16px;font-size:16px;width:100%;outline:none;transition:border-color .15s}
input:focus{border-color:var(--green)}
input::placeholder{color:var(--text3)}
button{cursor:pointer;border:none;border-radius:12px;font-size:15px;font-weight:600;transition:all .15s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.btn-primary{background:var(--green);color:#000;padding:16px;width:100%;font-size:16px;border-radius:16px}
.btn-ghost{background:var(--surface2);color:var(--text2);padding:14px;width:100%;border:1px solid var(--border)}
.btn-primary:disabled{opacity:.5}
.screen{min-height:100dvh;display:flex;flex-direction:column}
.content{flex:1;padding:24px 20px;max-width:480px;margin:0 auto;width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:12px}
.balance-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.balance-row:last-child{border-bottom:none;padding-bottom:0}
.balance-row:first-child{padding-top:0}
.balance-label{font-size:14px;color:var(--text2)}
.balance-value{font-family:'Space Mono',monospace;font-size:16px;font-weight:700}
.step-num{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.step-title{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:6px}
.step-sub{font-size:14px;color:var(--text2);margin-bottom:28px;line-height:1.5}
.instruction{background:var(--surface2);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid var(--green)}
.instruction-label{font-size:13px;color:var(--text2);margin-bottom:2px}
.instruction-action{font-size:15px;font-weight:600}
.instruction-amount{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--green)}
.big-wrap{position:relative;margin-bottom:24px}
.big-wrap .sym{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-family:'Space Mono',monospace;font-size:28px;font-weight:700;color:var(--text3);pointer-events:none}
.big-input{font-family:'Space Mono',monospace!important;font-size:28px!important;font-weight:700!important;padding:20px 20px 20px 44px!important;border-radius:16px!important}
.nav{display:flex;justify-content:space-around;padding:10px 0 max(10px,env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border);position:sticky;bottom:0}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 12px;background:none;color:var(--text3);font-size:11px;border-radius:12px;min-width:56px}
.nav-btn.active{color:var(--green)}
.prog-wrap{background:var(--surface2);border-radius:100px;height:8px;overflow:hidden;margin:8px 0}
.prog-fill{height:100%;border-radius:100px;background:var(--green);transition:width .6s}
.sub-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.sub-item:last-child{border-bottom:none}
.history-item{background:var(--surface2);border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.section-hdr{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;margin-top:28px}
.section-hdr:first-child{margin-top:0}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.done-icon{animation:pop .4s forwards;display:flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:50%;background:var(--green-dim);margin:0 auto 20px}
.row{display:flex;gap:10px}
.error-msg{font-size:13px;color:var(--red);line-height:1.4;margin-top:4px}
.info-box{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6}
</style>

firebase.initializeApp({

const auth = firebase.auth();

const fmt = n => (n<0?'-£':'£') + Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,10);
const el = (tag, props={}, ...kids) => {
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='class') e.className=v;
    else if(k==='style') Object.assign(e.style,v);
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const k of kids){
    if(k==null||k===false) continue;
    e.append(typeof k==='string'||typeof k==='number' ? document.createTextNode(String(k)) : k);
  }
  return e;
};

const DEFAULT_DATA = {
  balances:{current:-5.40,creditCard:0,florasii:1973.24,personalSavings:0.51},
  paychecks:[],
  subscriptions:[
    {id:'s1',name:'Spotify',amount:12.99},
    {id:'s2',name:'Amazon Prime',amount:8.99},
    {id:'s3',name:'Discord Nitro',amount:7.99},
    {id:'s4',name:'Prime Video',amount:2.99},
    {id:'s5',name:'BH Live (Gym)',amount:47.00},
    {id:'s6',name:'Aloha VPN',amount:4.99},
    {id:'s7',name:'Crunchyroll',amount:6.99},
    {id:'s8',name:'iCloud+',amount:8.99},
    {id:'s9',name:'OKOK (Scale)',amount:9.99},
    {id:'s10',name:'Runna',amount:15.99},
    {id:'s11',name:'YouTube Premium',amount:16.99},
  ]
};

let appData = null;
let currentUser = null;

// ── render engine ──
const app = document.getElementById('app');
function render(node){ app.innerHTML=''; app.append(node); }

// ── persist ──
async function save(data){
  appData = data;
  if(currentUser) await db.ref('users/'+currentUser.uid).set(data);
}

// ── screens ──
function authScreen(){
  let mode = 'signin';
  const wrap = el('div',{class:'screen',style:{justifyContent:'center'}});
  const content = el('div',{class:'content',style:{display:'flex',flexDirection:'column',justifyContent:'center',minHeight:'100dvh'}});
  
  const heading = el('div',{style:{marginBottom:'40px'}},
    el('div',{style:{fontSize:'13px',letterSpacing:'3px',textTransform:'uppercase',color:'var(--text3)',marginBottom:'8px'}},'Your money'),
    el('div',{style:{fontSize:'36px',fontWeight:'700',lineHeight:'1.1'}},'Financial Freedom')
  );

  const emailInput = el('input',{type:'email',placeholder:'Email',autocomplete:'email',required:true});
  const passInput = el('input',{type:'password',placeholder:'Password',autocomplete:'current-password',required:true,minlength:'6'});
  const errDiv = el('div',{class:'error-msg'});
  const submitBtn = el('button',{class:'btn-primary'},'Sign in');
  const toggleBtn = el('button',{class:'btn-ghost',type:'button'},'No account? Sign up');

  submitBtn.addEventListener('click', async()=>{
    const email = emailInput.value.trim();
    const pass = passInput.value;
    if(!email||!pass) return;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Please wait…';
    errDiv.textContent = '';
    try{
      if(mode==='signin') await auth.signInWithEmailAndPassword(email,pass);
      else await auth.createUserWithEmailAndPassword(email,pass);
    }catch(e){
      errDiv.textContent = e.message;
      submitBtn.disabled = false;
      submitBtn.textContent = mode==='signin'?'Sign in':'Create account';
    }
  });

  toggleBtn.addEventListener('click',()=>{
    mode = mode==='signin'?'signup':'signin';
    submitBtn.textContent = mode==='signin'?'Sign in':'Create account';
    toggleBtn.textContent = mode==='signin'?'No account? Sign up':'Already have an account';
  });

  const form = el('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}},
    emailInput, passInput, errDiv, submitBtn, toggleBtn
  );
  content.append(heading, form);
  wrap.append(content);
  return wrap;
}

function paydayFlow(){
  let step = 0;
  let income = 0;
  let spent = 0;
  let split = null;
  const wrap = el('div',{class:'screen'});

  function calcSplit(inc){
    const hasCC = appData.balances.creditCard > 0;
    if(hasCC) return {florasii:inc*0.50, spending:inc*0.25, creditCard:inc*0.25};
    return {florasii:inc*0.75, spending:inc*0.25, creditCard:0};
  }

  function show(){
    wrap.innerHTML='';
    const content = el('div',{class:'content',style:{display:'flex',flexDirection:'column',justifyContent:'center',flex:'1'}});

    // exit button on all steps except done
    if(step!==3){
      const exitBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'14px',padding:'4px 8px',position:'absolute',top:'20px',right:'16px'}},'✕ Exit');
      exitBtn.addEventListener('click',()=>mainScreen());
      wrap.style.position='relative';
      wrap.append(exitBtn);
    }

    if(step===0){
      const inp = el('input',{class:'big-input',inputmode:'decimal',placeholder:'0.00'});
      const btn = el('button',{class:'btn-primary'},'See my split →');
      btn.disabled = true;
      inp.addEventListener('input',()=>{ btn.disabled=!parseFloat(inp.value); });
      btn.addEventListener('click',()=>{ income=parseFloat(inp.value)||0; split=calcSplit(income); step=1; show(); });
      content.append(
        el('div',{class:'step-num'},'Step 1 of 3'),
        el('div',{class:'step-title'},'You got paid 💰'),
        el('div',{class:'step-sub'},'How much landed in your account?'),
        el('div',{class:'big-wrap'}, el('span',{class:'sym'},'£'), inp),
        appData.balances.creditCard>0 ? el('div',{class:'info-box',style:{background:'var(--red-dim)',color:'var(--red)',marginBottom:'16px'}},
          'Credit card balance: '+fmt(appData.balances.creditCard)+' — split will be 50/25/25 this payday.') : el('span'),
        btn
      );
    }

    if(step===1){
      const subTotal = appData.subscriptions.reduce((s,x)=>s+x.amount,0);
      const backBtn = el('button',{class:'btn-ghost',style:{flex:'1'}},'← Back');
      const nextBtn = el('button',{class:'btn-primary',style:{flex:'2'}},'Done, what did I spend? →');
      backBtn.addEventListener('click',()=>{step=0;show();});
      nextBtn.addEventListener('click',()=>{step=2;show();});

      const instructions = [
        el('div',{class:'instruction'},
          el('div',{}, el('div',{class:'instruction-label'},'→ Florasii Fund'), el('div',{class:'instruction-action'},'Transfer to savings')),
          el('div',{class:'instruction-amount'},fmt(split.florasii))
        )
      ];
      if(split.creditCard>0){
        const cc = el('div',{class:'instruction',style:{borderLeftColor:'var(--red)'}},
          el('div',{}, el('div',{class:'instruction-label'},'→ Credit Card'), el('div',{class:'instruction-action'},'Pay off balance')),
          el('div',{class:'instruction-amount',style:{color:'var(--red)'}},fmt(split.creditCard))
        );
        instructions.push(cc);
      }
      instructions.push(
        el('div',{class:'instruction',style:{borderLeftColor:'var(--amber)'}},
          el('div',{}, el('div',{class:'instruction-label'},'→ Daily Spending'), el('div',{class:'instruction-action'},'Keep in current account')),
          el('div',{class:'instruction-amount',style:{color:'var(--amber)'}},fmt(split.spending))
        )
      );

      content.style.justifyContent='flex-start';
      content.append(
        el('div',{class:'step-num'},'Step 2 of 3'),
        el('div',{class:'step-title'},'Here\'s the plan'),
        el('div',{class:'step-sub'},'Move these amounts now, before you spend anything.'),
        ...instructions,
        el('div',{class:'info-box',style:{background:'var(--surface2)',color:'var(--text2)',margin:'16px 0'}},
          'Total: '+fmt(income)+' · Subscriptions ~'+fmt(subTotal)+'/mo come out of your spending pot.'),
        el('div',{class:'row'}, backBtn, nextBtn)
      );
    }

    if(step===2){
      const inp = el('input',{class:'big-input',inputmode:'decimal',placeholder:'0.00'});
      const backBtn = el('button',{class:'btn-ghost',style:{flex:'1'}},'← Back');
      const confirmBtn = el('button',{class:'btn-primary',style:{flex:'2'}},'Confirm & save →');
      backBtn.addEventListener('click',()=>{step=1;show();});
      confirmBtn.addEventListener('click',async()=>{
        spent = parseFloat(inp.value)||0;
        const nb = {...appData.balances};
        nb.current = nb.current + split.spending - spent;
        nb.florasii = nb.florasii + split.florasii;
        if(split.creditCard) nb.creditCard = Math.max(0, nb.creditCard - split.creditCard);
        const newPay = {
          id:uid(),
          date:new Date().toISOString(),
          income,spent,split,
          snapshot:{
            florasii: nb.florasii,
            current: nb.current,
            creditCard: nb.creditCard,
            personalSavings: nb.personalSavings
          }
        };
        await save({...appData, balances:nb, paychecks:[newPay,...(appData.paychecks||[])]});
        step=3; show();
      });
      content.append(
        el('div',{class:'step-num'},'Step 3 of 3'),
        el('div',{class:'step-title'},'What did you spend?'),
        el('div',{class:'step-sub'},'Since your last payday — not including subscriptions.'),
        el('div',{class:'big-wrap'}, el('span',{class:'sym'},'£'), inp),
        el('div',{class:'row'}, backBtn, confirmBtn)
      );
    }

    if(step===3){
      content.style.textAlign='center';
      const doneBtn = el('button',{class:'btn-primary'},'Back to overview');
      doneBtn.addEventListener('click',()=>mainScreen());
      content.append(
        el('div',{class:'done-icon'},
          el('svg',{width:'36',height:'36',viewBox:'0 0 24 24',fill:'none',stroke:'var(--green)','stroke-width':'2.5','stroke-linecap':'round','stroke-linejoin':'round'},
            el('path',{d:'M20 6L9 17l-5-5'})
          )
        ),
        el('div',{style:{fontSize:'26px',fontWeight:'700',marginBottom:'8px'}},'All sorted 🎉'),
        el('div',{style:{fontSize:'14px',color:'var(--text2)',marginBottom:'40px',lineHeight:'1.6'}},
          fmt(split.florasii)+' moved to Florasii. Your balances are updated.'),
        doneBtn
      );
    }

    wrap.append(content);
  }
  show();
  return wrap;
}

function overviewScreen(){
  const {balances,paychecks,subscriptions} = appData;
  const subTotal = subscriptions.reduce((s,x)=>s+x.amount,0);
  const recent = (paychecks||[]).slice(0,5);
  const totalInc = (paychecks||[]).reduce((s,p)=>s+p.income,0);
  const pct = Math.min(100,Math.round(balances.florasii/15000*100));

  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  content.append(
    el('div',{class:'section-hdr'},'Balances'),
    el('div',{class:'card'},
      el('div',{class:'balance-row'},
        el('div',{class:'balance-label'},'Current Account'),
        el('div',{class:'balance-value',style:{color:balances.current<0?'var(--red)':'var(--text)'}},fmt(balances.current))
      ),
      el('div',{class:'balance-row'},
        el('div',{class:'balance-label'},'Florasii Fund'),
        el('div',{class:'balance-value',style:{color:'var(--green)'}},fmt(balances.florasii))
      ),
      el('div',{class:'balance-row'},
        el('div',{class:'balance-label'},'Personal Savings'),
        el('div',{class:'balance-value'},fmt(balances.personalSavings))
      ),
      ...(balances.creditCard>0?[el('div',{class:'balance-row'},
        el('div',{class:'balance-label'},'Credit Card (owed)'),
        el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(balances.creditCard))
      )]:[] )
    ),
    el('div',{class:'section-hdr'},'Florasii Progress'),
    el('div',{class:'card'},
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:'8px'}},
        el('div',{},
          el('div',{style:{fontSize:'28px',fontWeight:'700',fontFamily:"'Space Mono',monospace",color:'var(--green)'}},fmt(balances.florasii)),
          el('div',{style:{fontSize:'13px',color:'var(--text2)',marginTop:'2px'}},'of £15,000 goal')
        ),
        el('div',{style:{fontSize:'22px',fontWeight:'700',color:'var(--text2)'}},pct+'%')
      ),
      el('div',{class:'prog-wrap'}, el('div',{class:'prog-fill',style:{width:pct+'%'}}))
    ),
    el('div',{class:'section-hdr'},'Subscriptions · '+fmt(subTotal)+'/mo'),
    el('div',{class:'card'},
      ...subscriptions.map(s=>
        el('div',{class:'sub-item'},
          el('div',{style:{fontSize:'14px'}},s.name),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'14px',color:'var(--text2)'}},fmt(s.amount))
        )
      ),
      el('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:'14px',marginTop:'4px'}},
        el('div',{style:{fontSize:'13px',color:'var(--text2)',fontWeight:'600'}},'Total / month'),
        el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'14px',fontWeight:'700',color:'var(--amber)'}},fmt(subTotal))
      )
    )
  );

  if(recent.length>0){
    content.append(el('div',{class:'section-hdr'},'Recent Paychecks'));
    for(const p of recent){
      content.append(el('div',{class:'history-item'},
        el('div',{},
          el('div',{style:{fontWeight:'600'}},fmt(p.income)),
          el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'2px'}},new Date(p.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}))
        ),
        el('div',{style:{textAlign:'right'}},
          el('div',{style:{fontSize:'13px',color:'var(--green)'}},'+'+fmt(p.split.florasii)+' Florasii'),
          el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'2px'}},'spent '+fmt(p.spent))
        )
      ));
    }
    content.append(el('div',{style:{textAlign:'center',marginTop:'8px',fontSize:'13px',color:'var(--text3)'}},
      'Total tracked: '+fmt(totalInc)+' across '+paychecks.length+' paychecks'));
  }
  return content;
}

function settingsScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  let subs = [...appData.subscriptions];

  const subList = el('div'); // BUG FIX 1: declare subList before renderSubs() calls it

  function renderSubs(){
    subList.innerHTML='';
    for(const s of subs){
      const sid = s.id;
      const row = el('div',{class:'sub-item'},
        el('div',{style:{fontSize:'14px'}},s.name),
        el('div',{style:{display:'flex',alignItems:'center',gap:'12px'}},
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'14px',color:'var(--text2)'}},fmt(s.amount)),
          (() => {
            const btn = el('button',{style:{background:'none',color:'var(--red)',padding:'0',fontSize:'18px',lineHeight:'1'}},'×');
            btn.addEventListener('click',()=>{ subs=subs.filter(x=>x.id!==sid); renderSubs(); }); // BUG FIX 2: single listener, no duplicate
            return btn;
          })()
        )
      );
      subList.append(row);
    }
  }

  const curInput = el('input',{inputmode:'decimal',value:String(appData.balances.current)});
  const florInput = el('input',{inputmode:'decimal',value:String(appData.balances.florasii)});
  const savInput = el('input',{inputmode:'decimal',value:String(appData.balances.personalSavings)});
  const ccInput = el('input',{inputmode:'decimal',value:String(appData.balances.creditCard)});
  const saveBalBtn = el('button',{class:'btn-primary',style:{marginTop:'8px'}},'Save balances');
  saveBalBtn.addEventListener('click',async()=>{
    const nb = {
      current:parseFloat(curInput.value)||0,
      florasii:parseFloat(florInput.value)||0,
      personalSavings:parseFloat(savInput.value)||0,
      creditCard:parseFloat(ccInput.value)||0,
    };
    await save({...appData, balances:nb, subscriptions:subs}); // BUG FIX 3: always include latest subs
    saveBalBtn.textContent='Saved ✓';
    setTimeout(()=>saveBalBtn.textContent='Save balances',2000);
  });

  renderSubs();

  const newName = el('input',{placeholder:'Name',style:{flex:'2'}});
  const newAmt = el('input',{placeholder:'£',inputmode:'decimal',style:{flex:'1'}});
  const addBtn = el('button',{style:{background:'var(--green)',color:'#000',borderRadius:'12px',padding:'0 16px',fontWeight:'700',whiteSpace:'nowrap'}},'Add');
  addBtn.addEventListener('click',()=>{
    if(!newName.value||!newAmt.value) return;
    subs.push({id:uid(),name:newName.value.trim(),amount:parseFloat(newAmt.value)||0});
    newName.value=''; newAmt.value='';
    renderSubs();
  });
  const saveSubBtn = el('button',{class:'btn-ghost',style:{marginTop:'12px'}},'Save subscriptions');
  saveSubBtn.addEventListener('click',async()=>{
    await save({...appData, subscriptions:subs}); // BUG FIX 4: save subs without clobbering balances
    saveSubBtn.textContent='Saved ✓';
    setTimeout(()=>saveSubBtn.textContent='Save subscriptions',2000);
  });

  const signOutBtn = el('button',{class:'btn-ghost',style:{marginTop:'32px'}},'Sign out');
  signOutBtn.addEventListener('click',()=>auth.signOut());

  const mkLabel = txt => el('div',{style:{fontSize:'12px',color:'var(--text3)',marginBottom:'6px',letterSpacing:'0.5px'}},txt);

  content.append(
    el('div',{class:'section-hdr'},'Update Balances'),
    el('div',{class:'card'},
      el('div',{style:{marginBottom:'12px'}}, mkLabel('Current Account (£)'), curInput),
      el('div',{style:{marginBottom:'12px'}}, mkLabel('Florasii Fund (£)'), florInput),
      el('div',{style:{marginBottom:'12px'}}, mkLabel('Personal Savings (£)'), savInput),
      el('div',{style:{marginBottom:'12px'}}, mkLabel('Credit Card Owed (£)'), ccInput),
      saveBalBtn
    ),
    el('div',{class:'section-hdr'},'Subscriptions'),
    el('div',{class:'card'},
      subList,
      el('div',{style:{display:'flex',gap:'8px',marginTop:'14px'}}, newName, newAmt, addBtn),
      saveSubBtn
    ),
    signOutBtn
  );
  return content;
}

function trendsScreen(){
  const paychecks = (appData.paychecks || []).filter(p => p.snapshot);
  const hoursLog = appData.hoursLog || [];
  const actualPay = appData.actualPay || {};
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const subTotal = (appData.subscriptions||[]).reduce((s,x)=>s+x.amount,0);

  if(paychecks.length < 2 && hoursLog.length < 4){
    content.append(el('div',{class:'card',style:{textAlign:'center',padding:'40px 20px'}},
      el('div',{style:{fontSize:'32px',marginBottom:'12px'}},'📈'),
      el('div',{style:{fontWeight:'600'}},'Not enough data yet')
    ));
    return content;
  }

  const fmtK = v => {
    const abs = Math.abs(v);
    if(abs>=1000) return (v<0?'-':'')+'£'+(abs/1000).toFixed(1)+'k';
    return (v<0?'-£':'£')+Math.round(abs);
  };

  function makeGraph(label, color, values, dates, fromZero){
    if(values.length < 2) return el('div',{});
    const W=Math.min(window.innerWidth-40,440),H=150;
    const PAD={top:10,right:16,bottom:28,left:52};
    const iW=W-PAD.left-PAD.right, iH=H-PAD.top-PAD.bottom;
    const min=fromZero?0:Math.min(...values), max=Math.max(...values,1), range=max-min||1;
    const xStep=values.length>1?iW/(values.length-1):iW;
    const yScale=v=>iH-((v-min)/range)*iH;
    const pts=values.map((v,i)=>[PAD.left+i*xStep,PAD.top+yScale(v)]);
    const polyline=pts.map(p=>p.join(',')).join(' ');
    const fillPath=`M${pts[0][0]},${PAD.top+iH} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${PAD.top+iH} Z`;
    const yLabels=[min,min+range*0.5,max].map(v=>{
      const y=PAD.top+yScale(v);
      return `<text x="${PAD.left-4}" y="${y+3}" text-anchor="end" fill="#555" font-size="9" font-family="Space Mono,monospace">${fmtK(v)}</text>`;
    }).join('');
    const xLabels=dates.map((d,i)=>{
      if(values.length>8&&i%Math.ceil(values.length/5)!==0&&i!==values.length-1) return '';
      const x=PAD.left+i*xStep;
      const parts=d.includes('/')?d.split('/'):[]; 
      const lbl=parts.length>=2?parts[0]+'/'+parts[1]:new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
      return `<text x="${x}" y="${H-4}" text-anchor="middle" fill="#555" font-size="8" font-family="Space Grotesk,sans-serif">${lbl}</text>`;
    }).join('');
    const dots=values.map((v,i)=>{
      const [x,y]=pts[i];
      const isMax=v===Math.max(...values),isMin=v===Math.min(...values);
      const c=isMax?'var(--green)':isMin?'var(--red)':color;
      return `<circle cx="${x}" cy="${y}" r="${isMax||isMin?4:2.5}" fill="${c}" stroke="#0D0D0D" stroke-width="1.5"/>`;
    }).join('');
    const gid='g'+Math.random().toString(36).slice(2,6);
    const svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${fillPath}" fill="url(#${gid})"/>
      <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${yLabels}${xLabels}${dots}</svg>`;
    const wrap=el('div',{class:'card',style:{overflowX:'auto',padding:'16px 20px'}});
    wrap.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${color};margin-bottom:10px;font-family:'Space Grotesk',sans-serif">${label}</div>${svg}`;
    return wrap;
  }

  function makeBarChart(label, color, values, labels){
    if(values.length===0) return el('div',{});
    const W=Math.min(window.innerWidth-40,440),H=150;
    const PAD={top:10,right:8,bottom:28,left:52};
    const iW=W-PAD.left-PAD.right,iH=H-PAD.top-PAD.bottom;
    const max=Math.max(...values,1);
    const barW=Math.max(4,iW/values.length*0.7),gap=iW/values.length;
    const bars=values.map((v,i)=>{
      const x=PAD.left+i*gap+(gap-barW)/2;
      const bh=(v/max)*iH, y=PAD.top+iH-bh;
      const isMax=v===Math.max(...values),isMin=v>0&&v===Math.min(...values.filter(x=>x>0));
      const c=isMax?'var(--green)':isMin?'var(--red)':color;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${c}" rx="3"/>`;
    }).join('');
    const xLbls=labels.map((l,i)=>{
      if(values.length>10&&i%Math.ceil(values.length/8)!==0&&i!==values.length-1) return '';
      return `<text x="${PAD.left+i*gap+gap/2}" y="${H-4}" text-anchor="middle" fill="#555" font-size="8" font-family="Space Grotesk,sans-serif">${l}</text>`;
    }).join('');
    const yLbls=[0,Math.round(max/2),Math.round(max)].map(v=>{
      const y=PAD.top+iH-(v/max)*iH;
      return `<text x="${PAD.left-4}" y="${y+3}" text-anchor="end" fill="#555" font-size="9" font-family="Space Mono,monospace">${fmtK(v)}</text>`;
    }).join('');
    const svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">${bars}${yLbls}${xLbls}</svg>`;
    const wrap=el('div',{class:'card',style:{overflowX:'auto',padding:'16px 20px'}});
    wrap.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${color};margin-bottom:10px;font-family:'Space Grotesk',sans-serif">${label}</div>${svg}`;
    return wrap;
  }

  const sorted=[...paychecks].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const dates=sorted.map(p=>p.date.slice(0,10));
  const florasiiSeries=sorted.map(p=>p.snapshot.florasii);
  const currentSeries=sorted.map(p=>p.snapshot.current);
  const ccSeries=sorted.map(p=>p.snapshot.creditCard);
  const realPays=sorted.filter(p=>p.income>0);
  const incomeSeries=realPays.map(p=>p.income);
  const incomeDates=realPays.map(p=>p.date.slice(0,10));
  const spentSeries=realPays.map(p=>p.spent||0);
  const totalIncome=realPays.reduce((s,p)=>s+p.income,0);
  const totalSpent=realPays.reduce((s,p)=>s+(p.spent||0),0);
  const avgIncome=totalIncome/Math.max(realPays.length,1);
  const netWorthSeries=sorted.map(p=>p.snapshot.florasii+(p.snapshot.personalSavings||0)-p.snapshot.creditCard);

  const monthlyIncome={},monthlySpend={};
  for(const p of realPays){
    const d=new Date(p.date);
    const key=d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
    monthlyIncome[key]=(monthlyIncome[key]||0)+p.income;
    monthlySpend[key]=(monthlySpend[key]||0)+(p.spent||0);
  }
  const monthKeys=Object.keys(monthlyIncome);

  const parseLabel=l=>{const p=l.split('/');return new Date(`${p[2]}-${p[1]}-${p[0]}`);};
  const sortedHours=[...hoursLog].sort((a,b)=>parseLabel(a.label)-parseLabel(b.label));
  const pairs=[];
  for(let i=0;i<sortedHours.length;i+=2) pairs.push({w1:sortedHours[i],w2:sortedHours[i+1]});
  const pairsWithActual=pairs.filter(({w1})=>actualPay[w1.id+'_actual']);
  const predictedVals=pairsWithActual.map(({w1,w2})=>(w1.total+(w2?w2.total:0))*14.5);
  const actualVals=pairsWithActual.map(({w1})=>actualPay[w1.id+'_actual']);
  const pairLabels=pairsWithActual.map(({w1})=>w1.label.slice(0,5));
  const predVsActualDiff=pairsWithActual.map((_,i)=>actualVals[i]-predictedVals[i]);

  const florasiiNow=appData.balances?.florasii||0;
  const florasiiGoal=15000;
  const florasiiRemaining=Math.max(0,florasiiGoal-florasiiNow);
  const florasiiGrowth=florasiiSeries.length>1?florasiiSeries[florasiiSeries.length-1]-florasiiSeries[0]:0;
  const avgFlorasiiPerPay=florasiiGrowth/Math.max(realPays.length,1);
  const paysToGoal=avgFlorasiiPerPay>0?Math.ceil(florasiiRemaining/avgFlorasiiPerPay):'?';
  const weeksToGoal=typeof paysToGoal==='number'?paysToGoal*2:'?';
  const subPct=avgIncome>0?((subTotal/avgIncome)*100).toFixed(1):0;
  const pct=Math.min(100,Math.round(florasiiNow/florasiiGoal*100));
  const r=42,c=2*Math.PI*r;
  const bestMonth=monthKeys.length?monthKeys[Object.values(monthlyIncome).indexOf(Math.max(...Object.values(monthlyIncome)))]:'-';

  const countdownCard=el('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'16px'}});
  const dialDiv=el('div',{style:{position:'relative',width:'100px',height:'100px',flexShrink:'0'}});
  dialDiv.innerHTML=`<svg width="100" height="100" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="9"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--green)" stroke-width="9"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}" stroke-linecap="round"/>
  </svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <span style="font-family:'Space Mono',monospace;font-size:20px;font-weight:700">${pct}%</span>
    <span style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px">to goal</span>
  </div>`;
  countdownCard.append(dialDiv, el('div',{style:{flex:'1'}},
    el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'4px'}},'Florasii Fund'),
    el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'22px',fontWeight:'700',color:'var(--green)'}},fmt(florasiiNow)),
    el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'4px'}},fmt(florasiiRemaining)+' remaining'),
    el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'6px'}},
      typeof paysToGoal==='number'?`~${paysToGoal} paychecks (${weeksToGoal} weeks) at current rate`:'Log more paychecks to estimate')
  ));

  const subCard=el('div',{class:'card'});
  subCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:12px;font-family:'Space Grotesk',sans-serif">Subscriptions impact</div>
    <div class="balance-row"><span class="balance-label">Monthly cost</span><span class="balance-value" style="color:var(--red)">${fmt(subTotal)}</span></div>
    <div class="balance-row"><span class="balance-label">% of avg paycheck</span><span class="balance-value" style="color:var(--red)">${subPct}%</span></div>
    <div class="balance-row"><span class="balance-label">Annual cost</span><span class="balance-value" style="color:var(--red)">${fmt(subTotal*12)}</span></div>
    <div class="balance-row" style="border:none"><span class="balance-label">Paychecks/year on subs</span><span class="balance-value">${(subTotal*12/avgIncome).toFixed(1)}</span></div>`;

  const statsCard=el('div',{class:'card'});
  statsCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;font-family:'Space Grotesk',sans-serif">All time</div>
    <div class="balance-row"><span class="balance-label">Total income tracked</span><span class="balance-value" style="color:var(--green)">${fmt(totalIncome)}</span></div>
    <div class="balance-row"><span class="balance-label">Total spent (logged)</span><span class="balance-value" style="color:var(--amber)">${fmt(totalSpent)}</span></div>
    <div class="balance-row"><span class="balance-label">Avg income / paycheck</span><span class="balance-value">${fmt(avgIncome)}</span></div>
    <div class="balance-row"><span class="balance-label">Best month</span><span class="balance-value" style="color:var(--green)">${bestMonth}</span></div>
    <div class="balance-row" style="border:none"><span class="balance-label">Paychecks logged</span><span class="balance-value">${realPays.length}</span></div>`;

  let accuracyCard=null;
  if(predVsActualDiff.length>=3){
    const avgDiff=predVsActualDiff.reduce((s,v)=>s+v,0)/predVsActualDiff.length;
    const W=Math.min(window.innerWidth-40,440),H=130;
    const PAD={top:10,right:8,bottom:28,left:52};
    const iW=W-PAD.left-PAD.right,iH=H-PAD.top-PAD.bottom;
    const maxAbs=Math.max(...predVsActualDiff.map(Math.abs),1);
    const midY=PAD.top+iH/2,gap=iW/predVsActualDiff.length;
    const barW=Math.max(4,gap*0.7);
    const bars=predVsActualDiff.map((v,i)=>{
      const x=PAD.left+i*gap+(gap-barW)/2,bh=(Math.abs(v)/maxAbs)*(iH/2);
      const y=v>=0?midY-bh:midY;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${v>=0?'var(--green)':'var(--red)'}" rx="2"/>`;
    }).join('');
    const xLbls=pairLabels.map((l,i)=>{
      if(predVsActualDiff.length>8&&i%Math.ceil(predVsActualDiff.length/6)!==0) return '';
      return `<text x="${PAD.left+i*gap+gap/2}" y="${H-4}" text-anchor="middle" fill="#555" font-size="7" font-family="Space Grotesk,sans-serif">${l}</text>`;
    }).join('');
    accuracyCard=el('div',{class:'card',style:{overflowX:'auto',padding:'16px 20px'}});
    accuracyCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#CE93D8;margin-bottom:4px;font-family:'Space Grotesk',sans-serif">Actual vs predicted pay</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px">Avg ${avgDiff>=0?'+':''}${fmt(avgDiff)} per paycheck vs estimate</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">
      <line x1="${PAD.left}" y1="${midY}" x2="${PAD.left+iW}" y2="${midY}" stroke="var(--border)" stroke-width="1"/>
      <text x="${PAD.left-4}" y="${midY+3}" text-anchor="end" fill="#555" font-size="8" font-family="Space Mono,monospace">0</text>
      ${bars}${xLbls}</svg>`;
  }

  content.append(
    el('div',{class:'section-hdr'},'Florasii Goal'),
    countdownCard,
    el('div',{class:'section-hdr'},'Net Worth over time'),
    makeGraph('Net worth (Florasii + savings − credit card)','#64B5F6',netWorthSeries,dates),
    el('div',{class:'section-hdr'},'Florasii Fund'),
    makeGraph('Florasii Fund — running balance','var(--green)',florasiiSeries,dates),
    el('div',{class:'section-hdr'},'Current Account'),
    makeGraph('Current Account — running balance','#4FC3F7',currentSeries,dates)
  );
  if(ccSeries.some(v=>v>0)) content.append(
    el('div',{class:'section-hdr'},'Credit Card'),
    makeGraph('Credit Card — amount owed','var(--red)',ccSeries,dates)
  );
  content.append(
    el('div',{class:'section-hdr'},'Monthly income'),
    makeBarChart('Income by month','var(--amber)',monthKeys.map(k=>monthlyIncome[k]),monthKeys),
    el('div',{class:'section-hdr'},'Monthly spending'),
    makeBarChart('Spending by month','#CE93D8',monthKeys.map(k=>monthlySpend[k]),monthKeys),
    el('div',{class:'section-hdr'},'Income per paycheck'),
    makeGraph('Income per paycheck','var(--amber)',incomeSeries,incomeDates,true)
  );
  // ── Pay consistency score ──
  const consistencyCard = el('div',{class:'card'});
  if(incomeSeries.length >= 3){
    const mean = avgIncome;
    const variance = incomeSeries.reduce((s,v)=>s+Math.pow(v-mean,2),0)/incomeSeries.length;
    const stdDev = Math.sqrt(variance);
    const cv = (stdDev/mean*100); // coefficient of variation
    const score = Math.max(0,Math.round(100 - cv));
    const scoreColor = score>=75?'var(--green)':score>=50?'var(--amber)':'var(--red)';
    const scoreLabel = score>=75?'Consistent':'Moderate variance';
    const W=Math.min(window.innerWidth-40,440), barW=Math.max(0,Math.min(1,score/100))*((W-40));
    consistencyCard.innerHTML=`
      <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${scoreColor};margin-bottom:12px;font-family:'Space Grotesk',sans-serif">Pay consistency</div>
      <div style="display:flex;align-items:flex-end;gap:12px;margin-bottom:12px">
        <div style="font-family:'Space Mono',monospace;font-size:48px;font-weight:700;color:${scoreColor};line-height:1">${score}</div>
        <div style="padding-bottom:8px">
          <div style="font-size:14px;font-weight:600">${scoreLabel}</div>
          <div style="font-size:12px;color:var(--text2)">out of 100</div>
        </div>
      </div>
      <div style="background:var(--surface2);border-radius:100px;height:8px;overflow:hidden;margin-bottom:16px">
        <div style="height:100%;width:${barW}px;background:${scoreColor};border-radius:100px;transition:width .6s"></div>
      </div>
      <div class="balance-row"><span class="balance-label">Avg paycheck</span><span class="balance-value">${fmt(mean)}</span></div>
      <div class="balance-row"><span class="balance-label">Std deviation</span><span class="balance-value">${fmt(stdDev)}</span></div>
      <div class="balance-row"><span class="balance-label">Lowest paycheck</span><span class="balance-value" style="color:var(--red)">${fmt(Math.min(...incomeSeries))}</span></div>
      <div class="balance-row" style="border:none"><span class="balance-label">Highest paycheck</span><span class="balance-value" style="color:var(--green)">${fmt(Math.max(...incomeSeries))}</span></div>
    `;
  } else {
    consistencyCard.innerHTML='<div style="color:var(--text3);font-size:13px">Log more paychecks to see your consistency score.</div>';
  }

  // ── Trip savings planner ──
  const tripCard = el('div',{class:'card'});
  tripCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:14px;font-family:'Space Grotesk',sans-serif">Trip savings planner</div>`;
  const tripNameInp = el('input',{placeholder:'Trip name (e.g. Philippines Nov)',style:{marginBottom:'10px'}});
  const tripGoalInp = el('input',{inputmode:'decimal',placeholder:'Target amount (£)',style:{marginBottom:'10px'}});
  const tripDateInp = el('input',{type:'date',style:{marginBottom:'10px'}});
  const tripResult = el('div',{style:{background:'var(--surface2)',borderRadius:'12px',padding:'14px',marginTop:'4px',display:'none'}});
  const tripCalcBtn = el('button',{class:'btn-primary',style:{fontSize:'14px',padding:'12px'}},'Calculate');
  tripCalcBtn.addEventListener('click',()=>{
    const target = parseFloat(tripGoalInp.value)||0;
    const tripDate = new Date(tripDateInp.value);
    const now = new Date();
    if(!target||!tripDateInp.value||tripDate<=now){
      tripResult.style.display='block';
      tripResult.innerHTML='<div style="color:var(--red);font-size:13px">Enter a valid target and future date.</div>';
      return;
    }
    const msPerDay = 86400000;
    const daysLeft = Math.ceil((tripDate-now)/msPerDay);
    const payPeriods = Math.max(1,Math.floor(daysLeft/14));
    const florasiiNow = appData.balances?.florasii||0;
    const still = Math.max(0,target-florasiiNow);
    const perPaycheck = still/payPeriods;
    const pctOfAvg = avgIncome>0?(perPaycheck/avgIncome*100).toFixed(1):0;
    tripResult.style.display='block';
    tripResult.innerHTML=`
      <div style="font-size:13px;color:var(--text2);margin-bottom:10px">${tripNameInp.value||'Trip'} · ${daysLeft} days away</div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">Already saved</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--green)">${fmt(florasiiNow)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">Still needed</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700">${fmt(still)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">Paychecks remaining</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700">${payPeriods}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0">
        <span style="font-size:13px;color:var(--text2)">Save per paycheck</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:${perPaycheck>avgIncome*0.8?'var(--red)':'var(--green)'}">${fmt(perPaycheck)} <span style="font-size:11px;color:var(--text3)">(${pctOfAvg}% of avg pay)</span></span>
      </div>
      ${perPaycheck>avgIncome*0.75?'<div style="margin-top:10px;padding:10px;background:var(--red-dim);border-radius:10px;font-size:12px;color:var(--red)">⚠️ This is more than 75% of your average paycheck — consider a lower target or later date.</div>':''}
    `;
  });
  tripCard.append(tripNameInp,tripGoalInp,tripDateInp,tripCalcBtn,tripResult);

  // ── What-if calculator ──
  const whatifCard = el('div',{class:'card'});
  whatifCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:14px;font-family:'Space Grotesk',sans-serif">"What if" calculator</div>`;
  const wiHoursInp = el('input',{inputmode:'decimal',placeholder:'Extra hours this period',style:{marginBottom:'10px'}});
  const wiResult = el('div',{style:{background:'var(--surface2)',borderRadius:'12px',padding:'14px',marginTop:'4px',display:'none'}});
  const wiBtn = el('button',{style:{background:'var(--amber)',color:'#000',borderRadius:'12px',padding:'13px',width:'100%',fontWeight:'700',fontSize:'14px'}},'Calculate');
  const RATE = appData.hourlyRate||14.50;
  wiBtn.addEventListener('click',()=>{
    const extraH = parseFloat(wiHoursInp.value)||0;
    if(!extraH){ wiResult.style.display='none'; return; }
    const extraGross = extraH * RATE;
    const extraFlorasii = extraGross * 0.75; // 75% split to Florasii when no CC
    const extraSpending = extraGross * 0.25;
    const florasiiNow = appData.balances?.florasii||0;
    const newFlorasii = florasiiNow + extraFlorasii;
    const newPct = Math.min(100,(newFlorasii/15000*100)).toFixed(1);
    wiResult.style.display='block';
    wiResult.innerHTML=`
      <div style="font-size:13px;color:var(--text2);margin-bottom:10px">${extraH}h extra at £${RATE}/hr</div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">Extra take-home</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--amber)">${fmt(extraGross)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">→ Extra to Florasii (75%)</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--green)">${fmt(extraFlorasii)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">→ Extra spending (25%)</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700">${fmt(extraSpending)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0">
        <span style="font-size:13px;color:var(--text2)">Florasii would reach</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--green)">${fmt(newFlorasii)} <span style="font-size:11px;color:var(--text3)">(${newPct}%)</span></span>
      </div>
    `;
  });
  whatifCard.append(wiHoursInp,wiBtn,wiResult);

  if(accuracyCard) content.append(
    el('div',{class:'section-hdr'},'Prediction accuracy'),
    accuracyCard
  );
  content.append(
    el('div',{class:'section-hdr'},'Pay consistency'),
    consistencyCard,
    el('div',{class:'section-hdr'},'Trip savings planner'),
    tripCard,
    el('div',{class:'section-hdr'},'"What if" calculator'),
    whatifCard,
    el('div',{class:'section-hdr'},'Subscriptions'),
    subCard,
    el('div',{class:'section-hdr'},'All time stats'),
    statsCard
  );
  return content;
}

function hoursScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const weeks = appData.hoursLog || [];
  const RATE = appData.hourlyRate || 14.50;
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  // Current week being logged
  let currentHours = {mon:0,tue:0,wed:0,thu:0,fri:0,sat:0,sun:0};
  let weekLabel = '';

  function totalHours(w){ return ['mon','tue','wed','thu','fri','sat','sun'].reduce((s,d)=>s+(parseFloat(w[d])||0),0); }
  function predictedPay(h){ return h * RATE; }

  // Rate editor
  const rateWrap = el('div',{class:'card',style:{marginBottom:'0'}});
  const rateLabel = el('div',{style:{fontSize:'12px',color:'var(--text3)',marginBottom:'6px',letterSpacing:'0.5px'}},'Hourly rate (after tax, £)');
  const rateInput = el('input',{inputmode:'decimal',value:String(RATE),style:{marginBottom:'8px'}});
  const saveRateBtn = el('button',{class:'btn-primary',style:{fontSize:'14px',padding:'12px'}},'Save rate');
  saveRateBtn.addEventListener('click',async()=>{
    const r = parseFloat(rateInput.value)||14.50;
    await save({...appData, hourlyRate:r});
    saveRateBtn.textContent='Saved ✓';
    setTimeout(()=>{saveRateBtn.textContent='Save rate'; renderAll();},1500);
  });
  rateWrap.append(rateLabel, rateInput, saveRateBtn);

  // Log new week
  const logWrap = el('div',{class:'card'});
  const logTitle = el('div',{style:{fontSize:'14px',fontWeight:'600',marginBottom:'14px',color:'var(--text)'}},'Log a week');
  const weekInput = el('input',{placeholder:'Week starting (e.g. 04/08/2026)',style:{marginBottom:'12px'}});

  const dayInputs = {};
  const dayGrid = el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'6px',marginBottom:'12px'}});
  for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
    const label = el('div',{style:{fontSize:'10px',color:'var(--text3)',textAlign:'center',marginBottom:'3px',textTransform:'uppercase'}}, d.slice(0,2));
    const inp = el('input',{inputmode:'decimal',placeholder:'0',style:{padding:'10px 4px',textAlign:'center',fontSize:'14px',borderRadius:'10px'}});
    dayInputs[d] = inp;
    const col = el('div',{},label,inp);
    dayGrid.append(col);
  }

  const previewDiv = el('div',{style:{background:'var(--surface2)',borderRadius:'12px',padding:'12px',marginBottom:'12px',display:'none'}});

  function updatePreview(){
    const h = ['mon','tue','wed','thu','fri','sat','sun'].reduce((s,d)=>s+(parseFloat(dayInputs[d].value)||0),0);
    if(h>0){
      previewDiv.style.display='block';
      previewDiv.innerHTML = `<span style="color:var(--text2);font-size:13px">Total: </span><span style="font-family:'Space Mono',monospace;font-weight:700">${h.toFixed(2)}h</span><span style="color:var(--text2);font-size:13px;margin-left:12px">Predicted: </span><span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--green)">${fmt(predictedPay(h))}</span>`;
    } else {
      previewDiv.style.display='none';
    }
  }

  for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
    dayInputs[d].addEventListener('input', updatePreview);
  }

  const addWeekBtn = el('button',{class:'btn-primary',style:{fontSize:'14px',padding:'12px'}},'Add week');
  addWeekBtn.addEventListener('click',async()=>{
    if(!weekInput.value) return;
    const hrs = {};
    for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
      hrs[d] = parseFloat(dayInputs[d].value)||0;
    }
    const total = totalHours(hrs);
    if(total===0) return;
    const week = {
      id: uid(),
      label: weekInput.value.trim(),
      ...hrs,
      total,
      predicted: predictedPay(total)
    };
    const newLog = [week, ...(appData.hoursLog||[])];
    await save({...appData, hoursLog:newLog});
    weekInput.value='';
    for(const d of ['mon','tue','wed','thu','fri','sat','sun']) dayInputs[d].value='';
    previewDiv.style.display='none';
    renderAll();
  });

  logWrap.append(logTitle, weekInput, dayGrid, previewDiv, addWeekBtn);

  // History
  const histWrap = el('div',{});
  const graphWrap = el('div',{});

  let filterYear = 'all';
  let filterMonth = 'all';

  // Filter bar
  const filterBar = el('div',{style:{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}});
  const yearSel = el('select',{style:{flex:'1',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'10px',padding:'8px 10px',fontSize:'13px'}});
  const monthSel = el('select',{style:{flex:'1',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'10px',padding:'8px 10px',fontSize:'13px'}});

  const years = ['all','2025','2026','2027'];
  const months = ['all','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  years.forEach(y => { const o = el('option',{value:y},y==='all'?'All years':y); yearSel.append(o); });
  months.forEach((m,i) => { const o = el('option',{value:i===0?'all':String(i)},m==='all'?'All months':m); monthSel.append(o); });

  yearSel.addEventListener('change',()=>{ filterYear=yearSel.value; renderAll(); });
  monthSel.addEventListener('change',()=>{ filterMonth=monthSel.value; renderAll(); });
  filterBar.append(yearSel, monthSel);

  function renderAll(){
    histWrap.innerHTML='';
    const log = appData.hoursLog||[];
    if(log.length===0){
      histWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'30px 20px',color:'var(--text2)',fontSize:'13px'}},'No weeks logged yet — add your first week above.'));
      return;
    }

    // Sort by date ascending, then pair oldest→newest into pay periods
    const parseLabel = l => {
      const parts = l.split('/');
      return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    };
    const sorted = [...log].sort((a,b) => parseLabel(a.label) - parseLabel(b.label));

    const pairs = [];
    for(let i=0;i<sorted.length;i+=2){
      pairs.push({w1: sorted[i], w2: sorted[i+1]});
    }

    // Apply filter
    const filtered = pairs.filter(({w1}) => {
      const d = parseLabel(w1.label);
      if(filterYear !== 'all' && String(d.getFullYear()) !== filterYear) return false;
      if(filterMonth !== 'all' && String(d.getMonth()+1) !== filterMonth) return false;
      return true;
    });

    if(filtered.length === 0){
      histWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'20px',color:'var(--text2)',fontSize:'13px'}},'No pay periods match this filter.'));
    }

    for(const {w1,w2} of filtered){
      const totalH = w1.total + (w2?w2.total:0);
      const predicted = predictedPay(totalH);
      const actualKey = w1.id + '_actual';
      const savedActual = appData.actualPay && appData.actualPay[actualKey] ? appData.actualPay[actualKey] : 0;
      const card = el('div',{class:'card',style:{marginBottom:'10px'}});

      const header = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'12px'}});
      const labelDiv = el('div',{},
        el('div',{style:{fontWeight:'600',fontSize:'14px'}}, w1.label + (w2?' → '+w2.label:' (in progress)')),
        el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'2px'}},totalH.toFixed(2)+'h total')
      );
      const payDiv = el('div',{style:{textAlign:'right'}},
        el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--green)',fontSize:'16px'}},fmt(predicted)),
        el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},'predicted')
      );
      header.append(labelDiv,payDiv);

      // day breakdown — with edit toggle
      let editMode = false;
      const dayInputs = {};
      const breakdown = el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'4px',marginBottom:'8px'}});

      function renderBreakdown(){
        breakdown.innerHTML='';
        for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
          const h1 = w1[d]||0;
          const h2 = w2?w2[d]||0:0;
          const total = h1+h2;
          const col = el('div',{style:{textAlign:'center'}},
            el('div',{style:{fontSize:'9px',color:'var(--text3)',textTransform:'uppercase',marginBottom:'3px'}},d.slice(0,2))
          );
          if(editMode){
            const inp = el('input',{inputmode:'decimal',value:total||'',style:{padding:'4px 2px',textAlign:'center',fontSize:'12px',borderRadius:'8px',width:'100%'}});
            dayInputs[d] = inp;
            col.append(inp);
          } else {
            col.append(el('div',{style:{fontSize:'12px',fontFamily:"'Space Mono',monospace",color:total>0?'var(--text)':'var(--text3)'}},total>0?total.toFixed(1):'—'));
          }
          breakdown.append(col);
        }
      }
      renderBreakdown();

      // edit/save row
      const editRow = el('div',{style:{display:'flex',gap:'8px',marginBottom:'10px'}});
      const editBtn = el('button',{style:{background:'var(--surface2)',color:'var(--text2)',borderRadius:'10px',padding:'6px 12px',fontSize:'12px',border:'1px solid var(--border)'}},'Edit hours');
      editBtn.addEventListener('click',async()=>{
        if(!editMode){
          editMode=true;
          editBtn.textContent='Save hours';
          editBtn.style.background='var(--green)';
          editBtn.style.color='#000';
          renderBreakdown();
        } else {
          // save edited hours back to w1 (split proportionally if w2 exists)
          const newLog = (appData.hoursLog||[]).map(w => {
            if(w.id === w1.id){
              const updated = {...w};
              for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
                const val = parseFloat(dayInputs[d]?.value)||0;
                const h2 = w2?w2[d]||0:0;
                updated[d] = Math.max(0, val - h2);
              }
              updated.total = ['mon','tue','wed','thu','fri','sat','sun'].reduce((s,d)=>s+updated[d],0);
              updated.total = Math.round(updated.total*100)/100;
              updated.predicted = predictedPay(updated.total);
              return updated;
            }
            return w;
          });
          await save({...appData, hoursLog:newLog});
          editMode=false;
          editBtn.textContent='Edit hours';
          editBtn.style.background='var(--surface2)';
          editBtn.style.color='var(--text2)';
          renderBreakdown();
        }
      });
      editRow.append(editBtn);

      // Actual pay row
      const actualWrap = el('div',{style:{display:'flex',alignItems:'center',gap:'8px',borderTop:'1px solid var(--border)',paddingTop:'10px'}});
      const actualInput = el('input',{inputmode:'decimal',placeholder:'Actual pay received (£)',value:savedActual||'',style:{flex:'1',padding:'8px 12px',fontSize:'13px'}});
      const saveActualBtn = el('button',{style:{background:'var(--green)',color:'#000',borderRadius:'10px',padding:'8px 12px',fontWeight:'700',fontSize:'12px',whiteSpace:'nowrap'}},'Save');
      saveActualBtn.addEventListener('click',async()=>{
        const val = parseFloat(actualInput.value)||0;
        const newActual = {...(appData.actualPay||{}), [actualKey]: val};
        await save({...appData, actualPay:newActual});
        const diff = val - predicted;
        varianceDiv.textContent = val > 0 ? (diff >= 0 ? '+' : '') + fmt(diff) + ' vs predicted' : '';
        varianceDiv.style.color = diff >= 0 ? 'var(--green)' : 'var(--red)';
        saveActualBtn.textContent = '✓';
        setTimeout(()=>saveActualBtn.textContent='Save', 1500);
      });
      const diff = savedActual ? savedActual - predicted : 0;
      const varianceDiv = el('div',{style:{fontSize:'11px',color:diff>=0?'var(--green)':'var(--red)',minWidth:'80px',textAlign:'right'}},
        savedActual > 0 ? (diff>=0?'+':'')+fmt(diff)+' vs predicted' : ''
      );
      actualWrap.append(actualInput, saveActualBtn, varianceDiv);

      // delete button
      const delBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'12px',padding:'4px 0',marginTop:'8px'}},'Remove period');
      delBtn.addEventListener('click',async()=>{
        const ids = [w1.id, w2&&w2.id].filter(Boolean);
        const newLog = (appData.hoursLog||[]).filter(w=>!ids.includes(w.id));
        await save({...appData,hoursLog:newLog});
        renderAll();
      });

      card.append(header, breakdown, editRow, actualWrap, delBtn);
      histWrap.append(card);
    }

    // Hours graph
    const sortedForGraph = [...log].sort((a,b) => parseLabel(a.label) - parseLabel(b.label));
    if(sortedForGraph.length >= 2){
      const values = sortedForGraph.map(w => w.total);
      const dates = sortedForGraph.map(w => w.label);
      const W = Math.min(window.innerWidth - 40, 440);
      const H = 150;
      const PAD = {top:10, right:16, bottom:28, left:36};
      const iW = W - PAD.left - PAD.right;
      const iH = H - PAD.top - PAD.bottom;
      const min = 0;
      const max = Math.max(...values, 1);
      const xStep = values.length > 1 ? iW / (values.length - 1) : iW;
      const yScale = v => iH - ((v - min) / (max - min)) * iH;
      const pts = values.map((v,i) => [PAD.left + i*xStep, PAD.top + yScale(v)]);
      const polyline = pts.map(p=>p.join(',')).join(' ');
      const fillPath = `M${pts[0][0]},${PAD.top+iH} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${PAD.top+iH} Z`;

      const avgH = values.reduce((s,v)=>s+v,0)/values.length;
      const avgY = PAD.top + yScale(avgH);

      const xLabels = dates.map((d,i) => {
        if(values.length > 8 && i % Math.ceil(values.length/6) !== 0 && i !== values.length-1) return '';
        const x = PAD.left + i*xStep;
        const parts = d.split('/');
        const lbl = parts[0]+'/'+parts[1];
        return `<text x="${x}" y="${H-4}" text-anchor="middle" fill="#555" font-size="8" font-family="Space Grotesk,sans-serif">${lbl}</text>`;
      }).join('');

      const yLabels = [0, Math.round(max/2), Math.round(max)].map(v => {
        const y = PAD.top + yScale(v);
        return `<text x="${PAD.left-4}" y="${y+3}" text-anchor="end" fill="#555" font-size="9" font-family="Space Mono,monospace">${v}h</text>`;
      }).join('');

      const dots = values.map((v,i) => {
        const [x,y] = pts[i];
        const isHigh = v === Math.max(...values);
        const isLow = v === Math.min(...values);
        const color = isHigh ? 'var(--green)' : isLow ? 'var(--red)' : '#64B5F6';
        return `<circle cx="${x}" cy="${y}" r="${isHigh||isLow?4:2.5}" fill="${color}" stroke="#0D0D0D" stroke-width="1.5"/>`;
      }).join('');

      const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">
        <defs><linearGradient id="hoursGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#64B5F6" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${fillPath}" fill="url(#hoursGrad)"/>
        <line x1="${PAD.left}" y1="${avgY}" x2="${PAD.left+iW}" y2="${avgY}" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="${PAD.left+iW+2}" y="${avgY+3}" fill="#555" font-size="8" font-family="Space Mono,monospace">avg</text>
        <polyline points="${polyline}" fill="none" stroke="#64B5F6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${yLabels}${xLabels}${dots}
      </svg>`;

      const graphCard = el('div',{class:'card',style:{overflowX:'auto',padding:'16px 20px',marginBottom:'12px'}});
      graphCard.innerHTML = `<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#64B5F6;margin-bottom:12px;font-family:'Space Grotesk',sans-serif">Hours per week · avg ${avgH.toFixed(1)}h</div>${svg}`;
      graphWrap.innerHTML = '';
      graphWrap.append(graphCard);
    }

    // Summary — use sorted (chronological) to get most recent weeks
    const totalAllHours = log.reduce((s,w)=>s+w.total,0);
    const recentTwo = sortedForGraph.slice(-2);
    const nextPredicted = recentTwo.reduce((s,w)=>s+w.total,0);
    histWrap.append(
      el('div',{class:'section-hdr'},'Summary'),
      el('div',{class:'card'},
        el('div',{class:'balance-row'},
          el('div',{class:'balance-label'},'Total hours tracked'),
          el('div',{class:'balance-value'},totalAllHours.toFixed(1)+'h')
        ),
        el('div',{class:'balance-row'},
          el('div',{class:'balance-label'},'Effective rate (after tax)'),
          el('div',{class:'balance-value'},fmt(RATE)+'/hr')
        ),
        el('div',{class:'balance-row'},
          el('div',{class:'balance-label'},'Current period predicted'),
          el('div',{class:'balance-value',style:{color:'var(--green)'}},
            recentTwo.length >= 1 ? fmt(predictedPay(nextPredicted)) : '—'
          )
        )
      )
    );
  }

  renderAll();

  content.append(
    el('div',{class:'section-hdr'},'Hours per week'),
    graphWrap,
    el('div',{class:'section-hdr'},'Hourly Rate'),
    rateWrap,
    el('div',{class:'section-hdr'},'Log Hours'),
    logWrap,
    el('div',{class:'section-hdr'},'Pay Periods'),
    filterBar,
    histWrap
  );
  return content;
}

  const homeBtn = el('button',{class:'nav-btn active'});
  homeBtn.innerHTML = svgHome + '<span>Overview</span>';
  const trendsBtn = el('button',{class:'nav-btn'});
  trendsBtn.innerHTML = svgChart + '<span>Trends</span>';
  const hoursBtn = el('button',{class:'nav-btn'});
  hoursBtn.innerHTML = svgClock + '<span>Hours</span>';
  const settBtn = el('button',{class:'nav-btn'});
  settBtn.innerHTML = svgGear + '<span>Settings</span>';
  const payBtn = el('button',{class:'nav-btn',style:{color:'var(--green)'}});
  const payCircle = el('div',{style:{width:'44px',height:'44px',background:'var(--green)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',marginTop:'-20px',boxShadow:'0 0 20px #00E67640'}});
  payCircle.innerHTML = svgPlus;
  payBtn.append(payCircle, el('span',{style:{marginTop:'4px'}},'Payday'));

  function setTab(t){
    tab=t;
    homeBtn.className='nav-btn'+(t==='home'?' active':'');
    trendsBtn.className='nav-btn'+(t==='trends'?' active':'');
    hoursBtn.className='nav-btn'+(t==='hours'?' active':'');
    settBtn.className='nav-btn'+(t==='settings'?' active':'');
    body.innerHTML='';
    const header = el('div',{style:{padding:'max(20px,env(safe-area-inset-top)) 20px 0',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0'}});
    if(t==='home'){
      header.append(
        el('div',{},
          el('div',{style:{fontSize:'12px',color:'var(--text3)',letterSpacing:'2px',textTransform:'uppercase'}},'Your money'),
          el('div',{style:{fontSize:'22px',fontWeight:'700',marginTop:'2px'}},'Financial Freedom')
        ),
        el('button',{style:{background:'var(--green)',color:'#000',padding:'10px 18px',borderRadius:'12px',fontWeight:'700',fontSize:'14px'}},'I got paid')
      );
      header.querySelector('button').addEventListener('click',()=>render(paydayFlow()));
      body.append(header, overviewScreen());
    } else if(t==='trends'){
      header.append(el('div',{},
        el('div',{style:{fontSize:'12px',color:'var(--text3)',letterSpacing:'2px',textTransform:'uppercase'}},'Your progress'),
        el('div',{style:{fontSize:'22px',fontWeight:'700',marginTop:'2px'}},'Trends')
      ));
      body.append(header, trendsScreen());
    } else if(t==='hours'){
      header.append(el('div',{},
        el('div',{style:{fontSize:'12px',color:'var(--text3)',letterSpacing:'2px',textTransform:'uppercase'}},'Work'),
        el('div',{style:{fontSize:'22px',fontWeight:'700',marginTop:'2px'}},'Hours & Pay')
      ));
      body.append(header, hoursScreen());
    } else {
      header.append(el('div',{},
        el('div',{style:{fontSize:'12px',color:'var(--text3)',letterSpacing:'2px',textTransform:'uppercase'}},'Manage'),
        el('div',{style:{fontSize:'22px',fontWeight:'700',marginTop:'2px'}},'Settings')
      ));
      body.append(header, settingsScreen());
    }
  }

  homeBtn.addEventListener('click',()=>setTab('home'));
  trendsBtn.addEventListener('click',()=>setTab('trends'));
  hoursBtn.addEventListener('click',()=>setTab('hours'));
  settBtn.addEventListener('click',()=>setTab('settings'));
  payBtn.addEventListener('click',()=>render(paydayFlow()));

  const nav = el('div',{class:'nav'}, homeBtn, trendsBtn, payBtn, hoursBtn, settBtn);
  wrap.append(body, nav);
  setTab(startTab);
  render(wrap);
}

// ── boot ──
auth.onAuthStateChanged(async user => {
  currentUser = user;
  if(!user){ render(authScreen()); return; }
  render(el('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh',color:'var(--text3)',fontSize:'14px'}},'Loading…'));
  const snap = await db.ref('users/'+user.uid).once('value');
  const val = snap.val();
  appData = val ? {
    ...DEFAULT_DATA,
    ...val,
    balances:{...DEFAULT_DATA.balances,...(val.balances||{})},
    subscriptions:val.subscriptions||DEFAULT_DATA.subscriptions,
    paychecks: Array.isArray(val.paychecks) ? val.paychecks : [] // BUG FIX 6: Firebase drops empty arrays, guard against null
  } : DEFAULT_DATA;
  mainScreen();
});
</script>
</body>
</html>
