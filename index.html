        el('div',{style:{flex:'1'}},
          el('div',{style:{fontWeight:'600',fontSize:'14px'}},item.label),
          el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'2px'}},item.sub)
        ),
        el('div',{style:{color:'var(--text3)',fontSize:'18px'}},'›')
      );
      row.addEventListener('click',()=>setTab(item.tab));
      content.append(row);
    }
    return content;
  }

  function setTab(t){
    tab=t;
    homeBtn.className ='nav-btn'+(t==='home'?' active':'');
    moneyBtn.className='nav-btn'+(['money','_accounts','_transactions','_analytics'].includes(t)?' active':'');
    planBtn.className ='nav-btn'+(['plan','_calendar','_goals'].includes(t)?' active':'');
    workBtn.className ='nav-btn'+(t==='work'?' active':'');
    moreBtn.className ='nav-btn'+(['more','_statements','_recurring','_merchants','_lifestyle','_ask','_trends','_settings'].includes(t)?' active':'');

    body.innerHTML='';
    const userLabel = (appData.profile?.displayName || currentUser?.email?.split('@')[0] || 'My') + '\'s Account';
    const header = el('div',{class:'page-header'});
    const makeHeader = (title, action) => {
      header.append(el('div',{style:{flex:'1'}},
        el('div',{class:'page-eyebrow'},userLabel),
        el('div',{class:'page-title'},title)
      ));
      if(action) header.append(action);
    };

    if(t==='home'){
      const payBtn2 = el('button',{style:{background:'var(--green)',color:'#000',padding:'9px 16px',borderRadius:'10px',fontWeight:'700',fontSize:'13px'}},'I got paid');
      payBtn2.addEventListener('click',()=>render(paydayFlow()));
      makeHeader('Financial Freedom', payBtn2);
      body.append(header, overviewScreen());

    } else if(t==='money'||t==='_accounts'||t==='_transactions'||t==='_analytics'){
      if(t!=='money') moneySubTab = t.slice(1);
      makeHeader('Money');
      const subBar = makeSubTabs([['accounts','Accounts'],['transactions','Transactions'],['analytics','Analytics']], moneySubTab, id=>{
        moneySubTab=id; setTab('_'+id);
      });
      body.append(header, subBar);
      if(moneySubTab==='accounts')     body.append(accountsScreen());
      else if(moneySubTab==='transactions') body.append(transactionsScreen());
      else body.append(analyticsScreen());

    } else if(t==='plan'||t==='_calendar'||t==='_goals'){
      if(t!=='plan') planSubTab = t.slice(1);
      makeHeader('Plan');
      const subBar = makeSubTabs([['calendar','Calendar'],['goals','Goals']], planSubTab, id=>{
        planSubTab=id; setTab('_'+id);
      });
      body.append(header, subBar);
      if(planSubTab==='calendar') body.append(calendarScreen());
      else body.append(goalsScreen());

    } else if(t==='work'){
      makeHeader('Hours & Pay');
      body.append(header, hoursScreen());

    } else if(t==='more'){
      makeHeader('More');
      body.append(header, moreScreen());

    // ── More sub-screens ──
    } else if(t==='_statements'){ makeHeader('Import Statement'); body.append(header, statementsScreen());
    } else if(t==='_recurring'){  makeHeader('Recurring');        body.append(header, recurringScreen());
    } else if(t==='_merchants'){  makeHeader('Merchant Rules');   body.append(header, merchantRulesScreen());
    } else if(t==='_lifestyle'){  makeHeader('Lifestyle');        body.append(header, lifestyleScreen());
    } else if(t==='_ask'){        makeHeader('Ask My Finances');  body.append(header, askScreen());
    } else if(t==='_trends'){     makeHeader('Trends');           body.append(header, trendsScreen());
    } else if(t==='_settings'){   makeHeader('Settings');         body.append(header, settingsScreen());
    }
  }

  window._setTab = setTab;

  function scrollActiveTab(){
    const activeBtn = nav.querySelector('.nav-btn.active');
    if(activeBtn) activeBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  }

  homeBtn.addEventListener('click',()=>{  setTab('home');  setTimeout(scrollActiveTab,50); });
  moneyBtn.addEventListener('click',()=>{ setTab('money'); setTimeout(scrollActiveTab,50); });
  planBtn.addEventListener('click',()=>{  setTab('plan');  setTimeout(scrollActiveTab,50); });
  workBtn.addEventListener('click',()=>{  setTab('work');  setTimeout(scrollActiveTab,50); });
  moreBtn.addEventListener('click',()=>{  setTab('more');  setTimeout(scrollActiveTab,50); });
  payBtn.addEventListener('click',()=>render(paydayFlow()));

  const nav = el('div',{class:'nav'}, homeBtn, moneyBtn, payBtn, planBtn, workBtn, moreBtn);
  wrap.append(body, nav);
  setTab(startTab);
  setTimeout(scrollActiveTab, 100);
  render(wrap);
}


// ── boot ──
auth.onAuthStateChanged(async user => {
  currentUser = user;
  if(!user){ render(authScreen()); return; }
  render(el('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh',color:'var(--text3)',fontSize:'14px'}},'Loading…'));
  const snap = await db.ref('users/'+user.uid).once('value');
  const val = snap.val();
  appData = val ? {
    ...DEFAULT_DATA,
    ...val,
    balances:{...DEFAULT_DATA.balances,...(val.balances||{})},
    subscriptions: Array.isArray(val.subscriptions) ? val.subscriptions : [],
    paychecks: Array.isArray(val.paychecks) ? val.paychecks : [],
    lifestyleRequirements: Array.isArray(val.lifestyleRequirements) ? val.lifestyleRequirements : [],
    goals: Array.isArray(val.goals) ? val.goals : [],
    habits: val.habits || {lastPaycheckLog:null, lastReview:null, streak:0, xp:0, level:1, achievements:[]},
  } : {
    ...DEFAULT_DATA,
    lifestyleRequirements: [],
    goals: [],
    habits: {lastPaycheckLog:null, lastReview:null, streak:0, xp:0, level:1, achievements:[]},
  };
  // Ensure profile data (display name) is saved if new user
  if(!val || !val.profile){
    const displayName = user.displayName || user.email.split('@')[0];
    await db.ref('users/'+user.uid+'/profile').set({displayName, email:user.email, createdAt: new Date().toISOString()});
    appData.profile = {displayName, email:user.email};
  }
  mainScreen();
  // Silently update subscription billing dates from all existing transactions
  db.ref('users/'+user.uid+'/transactions').limitToLast(500).once('value').then(snap=>{
    const val = snap.val();
    if(val) updateSubscriptionBillingDates(Object.values(val));
  });

  // Seed default goals if none exist and this is Lawrence's account
  // (Each user sets their own goals — this only runs once when goals array is empty)
  if(!appData.goals || appData.goals.length === 0){
    // Leave empty — user will add their own via Goals screen
    // Lawrence can add his Florasii goals from the Goals tab
  }
});
</script>
</body>
</html>
