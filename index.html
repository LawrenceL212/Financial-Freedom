<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0D0D0D;
  --surface: #161616;
  --surface2: #1E1E1E;
  --border: #2A2A2A;
  --green: #00E676;
  --green-dim: #00E67620;
  --red: #FF5252;
  --red-dim: #FF525220;
  --amber: #FFB300;
  --amber-dim: #FFB30020;
  --text: #F0F0F0;
  --text2: #888;
  --text3: #555;
}
body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior: none;
}
.mono { font-family: 'Space Mono', monospace; }

/* scrollbar */
::-webkit-scrollbar { width: 0; }

/* input reset */
input, select, button { font-family: inherit; }
input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 14px 16px; font-size: 16px; width: 100%; outline: none; transition: border-color 0.15s; }
input:focus { border-color: var(--green); }
input::placeholder { color: var(--text3); }

button { cursor: pointer; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
button:active { transform: scale(0.97); }

.btn-primary { background: var(--green); color: #000; padding: 16px; width: 100%; font-size: 16px; border-radius: 16px; letter-spacing: 0.3px; }
.btn-ghost { background: var(--surface2); color: var(--text2); padding: 14px; width: 100%; border: 1px solid var(--border); }

/* layout */
.screen { min-height: 100dvh; display: flex; flex-direction: column; }
.content { flex: 1; padding: 24px 20px; max-width: 480px; margin: 0 auto; width: 100%; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
.card + .card { margin-top: 12px; }

/* balance pill */
.balance-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
.balance-row:last-child { border-bottom: none; padding-bottom: 0; }
.balance-row:first-child { padding-top: 0; }
.balance-label { font-size: 14px; color: var(--text2); }
.balance-value { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; }

/* step flow */
.step-number { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
.step-title { font-size: 26px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; }
.step-sub { font-size: 14px; color: var(--text2); margin-bottom: 28px; line-height: 1.5; }

/* split instruction card */
.instruction { background: var(--surface2); border-radius: 16px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid var(--green); }
.instruction.red { border-left-color: var(--red); }
.instruction.amber { border-left-color: var(--amber); }
.instruction-label { font-size: 14px; color: var(--text2); margin-bottom: 2px; }
.instruction-action { font-size: 15px; font-weight: 600; }
.instruction-amount { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; color: var(--green); }
.instruction.red .instruction-amount { color: var(--red); }
.instruction.amber .instruction-amount { color: var(--amber); }

/* big input */
.big-input-wrap { position: relative; margin-bottom: 24px; }
.big-input-wrap .currency { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: var(--text3); pointer-events: none; }
.big-input { font-family: 'Space Mono', monospace !important; font-size: 28px !important; font-weight: 700 !important; padding: 20px 20px 20px 44px !important; border-radius: 16px !important; letter-spacing: -0.5px; }

/* nav */
.nav { display: flex; justify-content: space-around; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); position: sticky; bottom: 0; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 16px; background: none; color: var(--text3); font-size: 11px; border-radius: 12px; min-width: 60px; }
.nav-btn.active { color: var(--green); }
.nav-btn svg { width: 22px; height: 22px; }

/* progress bar */
.prog-wrap { background: var(--surface2); border-radius: 100px; height: 8px; overflow: hidden; margin: 8px 0; }
.prog-fill { height: 100%; border-radius: 100px; background: var(--green); transition: width 0.6s cubic-bezier(.4,0,.2,1); }
.prog-fill.red { background: var(--red); }
.prog-fill.amber { background: var(--amber); }

/* sub item */
.sub-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.sub-item:last-child { border-bottom: none; }
.sub-name { font-size: 14px; }
.sub-amount { font-family: 'Space Mono', monospace; font-size: 14px; color: var(--text2); }

/* paycheck history */
.history-item { background: var(--surface2); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.history-date { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* tag */
.tag { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
.tag-green { background: var(--green-dim); color: var(--green); }
.tag-red { background: var(--red-dim); color: var(--red); }

/* done checkmark animation */
@keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
.done-icon { animation: pop 0.4s cubic-bezier(.4,0,.2,1) forwards; display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 50%; background: var(--green-dim); margin: 0 auto 20px; }

/* section header */
.section-header { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 14px; margin-top: 28px; }
.section-header:first-child { margin-top: 0; }

/* toggle */
.toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
.toggle-row:last-child { border-bottom: none; }
</style>
</head>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ── icons ── */
const I = ({ d, size=22, color='currentColor', strokeWidth=1.8 }) => (

/* ── Auth ── */
function AuthScreen() {
  const [mode, setMode] = useState('signin');
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setErr('');
    try {
      if (mode === 'signin') await auth.signInWithEmailAndPassword(email, pass);
      else await auth.createUserWithEmailAndPassword(email, pass);
    } catch(ex) { setErr(ex.message); }
    setBusy(false);
  }

  return (
    <div className="screen" style={{justifyContent:'center'}}>
      <div className="content" style={{display:'flex',flexDirection:'column',justifyContent:'center',minHeight:'100dvh'}}>
        <div style={{marginBottom:40}}>
          <div style={{fontSize:13,letterSpacing:3,textTransform:'uppercase',color:'var(--text3)',marginBottom:8}}>Your money</div>
          <div style={{fontSize:36,fontWeight:700,lineHeight:1.1}}>Financial<br/>Freedom</div>
        </div>
        <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:12}}>
          <input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} required autoComplete="email"/>
          <input type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} required minLength={6} autoComplete="current-password"/>
          {err && <div style={{fontSize:13,color:'var(--red)',lineHeight:1.4}}>{err}</div>}
          <button className="btn-primary" disabled={busy} style={{marginTop:4}}>
            {busy ? 'Please wait…' : mode === 'signin' ? 'Sign in' : 'Create account'}
          </button>
          <button type="button" className="btn-ghost" onClick={()=>setMode(m=>m==='signin'?'signup':'signin')}>
            {mode === 'signin' ? 'No account? Sign up' : 'Already have an account'}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ── Payday Flow ── */
function PaydayFlow({ data, onSave }) {
  const [step, setStep] = useState(0); // 0=income, 1=split, 2=spent, 3=done
  const [income, setIncome] = useState('');
  const [spent, setSpent] = useState('');
  const incomeNum = parseFloat(income) || 0;
  const spentNum = parseFloat(spent) || 0;
  const hasCC = data.balances.creditCard > 0;

  const split = useMemo(() => {
    if (!incomeNum) return null;
    if (hasCC) {
      return {
        florasii: incomeNum * 0.50,
        spending: incomeNum * 0.25,
        creditCard: incomeNum * 0.25,
      };
    }
    return {
      florasii: incomeNum * 0.75,
      spending: incomeNum * 0.25,
      creditCard: 0,
    };
  }, [incomeNum, hasCC]);

  function confirm() {
    const newBalances = { ...data.balances };
    newBalances.current = newBalances.current + split.spending - spentNum;
    newBalances.florasii = newBalances.florasii + split.florasii;
    if (split.creditCard) {
      newBalances.creditCard = Math.max(0, newBalances.creditCard - split.creditCard);
    }
    const newPaycheck = {
      id: uid(),
      date: new Date().toISOString(),
      income: incomeNum,
      spent: spentNum,
      split,
    };
    onSave({
      ...data,
      balances: newBalances,
      paychecks: [newPaycheck, ...(data.paychecks || [])],
    });
    setStep(3);
  }

  function reset() { setStep(0); setIncome(''); setSpent(''); }

  if (step === 0) return (
    <div className="screen">
      <div className="content" style={{display:'flex',flexDirection:'column',justifyContent:'center',flex:1}}>
        <div className="step-number">Step 1 of 3</div>
        <div className="step-title">You got paid 💰</div>
        <div className="step-sub">How much landed in your account?</div>
        <div className="big-input-wrap">
          <span className="currency">£</span>
          <input className="big-input" inputMode="decimal" placeholder="0.00" value={income} onChange={e=>setIncome(e.target.value)} autoFocus/>
        </div>
        {data.balances.creditCard > 0 && (
          <div style={{background:'var(--red-dim)',borderRadius:12,padding:'12px 14px',marginBottom:20,fontSize:13,color:'var(--red)',lineHeight:1.5}}>
            Credit card balance: {fmt(data.balances.creditCard)} — split will be 50/25/25 this payday.
          </div>
        )}
        <button className="btn-primary" disabled={!incomeNum} onClick={()=>setStep(1)}>See my split →</button>
      </div>
    </div>
  );

  if (step === 1) return (
    <div className="screen">
      <div className="content">
        <div className="step-number">Step 2 of 3</div>
        <div className="step-title">Here's the plan</div>
        <div className="step-sub">Move these amounts now, before you spend anything.</div>

        <div className="instruction">
          <div>
            <div className="instruction-label">→ Florasii Fund</div>
            <div className="instruction-action">Transfer to savings</div>
          </div>
          <div className="instruction-amount">{fmt(split.florasii)}</div>
        </div>

        {split.creditCard > 0 && (
          <div className="instruction red">
            <div>
              <div className="instruction-label">→ Credit Card</div>
              <div className="instruction-action">Pay off balance</div>
            </div>
            <div className="instruction-amount">{fmt(split.creditCard)}</div>
          </div>
        )}

        <div className="instruction amber">
          <div>
            <div className="instruction-label">→ Daily Spending</div>
            <div className="instruction-action">Keep in current account</div>
          </div>
          <div className="instruction-amount">{fmt(split.spending)}</div>
        </div>

        <div style={{background:'var(--surface2)',borderRadius:12,padding:'12px 14px',margin:'20px 0',fontSize:13,color:'var(--text2)',lineHeight:1.6}}>
          Total: {fmt(incomeNum)} · Subscriptions this month cost ~{fmt(data.subscriptions.reduce((s,x)=>s+x.amount,0))} — that comes out of your spending pot.
        </div>

        <div style={{display:'flex',gap:10}}>
          <button className="btn-ghost" style={{flex:1}} onClick={()=>setStep(0)}>← Back</button>
          <button className="btn-primary" style={{flex:2}} onClick={()=>setStep(2)}>Done, what did I spend? →</button>
        </div>
      </div>
    </div>
  );

  if (step === 2) return (
    <div className="screen">
      <div className="content" style={{display:'flex',flexDirection:'column',justifyContent:'center',flex:1}}>
        <div className="step-number">Step 3 of 3</div>
        <div className="step-title">What did you spend?</div>
        <div className="step-sub">Since your last payday — not including subscriptions, those are tracked separately.</div>
        <div className="big-input-wrap">
          <span className="currency">£</span>
          <input className="big-input" inputMode="decimal" placeholder="0.00" value={spent} onChange={e=>setSpent(e.target.value)} autoFocus/>
        </div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn-ghost" style={{flex:1}} onClick={()=>setStep(1)}>← Back</button>
          <button className="btn-primary" style={{flex:2}} onClick={confirm}>Confirm & save →</button>
        </div>
      </div>
    </div>
  );

  if (step === 3) return (
    <div className="screen">
      <div className="content" style={{display:'flex',flexDirection:'column',justifyContent:'center',flex:1,textAlign:'center'}}>
        <div className="done-icon"><CheckIcon/></div>
        <div style={{fontSize:26,fontWeight:700,marginBottom:8}}>All sorted 🎉</div>
        <div style={{fontSize:14,color:'var(--text2)',marginBottom:40,lineHeight:1.6}}>
          {fmt(split.florasii)} moved to Florasii.<br/>
          Your balances are updated.
        </div>
        <button className="btn-primary" onClick={reset}>Log another paycheck</button>
      </div>
    </div>
  );
}

/* ── Overview ── */
function Overview({ data }) {

        <div className="balance-row">
          <div className="balance-label">Florasii Fund</div>
          <div className="balance-value" style={{color:'var(--green)'}}>{fmt(balances.florasii)}</div>
        </div>

            <div className="balance-value" style={{color:'var(--red)'}}>{fmt(balances.creditCard)}</div>
          </div>
        )}
      </div>

      <div className="section-header">Florasii Progress</div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:8}}>
          <div>
            <div style={{fontSize:28,fontWeight:700,fontFamily:'Space Mono',color:'var(--green)'}}>{fmt(balances.florasii)}</div>
            <div style={{fontSize:13,color:'var(--text2)',marginTop:2}}>of £15,000 goal</div>
          </div>
          <div style={{fontSize:22,fontWeight:700,color:'var(--text2)'}}>{Math.round(balances.florasii/15000*100)}%</div>
        </div>
        <div className="prog-wrap">
          <div className="prog-fill" style={{width:`${Math.min(100,balances.florasii/15000*100)}%`}}/>
        </div>
      </div>

      <div className="section-header">Subscriptions · {fmt(subTotal)}/mo</div>
      <div className="card">
        {data.subscriptions.map(s => (
          <div className="sub-item" key={s.id}>
            <div className="sub-name">{s.name}</div>
            <div className="sub-amount">{fmt(s.amount)}</div>
          </div>
        ))}
        <div style={{display:'flex',justifyContent:'space-between',paddingTop:14,marginTop:4}}>
          <div style={{fontSize:13,color:'var(--text2)',fontWeight:600}}>Total / month</div>
          <div style={{fontFamily:'Space Mono',fontSize:14,fontWeight:700,color:'var(--amber)'}}>{fmt(subTotal)}</div>
        </div>
      </div>

      {recentPays.length > 0 && <>
        <div className="section-header">Recent Paychecks</div>
        {recentPays.map(p => (
          <div className="history-item" key={p.id}>
            <div>
              <div style={{fontWeight:600}}>{fmt(p.income)}</div>
              <div className="history-date">{new Date(p.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:13,color:'var(--green)'}}>+{fmt(p.split.florasii)} Florasii</div>
              <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>spent {fmt(p.spent)}</div>
            </div>
          </div>
        ))}
        <div style={{textAlign:'center',marginTop:8,fontSize:13,color:'var(--text3)'}}>
          Total tracked: {fmt(totalIncome)} across {paychecks.length} paychecks
        </div>
      </>}
    </div>
  );
}

/* ── Settings ── */
function Settings({ data, onSave, onSignOut }) {
  const [balances, setBalances] = useState(data.balances);
  const [subs, setSubs] = useState(data.subscriptions);
  const [newSub, setNewSub] = useState({ name: '', amount: '' });

  function saveAll() {
    onSave({ ...data, balances: { current: parseFloat(balances.current)||0, creditCard: parseFloat(balances.creditCard)||0, florasii: parseFloat(balances.florasii)||0, personalSavings: parseFloat(balances.personalSavings)||0 }, subscriptions: subs });
  }

  function addSub(e) {
    e.preventDefault();
    if (!newSub.name || !newSub.amount) return;
    setSubs([...subs, { id: uid(), name: newSub.name, amount: parseFloat(newSub.amount)||0 }]);
    setNewSub({ name: '', amount: '' });
  }

  const fld = (label, val, key) => (
    <div style={{marginBottom:12}}>
      <div style={{fontSize:12,color:'var(--text3)',marginBottom:6,letterSpacing:0.5}}>{label}</div>
      <input inputMode="decimal" value={val} onChange={e=>setBalances({...balances,[key]:e.target.value})} />
    </div>
  );

  return (
    <div className="content" style={{paddingBottom:100}}>
      <div className="section-header">Update Balances</div>
      <div className="card">
        {fld('Current Account (£)', balances.current, 'current')}
        {fld('Florasii Fund (£)', balances.florasii, 'florasii')}
        {fld('Personal Savings (£)', balances.personalSavings, 'personalSavings')}
        {fld('Credit Card Owed (£)', balances.creditCard, 'creditCard')}
        <button className="btn-primary" onClick={saveAll} style={{marginTop:8}}>Save balances</button>
      </div>

      <div className="section-header">Subscriptions</div>
      <div className="card">
        {subs.map(s => (
          <div className="sub-item" key={s.id}>
            <div className="sub-name">{s.name}</div>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <div className="sub-amount">{fmt(s.amount)}</div>
              <button style={{background:'none',color:'var(--red)',padding:0}} onClick={()=>setSubs(subs.filter(x=>x.id!==s.id))}><TrashIcon/></button>
            </div>
          </div>
        ))}
        <form onSubmit={addSub} style={{display:'flex',gap:8,marginTop:14}}>
          <input placeholder="Name" value={newSub.name} onChange={e=>setNewSub({...newSub,name:e.target.value})} style={{flex:2}}/>
          <input placeholder="£" inputMode="decimal" value={newSub.amount} onChange={e=>setNewSub({...newSub,amount:e.target.value})} style={{flex:1}}/>
          <button type="submit" style={{background:'var(--green)',color:'#000',borderRadius:12,padding:'0 16px',fontWeight:700,whiteSpace:'nowrap'}}>Add</button>
        </form>
        <button className="btn-ghost" style={{marginTop:12}} onClick={saveAll}>Save subscriptions</button>
      </div>

      <div style={{marginTop:32}}>
        <button className="btn-ghost" onClick={onSignOut}>Sign out</button>
      </div>
    </div>
  );
}

/* ── Main App ── */
function App() {
  const [user, setUser] = useState(undefined);
  const [data, setData] = useState(null);
  const [tab, setTab] = useState('home');
  const [payday, setPayday] = useState(false);

  useEffect(() => {
    return auth.onAuthStateChanged(u => setUser(u));
  }, []);

  useEffect(() => {
    if (!user) return;
    db.ref(`users/${user.uid}`).once('value').then(snap => {
      const val = snap.val();
      setData(val ? { ...DEFAULT_DATA, ...val, balances: { ...DEFAULT_DATA.balances, ...(val.balances||{}) }, subscriptions: val.subscriptions || DEFAULT_DATA.subscriptions } : DEFAULT_DATA);
    });
  }, [user]);

  const persist = useCallback(async (next) => {
    if (!user) return;
    await db.ref(`users/${user.uid}`).set(next);
    setData(next);
  }, [user]);

  if (user === undefined || (user && !data)) {
    return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh',color:'var(--text3)',fontSize:14}}>Loading…</div>;
  }
  if (!user) return <AuthScreen />;

  if (payday) return (
    <PaydayFlow data={data} onSave={next => { persist(next); setPayday(false); setTab('home'); }} />
  );

  const tabs = [
    { id: 'home', label: 'Overview', icon: <HomeIcon/> },
    { id: 'settings', label: 'Settings', icon: <SettingsIcon/> },
  ];

  return (
    <div className="screen">
      <div style={{flex:1,overflowY:'auto'}}>
        <div style={{paddingTop:'max(20px,env(safe-area-inset-top))'}}>
          {tab === 'home' && (
            <>
              <div style={{padding:'20px 20px 0',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontSize:12,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase'}}>Your money</div>
                  <div style={{fontSize:22,fontWeight:700,marginTop:2}}>Financial Freedom</div>
                </div>
                <button onClick={()=>setPayday(true)} style={{background:'var(--green)',color:'#000',padding:'10px 18px',borderRadius:12,fontWeight:700,fontSize:14}}>
                  I got paid
                </button>
              </div>
              <Overview data={data}/>
            </>
          )}
          {tab === 'settings' && (
            <>
              <div style={{padding:'20px 20px 0'}}>
                <div style={{fontSize:12,color:'var(--text3)',letterSpacing:2,textTransform:'uppercase'}}>Manage</div>
                <div style={{fontSize:22,fontWeight:700,marginTop:2}}>Settings</div>
              </div>
              <Settings data={data} onSave={persist} onSignOut={()=>auth.signOut()} />
            </>
          )}
        </div>
      </div>
      <nav className="nav">
        {tabs.map(t => (
          <button key={t.id} className={`nav-btn${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
            {t.icon}
            <span>{t.label}</span>
          </button>
        ))}
        <button className="nav-btn" style={{color:'var(--green)'}} onClick={()=>setPayday(true)}>
          <div style={{width:44,height:44,background:'var(--green)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',marginTop:-20,boxShadow:'0 0 20px #00E67640'}}>
            <PlusIcon/>
          </div>
          <span style={{marginTop:4}}>Payday</span>
        </button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
