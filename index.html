// STATEMENT IMPORT SCREEN
// ══════════════════════════════════════
function statementsScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  let importState = 'idle'; // idle | parsing | preview | importing | complete | error
  let parsedTxns = [];
  let analysisResult = null;
  let statementMeta = null;
  let fileContent = null;

  const stmtWrap = el('div',{}); // statement history
  const importWrap = el('div',{}); // import UI

  // ── Statement history ──
  async function renderHistory(){
    stmtWrap.innerHTML = '';
    const stmts = await txnDB.getStatements();
    if(stmts.length === 0){
      stmtWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'24px 16px',color:'var(--text2)',fontSize:'13px'}},'No statements imported yet.'));
      return;
    }
    const sorted = [...stmts].sort((a,b)=>(b.periodStart||'').localeCompare(a.periodStart||''));
    stmtWrap.append(el('div',{class:'section-hdr'},'Imported Statements'));
    for(const s of sorted){
      const card = el('div',{class:'card',style:{marginBottom:'8px'}});
      const hdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}});
      hdr.append(
        el('div',{},
          el('div',{style:{fontWeight:'600',fontSize:'14px'}},s.filename||'Statement'),
          el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'2px'}},
            (s.periodStart?s.periodStart.slice(0,7):'?')+' → '+(s.periodEnd?s.periodEnd.slice(0,7):'?'))
        ),
        el('div',{style:{textAlign:'right'}},
          el('div',{style:{fontSize:'13px',fontWeight:'600',color:'var(--green)'}},s.transactionCount+' txns'),
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},
            new Date(s.uploadedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}))
        )
      );
      const details = el('div',{style:{display:'flex',gap:'16px',marginTop:'8px',fontSize:'12px',color:'var(--text2)'}});
      if(s.newCount!=null) details.append(el('span',{},s.newCount+' new'));
      if(s.matchedPaycheckCount) details.append(el('span',{style:{color:'var(--green)'}},s.matchedPaycheckCount+' paychecks matched'));
      if(s.duplicateCount) details.append(el('span',{style:{color:'var(--amber)'}},s.duplicateCount+' possible duplicates'));
      const delBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'12px',padding:'4px 0',marginTop:'8px'}},'Delete import');
      delBtn.addEventListener('click',async()=>{
        if(!confirm('Delete this statement and all its transactions? This cannot be undone.')) return;
        delBtn.textContent='Deleting…'; delBtn.disabled=true;
        await txnDB.deleteStatement(s.statementId);
        renderHistory();
      });
      card.append(hdr, details, delBtn);
      stmtWrap.append(card);
    }
  }

  // ── Import UI ──
  function renderImportUI(){
    importWrap.innerHTML = '';

    if(importState === 'idle'){
      const uploadCard = el('div',{class:'card'});
      uploadCard.innerHTML = `<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;font-family:'Space Grotesk',sans-serif">Import Statement</div>`;

      const fileInp = el('input',{type:'file',accept:'.csv',style:{display:'none'}});
      const uploadBtn = el('button',{class:'btn-primary'},'📂 Choose CSV file');
      uploadBtn.addEventListener('click',()=>fileInp.click());

      const infoDiv = el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'10px',lineHeight:'1.6'}},
        'Supports Barclays current account CSV export. Raw bank data is preserved — your interpretations are stored separately.');

      fileInp.addEventListener('change',async(e)=>{
        const file = e.target.files[0];
        if(!file) return;
        importState = 'parsing';
        uploadBtn.textContent = 'Parsing…';
        uploadBtn.disabled = true;

        try {
          fileContent = await file.text();
          const fingerprint = await hashFile(fileContent);

          // Check for duplicate file
          const existing = await txnDB.getFingerprints();
          if(existing.includes(fingerprint)){
            importWrap.innerHTML='';
            const dupCard = el('div',{class:'card',style:{borderLeft:'3px solid var(--amber)'}});
            dupCard.innerHTML=`<div style="font-weight:700;margin-bottom:8px;color:var(--amber)">⚠️ This statement has already been imported</div>
<div style="font-size:13px;color:var(--text2)">The exact same file was previously imported. Importing it again would create duplicate transactions.</div>`;
            const resetBtn = el('button',{class:'btn-ghost',style:{marginTop:'12px'}},'Choose a different file');
            resetBtn.addEventListener('click',()=>{ importState='idle'; renderImportUI(); });
            dupCard.append(resetBtn);
            importWrap.append(dupCard);
            return;
          }

          // Parse
          const {txns, account, minDate, maxDate} = parseBarclaysCSV(fileContent);
          parsedTxns = txns;

          // Analyse
          const paychecks = (appData.paychecks||[]).filter(p=>p.income>0);
          const subs = appData.subscriptions||[];
          const dupResult = await detectDuplicates(txns, [], null);
          const paycheckMatches = findPaycheckMatches(txns, paychecks);
          const subMatches = findSubscriptionMatches(txns, subs);

          // Financial type breakdown
          const byType = {};
          for(const t of txns){
            byType[t.financialType] = (byType[t.financialType]||0)+1;
          }

          const transferKeywords = ['FLORASII','FLOLOSII','FLORAIII','SAVINGS','CREDIT CARD'];
          const likelySavings = txns.filter(t=>t.financialType==='SAVINGS_TRANSFER').length;
          const needsReview = txns.filter(t=>t.confidence<0.6||t.financialType.startsWith('UNKNOWN')).length;

          analysisResult = {
            fingerprint,
            account,
            periodStart: minDate,
            periodEnd: maxDate,
            total: txns.length,
            byType,
            income: txns.filter(t=>t.financialType==='INCOME').length,
            expenses: txns.filter(t=>t.financialType==='EXPENSE').length,
            transfers: txns.filter(t=>t.financialType.includes('TRANSFER')||t.financialType==='SAVINGS_TRANSFER').length,
            refunds: txns.filter(t=>t.financialType==='REFUND').length,
            possibleDuplicates: dupResult.possible.length,
            paycheckMatches,
            subMatches,
            needsReview,
            filename: file.name,
          };
          statementMeta = {fingerprint, account, periodStart:minDate, periodEnd:maxDate, filename:file.name};

          importState = 'preview';
          renderImportUI();
        } catch(err){
          importState = 'error';
          importWrap.innerHTML = '';
          importWrap.append(el('div',{class:'card',style:{color:'var(--red)'}},
            el('div',{style:{fontWeight:'700',marginBottom:'8px'}},'Parse error'),
            el('div',{style:{fontSize:'13px'}},err.message)
          ));
        }
      });
      uploadCard.append(fileInp, uploadBtn, infoDiv);
      importWrap.append(uploadCard);
    }

    if(importState === 'preview'){
      const a = analysisResult;
      const previewCard = el('div',{class:'card'});

      // Header
      previewCard.append(
        el('div',{style:{fontWeight:'700',fontSize:'16px',marginBottom:'4px'}}, a.filename),
        el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'16px'}},
          'Account '+a.account+' · '+(a.periodStart?a.periodStart.slice(0,7):' ')+' → '+(a.periodEnd?a.periodEnd.slice(0,7):' '))
      );

      // Analysis grid
      const grid = el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'16px'}});
      const stat = (label,val,color)=>{
        const box = el('div',{style:{background:'var(--surface2)',borderRadius:'10px',padding:'10px 12px'}});
        box.append(
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'2px'}},label),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'18px',color:color||'var(--text)'}},String(val))
        );
        return box;
      };
      grid.append(
        stat('Total transactions', a.total),
        stat('Income credits', a.income, 'var(--green)'),
        stat('Expenses', a.expenses, 'var(--red)'),
        stat('Transfers', a.transfers, 'var(--text2)'),
        stat('Needs review', a.needsReview, a.needsReview>0?'var(--amber)':'var(--text)'),
        stat('Possible duplicates', a.possibleDuplicates, a.possibleDuplicates>0?'var(--amber)':'var(--text)'),
      );
      previewCard.append(grid);

      // Paycheck matches
      if(a.paycheckMatches.length>0){
        const pmDiv = el('div',{style:{background:'var(--green-dim)',borderRadius:'10px',padding:'12px',marginBottom:'10px'}});
        pmDiv.append(el('div',{style:{fontWeight:'600',color:'var(--green)',marginBottom:'8px',fontSize:'13px'}},
          `✓ ${a.paycheckMatches.length} paycheck match${a.paycheckMatches.length>1?'es':''} found`));
        for(const m of a.paycheckMatches.slice(0,3)){
          const row = el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'4px',display:'flex',justifyContent:'space-between'}});
          row.append(
            el('span',{},m.txn.postingDate+' '+m.txn.normalisedMerchant),
            el('span',{},m.exact?'✓ Exact match':'~£'+m.amountDiff.toFixed(2)+' diff')
          );
          pmDiv.append(row);
        }
        if(a.paycheckMatches.length>3) pmDiv.append(el('div',{style:{fontSize:'11px',color:'var(--text3)'}},'+ '+(a.paycheckMatches.length-3)+' more'));
        previewCard.append(pmDiv);
      }

      // Subscription matches
      if(a.subMatches.length>0){
        const smDiv = el('div',{style:{background:'var(--surface2)',borderRadius:'10px',padding:'12px',marginBottom:'10px'}});
        smDiv.append(el('div',{style:{fontWeight:'600',marginBottom:'8px',fontSize:'13px'}},
          `${a.subMatches.length} subscription payment${a.subMatches.length>1?'s':''} found`));
        for(const m of a.subMatches.slice(0,3)){
          const row = el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'4px',display:'flex',justifyContent:'space-between'}});
          row.append(
            el('span',{},m.txn.normalisedMerchant),
            el('span',{style:{color:m.priceChanged?'var(--amber)':'var(--text2)'}},
              m.priceChanged?'Price changed: was £'+m.subscription.amount.toFixed(2)+', paid £'+m.txn.amount.toFixed(2):'£'+m.txn.amount.toFixed(2))
          );
          smDiv.append(row);
        }
        previewCard.append(smDiv);
      }

      if(a.possibleDuplicates>0){
        previewCard.append(el('div',{style:{background:'var(--amber-dim)',borderRadius:'10px',padding:'12px',marginBottom:'10px',fontSize:'13px',color:'var(--amber)'}},
          `⚠️ ${a.possibleDuplicates} possible duplicate${a.possibleDuplicates>1?'s':''} detected. These will be imported but flagged for review.`));
      }

      // Import button
      const importingNote = el('div',{style:{fontSize:'12px',color:'var(--text2)',margin:'10px 0'}},
        `Ready to import ${a.total} transactions into your private financial history.`);
      const confirmBtn = el('button',{class:'btn-primary'},'Import '+a.total+' transactions');
      const cancelBtn = el('button',{class:'btn-ghost',style:{marginTop:'8px'}},'Cancel');
      cancelBtn.addEventListener('click',()=>{ importState='idle'; parsedTxns=[]; analysisResult=null; renderImportUI(); });

      confirmBtn.addEventListener('click',async()=>{
        importState = 'importing';
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Importing…';

        try {
          // Create statement record
          const statementId = 'stmt_'+Date.now();
          const a = analysisResult;

          // Mark paycheck matches
          const paycheckMatchIds = new Set(a.paycheckMatches.map(m=>m.txn.transactionId));
          const subMatchIds = new Map(a.subMatches.map(m=>[m.txn.transactionId, m.subscription.id]));

          // Assign statementId to all transactions and mark reconciliation
          const finalTxns = parsedTxns.map(t => {
            let rec = t.reconciliationStatus;
            let paycheckId = null, subscriptionId = null;
            if(paycheckMatchIds.has(t.transactionId)){
              rec = 'matched';
              const match = a.paycheckMatches.find(m=>m.txn.transactionId===t.transactionId);
              paycheckId = match?.paycheck?.id || null;
            }
            if(subMatchIds.has(t.transactionId)){
              rec = 'matched';
              subscriptionId = subMatchIds.get(t.transactionId);
            }
            return {...t, statementId, reconciliationStatus:rec, paycheckId, subscriptionId};
          });

          // Import in batches of 100 to avoid Firebase limits
          const BATCH = 100;
          for(let i=0;i<finalTxns.length;i+=BATCH){
            await txnDB.writeBatch(finalTxns.slice(i,i+BATCH));
          }

          // Save statement record
          const stmt = {
            statementId,
            accountId: a.account,
            filename: a.filename,
            sourceFormat: 'barclays_csv_v1',
            sourceBank: 'Barclays',
            periodStart: a.periodStart,
            periodEnd: a.periodEnd,
            uploadedAt: new Date().toISOString(),
            transactionCount: a.total,
            importStatus: 'complete',
            newCount: a.total - a.possibleDuplicates,
            duplicateCount: a.possibleDuplicates,
            matchedPaycheckCount: a.paycheckMatches.length,
            matchedSubscriptionCount: a.subMatches.length,
            reviewCount: a.needsReview,
            fileFingerprint: a.fingerprint,
          };
          await txnDB.writeStatement(stmt);

          // ── Auto-update subscription billing dates from ALL transactions ──
          const allTxnsSnap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
          const allTxnsVal = allTxnsSnap.val() || {};
          const allTxns = Object.values(allTxnsVal);

          await updateSubscriptionBillingDates(allTxns);

          importState = 'complete';
          parsedTxns = []; analysisResult = null;
          renderImportUI();
          renderHistory();
        } catch(err){
          importState = 'error';
          renderImportUI();
          console.error('Import error:', err);
        }
      });

      previewCard.append(importingNote, confirmBtn, cancelBtn);
      importWrap.append(previewCard);
    }

    if(importState === 'importing'){
      importWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'30px'}},
        el('div',{style:{fontSize:'16px',fontWeight:'600',marginBottom:'8px'}},'Importing transactions…'),
        el('div',{style:{fontSize:'13px',color:'var(--text2)'}},'Please wait, do not close the app.')
      ));
    }

    if(importState === 'complete'){
      const doneCard = el('div',{class:'card',style:{textAlign:'center',padding:'30px'}});
      doneCard.append(
        el('div',{style:{fontSize:'32px',marginBottom:'12px'}},'✅'),
        el('div',{style:{fontSize:'18px',fontWeight:'700',marginBottom:'8px'}},'Import complete'),
        el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'16px'}},'Your transactions are now in your financial history.')
      );
      const newImportBtn = el('button',{class:'btn-primary'},'Import another statement');
      newImportBtn.addEventListener('click',()=>{ importState='idle'; renderImportUI(); });
      const viewTxnsBtn = el('button',{class:'btn-ghost',style:{marginTop:'8px'}},'View transactions');
      viewTxnsBtn.addEventListener('click',()=>{ /* switch to transactions tab - set via global */ if(window._setTab) window._setTab('_transactions'); });
      doneCard.append(newImportBtn, viewTxnsBtn);
      importWrap.append(doneCard);
    }

    if(importState === 'error'){
      importWrap.append(el('div',{class:'card',style:{color:'var(--red)',padding:'20px'}},
        el('div',{style:{fontWeight:'700',marginBottom:'8px'}},'Import failed'),
        el('div',{style:{fontSize:'13px'}},'Something went wrong. Please try again.')
      ));
      const retryBtn = el('button',{class:'btn-ghost',style:{marginTop:'12px'}},'Try again');
      retryBtn.addEventListener('click',()=>{ importState='idle'; renderImportUI(); });
      importWrap.append(retryBtn);
    }
  }

  renderImportUI();
  renderHistory();

  content.append(
    el('div',{class:'section-hdr'},'Import Statement'),
    importWrap,
    stmtWrap
  );
  return content;
}

// ══════════════════════════════════════
// TRANSACTION HISTORY SCREEN
// ══════════════════════════════════════
function transactionsScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  let allTxns = [];
  let filtered = [];
  let filterType = 'all';
  let searchQ = '';
  let selectedTxn = null;

  const listWrap = el('div',{});
  const detailWrap = el('div',{});

  const FINANCIAL_TYPE_LABELS = {
    INCOME:'Income', EXPENSE:'Expense', TRANSFER_OUT:'Transfer Out',
    TRANSFER_IN:'Transfer In', SAVINGS_TRANSFER:'Savings', REFUND:'Refund',
    UNKNOWN_CREDIT:'Unknown Credit', GOAL_ALLOCATION:'Goal',
  };
  const FINANCIAL_TYPE_COLORS = {
    INCOME:'var(--green)', EXPENSE:'var(--red)', SAVINGS_TRANSFER:'var(--amber)',
    REFUND:'var(--green)', TRANSFER_OUT:'var(--text3)', TRANSFER_IN:'var(--text3)',
  };

  async function load(){
    listWrap.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:20px 0">Loading transactions…</div>';
    allTxns = await txnDB.getTransactions(500);
    applyFilter();
  }

  function applyFilter(){
    filtered = allTxns.filter(t=>{
      if(filterType==='income' && t.financialType!=='INCOME') return false;
      if(filterType==='expense' && t.financialType!=='EXPENSE') return false;
      if(filterType==='transfer' && !t.financialType.includes('TRANSFER') && t.financialType!=='SAVINGS_TRANSFER') return false;
      if(filterType==='review' && t.userConfirmed) return false;
      if(searchQ){
        const q = searchQ.toLowerCase();
        if(!t.normalisedMerchant.toLowerCase().includes(q) &&
           !t.rawDescription.toLowerCase().includes(q) &&
           !(t.category||'').toLowerCase().includes(q)) return false;
      }
      return true;
    });
    renderList();
  }

  function renderList(){
    listWrap.innerHTML = '';
    if(allTxns.length === 0){
      listWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'30px 20px',color:'var(--text2)',fontSize:'13px'}},
        'No transactions yet. Import a bank statement to get started.'));
      return;
    }
    if(filtered.length === 0){
      listWrap.append(el('div',{style:{color:'var(--text3)',fontSize:'13px',padding:'16px 0'}},'No transactions match this filter.'));
      return;
    }

    // Group by month
    const byMonth = {};
    for(const t of filtered){
      const month = t.postingDate.slice(0,7);
      if(!byMonth[month]) byMonth[month] = [];
      byMonth[month].push(t);
    }

    for(const [month, txns] of Object.entries(byMonth)){
      const d = new Date(month+'-01');
      const label = d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
      const totalIn = txns.filter(t=>t.direction==='credit').reduce((s,t)=>s+t.amount,0);
      const totalOut = txns.filter(t=>t.direction==='debit').reduce((s,t)=>s+t.amount,0);

      const monthHdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px',marginTop:'16px'}});
      monthHdr.append(
        el('div',{style:{fontSize:'11px',letterSpacing:'2px',textTransform:'uppercase',color:'var(--text3)',fontFamily:"'Space Grotesk',sans-serif"}},label),
        el('div',{style:{fontSize:'11px',color:'var(--text3)',fontFamily:"'Space Mono',monospace"}},
          '+'+fmt(totalIn)+' / -'+fmt(totalOut))
      );
      listWrap.append(monthHdr);

      for(const t of txns){
        const row = el('div',{style:{
          display:'flex',alignItems:'center',gap:'10px',
          padding:'11px 14px',background:'var(--surface)',border:'1px solid var(--border)',
          borderRadius:'12px',marginBottom:'6px',cursor:'pointer',
          borderLeft:'3px solid '+(FINANCIAL_TYPE_COLORS[t.financialType]||'var(--border)')
        }});

        const dateSpan = el('div',{style:{fontSize:'11px',color:'var(--text3)',minWidth:'32px',textAlign:'center',lineHeight:'1.2'}});
        const d = new Date(t.postingDate);
        dateSpan.append(el('div',{},String(d.getDate())),el('div',{},d.toLocaleDateString('en-GB',{month:'short'})));

        const info = el('div',{style:{flex:'1',minWidth:'0'}});
        info.append(
          el('div',{style:{fontWeight:'500',fontSize:'13px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},t.normalisedMerchant||t.rawDescription),
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'1px'}},t.category+(t.subcategory?' · '+t.subcategory:''))
        );

        const amtCol = el('div',{style:{textAlign:'right',flexShrink:'0'}});
        amtCol.append(
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'13px',
            color:t.direction==='credit'?'var(--green)':'var(--text)'}},
            (t.direction==='credit'?'+':'-')+'£'+t.amount.toFixed(2)),
          !t.userConfirmed?el('div',{style:{fontSize:'9px',color:'var(--amber)',marginTop:'1px'}},'review'):el('span')
        );

        row.append(dateSpan, info, amtCol);
        row.addEventListener('click',()=>{ selectedTxn=t; renderDetail(); });
        listWrap.append(row);
      }
    }
  }

  function renderDetail(){
    detailWrap.innerHTML = '';
    if(!selectedTxn) return;
    const t = selectedTxn;

    const panel = el('div',{class:'card',style:{marginBottom:'12px',borderLeft:'3px solid '+(FINANCIAL_TYPE_COLORS[t.financialType]||'var(--border)')}});

    // Header
    panel.append(
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'14px'}},
        el('div',{},
          el('div',{style:{fontWeight:'700',fontSize:'16px'}},t.normalisedMerchant||t.rawDescription),
          el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'2px'}},t.postingDate+
            (t.transactionDate!==t.postingDate?' (txn: '+t.transactionDate+')':''))
        ),
        el('div',{style:{textAlign:'right'}},
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'20px',

// PHASE F — RECURRING TRANSACTION DETECTION
// ═══════════════════════════════════════════════════════════════

function detectRecurring(transactions){
  // Group by normalised merchant
  const byMerchant = {};
  for(const t of transactions){
    if(t.financialType === 'INCOME' || t.financialType.includes('TRANSFER')) continue;
    const key = t.normalisedMerchant || t.rawDescription;
    if(!byMerchant[key]) byMerchant[key] = [];
    byMerchant[key].push(t);
  }

  const patterns = [];

  for(const [merchant, txns] of Object.entries(byMerchant)){
    if(txns.length < 2) continue;
    const sorted = [...txns].sort((a,b)=>a.postingDate.localeCompare(b.postingDate));

    // Calculate gaps between transactions in days
    const gaps = [];
    for(let i=1;i<sorted.length;i++){
      const days = Math.round((new Date(sorted[i].postingDate) - new Date(sorted[i-1].postingDate)) / 86400000);
      gaps.push(days);
    }

    if(!gaps.length) continue;

    // Calculate average gap and amount
    const avgGap = gaps.reduce((s,g)=>s+g,0)/gaps.length;
    const amounts = sorted.map(t=>t.amount);
    const avgAmount = amounts.reduce((s,a)=>s+a,0)/amounts.length;
    const amountVariance = amounts.map(a=>Math.abs(a-avgAmount)).reduce((s,v)=>s+v,0)/amounts.length;

    // Classify frequency
    let frequency = null;
    let confidence = 0;
    const gapVariance = gaps.map(g=>Math.abs(g-avgGap)).reduce((s,v)=>s+v,0)/gaps.length;

    if(avgGap >= 6 && avgGap <= 8 && gapVariance < 3){
      frequency = 'Weekly'; confidence = 0.9;
    } else if(avgGap >= 12 && avgGap <= 16 && gapVariance < 4){
      frequency = 'Fortnightly'; confidence = 0.85;
    } else if(avgGap >= 28 && avgGap <= 33 && gapVariance < 5){
      frequency = 'Monthly'; confidence = 0.9;
    } else if(avgGap >= 85 && avgGap <= 95 && gapVariance < 7){
      frequency = 'Quarterly'; confidence = 0.8;
    } else if(avgGap >= 350 && avgGap <= 380 && gapVariance < 15){
      frequency = 'Annual'; confidence = 0.75;
    }

    if(!frequency) continue;
    // Amount must be consistent (variance < 10% of average)
    if(amountVariance > avgAmount * 0.15) continue;
    // Need at least 2 observations, prefer 3+
    if(sorted.length < 2) continue;
    if(sorted.length < 3) confidence *= 0.7;

    // Predict next payment
    const lastDate = new Date(sorted[sorted.length-1].postingDate);
    const nextDate = new Date(lastDate);
    if(frequency==='Weekly') nextDate.setDate(nextDate.getDate()+7);
    else if(frequency==='Fortnightly') nextDate.setDate(nextDate.getDate()+14);
    else if(frequency==='Monthly') nextDate.setMonth(nextDate.getMonth()+1);
    else if(frequency==='Quarterly') nextDate.setMonth(nextDate.getMonth()+3);
    else if(frequency==='Annual') nextDate.setFullYear(nextDate.getFullYear()+1);

    patterns.push({
      id: 'rec_'+merchant.replace(/\W/g,'').toLowerCase()+'_'+Date.now(),
      merchant,
      category: sorted[0].category,
      typicalAmount: Math.round(avgAmount*100)/100,
      frequency,
      confidence: Math.round(confidence*100)/100,
      observations: sorted.length,
      lastPayment: sorted[sorted.length-1].postingDate,
      nextExpected: nextDate.toISOString().slice(0,10),
      transactionIds: sorted.map(t=>t.transactionId),
      status: 'detected', // detected | confirmed | ignored
    });
  }

  return patterns.sort((a,b)=>b.confidence-a.confidence || b.observations-a.observations);
}

const merchantRulesDB = {
  async getAll(){
    const snap = await db.ref('users/'+currentUser.uid+'/merchantRules').once('value');
    return snap.val() ? Object.values(snap.val()) : [];
  },
  async save(rule){
    await db.ref('users/'+currentUser.uid+'/merchantRules/'+rule.id).set(rule);
  },
  async delete(id){
    await db.ref('users/'+currentUser.uid+'/merchantRules/'+id).remove();
  },
  async applyToTransaction(rawDesc, merchant){
    // Check if user has a rule for this merchant
    const snap = await db.ref('users/'+currentUser.uid+'/merchantRules')
      .orderByChild('matchPattern').once('value');
    const val = snap.val();
    if(!val) return null;
    for(const rule of Object.values(val)){
      if(!rule.active) continue;
      if(rawDesc.toUpperCase().includes(rule.matchPattern.toUpperCase()) ||
         merchant.toLowerCase().includes(rule.matchPattern.toLowerCase())){
        return rule;
      }
    }
    return null;
  }
};

// PHASE K — HISTORICAL ANALYTICS
// ═══════════════════════════════════════════════════════════════

async function buildAnalytics(periodMonths){
  const now = new Date();
  const cutoff = new Date(now);
  if(periodMonths > 0) cutoff.setMonth(cutoff.getMonth() - periodMonths);
  const cutoffStr = cutoff.toISOString().slice(0,10);

  // Load transactions for period
  const snap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
  const val = snap.val() || {};
  const allTxns = Object.values(val).filter(t=>
    periodMonths === 0 || t.postingDate >= cutoffStr
  );

  // Separate by financial type — transfers EXCLUDED from income/expense calcs
  const income   = allTxns.filter(t=>t.financialType==='INCOME');
  const expenses = allTxns.filter(t=>t.financialType==='EXPENSE');
  const savings  = allTxns.filter(t=>t.financialType==='SAVINGS_TRANSFER' && t.direction==='debit');
  const refunds  = allTxns.filter(t=>t.financialType==='REFUND');

  // Monthly aggregates
  const monthly = {};
  for(const t of [...income,...expenses,...savings]){
    const m = t.postingDate.slice(0,7);
    if(!monthly[m]) monthly[m]={income:0,expenses:0,savings:0,txnCount:0};
    if(t.financialType==='INCOME') monthly[m].income+=t.amount;
    if(t.financialType==='EXPENSE') monthly[m].expenses+=t.amount;
    if(t.financialType==='SAVINGS_TRANSFER') monthly[m].savings+=t.amount;
    monthly[m].txnCount++;
  }

  // Category breakdown (expenses only)
  const byCategory = {};
  for(const t of expenses){
    const cat = t.userCategory || t.category || 'Uncategorised';
    if(!byCategory[cat]) byCategory[cat]={total:0,count:0};
    byCategory[cat].total += t.amount;
    byCategory[cat].count++;
  }

  // Merchant breakdown
  const byMerchant = {};
  for(const t of expenses){
    const m = t.normalisedMerchant || t.rawDescription;
    if(!byMerchant[m]) byMerchant[m]={total:0,count:0};
    byMerchant[m].total += t.amount;
    byMerchant[m].count++;
  }

  const totalIncome   = income.reduce((s,t)=>s+t.amount,0);
  const totalExpenses = expenses.reduce((s,t)=>s+t.amount,0);
  const totalSavings  = savings.reduce((s,t)=>s+t.amount,0);
  const netIncome     = totalIncome - totalExpenses;
  const savingsRate   = totalIncome > 0 ? (totalSavings/totalIncome*100) : 0;

  const monthlyArr = Object.entries(monthly).sort((a,b)=>a[0].localeCompare(b[0]));
  const avgMonthlyIncome   = monthlyArr.length ? monthlyArr.reduce((s,[,m])=>s+m.income,0)/monthlyArr.length : 0;
  const avgMonthlyExpenses = monthlyArr.length ? monthlyArr.reduce((s,[,m])=>s+m.expenses,0)/monthlyArr.length : 0;

  return {
    totalIncome, totalExpenses, totalSavings, netIncome, savingsRate,
    avgMonthlyIncome, avgMonthlyExpenses,
    txnCount: allTxns.length,
    incomeCount: income.length,
    expenseCount: expenses.length,
    byCategory: Object.entries(byCategory).sort((a,b)=>b[1].total-a[1].total).slice(0,10),
    byMerchant: Object.entries(byMerchant).sort((a,b)=>b[1].total-a[1].total).slice(0,10),
    monthly: monthlyArr,
    hasTxnData: allTxns.length > 0,
  };
}

      for(const p of confirmed){
        const card = el('div',{class:'card',style:{marginBottom:'8px',borderLeft:'3px solid var(--green)'}});
        card.append(
          el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
            el('div',{},
              el('div',{style:{fontWeight:'600',fontSize:'14px'}},p.merchant),
              el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'2px'}},p.frequency+' · Next: '+p.nextExpected)
            ),
            el('div',{style:{textAlign:'right'}},
              el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--red)'}},fmt(p.typicalAmount)),
              el('div',{style:{fontSize:'11px',color:'var(--text3)'}},p.observations+' observed')
            )
          )
        );
        const delBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'12px',padding:'4px 0',marginTop:'8px'}},'Remove');
        delBtn.addEventListener('click',async()=>{ await recurringDB.delete(p.id); load(); });
        card.append(delBtn);
        resultsWrap.append(card);
      }
    }

    // Detected patterns (not yet confirmed)
    const unconfirmed = patterns.filter(p=>!savedIds.has(p.merchant));
    if(unconfirmed.length){
      resultsWrap.append(el('div',{class:'section-hdr'},'Possible recurring payments'));
      for(const p of unconfirmed){
        const confLabel = Object.entries(CONF_LABELS).find(([k])=>parseFloat(k)<=p.confidence)?.[1]||'Low';
        const confColor = CONF_COLORS[confLabel];
        const card = el('div',{class:'card',style:{marginBottom:'8px',borderLeft:'3px solid '+confColor}});
        card.append(
          el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}},
            el('div',{},
              el('div',{style:{fontWeight:'600',fontSize:'14px'}},p.merchant),
              el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'2px'}},
                p.frequency+' · '+p.observations+' observations')
            ),
            el('div',{style:{textAlign:'right'}},
              el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--red)'}},fmt(p.typicalAmount)),
              el('div',{style:{fontSize:'11px',color:confColor,marginTop:'2px'}},confLabel+' confidence')
            )
          ),
          el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'var(--text2)',marginBottom:'10px'}},
            el('span',{},'Last: '+p.lastPayment),
            el('span',{},'Next expected: '+p.nextExpected)
          )
        );
        const btnRow = el('div',{style:{display:'flex',gap:'8px'}});
        const confirmBtn = el('button',{style:{flex:'1',background:'var(--green)',color:'#000',border:'none',borderRadius:'10px',padding:'8px',fontWeight:'700',fontSize:'13px'}},'Confirm');
        const ignoreBtn = el('button',{style:{flex:'1',background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'8px',fontSize:'13px'}},'Ignore');
        confirmBtn.addEventListener('click',async()=>{
          await recurringDB.save({...p, status:'confirmed'});
          load();
        });
        ignoreBtn.addEventListener('click',async()=>{
          await recurringDB.save({...p, status:'ignored'});
          load();
        });
        btnRow.append(confirmBtn, ignoreBtn);
        card.append(btnRow);
        resultsWrap.append(card);
      }
    }

    if(!confirmed.length && !unconfirmed.length){
      resultsWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'24px',color:'var(--text2)',fontSize:'13px'}},
        'All recurring patterns have been reviewed.'));
    }
  }

  content.append(resultsWrap);
  load();
  return content;
}
