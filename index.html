        if(!g.met && !g.overdue && !g.queued){
          const perWeekNeed = g.requiredPerPeriod/2;
          const perWeekHave = avgFlorasiiPerPay/2;
          const perWeekGap  = Math.max(0, perWeekNeed - perWeekHave);
          const trio = el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'var(--s2)',marginTop:'var(--s3)'}});
          const cell=(label,val,col)=>el('div',{style:{background:'var(--surface-2)',borderRadius:'var(--r-sm)',padding:'8px 10px'}},
            el('div',{style:{fontSize:'9.5px',color:'var(--ink-3)',textTransform:'uppercase',letterSpacing:'1px',fontWeight:'700',marginBottom:'3px'}},label),
            el('div',{class:'num',style:{fontSize:'13px',fontWeight:'700',color:col}},val));
          trio.append(
            cell('Needed', fmt(perWeekNeed)+'/wk', 'var(--ink)'),
            cell('Saving', fmt(perWeekHave)+'/wk', 'var(--ink-2)'),
            cell('Gap', perWeekGap>0?fmt(perWeekGap)+'/wk':'none', perWeekGap>0?'var(--warn)':'var(--accent)')
          );
          block.append(trio);
        } else {
          block.append(el('div',{class:'t-meta',style:{marginTop:'var(--s2)'}},
            g.met ? 'Target reached'
              : g.overdue ? 'Deadline was '+Math.abs(g.daysLeft)+' days ago — update it in Goals'
              : 'Starts after '+(g.waitingFor||'your current goal')));
        }
        florasiiCard.append(block);
      }

      // Feasibility, explained      // Feasibility, explained — with sized ways to close any gap
      const activeGoal = goalDetails.find(g=>g.isActive);
      if(activeGoal){
        const asmt = assessGoal({target:activeGoal.target, deadline:activeGoal.deadline},
                                activeGoal.myShare, baselines);
        const box = el('div',{style:{background:asmt.feasible?'var(--green-dim)':'var(--red-dim)',
          border:'1px solid '+(asmt.feasible?'var(--green)':'var(--red)'),
          borderRadius:'12px',padding:'12px',marginBottom:'12px'}});
        box.append(
          el('div',{style:{fontWeight:'700',fontSize:'13px',marginBottom:'6px',
            color:asmt.feasible?'var(--green)':'var(--red)'}},
            asmt.feasible?'✓ '+activeGoal.name+' is reachable':'⚠ '+activeGoal.name+' does not add up yet'),
          el('div',{style:{fontSize:'12px',color:'var(--text2)',lineHeight:'1.6'}},
            'You need '+fmt(asmt.requiredPerPaycheck)+' a paycheck for '+asmt.paychecksLeft+
            ' paychecks. Your demonstrated surplus is '+fmt(asmt.sustainablePerPaycheck)+
            (asmt.feasible?'.':', a gap of '+fmt(asmt.shortfallPerPaycheck)+'.')),
          asmt.feasible?el('span'):el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'6px',lineHeight:'1.6'}},
            'At your current rate you would reach '+fmt(asmt.projectedAtDeadline)+' by the deadline — '+
            fmt(asmt.projectedShortfall)+' short.')
        );
        florasiiCard.append(box);

        const scenarios = goalScenarios(asmt, {
          subsMonthly: subTotal,
          discretionaryMonthly: fmodel.monthlyDiscretionary,
          owedToUser: (appData.debts||[]).reduce((s,d)=>s+Math.max(0,(d.amount||0)-(d.paid||0)),0),
          hourlyRate: appData.hourlyRate||14.50,
        });
        if(scenarios.length){
          const sc = el('div',{style:{marginBottom:'12px'}});
          sc.append(el('div',{style:{fontSize:'11px',color:'var(--text3)',textTransform:'uppercase',
            letterSpacing:'1px',fontWeight:'700',marginBottom:'8px'}},'Ways to close the gap'));
          for(const s of scenarios.slice(0,5)){
            sc.append(el('div',{style:{display:'flex',gap:'10px',alignItems:'flex-start',
              padding:'8px 0',borderBottom:'1px solid var(--border)'}},
              el('div',{style:{flex:'1'}},
                el('div',{style:{fontSize:'12px',fontWeight:'600'}},s.label),
                el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'1px',lineHeight:'1.5'}},s.detail)),
              el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'11px',
                color:'var(--green)',flexShrink:'0'}},fmt(s.closes))));
          }
          florasiiCard.append(sc);
        }
      }

      florasiiCard.append(
        el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',paddingTop:'2px',gap:'8px'}},
          el('span',{style:{color:'var(--text2)'}},(()=>{
            const act = goalDetails.find(x=>x.isActive);
            return act ? 'Needed for '+act.name : 'Required per paycheck';
          })()),
          el('span',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:totalRequiredPerPaycheck>avgFlorasiiPerPay?'var(--red)':'var(--green)'}},
            fmt(totalRequiredPerPaycheck))
        ),
        totalRequiredPerPaycheck>avgFlorasiiPerPay?
          el('div',{style:{fontSize:'11px',color:'var(--red)',marginTop:'6px'}},'Saving rate of '+fmt(avgFlorasiiPerPay)+'/paycheck is below target.'):
          el('div',{style:{fontSize:'11px',color:'var(--green)',marginTop:'6px'}},'Current saving rate covers all goals.')
      );
    }
    intelligenceWrap.append(florasiiCard);

    // ── MONEY LEAKS ──
    if(topCats.length||topMerchants.length){
      const leakCard = el('div',{class:'card',style:{marginBottom:'12px'}});
      leakCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},'💸 Where is your money going?'));

      if(thisMonthSpend>0){
        leakCard.append(el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'10px'}},
          'This month: '+fmt(thisMonthSpend)+' spent'+(thisMonthIncome>0?' · '+fmt(thisMonthIncome)+' earned':'')+
          (lastMonthSpend>0?' · '+(spendChange>0?'+':'')+Math.round(spendChange)+'% vs last month':'')));
      }

      // Drill-down panel
      const drillWrap = el('div',{style:{display:'none'}});

      // Standard categories for picker
      const STANDARD_CATS = ['Housing','Groceries','Eating out','Transport','Shopping','Health',
        'Entertainment','Bars & Nights out','Travel','Bills','Subscriptions',
        'Personal care','Education','Gifts','Other'];

      function showDrill(cat, catTxns){
        drillWrap.style.display='block';
        drillWrap.innerHTML='';
        const header = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}});
        header.append(
          el('div',{style:{fontWeight:'700',fontSize:'14px'}},cat+' — '+fmt(catTxns.reduce((s,t)=>s+t.amount,0))),
          el('button',{style:{background:'none',color:'var(--text3)',fontSize:'18px',padding:'0'}},'×')
        );
        header.querySelector('button').addEventListener('click',()=>{ drillWrap.style.display='none'; });
        drillWrap.append(header);

        for(const t of catTxns.slice(0,15)){
          const tRow = el('div',{style:{padding:'10px 0',borderBottom:'1px solid var(--border)'}});
          const top = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}});
          top.append(
            el('div',{},
              el('div',{style:{fontSize:'13px',fontWeight:'500'}},t.normalisedMerchant||t.rawDescription),
              el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'1px'}},t.postingDate)
            ),
            el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'13px',color:'var(--red)'}},'-'+fmt(t.amount))
          );
          tRow.append(top);

          // Mini category picker
          const chipWrap = el('div',{style:{display:'flex',flexWrap:'wrap',gap:'5px'}});
          let selCat = t.userCategory||t.category||cat;
          function renderChips(cw, tc){
            cw.innerHTML='';
            for(const c of STANDARD_CATS){
              const chip = el('button',{style:{
                background:selCat===c?'var(--green)':'var(--surface2)',
                color:selCat===c?'#000':'var(--text2)',
                border:selCat===c?'none':'1px solid var(--border)',
                borderRadius:'100px',padding:'4px 10px',fontSize:'11px',fontWeight:'600'
              }},c);
              chip.addEventListener('click',async()=>{
                selCat=c;
                renderChips(cw,tc);
                // Show saving indicator
                const saving = el('div',{style:{fontSize:'11px',color:'var(--text3)',padding:'2px 0'}},'Saving…');
                cw.append(saving);
                try {
                  const updated={...tc,userCategory:c,category:c,userConfirmed:true,updatedAt:new Date().toISOString()};
                  await txnDB.write(updated);
                  // Update the local transaction reference so it persists in this session
                  Object.assign(tc, updated);
                  // Save merchant rule
                  if(tc.normalisedMerchant){
                    const ruleId='mr_'+tc.normalisedMerchant.replace(/\W/g,'').toLowerCase();
                    const ex=await db.ref('users/'+currentUser.uid+'/merchantRules/'+ruleId).once('value');
                    await db.ref('users/'+currentUser.uid+'/merchantRules/'+ruleId).set({
                      id:ruleId,matchPattern:tc.normalisedMerchant.toUpperCase(),
                      normalisedMerchant:tc.normalisedMerchant,preferredCategory:c,
                      confirmationCount:(ex.val()?.confirmationCount||0)+1,
                      active:true,createdAt:ex.val()?.createdAt||new Date().toISOString(),
                      updatedAt:new Date().toISOString(),
                    });
                  }
                  saving.textContent='✓ Saved';
                  saving.style.color='var(--green)';
                  setTimeout(()=>saving.remove(),1500);
                } catch(e){
                  saving.textContent='Error saving — try again';
                  saving.style.color='var(--red)';
                }
              });
              cw.append(chip);
            }
          }
          renderChips(chipWrap, t);
          tRow.append(chipWrap);
          drillWrap.append(tRow);
        }
        if(catTxns.length>15) drillWrap.append(
          el('div',{style:{fontSize:'12px',color:'var(--text3)',padding:'8px 0',textAlign:'center'}},
            '+'+(catTxns.length-15)+' more — see Money → Transactions for full list')
        );
      }

      for(const [cat,data] of topCats){
        const pctOfSpend = thisMonthSpend>0?Math.round(data.total/thisMonthSpend*100):0;
        // Get the actual transactions for this category
        const catTxns = thisMonthTxns.filter(t=>
          t.financialType==='EXPENSE' && (t.userCategory||t.category)===cat
        ).sort((a,b)=>b.amount-a.amount);

        const row = el('div',{style:{marginBottom:'10px',cursor:'pointer',padding:'6px',borderRadius:'10px',transition:'background .15s'}});
        row.addEventListener('mouseenter',()=>row.style.background='var(--surface2)');
        row.addEventListener('mouseleave',()=>row.style.background='transparent');
        row.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
          <span style="font-weight:500">${cat} <span style="font-size:11px;color:var(--text3)">↗ tap to see</span></span>
          <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--red)">${fmt(data.total)}</span>
        </div>
        <div style="background:var(--surface2);border-radius:100px;height:5px;overflow:hidden">
          <div style="height:100%;width:${pctOfSpend}%;background:var(--red);border-radius:100px"></div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${data.count} transactions · ${pctOfSpend}% of spending</div>`;
        row.addEventListener('click',()=>showDrill(cat, catTxns));
        leakCard.append(row);
      }

      if(topMerchants.length&&thisMonthSpend===0){
        leakCard.append(el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'8px'}},'Last 14 days:'));
        for(const [merchant,data] of topMerchants){
          leakCard.append(el('div',{class:'balance-row'},
            el('div',{},el('div',{class:'balance-label'},merchant),el('div',{style:{fontSize:'11px',color:'var(--text3)'}},data.count+' transactions')),
            el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(data.total))
          ));
        }
      }
      leakCard.append(drillWrap);
      intelligenceWrap.append(leakCard);
    }

    // ── RECOMMENDED ACTIONS ──
    const actions = [];
    if(balances.current<0) actions.push({icon:'🚨',text:'Your account is overdrawn — avoid spending until next payday',urgent:true});
    if(balances.creditCard>0&&balances.personalSavings>balances.creditCard) actions.push({icon:'💳',text:'You have enough in savings to clear your £'+Math.round(balances.creditCard)+' credit card balance',urgent:false});
    if(subTotal>150) actions.push({icon:'✂️',text:'Review your subscriptions — £'+Math.round(subTotal)+'/mo is significant',urgent:false});
    if(totalRequiredPerPaycheck>avgFlorasiiPerPay) actions.push({icon:'💰',text:'You need £'+Math.round(totalRequiredPerPaycheck)+'/paycheck to hit your goals — currently saving £'+Math.round(avgFlorasiiPerPay),urgent:false});
    const behindGoals = goalDetails.filter(g=>!g.onTrack);
    if(behindGoals.length) actions.push({icon:'⏰',text:behindGoals.map(g=>g.name).join(' and ')+' '+( behindGoals.length>1?'are':'is')+' behind target',urgent:false});
    const totalDebtsOwed = (appData.debts||[]).reduce((s,d)=>s+Math.max(0,d.amount-d.paid),0);
    const earmarkedForSavings = (appData.debts||[]).filter(d=>d.earmarkForSavings&&d.paid<d.amount).reduce((s,d)=>s+Math.max(0,d.amount-d.paid),0);
    if(totalDebtsOwed>0){
      const florasiiWithDebt = (appData.balances?.florasii||0)+earmarkedForSavings;
      actions.push({icon:'🤝',text:fmt(totalDebtsOwed)+' still owed to you'+
        (earmarkedForSavings>0?' · '+fmt(earmarkedForSavings)+' earmarked for savings (would reach '+fmt(florasiiWithDebt)+')':''),urgent:false});
    }
    const unsorted = txns.filter(t=>t.direction==='debit' && needsReview(t)).length;
    if(unsorted>20) actions.push({icon:'🏷️',
      text:unsorted+' transactions still need a category — sort them by merchant in More → Sort Transactions',urgent:false});
    if(txns.length===0) actions.push({icon:'📥',text:'Import your bank statement to unlock spending insights',urgent:false});

    if(actions.length){
      const actCard = el('div',{class:'card',style:{marginBottom:'12px'}});
      actCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},'💡 Recommended actions'));
      for(const a of actions){
        actCard.append(el('div',{style:{display:'flex',gap:'10px',alignItems:'flex-start',marginBottom:'10px',fontSize:'13px',
          color:a.urgent?'var(--red)':'var(--text2)',lineHeight:'1.5'}},
          el('span',{style:{flexShrink:'0'}},a.icon),
          el('span',{},a.text)
        ));
      }
      intelligenceWrap.append(actCard);
    }

    // ── SUBSCRIPTIONS (collapsed summary) ──
    if(subscriptions.length){
      const subCard = el('div',{class:'card'});
      const annual = subTotal*12;
      const pctIncome = fmodel.monthlyIncome>0 ? Math.round(subTotal/fmodel.monthlyIncome*100) : null;

      // Annual cost leads — £1,367/year lands differently from £113.94/month
      subCard.append(
        el('div',{class:'t-eyebrow',style:{marginBottom:'var(--s2)'}},'Subscriptions cost you'),
        el('div',{style:{display:'flex',alignItems:'baseline',gap:'var(--s2)',marginBottom:'3px'}},
          el('div',{class:'t-figure num',style:{color:'var(--warn)'}},fmt(annual)),
          el('div',{class:'t-label'},'a year')),
        el('div',{class:'t-meta',style:{marginBottom:'var(--s4)'}},
          fmt(subTotal)+' a month across '+subscriptions.length+' subscription'+(subscriptions.length===1?'':'s')+
          (pctIncome!=null?' · '+pctIncome+'% of your income':''))
      );

      // Most expensive first — that is the order you would cancel in
      const sorted=[...subscriptions].sort((a,b)=>b.amount-a.amount);
      const list = el('div',{style:{borderTop:'1px solid var(--line-soft)',paddingTop:'var(--s2)'}});
      for(const s of sorted){
        list.append(el('div',{class:'sub-item'},
          el('div',{style:{minWidth:'0'}},
            el('div',{style:{fontSize:'13.5px',fontWeight:'550'}},s.name),
            s.billingDay?el('div',{class:'t-meta'},'bills on day '+s.billingDay):el('span')),
          el('div',{style:{textAlign:'right',flexShrink:'0'}},
            el('div',{class:'num',style:{fontSize:'13.5px',fontWeight:'700'}},fmt(s.amount)),
            el('div',{class:'t-meta'},fmt(s.amount*12)+'/yr'))
        ));
      }
      subCard.append(list);

      const priciest=sorted[0];
      if(priciest && priciest.amount*12 > 100){
        subCard.append(el('div',{style:{marginTop:'var(--s3)',paddingTop:'var(--s3)',
          borderTop:'1px solid var(--line-soft)'}},
          el('div',{class:'t-meta'},'Cancelling '+priciest.name+' alone would save '+fmt(priciest.amount*12)+' a year.')));
      }
      intelligenceWrap.append(el('div',{class:'section-hdr'},'Recurring costs'), subCard);
    }
  }

  // Show balances immediately — use user-defined accounts if available, fallback to legacy
  const accs = appData.accounts||[];
  const legacyBalances = appData.balances||{};
  const balanceItems = accs.length ? accs.map(a=>({
    label:a.name, val:a.type==='credit_card'?-a.balance:a.balance,
    color:a.type==='credit_card'?'var(--red)':a.type==='savings'?'var(--green)':'var(--text)'
  })) : [
    {label:'Current', val:legacyBalances.current||0, color:(legacyBalances.current||0)<0?'var(--red)':'var(--text)'},
    {label:'Savings', val:legacyBalances.florasii||0, color:'var(--green)'},
    {label:'Savings', val:legacyBalances.personalSavings||0, color:'var(--text)'},
    ...(legacyBalances.creditCard>0?[{label:'Credit Card', val:-(legacyBalances.creditCard||0), color:'var(--red)'}]:[]),
  ];

  content.append(
    el('div',{class:'card',style:{marginBottom:'12px'}},
      el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}},
        ...balanceItems.map(({label,val,color})=>{
          const b=el('div',{style:{background:'var(--surface2)',borderRadius:'10px',padding:'10px 12px',cursor:'pointer'}});
          b.append(
            el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'2px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},label),
            el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'15px',color}},fmt(val))
          );
          b.addEventListener('click',()=>{ if(window._setTab) window._setTab('_accounts'); });
          return b;
        })
      ),
      accs.length===0?el('div',{style:{marginTop:'10px',textAlign:'center',fontSize:'12px',color:'var(--text3)',cursor:'pointer'}},'Tap to manage accounts →'):el('span')
    )
  );

  intelligenceWrap.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Analysing your finances…</div>';
  renderIntelligence().catch(err=>{
    console.error('renderIntelligence failed:', err);
    intelligenceWrap.innerHTML = '';
    intelligenceWrap.append(el('div',{class:'card',style:{borderLeft:'3px solid var(--danger)'}},
      el('div',{style:{fontWeight:'700',color:'var(--danger)',marginBottom:'6px'}},'Could not load financial analysis'),
      el('div',{style:{fontSize:'13px',color:'var(--ink-2)',lineHeight:'1.6'}},err.message||'Unknown error'),
      el('div',{style:{fontSize:'11px',color:'var(--ink-3)',marginTop:'6px'}},'Check the browser console for details.')
    ));
  });
  return content;
}

function settingsScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  let subs = [...appData.subscriptions];

  const subList = el('div'); // BUG FIX 1: declare subList before renderSubs() calls it

  function renderSubs(){
    subList.innerHTML='';
    if(!subs.length){
      subList.append(el('div',{style:{fontSize:'13px',color:'var(--text3)',padding:'8px 0'}},'No subscriptions yet.'));
      return;
    }
    for(const s of subs){
      const sid = s.id;
      const row = el('div',{style:{padding:'12px 0',borderBottom:'1px solid var(--border)'}});
      const top = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});

      const info = el('div',{style:{flex:'1'}},
        el('div',{style:{fontSize:'14px',fontWeight:'500'}},s.name));
      
      const right = el('div',{style:{display:'flex',alignItems:'center',gap:'10px'}});
      right.append(el('div',{class:'num',style:{fontSize:'14px',fontWeight:'700'}},fmt(s.amount)));
      const removeBtn = el('button',{style:{background:'var(--red-dim)',color:'var(--red)',padding:'5px 10px',borderRadius:'8px',fontSize:'12px',fontWeight:'600',border:'1px solid var(--red)'}}, 'Remove');
      removeBtn.addEventListener('click',()=>{ subs=subs.filter(x=>x.id!==sid); renderSubs(); });
      right.append(removeBtn);
      top.append(info, right);
      row.append(top);

      // Billing day row — always visible, inline edit
      const dayRow = el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginTop:'6px'}});
      dayRow.append(el('div',{style:{fontSize:'11px',color:'var(--ink-3)',minWidth:'80px'}},'Billing day:'));
      const dayInp = el('input',{inputmode:'numeric',placeholder:'e.g. 9',
        value: s.billingDay ? String(s.billingDay) : '',
        style:{width:'70px',padding:'4px 8px',fontSize:'12px',borderRadius:'8px',
          background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)'}});
      dayInp.addEventListener('change',()=>{
        const d = parseInt(dayInp.value);
        subs = subs.map(x=>x.id===sid?{...x,billingDay:(d>=1&&d<=31)?d:null}:x);
      });
      const dayHint = el('div',{style:{fontSize:'11px',color:s.billingDay?'var(--accent)':'var(--warn)'}},
        s.billingDay
          ? '✓ bills day '+s.billingDay+(s.lastPaidDate?' · last paid '+s.lastPaidDate.slice(0,10):'')
          : '⚠ add day so payday plan can time this correctly');
      dayRow.append(dayInp, dayHint);
      row.append(dayRow);
      subList.append(row);
    }
  }

  const curInput = el('input',{inputmode:'decimal',value:String(appData.balances.current)});
  const savingsAcc = (appData.accounts||[]).find(a=>a.type==='savings'||a.legacyKey==='florasii');
  const florInput = el('input',{inputmode:'decimal',value:String(savingsAcc?savingsAcc.balance:(appData.balances.florasii||0))});
  const savInput = el('input',{inputmode:'decimal',value:String(appData.balances.personalSavings)});
  const ccInput = el('input',{inputmode:'decimal',value:String(appData.balances.creditCard)});
  const saveBalBtn = el('button',{class:'btn-primary',style:{marginTop:'8px'}},'Save balances');
  saveBalBtn.addEventListener('click',async()=>{
    const nb = {
      current:parseFloat(curInput.value)||0,
      florasii:parseFloat(florInput.value)||0,
      personalSavings:parseFloat(savInput.value)||0,
      creditCard:parseFloat(ccInput.value)||0,
    };
    // Update user accounts if they exist
    let updAccts = appData.accounts||[];
    if(updAccts.length){
      updAccts = updAccts.map(a=>{
        if(a.type==='current'||a.legacyKey==='current') return {...a,balance:nb.current,updatedAt:new Date().toISOString()};
        if(a.type==='savings'||a.legacyKey==='florasii') return {...a,balance:nb.florasii,updatedAt:new Date().toISOString()};
        if(a.type==='credit_card'||a.legacyKey==='creditCard') return {...a,balance:nb.creditCard,updatedAt:new Date().toISOString()};
        return a;
      });
    }
    await save({...appData, balances:nb, accounts:updAccts, subscriptions:subs}); // BUG FIX 3: always include latest subs
    saveBalBtn.textContent='Saved ✓';
    setTimeout(()=>saveBalBtn.textContent='Save balances',2000);
  });

  renderSubs();

  const newName = el('input',{placeholder:'Name',style:{flex:'2'}});
  const newAmt  = el('input',{placeholder:'£',inputmode:'decimal',style:{flex:'1',maxWidth:'70px'}});
  const newDay  = el('input',{placeholder:'Day (1-31)',inputmode:'numeric',style:{flex:'1',maxWidth:'90px'}});
  const addBtn  = el('button',{style:{background:'var(--green)',color:'#000',borderRadius:'12px',padding:'0 16px',fontWeight:'700',whiteSpace:'nowrap'}},'Add');
  addBtn.addEventListener('click',()=>{
    if(!newName.value||!newAmt.value) return;
    const day = parseInt(newDay.value);
    subs.push({id:uid(), name:newName.value.trim(), amount:parseFloat(newAmt.value)||0,
      billingDay: (day>=1&&day<=31)?day:null});
    newName.value=''; newAmt.value=''; newDay.value='';
    renderSubs();
  });
  const saveSubBtn = el('button',{class:'btn-ghost',style:{marginTop:'12px'}},'Save subscriptions');
  saveSubBtn.addEventListener('click',async()=>{
    await save({...appData, subscriptions:subs}); // BUG FIX 4: save subs without clobbering balances
    saveSubBtn.textContent='Saved ✓';
    setTimeout(()=>saveSubBtn.textContent='Save subscriptions',2000);
    // Re-render home if it's visible so changes show immediately
    if(window._setTab && document.querySelector('.nav-btn.active')?.textContent?.includes('Home')){
      window._setTab('home');
    }
  });

  const signOutBtn = el('button',{class:'btn-ghost',style:{marginTop:'32px'}},'Sign out');
  signOutBtn.addEventListener('click',()=>auth.signOut());

  const mkLabel = txt => el('div',{style:{fontSize:'12px',color:'var(--text3)',marginBottom:'6px',letterSpacing:'0.5px'}},txt);

  const profileInput = el('input',{placeholder:'Your name',value:appData.profile?.displayName||''});
  const saveProfileBtn = el('button',{class:'btn-primary',style:{marginTop:'8px',fontSize:'14px',padding:'12px'}},'Save name');
  saveProfileBtn.addEventListener('click',async()=>{
    const name = profileInput.value.trim();
    if(!name) return;
    const newProfile = {...(appData.profile||{}), displayName:name};
    await db.ref('users/'+currentUser.uid+'/profile').set(newProfile);
    appData.profile = newProfile;
    saveProfileBtn.textContent='Saved ✓';
    setTimeout(()=>saveProfileBtn.textContent='Save name',2000);
  });

  content.append(
    el('div',{class:'section-hdr'},'Your Name'),
    el('div',{class:'card'},
      el('div',{style:{fontSize:'12px',color:'var(--text3)',marginBottom:'6px'}},'Shown in the app header so each user knows whose account is active.'),
      profileInput,
      saveProfileBtn
    ),
    el('div',{class:'section-hdr'},'Update Balances'),
    el('div',{class:'card'},
      el('div',{style:{marginBottom:'12px'}}, mkLabel('Spending (£)'), curInput),
      el('div',{style:{marginBottom:'12px'}}, mkLabel((()=>{ const sa=(appData.accounts||[]).filter(a=>a.type==='savings'); return sa.length?sa[0].name+' (£)':'Savings Fund (£)'; })()), florInput),
      el('div',{style:{marginBottom:'12px'}}, mkLabel('Savings (£)'), savInput),
      el('div',{style:{marginBottom:'12px'}}, mkLabel('Credit Card Owed (£)'), ccInput),
      saveBalBtn
    ),
    el('div',{class:'section-hdr'},'Subscriptions'),
    el('div',{class:'card'},
      subList,
      el('div',{style:{display:'flex',gap:'8px',marginTop:'14px',flexWrap:'wrap'}}, newName, newAmt, newDay, addBtn),
      el('div',{style:{fontSize:'11px',color:'var(--ink-3)',marginTop:'4px'}},'Name · Monthly amount · Billing day of month'),
      saveSubBtn
    ),
    signOutBtn
  );
  return content;
}

// ── PHASE 2: Lifestyle Requirements ──
function lifestyleScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const reqs = appData.lifestyleRequirements || [];
  const PRIORITIES = ['Non-negotiable','Important','Flexible','Optional'];
  const FREQS = ['One-time','Weekly','Monthly','Quarterly','Annually'];
  const PRIORITY_COLORS = {'Non-negotiable':'var(--red)','Important':'var(--amber)','Flexible':'var(--green)','Optional':'var(--text3)'};

  const listWrap = el('div',{});

  function renderList(){
    listWrap.innerHTML='';
    if(reqs.length===0){
      listWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'30px 20px',color:'var(--text2)',fontSize:'13px'}},'No requirements yet. Add things you need to spend money on — visits, training, commitments.'));
      return;
    }
    const grouped = {};
    for(const p of PRIORITIES) grouped[p]=reqs.filter(r=>r.priority===p&&r.active!==false);
    const inactive = reqs.filter(r=>r.active===false);

    for(const p of PRIORITIES){
      if(!grouped[p].length) continue;
      listWrap.append(el('div',{class:'section-hdr',style:{marginTop:'16px'}},p));
      for(const r of grouped[p]){
        const card = el('div',{class:'card',style:{marginBottom:'8px',borderLeft:'3px solid '+PRIORITY_COLORS[p]}});
        const hdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}});
        hdr.append(
          el('div',{},
            el('div',{style:{fontWeight:'600',fontSize:'15px'}},r.name),
            el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'2px'}},r.description||'')
          ),
          el('div',{style:{textAlign:'right',flexShrink:'0'}},
            r.estimatedCost>0?el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--amber)',fontSize:'14px'}},fmt(r.estimatedCost)):el('span'),
            r.frequency?el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},r.frequency):el('span')
          )
        );
        const actions = el('div',{style:{display:'flex',gap:'12px',marginTop:'10px'}});
        const delBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'12px',padding:'0'}},'Remove');
        const toggleBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'12px',padding:'0'}},'Pause');
        delBtn.addEventListener('click',async()=>{
          const updated = reqs.filter(x=>x.id!==r.id);
          appData.lifestyleRequirements=updated;
          await save({...appData,lifestyleRequirements:updated});
          renderList();
        });
        toggleBtn.addEventListener('click',async()=>{
          const updated = reqs.map(x=>x.id===r.id?{...x,active:false}:x);
          appData.lifestyleRequirements=updated;
          await save({...appData,lifestyleRequirements:updated});
          renderList();
        });
        actions.append(delBtn,toggleBtn);
        if(r.targetDate) actions.append(el('div',{style:{fontSize:'11px',color:'var(--text3)',marginLeft:'auto'}},new Date(r.targetDate).toLocaleDateString('en-GB',{month:'short',year:'numeric'})));
        card.append(hdr,actions);
        listWrap.append(card);
      }
    }
  }
  renderList();

  // Add form
  const formCard = el('div',{class:'card'});
  formCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;font-family:'Space Grotesk',sans-serif">Add requirement</div>`;
  const nameInp = el('input',{placeholder:'Name (e.g. Visit girlfriend, Half marathon)',style:{marginBottom:'10px'}});
  const descInp = el('input',{placeholder:'Description (optional)',style:{marginBottom:'10px'}});
  const costInp = el('input',{inputmode:'decimal',placeholder:'Estimated cost (£)',style:{marginBottom:'10px'}});
  const dateInp = el('input',{type:'date',style:{marginBottom:'10px'}});

  const priSel = el('select',{style:{width:'100%',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'12px',padding:'12px 14px',fontSize:'15px',outline:'none',marginBottom:'10px'}});
  for(const p of PRIORITIES) priSel.append(el('option',{value:p},p));

  const freqSel = el('select',{style:{width:'100%',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'12px',padding:'12px 14px',fontSize:'15px',outline:'none',marginBottom:'14px'}});
  for(const f of FREQS) freqSel.append(el('option',{value:f},f));

  const addBtn = el('button',{class:'btn-primary'},'Add requirement');
  addBtn.addEventListener('click',async()=>{
    if(!nameInp.value.trim()) return;
    const newReq = {
      id:uid(), name:nameInp.value.trim(), description:descInp.value.trim(),
      estimatedCost:parseFloat(costInp.value)||0, targetDate:dateInp.value||null,
      priority:priSel.value, frequency:freqSel.value, active:true,
      createdAt:new Date().toISOString()
    };
    const updated=[...reqs,newReq];
    appData.lifestyleRequirements=updated;
    await save({...appData,lifestyleRequirements:updated});
    nameInp.value=''; descInp.value=''; costInp.value=''; dateInp.value='';
    renderList();
    addBtn.textContent='Added ✓';
    setTimeout(()=>addBtn.textContent='Add requirement',1500);
  });
  formCard.append(nameInp,descInp,costInp,priSel,freqSel,dateInp,addBtn);

  // Monthly cost summary
  const monthlyCommitted = reqs.filter(r=>r.active!==false).reduce((s,r)=>{
    if(r.frequency==='Monthly') return s+r.estimatedCost;
    if(r.frequency==='Weekly') return s+r.estimatedCost*4.33;
    if(r.frequency==='Annually') return s+r.estimatedCost/12;
    if(r.frequency==='Quarterly') return s+r.estimatedCost/3;
    return s;
  },0);

  content.append(
    el('div',{class:'section-hdr'},'Add Requirement'),
    formCard,
    monthlyCommitted>0?el('div',{class:'card',style:{marginTop:'0'}},
      el('div',{style:{display:'flex',justifyContent:'space-between'}},
        el('div',{class:'balance-label'},'Monthly lifestyle cost'),
        el('div',{class:'balance-value',style:{color:'var(--amber)'}},fmt(monthlyCommitted))
      )
    ):el('span'),
    listWrap
  );
  return content;
}

// ── PHASE 4/5: Financial Intelligence Engine ──
function askScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  // ── deterministic financial context builder ──
  function buildFinancialContext(){
    const paychecks = (appData.paychecks||[]).filter(p=>p.income>0);
    const sorted = [...paychecks].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const balances = appData.balances||{};
    const subs = appData.subscriptions||[];
    const cashFlow = appData.cashFlow||[];
    const goals = appData.goals||[];
    const lifestyle = appData.lifestyleRequirements||[];
    const hoursLog = appData.hoursLog||[];
    const actualPay = appData.actualPay||{};
    const now = new Date();

    // Income stats
    const incomes = sorted.map(p=>p.income);
    const avgIncome = incomes.length?incomes.reduce((s,v)=>s+v,0)/incomes.length:0;
    const recentIncomes = incomes.slice(-6);
    const recentAvg = recentIncomes.length?recentIncomes.reduce((s,v)=>s+v,0)/recentIncomes.length:0;
    const lastPaycheck = sorted[sorted.length-1];
    const subTotal = subs.reduce((s,x)=>s+x.amount,0);

    // Florasii growth rate
    const snapshots = (appData.paychecks||[]).filter(p=>p.snapshot).sort((a,b)=>new Date(a.date)-new Date(b.date));
    let avgFlorasiiPerPay = 0;
    if(snapshots.length>=2){
      const growth = snapshots[snapshots.length-1].snapshot.florasii - snapshots[0].snapshot.florasii;
      avgFlorasiiPerPay = growth/Math.max(snapshots.length-1,1);
    }

    // Upcoming cash flow events (next 60 days)
    const upcoming = cashFlow.filter(e=>{
      const d = new Date(e.date);
      return d>=now && d<=new Date(now.getTime()+60*86400000);
    }).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const upcomingOut = upcoming.filter(e=>e.type==='out').reduce((s,e)=>s+e.amount,0);
    const upcomingIn = upcoming.filter(e=>e.type==='in').reduce((s,e)=>s+e.amount,0);

    // Savings rate
    const totalSaved = avgFlorasiiPerPay>0?avgFlorasiiPerPay:0;
    const savingsRate = recentAvg>0?((totalSaved/recentAvg)*100).toFixed(1):0;

    // Hours data
    const parseLabel = l=>{const p=l.split('/');return new Date(`${p[2]}-${p[1]}-${p[0]}`);};
    const sortedH=[...hoursLog].sort((a,b)=>parseLabel(a.label)-parseLabel(b.label));
    const pairs=[];
    for(let i=0;i<sortedH.length;i+=2) pairs.push({w1:sortedH[i],w2:sortedH[i+1]});
    const latestPair = pairs[pairs.length-1];
    const currentPeriodHours = latestPair?(latestPair.w1.total+(latestPair.w2?latestPair.w2.total:0)):0;
    const predictedNextPay = currentPeriodHours*(appData.hourlyRate||14.5);

    return {
      currentDate: now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
      balances: {
        currentAccount: balances.current||0,
        savings: (()=>{ const sa=(appData.accounts||[]).filter(a=>a.type==='savings'); return sa.length?sa.reduce((s,a)=>s+a.balance,0):(balances.florasii||0); })(),
        personalSavings: balances.personalSavings||0,
        creditCard: balances.creditCard||0,
      },
      income: {
        averagePaycheck: Math.round(avgIncome*100)/100,
        recentAverage: Math.round(recentAvg*100)/100,
        totalPaychecksLogged: paychecks.length,
        lastPaycheckAmount: lastPaycheck?lastPaycheck.income:0,
        lastPaycheckDate: lastPaycheck?lastPaycheck.date:null,
        predictedNextPaycheck: Math.round(predictedNextPay*100)/100,
        currentPeriodHoursWorked: currentPeriodHours,
      },
      subscriptions: {
        total: Math.round(subTotal*100)/100,
        monthly: Math.round(subTotal*100)/100,
        annual: Math.round(subTotal*12*100)/100,
        list: subs.map(s=>({name:s.name,amount:s.amount})),
      },
      savings: {
        florasiiGoal: (appData.goals||[]).reduce((s,g)=>s+(g.target||0),0) || null,
        florasiiCurrent: balances.florasii||0,
        florasiiRemaining: Math.max(0, ((appData.goals||[]).reduce((s,g)=>s+(g.target||0),0)||0) - (balances.florasii||0)),
        avgSavedPerPaycheck: Math.round(avgFlorasiiPerPay*100)/100,
        estimatedSavingsRate: savingsRate+'%',
      },
      cashFlow: {
        upcomingCommittedExpenses: Math.round(upcomingOut*100)/100,
        upcomingExpectedIncome: Math.round(upcomingIn*100)/100,
        next60DaysEvents: upcoming.slice(0,10).map(e=>({label:e.label,amount:e.amount,type:e.type,date:e.date})),
      },
      lifestyle: lifestyle.filter(r=>r.active!==false).map(r=>({
        name:r.name, priority:r.priority, estimatedCost:r.estimatedCost, frequency:r.frequency
      })),
      goals: goals.map(g=>({name:g.name,target:g.target,current:g.current,targetDate:g.targetDate})),
      userName: appData.profile?.displayName || currentUser?.email?.split('@')[0] || 'User',
    };
  }

  // ── affordability engine ──
  function calculateAffordability(amount){
    const ctx = buildFinancialContext();
    const goals = appData.goals || [];

    // Step 1: Projected cash = current balance + expected income - committed expenses - subscriptions
    const projectedCash = ctx.balances.currentAccount
      + ctx.income.predictedNextPaycheck
      - ctx.cashFlow.upcomingCommittedExpenses
      - ctx.subscriptions.monthly;

    // Step 2: Required additional savings = savings needed to stay on goal
    // Only count if there's a goal with a target date that hasn't been reached
    let requiredSavings = 0;
    const goalDetails = [];
    for(const g of goals){
      if(!g.targetDate || !g.target) continue;
      const remaining = Math.max(0, (g.target||0) - (g.current||0));
      if(remaining <= 0) continue;
      const daysLeft = Math.max(1, Math.ceil((new Date(g.targetDate) - new Date()) / 86400000));
      const payPeriodsLeft = Math.max(1, Math.floor(daysLeft / 14));
      const requiredPerPeriod = remaining / payPeriodsLeft;
      requiredSavings += requiredPerPeriod;
      goalDetails.push({name:g.name, requiredPerPeriod:Math.round(requiredPerPeriod*100)/100});
    }
    // If no explicit goals, use historical Florasii savings rate as target
    if(goals.length === 0 && ctx.savings.avgSavedPerPaycheck > 0){
      requiredSavings = ctx.savings.avgSavedPerPaycheck;
    }

    // Step 3: Flexible money = projected cash minus required savings
    const flexibleMoney = projectedCash - requiredSavings;
    const canAfford = flexibleMoney >= amount;
    const wouldLeave = flexibleMoney - amount;

    return {
      // Components (shown to user)
      currentBalance: ctx.balances.currentAccount,
      expectedIncome: ctx.income.predictedNextPaycheck,
      upcomingCommitments: ctx.cashFlow.upcomingCommittedExpenses,
      subscriptions: ctx.subscriptions.monthly,
      projectedCash: Math.round(projectedCash*100)/100,
      requiredSavings: Math.round(requiredSavings*100)/100,
      flexibleMoney: Math.round(flexibleMoney*100)/100,
      // Result
      canAfford,
      wouldLeave: Math.round(wouldLeave*100)/100,
      goalDetails,
      hasGoals: goals.length > 0,
    };
  }

  // ── chat UI ──
  const messages = [];
  const chatWrap = el('div',{style:{display:'flex',flexDirection:'column',gap:'12px',marginBottom:'16px'}});

  function addMessage(role, text){
    messages.push({role,text});
    const bubble = el('div',{style:{
      maxWidth:'88%',

      alignSelf: role==='user'?'flex-end':'flex-start',

    }},text);
    chatWrap.append(bubble);
    chatWrap.scrollTop=chatWrap.scrollHeight;
  }

  // Welcome message
  addMessage('assistant', 'Hi! I can answer questions about your finances using your real data.\n\nTry asking:\n• "How much do I normally get paid?"\n• "Can I afford £300?"\n• "When will I hit my savings goal?"\n• "How much do my subscriptions cost?"\n• "What\'s my savings rate?"');

  // Suggested questions
  const suggestions = [
    'Can I afford £300?',
    'When will I hit my savings goal?',
    'What\'s my savings rate?',
    'How much are my subscriptions?',
    'How much do I normally get paid?',
    'What happens if I save £50 more per paycheck?',
  ];
  const suggWrap = el('div',{style:{display:'flex',flexWrap:'wrap',gap:'8px',marginBottom:'16px'}});
  for(const s of suggestions){
    const btn = el('button',{style:{background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border)',borderRadius:'100px',padding:'6px 12px',fontSize:'12px',whiteSpace:'nowrap'}},s);
    btn.addEventListener('click',()=>{ inp.value=s; sendMessage(); });
    suggWrap.append(btn);
  }

  const inp = el('input',{placeholder:'Ask about your finances...',style:{flex:'1'}});
  const sendBtn = el('button',{style:{background:'var(--green)',color:'#000',borderRadius:'12px',padding:'12px 16px',fontWeight:'700',fontSize:'14px',flexShrink:'0'}},'Ask');

  async function sendMessage(){

    addMessage('user',q);

    // Build deterministic context
    const ctx = buildFinancialContext();

    // Check for affordability question
    const affordMatch = q.match(/afford[^\d]*£?(\d+[\d,.]*)/i) || q.match(/£(\d+[\d,.]*)/i);
    let affordCtx = '';
    if(affordMatch){

      if(amount>0){

        affordCtx = `\n\nAFFORDABILITY BREAKDOWN for £${amount}:
Components:
  Current account balance:        £${aff.currentBalance.toFixed(2)}
+ Expected next paycheck:         £${aff.expectedIncome.toFixed(2)}
- Upcoming committed expenses:    £${aff.upcomingCommitments.toFixed(2)}

Purchase amount: £${amount}
Can afford: ${aff.canAfford ? 'YES' : 'NO'}
Would leave: £${aff.wouldLeave.toFixed(2)}
${aff.goalDetails.length>0?'Goal savings breakdown: '+aff.goalDetails.map(g=>`${g.name}: £${g.requiredPerPeriod}/period`).join(', '):'No specific goal targets set — using historical savings rate as guide.'}

IMPORTANT: Present these components to the user. Do not just say yes or no. Show the breakdown. Note what is ACTUAL vs ESTIMATED vs PROJECTED.`;
      }
    }

    const systemPrompt = `You are a personal financial assistant for ${ctx.userName}. You have access to their real financial data below. 
Answer questions using ONLY the data provided. Never invent numbers. If data is insufficient, say so clearly.
Keep answers concise and conversational. Use £ for currency. Be direct — give the answer first, then context.
Do NOT tell the user what they must do. Present facts and let them decide.

FINANCIAL DATA (as of ${ctx.currentDate}):
${JSON.stringify(ctx, null, 2)}${affordCtx}`;

    try {
      // SECURITY NOTE: The Anthropic API key must never be in client-side code.
      // This call goes to a Cloudflare Worker that:
      //   1. Verifies the Firebase auth token
      //   2. Confirms the UID matches the data being requested
      //   3. Calls Anthropic API with the key stored securely server-side
      //   4. Returns only the AI response — never the raw financial data or key
      //
      // WORKER_URL is set to the deployed Cloudflare Worker endpoint.
      // If not configured, Ask My Finances is unavailable on this deployment.
      const WORKER_URL = window.FF_WORKER_URL || null;

      if(!WORKER_URL){
        addMessage('assistant', '⚠️ Ask My Finances is not available on this deployment.\n\nIt requires a secure server-side connection to process your financial data safely. The Anthropic API key cannot be stored in a browser app.\n\nTo enable this feature, a Cloudflare Worker needs to be set up and configured.');
        sendBtn.disabled=false;
        sendBtn.textContent='Ask';
        return;
      }

      // Get Firebase ID token — the Worker verifies this to confirm identity
      const idToken = await auth.currentUser.getIdToken();

      const res = await fetch(WORKER_URL, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+idToken,  // Worker verifies this — never trust UID from body
        },
        body:JSON.stringify({
          question: q,
          financialContext: ctx,       // deterministic data calculated client-side from user's own Firebase data
          affordabilityContext: affordCtx,
        })
      });

      if(res.status===401){
        addMessage('assistant','Authentication error — please sign out and sign back in.');
        sendBtn.disabled=false; sendBtn.textContent='Ask'; return;
      }
      if(!res.ok){
        addMessage('assistant','Server error — please try again.');
        sendBtn.disabled=false; sendBtn.textContent='Ask'; return;
      }

      const data = await res.json();
      const reply = data.reply || 'Sorry, I couldn\'t process that. Try again.';
      addMessage('assistant', reply);
    } catch(e) {
      addMessage('assistant','Connection error — please try again.');
    }

    sendBtn.disabled=false;
    sendBtn.textContent='Ask';
  }

  sendBtn.addEventListener('click', sendMessage);

// ── Transaction write layer (bypasses save() for scalability) ──
const txnDB = {
  async write(txn){
    const ref = db.ref('users/'+currentUser.uid+'/transactions/'+txn.transactionId);
    await ref.set(txn);
  },
  async writeBatch(txns){
    const updates = {};
    for(const t of txns) updates['users/'+currentUser.uid+'/transactions/'+t.transactionId] = t;
    await db.ref().update(updates);
  },
  async writeStatement(stmt){
    await db.ref('users/'+currentUser.uid+'/statements/'+stmt.statementId).set(stmt);
  },
  async getStatements(){
    const snap = await db.ref('users/'+currentUser.uid+'/statements').once('value');
    const val = snap.val();
    return val ? Object.values(val) : [];
  },
  async getTransactions(limitToLast=200){
    const snap = await db.ref('users/'+currentUser.uid+'/transactions').limitToLast(limitToLast).once('value');
    const val = snap.val();
    return val ? Object.values(val).sort((a,b)=>b.postingDate.localeCompare(a.postingDate)) : [];
  },
  async getFingerprints(){
    const stmts = await this.getStatements();
    return stmts.map(s=>s.fileFingerprint).filter(Boolean);
  },
  async deleteStatement(statementId){
    // Get all transactions for this statement
    const snap = await db.ref('users/'+currentUser.uid+'/transactions')
      .orderByChild('statementId').equalTo(statementId).once('value');
    const val = snap.val();
    if(val){
      const updates = {};
      for(const key of Object.keys(val)) updates['users/'+currentUser.uid+'/transactions/'+key] = null;
      await db.ref().update(updates);
    }
    await db.ref('users/'+currentUser.uid+'/statements/'+statementId).remove();
  }
};

  CPM: 'Card Purchase',
  BCC: 'Barclays Card',
  BGC: 'Bank Credit',
  FT:  'Funds Transfer',
  DDR: 'Direct Debit',
  UNP: 'Unpaid',
  WOT: 'Wire/Online Transfer',
  SO:  'Standing Order',
  SV:  'Internal Savings',
  BBP: 'Bill Payment',
};

function normaliseMerchant(rawDesc){
  const upper = rawDesc.toUpperCase();
  for(const [pat, name] of MERCHANT_PATTERNS){
    if(pat.test(upper)) return name;
  }
  // Generic cleanup: remove trailing reference numbers, ON DD MON, codes
  return rawDesc
    .replace(/\s+(ON \d{1,2} [A-Z]{3})\s*$/i, '')
    .replace(/\s+[A-Z0-9]{8,}\s*$/,'')
    .replace(/\s+\d{4,}\s*$/, '')
    .replace(/\t.*/,'')
    .trim()
    .split(/\s+/)
    .slice(0, 4)
    .join(' ')
    .replace(/\s+/,' ')
    .trim() || rawDesc.trim();
}

// ── Financial type classifier ──
function classifyFinancialType(row, amount, subcat, memo){
  const INTERNAL_ACCOUNTS = ['201139 03562921','201139 93224309'];
  const isInternal = INTERNAL_ACCOUNTS.some(a => memo.includes(a.replace(' ','')||a));

  if(subcat === 'Counter Credit' || subcat === 'Bill Payment'){
    // BGC = bank giro credit = incoming payment
    if(memo.includes(' BGC') && amount > 0) return 'INCOME';
  }
  if(subcat === 'Funds Transfer'){
    if(isInternal || memo.match(/FLORASII|FLOLOSII|FLOLOSIII|FLORAIII|FLORA|SAVINGS|CREDIT CARD|SP\b|SV\b|SO\b/i)){
      return amount < 0 ? 'SAVINGS_TRANSFER' : 'TRANSFER_IN';
    }
    return amount < 0 ? 'TRANSFER_OUT' : 'TRANSFER_IN';
  }
  if(subcat === 'Direct Debit') return 'EXPENSE';
  if(subcat === 'Unpaid') return 'TRANSFER_IN'; // reversed payment
  if(subcat === 'Cash Withdrawal') return 'EXPENSE';
  if(['Card Purchase','Contactless Card Purchase','Debit'].includes(subcat)){
    return amount < 0 ? 'EXPENSE' : 'REFUND';
  }
  if(amount > 0) return 'UNKNOWN_CREDIT';
  return 'EXPENSE';
}
