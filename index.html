  if(financialType.includes('TRANSFER') || financialType === 'SAVINGS_TRANSFER') return ['Transfer', null];
  if(financialType === 'REFUND') return ['Refund', null];
  // Then the detailed merchant rules
  if(typeof AUTO_RULES!=='undefined'){
    const hay = String(merchant||'').toUpperCase();
    for(const [pat, category] of AUTO_RULES){
      if(pat.test(hay)) return [category, null];
    }
  }
  for(const [m, cat, sub] of CATEGORY_RULES){
    if(merchant === m) return [cat, sub];
  }
  return ['Uncategorised', null];
}

// ── File fingerprinting ──
async function hashFile(content){
  const buf = new TextEncoder().encode(content);
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── CSV Parser (Barclays format) ──
function parseBarclaysCSV(content){
  const lines = content.split('\n');
  const header = lines[0].trim();

  if(!header.includes('Number') || !header.includes('Subcategory') || !header.includes('Memo')){
    throw new Error('Unrecognised CSV format. Expected Barclays format with columns: Number, Date, Account, Amount, Subcategory, Memo');
  }

  const ON_DATE_PAT = /\bON (\d{1,2}) ([A-Z]{3})\b/;
  const CODE_PAT = /\b(CPM|BCC|BGC|FT|DDR|UNP|WOT|SO|SV|BBP|DEB)\b/g;

  const MONTH_MAP = {JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};

  function parseDate(str){
    // DD/MM/YYYY
    const p = str.trim().split('/');
    if(p.length===3) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
    return str.trim();
  }

  function extractTransactionDate(postingDateStr, memo, year){
    const m = ON_DATE_PAT.exec(memo);
    if(!m) return null;
    const day = parseInt(m[1]);
    const mon = MONTH_MAP[m[2]];
    if(mon === undefined) return null;
    // Handle year rollover: if posting is Jan and txn is Dec, txn year = posting year - 1
    const postingParts = postingDateStr.split('-');
    let txnYear = parseInt(postingParts[0]);
    const postingMon = parseInt(postingParts[1]) - 1;
    if(postingMon === 0 && mon === 11) txnYear--;
    // Conversely if posting is Dec and txn is Jan (very rare for card transactions)
    if(postingMon === 11 && mon === 0) txnYear++;
    return `${txnYear}-${String(mon+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  const txns = [];
  let account = null;
  let minDate = null, maxDate = null;

  for(const rawLine of lines.slice(1)){
    const line = rawLine.replace(/^\t+/,'').trim();
    if(!line) continue;

    const parts = line.split(',', 5);
    if(parts.length < 5) continue;
    const [rawNum, rawDate, rawAccount, rawAmount] = parts;
    const rawMemo = line.slice(parts.slice(0,4).join(',').length + 1).replace(/\t/g,' ').trim();
    const rawSubcat = parts[4].trim();

    const amountVal = parseFloat(rawAmount);
    if(isNaN(amountVal)) continue;

    if(!account && rawAccount.trim()) account = rawAccount.trim();

    const postingDate = parseDate(rawDate);
    const txnDate = extractTransactionDate(postingDate, rawMemo, parseInt(postingDate.split('-')[0])) || postingDate;
    const txnDateInferred = txnDate === postingDate;

    // Extract payment codes
    const codes = [];
    let codeMatch;
    CODE_PAT.lastIndex = 0;
    while((codeMatch = CODE_PAT.exec(rawMemo)) !== null) codes.push(codeMatch[1]);
    const primaryCode = codes[0] || null;

    // Clean raw description (memo minus codes and date suffix)
    const rawDesc = rawMemo
      .replace(/\bON \d{1,2} [A-Z]{3}\b/g,'')
      .replace(/\b(CPM|BCC|BGC|FT|DDR|UNP|WOT|SO|SV|BBP|DEB|FIRST|PISP\w+|OBA\w+|212T\w+|BHL\w+|4929\w+)\b/g,'')
      .replace(/\s+/,' ').trim();

    const merchant = normaliseMerchant(rawMemo);
    const financialType = classifyFinancialType({}, amountVal, rawSubcat, rawMemo);
    const [category, subcategory] = suggestCategory(merchant, financialType);

    // Stable ID: we use a hash of key fields since Number is often 0
    const idSource = `${rawAccount.trim()}|${rawDate.trim()}|${rawAmount.trim()}|${rawMemo.trim()}`;
    const txnId = 'txn_' + btoa(idSource).replace(/[^a-z0-9]/gi,'').slice(0,20) + '_' + Math.random().toString(36).slice(2,6);

    const now = new Date().toISOString();
    const txn = {
      transactionId: txnId,
      statementId: null, // set when statement is saved
      accountId: rawAccount.trim(),
      postingDate,
      transactionDate: txnDate,
      transactionDateInferred: txnDateInferred,
      amount: Math.abs(amountVal),
      currency: 'GBP',
      direction: amountVal < 0 ? 'debit' : 'credit',
      bankTransactionNumber: rawNum.trim() || null,
      bankTransactionType: rawSubcat,
      bankPaymentCode: primaryCode,
      rawDescription: rawDesc,
      rawMemo: rawMemo,
      raw: { number: rawNum.trim(), date: rawDate.trim(), account: rawAccount.trim(), amount: rawAmount.trim(), subcategory: rawSubcat, memo: rawMemo },
      normalisedMerchant: merchant,
      financialType,
      category,
      subcategory: subcategory || null,
      purpose: null,
      goalId: null,
      tags: [],
      notes: '',
      reconciliationStatus: 'unmatched',
      matchedTransactionId: null,
      paycheckId: null,
      subscriptionId: null,
      confidence: financialType === 'UNKNOWN_CREDIT' || financialType === 'TRANSFER_IN' ? 0.5 : 0.8,
      source: 'statement',
      userConfirmed: false,
      userCategory: null,
      createdAt: now,
      updatedAt: now,
    };

    txns.push(txn);

    if(!minDate || postingDate < minDate) minDate = postingDate;
    if(!maxDate || postingDate > maxDate) maxDate = postingDate;
  }

  return { txns, account, minDate, maxDate };
}

// ── Duplicate detection ──
async function detectDuplicates(newTxns, existingFingerprints, statementId){
  // We check against existing transactions in Firebase
  const existingSnap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
  const existingVal = existingSnap.val() || {};
  const existing = Object.values(existingVal);

  const results = { strong: [], possible: [], clean: [] };

  for(const txn of newTxns){
    let strongMatch = false, possibleMatch = false;

    for(const ex of existing){
      if(ex.statementId === statementId) { strongMatch = true; break; } // same file
      // Possible duplicate: same account, date, amount, direction
      if(ex.accountId === txn.accountId &&
         ex.postingDate === txn.postingDate &&
         ex.amount === txn.amount &&
         ex.direction === txn.direction &&
         ex.rawDescription === txn.rawDescription){
        possibleMatch = true;
      }
    }

    if(strongMatch) results.strong.push(txn);
    else if(possibleMatch) results.possible.push({...txn, _duplicateWarning: true});
    else results.clean.push(txn);
  }

  return results;
}

// ── Paycheck reconciliation ──
function findPaycheckMatches(txns, paychecks){
  const matches = [];
  const incomeTxns = txns.filter(t => t.financialType === 'INCOME' && t.direction === 'credit');

  for(const txn of incomeTxns){
    for(const p of paychecks){
      const pDate = p.date ? p.date.slice(0,10) : null;
      const pAmount = p.income;
      const txnDate = txn.postingDate;
      const txnAmount = txn.amount;

      // Date within 3 days
      if(!pDate) continue;
      const daysDiff = Math.abs((new Date(txnDate) - new Date(pDate)) / 86400000);
      if(daysDiff > 3) continue;

      // Amount exact or within £5
      const amtDiff = Math.abs(txnAmount - pAmount);
      if(amtDiff > 5) continue;

      matches.push({
        txn,
        paycheck: p,
        amountDiff: amtDiff,
        daysDiff: Math.round(daysDiff),
        exact: amtDiff < 0.01,
        discrepancy: amtDiff > 0.01 ? amtDiff : null,
      });
    }
  }
  return matches;
}

// ── Subscription reconciliation ──
function findSubscriptionMatches(txns, subscriptions){
  const matches = [];
  const debitTxns = txns.filter(t => t.direction === 'debit' && ['Direct Debit','Bill Payment','Debit'].includes(t.bankTransactionType));

  for(const txn of debitTxns){
    for(const sub of subscriptions){
      const amtDiff = Math.abs(txn.amount - sub.amount);
      if(amtDiff > 2) continue; // within £2
      // Merchant name match
      const merchantMatch = txn.normalisedMerchant.toLowerCase().includes(sub.name.toLowerCase().split(' ')[0]) ||
                            sub.name.toLowerCase().includes(txn.normalisedMerchant.toLowerCase().split(' ')[0]);
      if(!merchantMatch) continue;

      matches.push({
        txn,
        subscription: sub,
        amountDiff: amtDiff,
        priceChanged: amtDiff > 0.01,
      });
    }
  }
  return matches;
}

// ── Update subscription billing dates from all transactions ──
async function updateSubscriptionBillingDates(allTxns, expectedUid){
  if(!allTxns || !allTxns.length) return;
  if(!currentUser) return;
  if(expectedUid && expectedUid !== currentUser.uid) return;
  if(!appData || !Array.isArray(appData.subscriptions)) return;
  const debitTxns = allTxns.filter(t=>t.direction==='debit');

  const updatedSubs = appData.subscriptions.map(sub=>{
    const firstWord = sub.name.toLowerCase().split(' ')[0];
    const matchingTxns = debitTxns
      .filter(t=>
        t.normalisedMerchant.toLowerCase().includes(firstWord) ||
        firstWord.includes(t.normalisedMerchant.toLowerCase().split(' ')[0]) ||
        (t.rawDescription||'').toLowerCase().includes(firstWord) ||
        (t.rawMemo||'').toLowerCase().includes(firstWord)
      )
      .sort((a,b)=>b.postingDate.localeCompare(a.postingDate));

    if(!matchingTxns.length) return sub;

    // Most common billing day across all history
    const dayCount = {};
    for(const t of matchingTxns){
      const d = parseInt((t.postingDate||'').split('-')[2]||'0');
      if(!d) continue;
      dayCount[d] = (dayCount[d]||0)+1;
    }
    const billingDay = parseInt(Object.entries(dayCount).sort((a,b)=>b[1]-a[1])[0][0]);
    const lastPaid = matchingTxns[0];
    const amountChanged = Math.abs(lastPaid.amount - sub.amount) > 0.5;

    return {
      ...sub,
      billingDay,
      lastPaidDate: lastPaid.postingDate,
      lastPaidAmount: lastPaid.amount,
      amountChangedFromStatement: amountChanged,
    };
  });

  await save({...appData, subscriptions: updatedSubs}, expectedUid);
  if(appData) appData.subscriptions = updatedSubs;
}

// ── Barclaycard PDF Parser (validated against real statement) ──
// NOTE: Barclaycard PDFs are TWO-COLUMN. A single extracted text line can contain
// two unrelated transactions, so we scan within each line rather than anchoring.
async function loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=res; s.onerror=()=>rej(new Error('Could not load PDF library. Check your connection.'));
    document.head.append(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return window.pdfjsLib;
}

async function extractPdfText(file){
  const lib = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({data:buf}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    const rows={};
    for(const it of content.items){
      const y=Math.round(it.transform[5]);
      (rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str});
    }
    for(const y of Object.keys(rows).map(Number).sort((a,b)=>b-a)){
      out += rows[y].sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()+'\n';
    }
  }
  return out;
}

const CARD_MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

function parseBarclaycardText(text){
  if(!/barclaycard/i.test(text)) throw new Error('This does not look like a Barclaycard statement.');

  const num = s => s ? parseFloat(s.replace(/,/g,'')) : null;
  const grab = re => { const m=text.match(re); return m?m[1]:null; };

  const newBalance  = num(grab(/Your new balance:?\s*£([\d,]+\.\d{2})/i));
  const prevBalance = num(grab(/Your previous balance:?\s*£([\d,]+\.\d{2})/i));
  const paymentMade = num(grab(/Payments towards your account:?\s*£([\d,]+\.\d{2})/i));
  const creditLimit = num(grab(/credit limit:?\s*£([\d,]+\.\d{2})/i));
  // "How you've used your card" may be £0 on older statements where all spending
  // was under a 0% promotional offer. In that case the real total is under
  // "Promotional transactions". Take whichever is larger, or the sum.
  const statedStandard  = num(grab(/How you.ve used your card\s*£([\d,]+\.\d{2})/i));
  const statedPromo     = num(grab(/Promotional transactions\s*£([\d,]+\.\d{2})/i));
  const statedSpend = (statedStandard!=null && statedPromo!=null)
    ? Math.round((statedStandard + statedPromo)*100)/100
    : (statedStandard ?? statedPromo);
  const minPayment  = num(grab(/Minimum payment:?\s*£([\d,]+\.\d{2})/i));
  const dueDateStr  = grab(/Please pay by:?\s*(\d{1,2}\s+\w+\s+\d{4})/i);
  const cardLast4   = (grab(/Number\s+((?:\d{4}\s*){4})/)||'').replace(/\s/g,'').slice(-4)||null;

  // Statement issue date anchors the year for DD-MMM transaction dates
  const issued = grab(/issued on (\d{1,2}\s+\w+\s+\d{4})/i) || dueDateStr;
  const issuedDate = issued ? new Date(issued) : new Date();
  const issuedYear = issuedDate.getFullYear();
  const issuedMon  = issuedDate.getMonth();

  const MON='Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec';
  const pat = new RegExp('(\\d{1,2})\\s+('+MON+')\\s+(.+?)\\s*(?:\\be\\b\\s*)?£([\\d,]+\\.\\d{2})','g');

  const txns=[];
  for(const line of text.split('\n')){
    pat.lastIndex=0;
    let m;
    while((m=pat.exec(line))!==null){
      const day=parseInt(m[1],10);
      const mon=CARD_MONTHS[m[2]];
      if(mon===undefined) continue;
      const desc=m[3].trim().replace(/,$/,'').trim();
      if(!desc) continue;
      const amount=num(m[4]);
      // Statement covers the weeks before issue: a month AFTER the issue month
      // must belong to the previous year.
      const year = mon > issuedMon ? issuedYear-1 : issuedYear;
      const date = year+'-'+String(mon+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      txns.push({date, description:desc, amount,
        isPayment: /payment by direct debit|payment received|payment thank/i.test(desc)});
    }
  }

  const spending = txns.filter(t=>!t.isPayment);
  const parsedSpend = Math.round(spending.reduce((s,t)=>s+t.amount,0)*100)/100;
  const dates = spending.map(t=>t.date).sort();

  return {
    txns,
    meta:{
      newBalance, prevBalance, paymentMade, creditLimit, minPayment,
      statedSpend, parsedSpend,
      reconciles: statedSpend!=null ? Math.abs(statedSpend-parsedSpend)<0.02 : null,
      dueDate: dueDateStr, cardLast4,
      periodStart: dates[0]||null, periodEnd: dates[dates.length-1]||null,
    },
  };
}

// ── Barclaycard CSV Parser ──
// Handles two common Barclaycard export formats:
//
// Format A (standard export):
//   Transaction Date,Transaction Type,Transaction Description,Debit Amount,Credit Amount
//   07/07/2026,Purchase,McDonalds 120 Bournemouth,19.14,
//
// Format B (simple export):
//   Date,Description,Amount
//   07/07/2026,McDonalds 120 Bournemouth,-19.14
//
// Both auto-detected from headers.

function detectBarclaycardCSVFormat(text){
  const firstLine = text.split('\n')[0].toLowerCase().trim();
  if(firstLine.includes('transaction date') || firstLine.includes('debit amount'))
    return 'A';
  if(firstLine.startsWith('date,') && firstLine.includes('description'))
    return 'B';
  return null;
}

function parseBarclaycardCSV(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) throw new Error('File is empty');
  const fmt = detectBarclaycardCSVFormat(text);
  if(!fmt) throw new Error('This does not look like a Barclaycard CSV. Expected columns: Transaction Date, Transaction Type, Transaction Description, Debit Amount, Credit Amount');

  const MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};

  function parseDate(str){
    str = str.trim().replace(/"/g,'');
    // DD/MM/YYYY
    const dmy = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(dmy) return `${dmy[3]}-${dmy[2].padStart(2,'0')}-${dmy[1].padStart(2,'0')}`;
    // YYYY-MM-DD
    if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
    // DD Mon YYYY
    const dmy2 = str.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
    if(dmy2){
      const m = MONTHS[dmy2[2].slice(0,3)];
      if(m!=null) return `${dmy2[3]}-${String(m+1).padStart(2,'0')}-${dmy2[1].padStart(2,'0')}`;
    }
    return null;
  }

  function parseAmount(str){
    if(!str && str!=='0') return null;
    return parseFloat(String(str).replace(/[£,"\s]/g,'').trim()) || null;
  }

  function parseLine(line){
    // Respect quoted fields
    const fields = [];
    let cur = '', inQ = false;
    for(const ch of line){
      if(ch==='"'){ inQ=!inQ; continue; }
      if(ch===','&&!inQ){ fields.push(cur.trim()); cur=''; continue; }
      cur+=ch;
    }
    fields.push(cur.trim());
    return fields;
  }

  const txns = [];
  let stmtBalance = null, prevBalance = null, paymentMade = null;
  let periodStart = null, periodEnd = null;

  for(let i=1; i<lines.length; i++){
    const f = parseLine(lines[i]);

    if(fmt==='A'){
      // Transaction Date, Transaction Type, Transaction Description, Debit, Credit
      if(f.length < 3) continue;
      const date = parseDate(f[0]);
      if(!date) continue;
      const type = (f[1]||'').trim();
      const desc = (f[2]||'').trim();
      const debit  = parseAmount(f[3]);
      const credit = parseAmount(f[4]);
      const amount = debit || credit || 0;
      const direction = credit ? 'credit' : 'debit';
      if(amount===0) continue;

      const isPayment = /payment|direct debit/i.test(type)||/payment|direct debit/i.test(desc);
      if(isPayment && credit){ paymentMade = (paymentMade||0)+credit; }

      if(!periodStart || date<periodStart) periodStart=date;
      if(!periodEnd   || date>periodEnd)   periodEnd=date;
      txns.push({date, description:desc, type, amount, direction, isPayment});
    }

    if(fmt==='B'){
      // Date, Description, Amount (negative=debit, positive=credit/refund)
      if(f.length < 3) continue;
      const date = parseDate(f[0]);
      if(!date) continue;
      const desc = (f[1]||'').trim();
      const raw  = parseAmount(f[2]);
      if(raw===null) continue;
      const direction = raw >= 0 ? 'credit' : 'debit';
      const amount = Math.abs(raw);
      const isPayment = /payment|direct debit/i.test(desc);
      if(isPayment && direction==='credit') paymentMade = (paymentMade||0)+amount;
      if(!periodStart || date<periodStart) periodStart=date;
      if(!periodEnd   || date>periodEnd)   periodEnd=date;
      txns.push({date, description:desc, type:'', amount, direction, isPayment});
    }
  }

  // Try to pull balance from last line or header metadata
  const lastFew = lines.slice(-5).join('\n');
  const balM = lastFew.match(/new balance[:\s]+£?([\d,]+\.\d{2})/i);
  if(balM) stmtBalance = parseAmount(balM[1]);
  const prevM = lastFew.match(/previous balance[:\s]+£?([\d,]+\.\d{2})/i);
  if(prevM) prevBalance = parseAmount(prevM[1]);

  const spending = txns.filter(t=>!t.isPayment&&t.direction==='debit');
  const parsedSpend = Math.round(spending.reduce((s,t)=>s+t.amount,0)*100)/100;

  return {
    txns,
    meta:{
      stmtBalance, prevBalance, paymentMade,
      parsedSpend, periodStart, periodEnd,
      reconciles: stmtBalance!=null ? Math.abs(stmtBalance-(prevBalance||0)-parsedSpend+(paymentMade||0))<1 : null,
      format: fmt,
    },
  };
}

async function parseBarclaycardPDF(file){
  const text = await extractPdfText(file);
  return parseBarclaycardText(text);
}

// Card purchases become EXPENSE transactions on the card account.
// The DDR that settles the card is NOT spending — it is excluded here and
// reclassified as a transfer on the current account, so nothing double-counts.
function normaliseCardTransactions(parsed, statementId, accountId){
  const now=new Date().toISOString();
  return parsed.txns.filter(t=>!t.isPayment).map(t=>{
    const merchant=normaliseMerchant(t.description);
    const [category,subcategory]=suggestCategory(merchant,'EXPENSE');
    const idSource=accountId+'|'+t.date+'|'+t.amount+'|'+t.description;
    const txnId='txn_'+btoa(unescape(encodeURIComponent(idSource))).replace(/[^a-z0-9]/gi,'').slice(0,20)+'_'+Math.random().toString(36).slice(2,6);
    return {
      transactionId:txnId, statementId, accountId,
      postingDate:t.date, transactionDate:t.date, transactionDateInferred:false,
      amount:t.amount, currency:'GBP', direction:'debit',
      bankTransactionNumber:null, bankTransactionType:'Card Purchase', bankPaymentCode:'CPM',
      rawDescription:t.description, rawMemo:t.description,
      raw:{date:t.date, description:t.description, amount:String(t.amount)},
      normalisedMerchant:merchant, financialType:'EXPENSE',
      category, subcategory:subcategory||null,
      purpose:null, goalId:null, tags:[], notes:'',
      reconciliationStatus:'unmatched', matchedTransactionId:null,
      paycheckId:null, subscriptionId:null,
      confidence:0.85, source:'credit_card_statement', sourceType:'credit_card',
      userConfirmed:false, userCategory:null,
      createdAt:now, updatedAt:now,
    };
  });
}

// Reclassify the current-account DDR that settles this card as a transfer,
// so card spending is not counted twice.
async function reclassifyCardSettlement(paymentAmount, paymentDate){
  if(!paymentAmount) return 0;
  const snap=await db.ref('users/'+currentUser.uid+'/transactions').once('value');
  const all=Object.values(snap.val()||{});
  const target=new Date(paymentDate||Date.now());
  let changed=0;
  for(const t of all){
    if(t.sourceType==='credit_card') continue;
    if(t.direction!=='debit') continue;
    if(Math.abs(t.amount-paymentAmount)>0.01) continue;
    if(!/b\/card|barclaycard/i.test((t.rawMemo||'')+(t.rawDescription||''))) continue;
    if(paymentDate && Math.abs(new Date(t.postingDate)-target)/86400000>5) continue;
    if(t.financialType==='TRANSFER_OUT') continue;
    await txnDB.write({...t, financialType:'TRANSFER_OUT', category:'Transfer',
      notes:(t.notes?t.notes+' ':'')+'Credit card settlement — excluded from spending',
      updatedAt:new Date().toISOString()});
    changed++;
  }
  return changed;
}

// ══════════════════════════════════════
// STATEMENT IMPORT SCREEN
// ══════════════════════════════════════
function statementsScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  let importState = 'idle'; // idle | parsing | preview | nothing | importing | complete | error

  const stmtWrap = el('div',{}); // statement history
  const importWrap = el('div',{}); // import UI

  // ── Statement history ──
  async function renderHistory(){
    stmtWrap.innerHTML = '';
    const stmts = await txnDB.getStatements();
    if(stmts.length === 0){
      stmtWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'24px 16px',color:'var(--text2)',fontSize:'13px'}},'No statements imported yet.'));
      return;
    }
    const sorted = [...stmts].sort((a,b)=>(b.periodStart||'').localeCompare(a.periodStart||''));
    stmtWrap.append(el('div',{class:'section-hdr'},'Imported Statements'));
    for(const s of sorted){
      const card = el('div',{class:'card',style:{marginBottom:'8px'}});
      const hdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}});
      hdr.append(
        el('div',{},
          el('div',{style:{fontWeight:'600',fontSize:'14px'}},s.filename||'Statement'),
          el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'2px'}},
            (s.periodStart?s.periodStart.slice(0,7):'?')+' → '+(s.periodEnd?s.periodEnd.slice(0,7):'?'))
        ),
        el('div',{style:{textAlign:'right'}},
          el('div',{style:{fontSize:'13px',fontWeight:'600',color:'var(--green)'}},s.transactionCount+' txns'),
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},
            new Date(s.uploadedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}))
        )
      );
      const details = el('div',{style:{display:'flex',gap:'16px',marginTop:'8px',fontSize:'12px',color:'var(--text2)'}});
      if(s.newCount!=null) details.append(el('span',{},s.newCount+' new'));
      if(s.matchedPaycheckCount) details.append(el('span',{style:{color:'var(--green)'}},s.matchedPaycheckCount+' paychecks matched'));
      if(s.duplicateCount) details.append(el('span',{style:{color:'var(--amber)'}},s.duplicateCount+' possible duplicates'));
      const delBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'12px',padding:'4px 0',marginTop:'8px'}},'Delete import');
      delBtn.addEventListener('click',async()=>{
        if(!confirm('Delete this statement and all its transactions? This cannot be undone.')) return;
        delBtn.textContent='Deleting…'; delBtn.disabled=true;
        await txnDB.deleteStatement(s.statementId);
        renderHistory();
      });
      card.append(hdr, details, delBtn);
      stmtWrap.append(card);
    }
  }

  // ── Batch Import UI ──
  // queue entries: {file,name,status,kind,fingerprint,txns,analysis,error}
  let queue = [];
  let importProgress = {done:0,total:0,label:''};
  let importSummary = null;

  function fileSig(t){
    return [t.accountId,t.postingDate,t.amount.toFixed(2),t.direction,
            (t.rawDescription||'').slice(0,40)].join('|');
  }

  async function parseOneFile(file, existingSigs, batchSigs){
    const isPDF = /\.pdf$/i.test(file.name) || file.type==='application/pdf';

    let fingerprint, text=null;
    if(isPDF){
      const bytes = new Uint8Array(await file.arrayBuffer());
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      fingerprint = Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
    } else {
      text = await file.text();
      fingerprint = await hashFile(text);
    }

    if(isPDF){
      const parsed = await parseBarclaycardPDF(file);
      const m = parsed.meta;
      const accountId = 'barclaycard'+(m.cardLast4?'_'+m.cardLast4:'');
      const txns = normaliseCardTransactions(parsed, null, accountId);
      let dupes=0;
      for(const t of txns){
        const s=fileSig(t);
        if(existingSigs.has(s)||batchSigs.has(s)) dupes++; else batchSigs.add(s);
      }
      return {
        kind:'credit_card', fingerprint, txns,
        settlement:{amount:m.paymentMade, date:(parsed.txns.find(x=>x.isPayment)||{}).date||null},
        analysis:{
          account:'Barclaycard'+(m.cardLast4?' ••••'+m.cardLast4:''),
          periodStart:m.periodStart, periodEnd:m.periodEnd,
          total:txns.length, income:0, expenses:txns.length, transfers:0,
          possibleDuplicates:dupes,
          needsReview:txns.filter(t=>needsReview(t)).length,
          cardMeta:m,
        },
      };
    }

    // ── CSV: detect which bank/format ──
    const cardCSVFmt = detectBarclaycardCSVFormat(text);
    if(cardCSVFmt){
      // Barclaycard CSV — route through the card parser, same as PDF
      const parsed = parseBarclaycardCSV(text);
      const m = parsed.meta;
      const accountId = 'barclaycard_csv';
      const cardTxns = normaliseCardTransactions(parsed, null, accountId);
      let cdupe=0;
      for(const t of cardTxns){
        const s=fileSig(t);
        if(existingSigs.has(s)||batchSigs.has(s)) cdupe++; else batchSigs.add(s);
      }
      return {
        kind:'credit_card', fingerprint, txns:cardTxns,
        settlement:{amount:m.paymentMade, date:null},
        analysis:{
          account:'Barclaycard (CSV)', periodStart:m.periodStart, periodEnd:m.periodEnd,
          total:cardTxns.length, income:0, expenses:cardTxns.length, transfers:0,
          possibleDuplicates:cdupe,
          needsReview:cardTxns.filter(t=>needsReview(t)).length,
          cardMeta:m,
        },
      };
    }

    // ── Barclays current account CSV ──
    const {txns, account, minDate, maxDate} = parseBarclaysCSV(text);
    let dupes=0;
    for(const t of txns){
      const s=fileSig(t);
      if(existingSigs.has(s)||batchSigs.has(s)) dupes++; else batchSigs.add(s);
    }
    const paychecks=(appData.paychecks||[]).filter(p=>p.income>0);
    return {
      kind:'current_account', fingerprint, txns,
      paycheckMatches: findPaycheckMatches(txns, paychecks),
      subMatches: findSubscriptionMatches(txns, appData.subscriptions||[]),
      analysis:{
        account, periodStart:minDate, periodEnd:maxDate,
        total:txns.length,
        income:txns.filter(t=>t.financialType==='INCOME').length,
        expenses:txns.filter(t=>t.financialType==='EXPENSE').length,
        transfers:txns.filter(t=>(t.financialType||'').includes('TRANSFER')||(t.financialType||'')==='SAVINGS_TRANSFER').length,
        possibleDuplicates:dupes,
        needsReview:txns.filter(t=>needsReview(t)||t.financialType.startsWith('UNKNOWN')).length,
      },
    };
  }

  async function parseQueue(files){
    importState='parsing';
    queue = files.map(f=>({file:f, name:f.name, status:'pending'}));
    importProgress={done:0,total:files.length,label:''};
    renderImportUI();

    const knownFps = new Set(await txnDB.getFingerprints());
    const snap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
    const existingSigs = new Set(Object.values(snap.val()||{}).map(fileSig));
    const batchSigs = new Set();
    const seenFps = new Set();

    for(const entry of queue){
      entry.status='parsing';
      importProgress.label=entry.name;
      renderImportUI();
      try{
        const r = await parseOneFile(entry.file, existingSigs, batchSigs);
        if(knownFps.has(r.fingerprint) || seenFps.has(r.fingerprint)){
          entry.status='duplicate';
          entry.kind=r.kind;
        } else {
          seenFps.add(r.fingerprint);
          Object.assign(entry, r, {status:'ready'});
        }
      }catch(err){
        entry.status='error';
        entry.error=err.message||'Could not read this file';
      }
      importProgress.done++;
      renderImportUI();
    }

    // Oldest first, so the newest statement has the final say on balances
    queue.sort((a,b)=>((a.analysis&&a.analysis.periodEnd)||'').localeCompare((b.analysis&&b.analysis.periodEnd)||''));
    importState = queue.some(e=>e.status==='ready') ? 'preview' : 'nothing';
    renderImportUI();
  }

  async function runImport(){
    importState='importing';
    const ready = queue.filter(e=>e.status==='ready');
    importProgress={done:0,total:ready.length,label:''};
    renderImportUI();

    let txnCount=0, stmtCount=0, settlementsFixed=0;
    let latestCard=null, latestCardEnd='';

    for(const entry of ready){
      importProgress.label=entry.name;
      renderImportUI();
      const statementId='stmt_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      const a=entry.analysis;

      let finalTxns;
      if(entry.kind==='credit_card'){
        finalTxns = entry.txns.map(t=>({...t, statementId}));
      } else {
        const pIds=new Set((entry.paycheckMatches||[]).map(m=>m.txn.transactionId));
        const sIds=new Map((entry.subMatches||[]).map(m=>[m.txn.transactionId,m.subscription.id]));
        finalTxns = entry.txns.map(t=>{
          const isP=pIds.has(t.transactionId), isS=sIds.has(t.transactionId);
          const match=(entry.paycheckMatches||[]).find(m=>m.txn.transactionId===t.transactionId);
          return {...t, statementId,
            reconciliationStatus:(isP||isS)?'matched':t.reconciliationStatus,
            paycheckId:isP?((match&&match.paycheck&&match.paycheck.id)||null):null,
            subscriptionId:isS?sIds.get(t.transactionId):null};
        });
      }

      for(let i=0;i<finalTxns.length;i+=100){
        await txnDB.writeBatch(finalTxns.slice(i,i+100));
      }

      const cm=a.cardMeta||{};
      await txnDB.writeStatement({
        statementId,
        accountId:a.account,
        filename:entry.name,
        sourceFormat: entry.kind==='credit_card'?'barclaycard_pdf_v1':'barclays_csv_v1',
        sourceBank: entry.kind==='credit_card'?'Barclaycard':'Barclays',
        statementKind: entry.kind,
        periodStart:a.periodStart, periodEnd:a.periodEnd,
        uploadedAt:new Date().toISOString(),
        transactionCount:finalTxns.length,
        importStatus:'complete',
        newCount:finalTxns.length-a.possibleDuplicates,
        duplicateCount:a.possibleDuplicates,
        matchedPaycheckCount:(entry.paycheckMatches||[]).length,
        matchedSubscriptionCount:(entry.subMatches||[]).length,
        reviewCount:a.needsReview,
        fileFingerprint:entry.fingerprint,
        statementBalance: cm.newBalance!=null?cm.newBalance:null,
        creditLimit: cm.creditLimit!=null?cm.creditLimit:null,
        paymentDue: cm.dueDate||null,
        minimumPayment: cm.minPayment!=null?cm.minPayment:null,
      });

      if(entry.kind==='credit_card'){
        if(entry.settlement && entry.settlement.amount){
          settlementsFixed += await reclassifyCardSettlement(entry.settlement.amount, entry.settlement.date);
        }
        if(cm.newBalance!=null && (a.periodEnd||'')>=latestCardEnd){
          latestCardEnd=a.periodEnd||''; latestCard=cm;
        }
      }

      txnCount+=finalTxns.length; stmtCount++;
      importProgress.done++;
      renderImportUI();
    }

    // Only the most recent card statement sets the balance
    if(latestCard && latestCard.newBalance!=null){
      const accts=appData.accounts||[];
      if(accts.length){
        const upd=accts.map(x=>x.type==='credit_card'
          ? {...x, balance:latestCard.newBalance,
             creditLimit:latestCard.creditLimit!=null?latestCard.creditLimit:x.creditLimit,
             updatedAt:new Date().toISOString()} : x);
        await save({...appData, accounts:upd, balances:{...appData.balances, creditCard:latestCard.newBalance}});
      } else {
        await save({...appData, balances:{...appData.balances, creditCard:latestCard.newBalance}});
      }
    }

    const allNow=await db.ref('users/'+currentUser.uid+'/transactions').once('value');
    if(allNow.val()) await updateSubscriptionBillingDates(Object.values(allNow.val()));

    importSummary={files:stmtCount, txns:txnCount, settlementsFixed,
                   skipped:queue.filter(e=>e.status!=='ready').length};
    queue=[];
    importState='complete';
    renderImportUI();
    renderHistory();
  }

  function renderImportUI(){
    importWrap.innerHTML = '';

    if(importState === 'idle'){
      const uploadCard = el('div',{class:'card'});
      uploadCard.innerHTML = `<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;font-family:'Space Grotesk',sans-serif">Import Statements</div>`;

      const fileInp = el('input',{type:'file',accept:'.csv,.pdf',multiple:true,style:{display:'none'}});
      const uploadBtn = el('button',{class:'btn-primary'},'📂 Choose statement files');
      uploadBtn.addEventListener('click',()=>fileInp.click());

      const infoDiv = el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'10px',lineHeight:'1.6'}},
        'Select as many files as you like — Barclays current account CSVs and Barclaycard PDFs can be mixed. Each type is detected automatically, files you have already imported are skipped, and raw statement data is always preserved.');

      fileInp.addEventListener('change',async(e)=>{
        const files=Array.from(e.target.files||[]);
        if(!files.length) return;
        uploadBtn.disabled=true;
        try{ await parseQueue(files); }
        catch(err){
          importState='error';
          importSummary={error:err.message};
          renderImportUI();
        }
      });
      uploadCard.append(fileInp, uploadBtn, infoDiv);
      importWrap.append(uploadCard);
    }

    if(importState === 'parsing'){
      const card = el('div',{class:'card'});
      const pct = importProgress.total ? Math.round(importProgress.done/importProgress.total*100) : 0;
      card.append(
        el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'6px'}},'Reading your statements…'),
        el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'12px'}},
          importProgress.done+' of '+importProgress.total+(importProgress.label?' · '+importProgress.label:'')),
        el('div',{class:'prog-wrap'}, el('div',{class:'prog-fill',style:{width:pct+'%'}}))
      );
      importWrap.append(card);
      importWrap.append(queueListCard());
    }

    if(importState === 'nothing'){
      const card = el('div',{class:'card',style:{borderLeft:'3px solid var(--amber)'}});
      card.append(
        el('div',{style:{fontWeight:'700',marginBottom:'8px',color:'var(--amber)'}},'Nothing new to import'),
        el('div',{style:{fontSize:'13px',color:'var(--text2)'}},
          'Every file you selected was either already imported or could not be read.')
      );
      const again=el('button',{class:'btn-ghost',style:{marginTop:'12px'}},'Choose different files');
      again.addEventListener('click',()=>{ queue=[]; importState='idle'; renderImportUI(); });
      card.append(again);
      importWrap.append(card);
      importWrap.append(queueListCard());
    }

    if(importState === 'preview'){
      const ready = queue.filter(e=>e.status==='ready');
      const totalTxns = ready.reduce((s,e)=>s+e.analysis.total,0);
      const totalDupes = ready.reduce((s,e)=>s+e.analysis.possibleDuplicates,0);
      const totalReview = ready.reduce((s,e)=>s+e.analysis.needsReview,0);
      const cards = ready.filter(e=>e.kind==='credit_card').length;
      const currents = ready.length-cards;
      const allDates = ready.flatMap(e=>[e.analysis.periodStart,e.analysis.periodEnd]).filter(Boolean).sort();

      const previewCard = el('div',{class:'card'});
      previewCard.append(
        el('div',{style:{fontWeight:'700',fontSize:'16px',marginBottom:'4px'}},
          ready.length+' statement'+(ready.length>1?'s':'')+' ready to import'),
        el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'16px'}},
          (allDates.length?allDates[0].slice(0,7)+' → '+allDates[allDates.length-1].slice(0,7):'')+
          (currents?' · '+currents+' current account':'')+(cards?' · '+cards+' credit card':''))
      );

      const grid=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'16px'}});
      const stat=(label,val,color)=>{
        const b=el('div',{style:{background:'var(--surface2)',borderRadius:'10px',padding:'10px 12px'}});
        b.append(el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'2px'}},label),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'18px',color:color||'var(--text)'}},String(val)));
        return b;
      };
      grid.append(
        stat('Statements', ready.length),
        stat('Transactions', totalTxns),
        stat('Needs review', totalReview, totalReview>0?'var(--amber)':'var(--text)'),
        stat('Possible duplicates', totalDupes, totalDupes>0?'var(--amber)':'var(--text)'),
      );
      previewCard.append(grid);

      const badCard = ready.find(e=>e.kind==='credit_card'&&e.analysis.cardMeta&&e.analysis.cardMeta.reconciles===false);
      if(badCard){
        previewCard.append(el('div',{style:{background:'var(--amber-dim)',borderRadius:'10px',padding:'12px',marginBottom:'10px',fontSize:'13px',color:'var(--amber)'}},
          '⚠️ '+badCard.name+' did not reconcile against its own printed total. Check it after importing.'));
      }
      if(cards){
        previewCard.append(el('div',{style:{background:'var(--surface2)',borderRadius:'10px',padding:'12px',marginBottom:'10px',fontSize:'12px',color:'var(--text2)',lineHeight:'1.6'}},
          'Direct debits that settled these cards will be marked as transfers on your current account, so card spending is never counted twice. Your card balance will be set from the most recent statement.'));
      }

      const btn=el('button',{class:'btn-primary'},'Import '+totalTxns+' transactions');
      btn.addEventListener('click',()=>{ runImport().catch(err=>{ importState='error'; importSummary={error:err.message}; renderImportUI(); }); });
      const cancel=el('button',{class:'btn-ghost',style:{marginTop:'8px'}},'Cancel');
      cancel.addEventListener('click',()=>{ queue=[]; importState='idle'; renderImportUI(); });
      previewCard.append(btn, cancel);
      importWrap.append(previewCard);
      importWrap.append(queueListCard());
    }

    if(importState === 'importing'){
      const pct = importProgress.total ? Math.round(importProgress.done/importProgress.total*100) : 0;
      const card=el('div',{class:'card'});
      card.append(
        el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'6px'}},'Importing…'),
        el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'12px'}},
          importProgress.done+' of '+importProgress.total+' statements'+(importProgress.label?' · '+importProgress.label:'')),
        el('div',{class:'prog-wrap'}, el('div',{class:'prog-fill',style:{width:pct+'%'}})),
        el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'10px'}},'Please keep the app open.')
      );
      importWrap.append(card);
    }

    if(importState === 'complete'){
      const s=importSummary||{};
      const doneCard=el('div',{class:'card',style:{textAlign:'center',padding:'30px'}});
      doneCard.append(
        el('div',{style:{fontSize:'32px',marginBottom:'12px'}},'✅'),
        el('div',{style:{fontSize:'18px',fontWeight:'700',marginBottom:'8px'}},'Import complete'),
        el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'16px',lineHeight:'1.6'}},
          (s.txns||0)+' transactions from '+(s.files||0)+' statement'+((s.files||0)===1?'':'s')+'.'+
          (s.settlementsFixed?' '+s.settlementsFixed+' card settlement'+(s.settlementsFixed===1?'':'s')+' marked as transfers.':'')+
          (s.skipped?' '+s.skipped+' file'+(s.skipped===1?'':'s')+' skipped.':''))
      );
      const again=el('button',{class:'btn-primary'},'Import more statements');
      again.addEventListener('click',()=>{ importState='idle'; importSummary=null; renderImportUI(); });
      const viewBtn=el('button',{class:'btn-ghost',style:{marginTop:'8px'}},'View transactions');
      viewBtn.addEventListener('click',()=>{ if(window._setTab) window._setTab('_transactions'); });
      doneCard.append(again, viewBtn);
      importWrap.append(doneCard);
    }

    if(importState === 'error'){
      const s=importSummary||{};
      importWrap.append(el('div',{class:'card',style:{color:'var(--red)',padding:'20px'}},
        el('div',{style:{fontWeight:'700',marginBottom:'8px'}},'Import failed'),
        el('div',{style:{fontSize:'13px'}},s.error||'Something went wrong. Please try again.')
      ));
      const retry=el('button',{class:'btn-ghost',style:{marginTop:'12px'}},'Try again');
      retry.addEventListener('click',()=>{ queue=[]; importSummary=null; importState='idle'; renderImportUI(); });
      importWrap.append(retry);
    }
  }

  // Per-file breakdown shown under the summary
  function queueListCard(){
    const wrap=el('div',{});
    if(!queue.length) return wrap;
    wrap.append(el('div',{class:'section-hdr'},'Files'));
    for(const e of queue){
      const a=e.analysis;
      const meta={
        pending:  ['Waiting','var(--text3)'],
        parsing:  ['Reading…','var(--text2)'],
        ready:    [e.kind==='credit_card'?'Credit card':'Current account','var(--green)'],
        duplicate:['Already imported','var(--amber)'],
        error:    ['Could not read','var(--red)'],
      }[e.status]||['','var(--text3)'];

      const row=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',
        gap:'10px',padding:'12px 14px',background:'var(--surface)',border:'1px solid var(--border)',
        borderRadius:'12px',marginBottom:'6px',
        borderLeft:'3px solid '+(e.status==='ready'?'var(--green)':e.status==='error'?'var(--red)':e.status==='duplicate'?'var(--amber)':'var(--border)')}});

      const left=el('div',{style:{flex:'1',minWidth:'0'}});
      left.append(
        el('div',{style:{fontSize:'13px',fontWeight:'600',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},e.name),
        el('div',{style:{fontSize:'11px',color:meta[1],marginTop:'2px'}},
          meta[0]+(a&&a.periodStart?' · '+a.periodStart.slice(0,7)+' → '+a.periodEnd.slice(0,7):'')+(e.error?' · '+e.error:''))
      );
      const right=el('div',{style:{textAlign:'right',flexShrink:'0'}});
      if(e.status==='ready'){
        right.append(
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'13px'}},a.total+' txns'),
          a.possibleDuplicates?el('div',{style:{fontSize:'10px',color:'var(--amber)',marginTop:'2px'}},a.possibleDuplicates+' dup'):el('span')
        );
      }
      row.append(left,right);

      if(e.status==='ready'){
        const skip=el('button',{style:{background:'none',color:'var(--text3)',fontSize:'11px',padding:'0 0 0 8px',flexShrink:'0'}},'Skip');
        skip.addEventListener('click',()=>{
          e.status='skipped';
          if(!queue.some(x=>x.status==='ready')) importState='nothing';
          renderImportUI();
        });
        row.append(skip);
      }
      wrap.append(row);
    }
    return wrap;
  }

  renderImportUI();
  renderHistory();

  content.append(
    el('div',{class:'section-hdr'},'Import Statement'),
    importWrap,
    stmtWrap
  );
  return content;
}

// ══════════════════════════════════════
// TRANSACTION HISTORY SCREEN
// ══════════════════════════════════════
function transactionsScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  let allTxns = [];
  let filtered = [];
  let filterType = 'all';
  let searchQ = '';
  let selectedTxn = null;

  const listWrap = el('div',{});

    INCOME:'Income', EXPENSE:'Expense', TRANSFER_OUT:'Transfer Out',
    TRANSFER_IN:'Transfer In', SAVINGS_TRANSFER:'Savings', REFUND:'Refund',
    UNKNOWN_CREDIT:'Unknown Credit', GOAL_ALLOCATION:'Goal',

  const FINANCIAL_TYPE_COLORS = {

    REFUND:'var(--green)', TRANSFER_OUT:'var(--text3)', TRANSFER_IN:'var(--text3)',

  async function load(){
    listWrap.innerHTML = '<div class="skeleton skel-line" style="width:40%"></div>'+
      Array.from({length:5},()=>'<div class="skeleton" style="height:56px;margin-bottom:6px;border-radius:12px"></div>').join('');
    allTxns = await txnDB.getTransactions(500);
    applyFilter();

  function applyFilter(){
    filtered = allTxns.filter(t=>{
      if(filterType==='income' && t.financialType!=='INCOME') return false;
      if(filterType==='expense' && t.financialType!=='EXPENSE') return false;
      if(filterType==='transfer' && !t.financialType.includes('TRANSFER') && t.financialType!=='SAVINGS_TRANSFER') return false;
      if(filterType==='review' && !needsReview(t)) return false;
      if(searchQ){
        const q = searchQ.toLowerCase();
        if(!t.normalisedMerchant.toLowerCase().includes(q) &&
           !t.rawDescription.toLowerCase().includes(q) &&
           !(t.category||'').toLowerCase().includes(q)) return false;
      }
      return true;
    });
    renderList();
  }

  function renderList(){
    listWrap.innerHTML = '';
    if(allTxns.length === 0){
      listWrap.append(el('div',{class:'state'},
        el('div',{class:'state-title'},'No transactions yet'),
        el('div',{class:'state-body'},'Import a bank statement from More → Import Statement and your spending will appear here.')));
      return;
    }
    if(filtered.length === 0){
      listWrap.append(el('div',{class:'state'},
        el('div',{class:'state-title'},'Nothing matches'),
        el('div',{class:'state-body'},'Try a different filter, or clear your search.')));
      return;
    }

    // Group by month
    const byMonth = {};
    for(const t of filtered){
      const month = t.postingDate.slice(0,7);
      if(!byMonth[month]) byMonth[month] = [];
      byMonth[month].push(t);
    }

    for(const [month, txns] of Object.entries(byMonth)){
      const d = new Date(month+'-01');
      const label = d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
      const totalIn = txns.filter(t=>t.direction==='credit').reduce((s,t)=>s+t.amount,0);
      const totalOut = txns.filter(t=>t.direction==='debit').reduce((s,t)=>s+t.amount,0);

      const monthHdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px',marginTop:'16px'}});
      monthHdr.append(
        el('div',{style:{fontSize:'11px',letterSpacing:'2px',textTransform:'uppercase',color:'var(--text3)',fontFamily:"'Space Grotesk',sans-serif"}},label),
        el('div',{style:{fontSize:'11px',color:'var(--text3)',fontFamily:"'Space Mono',monospace"}},
          '+'+fmt(totalIn)+' / -'+fmt(totalOut))
      );
      listWrap.append(monthHdr);

      for(const t of txns){
        // Large relative to this month's typical spend — worth spotting at a glance
        const isLarge = t.direction==='debit' && t.amount >= Math.max(60, (totalOut/Math.max(txns.length,1))*4);
        const row = el('div',{class:'txn'+(isLarge?' txn-large':'')});

        const d = new Date(t.postingDate);
        const dateSpan = el('div',{class:'txn-date'});
        dateSpan.append(
          el('div',{style:{fontWeight:'650',color:'var(--ink-2)'}},String(d.getDate())),
          el('div',{},d.toLocaleDateString('en-GB',{month:'short'})));

        const info = el('div',{class:'txn-main'});
        info.append(
          el('div',{class:'txn-merchant'},t.normalisedMerchant||t.rawDescription),
          el('div',{class:'txn-cat'},
            (t.userCategory||t.category)+(t.sourceType==='credit_card'?' · card':''))
        );

        const amtCol = el('div',{class:'txn-amt'});
        amtCol.append(
          el('div',{class:'num',style:{color:t.direction==='credit'?'var(--accent)':'var(--ink)'}},
            (t.direction==='credit'?'+':'−')+'£'+t.amount.toFixed(2)),
          needsReview(t)?el('div',{style:{fontSize:'9.5px',color:'var(--warn)',marginTop:'2px',fontWeight:'600'}},'review'):el('span')
        );

        row.append(dateSpan, info, amtCol);
        row.addEventListener('click',()=>{ selectedTxn=t; renderDetail(); });
        listWrap.append(row);
      }
    }

    const typeSel = el('select',{style:{width:'100%',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'10px',padding:'8px 12px',fontSize:'13px',marginBottom:'8px',outline:'none'}});

    saveBtn.addEventListener('click',async()=>{
      const updated = {
        ...t,
        financialType: typeSel.value,
        userCategory: selectedCat||null,
        category: selectedCat||t.category,
        notes: notesInp.value.trim(),
        userConfirmed: true,
        updatedAt: new Date().toISOString(),
      };
      await txnDB.write(updated);

      // Save merchant rule so future imports use this category
      if(selectedCat && t.normalisedMerchant){
        const ruleId = 'mr_'+t.normalisedMerchant.replace(/\W/g,'').toLowerCase();
        const existingSnap = await db.ref('users/'+currentUser.uid+'/merchantRules/'+ruleId).once('value');
        const existing = existingSnap.val();
        await db.ref('users/'+currentUser.uid+'/merchantRules/'+ruleId).set({
          id: ruleId,
          matchPattern: t.normalisedMerchant.toUpperCase(),
          normalisedMerchant: t.normalisedMerchant,
          preferredCategory: selectedCat,
          preferredSubcategory: null,
          financialType: typeSel.value,
          confirmationCount: (existing?.confirmationCount||0)+1,

      const idx = allTxns.findIndex(x=>x.transactionId===t.transactionId);

  content.append(detailWrap, filterBar, searchInp, listWrap);
  load();
  return content;
}

// PHASE F — RECURRING TRANSACTION DETECTION
// ═══════════════════════════════════════════════════════════════

function detectRecurring(transactions){
  // Group by normalised merchant
  const byMerchant = {};
  for(const t of transactions){
    if(t.financialType === 'INCOME' || t.financialType.includes('TRANSFER')) continue;
    const key = t.normalisedMerchant || t.rawDescription;
    if(!byMerchant[key]) byMerchant[key] = [];
    byMerchant[key].push(t);
  }

  const patterns = [];

  for(const [merchant, txns] of Object.entries(byMerchant)){
    if(txns.length < 2) continue;
    const sorted = [...txns].sort((a,b)=>a.postingDate.localeCompare(b.postingDate));

    // Calculate gaps between transactions in days
    const gaps = [];
    for(let i=1;i<sorted.length;i++){
      const days = Math.round((new Date(sorted[i].postingDate) - new Date(sorted[i-1].postingDate)) / 86400000);
      gaps.push(days);
    }

    if(!gaps.length) continue;

    // Calculate average gap and amount
    const avgGap = gaps.reduce((s,g)=>s+g,0)/gaps.length;
    const amounts = sorted.map(t=>t.amount);
    const avgAmount = amounts.reduce((s,a)=>s+a,0)/amounts.length;
    const amountVariance = amounts.map(a=>Math.abs(a-avgAmount)).reduce((s,v)=>s+v,0)/amounts.length;

    // Classify frequency
    let frequency = null;
    let confidence = 0;
    const gapVariance = gaps.map(g=>Math.abs(g-avgGap)).reduce((s,v)=>s+v,0)/gaps.length;

    if(avgGap >= 6 && avgGap <= 8 && gapVariance < 3){
      frequency = 'Weekly'; confidence = 0.9;
    } else if(avgGap >= 12 && avgGap <= 16 && gapVariance < 4){
      frequency = 'Fortnightly'; confidence = 0.85;
    } else if(avgGap >= 28 && avgGap <= 33 && gapVariance < 5){
      frequency = 'Monthly'; confidence = 0.9;
    } else if(avgGap >= 85 && avgGap <= 95 && gapVariance < 7){
      frequency = 'Quarterly'; confidence = 0.8;
    } else if(avgGap >= 350 && avgGap <= 380 && gapVariance < 15){
      frequency = 'Annual'; confidence = 0.75;
    }

    if(!frequency) continue;
    // Amount must be consistent (variance < 10% of average)
    if(amountVariance > avgAmount * 0.15) continue;
    // Need at least 2 observations, prefer 3+
    if(sorted.length < 2) continue;
    if(sorted.length < 3) confidence *= 0.7;

    // Predict next payment
    const lastDate = new Date(sorted[sorted.length-1].postingDate);
    const nextDate = new Date(lastDate);
    if(frequency==='Weekly') nextDate.setDate(nextDate.getDate()+7);
    else if(frequency==='Fortnightly') nextDate.setDate(nextDate.getDate()+14);
    else if(frequency==='Monthly') nextDate.setMonth(nextDate.getMonth()+1);
    else if(frequency==='Quarterly') nextDate.setMonth(nextDate.getMonth()+3);
    else if(frequency==='Annual') nextDate.setFullYear(nextDate.getFullYear()+1);

    patterns.push({
      id: 'rec_'+merchant.replace(/\W/g,'').toLowerCase()+'_'+Date.now(),
      merchant,
      category: sorted[0].category,
      typicalAmount: Math.round(avgAmount*100)/100,
      frequency,
      confidence: Math.round(confidence*100)/100,
      observations: sorted.length,
      lastPayment: sorted[sorted.length-1].postingDate,
      nextExpected: nextDate.toISOString().slice(0,10),
      transactionIds: sorted.map(t=>t.transactionId),
      status: 'detected', // detected | confirmed | ignored
    });
  }

  return patterns.sort((a,b)=>b.confidence-a.confidence || b.observations-a.observations);
}

const merchantRulesDB = {
  async getAll(){
    const snap = await db.ref('users/'+currentUser.uid+'/merchantRules').once('value');
    return snap.val() ? Object.values(snap.val()) : [];
  },
  async save(rule){
    await db.ref('users/'+currentUser.uid+'/merchantRules/'+rule.id).set(rule);
  },
  async delete(id){
    await db.ref('users/'+currentUser.uid+'/merchantRules/'+id).remove();
  },
  async applyToTransaction(rawDesc, merchant){
    // Check if user has a rule for this merchant
    const snap = await db.ref('users/'+currentUser.uid+'/merchantRules')
      .orderByChild('matchPattern').once('value');
    const val = snap.val();
    if(!val) return null;
    for(const rule of Object.values(val)){
      if(!rule.active) continue;
      if(rawDesc.toUpperCase().includes(rule.matchPattern.toUpperCase()) ||
         merchant.toLowerCase().includes(rule.matchPattern.toLowerCase())){
        return rule;
      }
    }
    return null;
  }
};

// PHASE K — HISTORICAL ANALYTICS
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
// FINANCIAL MODEL — one reconciled source of truth
//
// Accounting identity this engine guarantees:
//     ΔNetWorth = grossIncome − trueSpending
//
// Transfers between your own accounts net to zero. A credit-card payment
// converts cash into debt reduction, so it is net-worth neutral and is NOT
// spending — the card purchase it settles was already counted as spending.
// ═══════════════════════════════════════════════════════════════

// What kind of cost is each category? Drives essential vs discretionary.
const CATEGORY_KIND = {
  'Housing':'essential', 'Bills':'essential', 'Groceries':'essential',
  'Transport':'essential', 'Health':'essential', 'Education':'essential',
  'Eating out':'discretionary', 'Shopping':'discretionary',
  'Entertainment':'discretionary', 'Bars & Nights out':'discretionary',
  'Travel':'discretionary', 'Personal care':'discretionary', 'Gifts':'discretionary',
  'Subscriptions':'committed',
  'Transfer':'excluded', 'Savings':'excluded', 'Income':'excluded', 'Refund':'excluded',
  'Uncategorised':'unknown', 'Other':'unknown',
};
function categoryKind(cat){ return CATEGORY_KIND[cat] || 'unknown'; }

// Life-stage costs that ended. Counting these as current lifestyle would
// wrongly suggest today's spending is extravagant.
function lifeStageTag(t){
  const hay = ((t.normalisedMerchant||'')+' '+(t.rawDescription||'')+' '+(t.rawMemo||'')).toUpperCase();
  if(/FPG |FRESH PROPERTY|YSI\*|TY NANT|THE OLDWAY|UNITE STUDENTS|STUDENT ROOST|IQ STUDENT/.test(hay))
    return 'university_accommodation';
  if(/SLC DISBURSEMENT|STUDENT LOAN/.test(hay)) return 'student_finance';
  return null;
}

function txnMonth(t){ return (t.postingDate||t.transactionDate||'').slice(0,7); }

// The single classifier every metric derives from.
function classifyForModel(t){
  const ft  = t.financialType || 'UNKNOWN';
  const cat = t.userCategory || t.category || 'Uncategorised';
  const stage = lifeStageTag(t);

  // Money that is not income or spending — moving between your own pots
  if(ft==='SAVINGS_TRANSFER')  return {bucket: t.direction==='debit' ? 'savings_out':'savings_in', cat, stage};
  if(ft==='TRANSFER_OUT')      return {bucket:'transfer_out', cat, stage};
  if(ft==='TRANSFER_IN')       return {bucket:'transfer_in',  cat, stage};
  if(cat==='Transfer')         return {bucket: t.direction==='debit'?'transfer_out':'transfer_in', cat, stage};

  if(ft==='INCOME')  return {bucket:'income', cat, stage};
  if(ft==='REFUND')  return {bucket:'refund', cat, stage};

  if(ft==='EXPENSE'){
    return {bucket:'spending', cat, stage, kind:categoryKind(cat), onCard:t.sourceType==='credit_card'};
  }
  if(ft==='UNKNOWN_CREDIT') return {bucket:'unknown_credit', cat, stage};
  return {bucket: t.direction==='credit' ? 'unknown_credit' : 'spending',
          cat, stage, kind:categoryKind(cat)};
}

// Build the reconciled model over a set of transactions.
function buildFinancialModel(txns, opts){
  opts = opts||{};
  const excludeLifeStage = opts.excludeLifeStage || [];

  const M = {
    grossIncome:0, trueSpending:0, refunds:0,
    essential:0, discretionary:0, committed:0, unknownSpend:0,
    savingsOut:0, savingsIn:0, transferOut:0, transferIn:0,
    unknownCredit:0, cardSpending:0,
    lifeStageExcluded:0, lifeStageBreakdown:{},
    byCategory:{}, byMonth:{}, txnCount:0,
    months:new Set(),
  };

  for(const t of txns){
    const c = classifyForModel(t);
    const amt = Math.abs(t.amount||0);
    const m = txnMonth(t);
    if(m) M.months.add(m);
    M.txnCount++;

    if(c.stage){
      M.lifeStageBreakdown[c.stage] = (M.lifeStageBreakdown[c.stage]||0) + amt;
      if(excludeLifeStage.includes(c.stage)){
        M.lifeStageExcluded += amt;
        continue;   // omitted from every headline figure
      }
    }

    if(!M.byMonth[m]) M.byMonth[m] = {income:0, spending:0, savingsOut:0, essential:0, discretionary:0};

    switch(c.bucket){
      case 'income':
        M.grossIncome += amt; M.byMonth[m].income += amt; break;
      case 'refund':
        M.refunds += amt; break;                       // netted off spending below
      case 'spending': {
        M.trueSpending += amt;
        M.byMonth[m].spending += amt;
        if(c.onCard) M.cardSpending += amt;
        if(c.kind==='essential'){ M.essential += amt; M.byMonth[m].essential += amt; }
        else if(c.kind==='discretionary'){ M.discretionary += amt; M.byMonth[m].discretionary += amt; }
        else if(c.kind==='committed') M.committed += amt;
        else M.unknownSpend += amt;
        M.byCategory[c.cat] = M.byCategory[c.cat] || {total:0,count:0,kind:c.kind};
        M.byCategory[c.cat].total += amt; M.byCategory[c.cat].count++;
        break;
      }
      case 'savings_out': M.savingsOut += amt; M.byMonth[m].savingsOut += amt; break;
      case 'savings_in':  M.savingsIn  += amt; break;
      case 'transfer_out':M.transferOut += amt; break;
      case 'transfer_in': M.transferIn  += amt; break;
      case 'unknown_credit': M.unknownCredit += amt; break;
    }
  }

  // Derived figures
  M.netSpending    = Math.max(0, M.trueSpending - M.refunds);
  M.netCashFlow    = M.grossIncome - M.netSpending;
  M.netWorthChange = M.netCashFlow;                    // transfers are internal
  M.monthCount     = Math.max(1, M.months.size);
  M.monthlyIncome    = M.grossIncome / M.monthCount;
  M.monthlySpending  = M.netSpending / M.monthCount;
  M.monthlySurplus   = M.netCashFlow / M.monthCount;
  M.monthlyEssential = M.essential / M.monthCount;
  M.monthlyDiscretionary = M.discretionary / M.monthCount;

  // Two distinct rates that are routinely conflated
  M.savingsRate         = M.grossIncome>0 ? (M.netCashFlow/M.grossIncome*100) : 0;
  M.savingsTransferRate = M.grossIncome>0 ? (M.savingsOut  /M.grossIncome*100) : 0;

  // Reconciliation — surfaced, never hidden
  M.netTransfers = (M.transferIn + M.savingsIn) - (M.transferOut + M.savingsOut);
  M.reconciliation = {
    identity: 'netWorthChange = grossIncome − netSpending',
    grossIncome: M.grossIncome,
    netSpending: M.netSpending,
    computed: M.netWorthChange,
    transfersExcluded: M.transferOut + M.transferIn + M.savingsOut + M.savingsIn,
    unexplainedCredits: M.unknownCredit,
    balances: Math.abs((M.grossIncome - M.netSpending) - M.netWorthChange) < 0.01,
  };
  return M;
}

// Several baselines, because one number over three years hides life changes.
function buildBaselines(txns, opts){
  const now = opts && opts.now ? new Date(opts.now) : new Date();
  const windows = [['3m',3],['6m',6],['12m',12],['all',0]];
  const out = {};
  for(const [key,months] of windows){
    let subset = txns;
    if(months>0){
      const cut = new Date(now); cut.setMonth(cut.getMonth()-months);
      const cutStr = cut.toISOString().slice(0,10);
      subset = txns.filter(t=>(t.postingDate||'') >= cutStr);
    }
    out[key] = buildFinancialModel(subset, opts);
  }
  // Recent behaviour predicts current behaviour better than lifetime averages
  const w = [[out['3m'],0.5],[out['6m'],0.3],[out['12m'],0.2]];
  let num=0, den=0;
  for(const [m,weight] of w){ if(m && m.txnCount>5){ num += m.monthlySurplus*weight; den += weight; } }
  out.sustainableMonthlySurplus = den>0 ? num/den : (out['all']?out['all'].monthlySurplus:0);
  out.sustainablePerPaycheck    = out.sustainableMonthlySurplus * 12/26;
  return out;
}

// Goal feasibility, with the reasoning shown rather than a bare number.
function assessGoal(goal, availableForGoal, baselines, opts){
  opts = opts||{};
  const now = opts.now ? new Date(opts.now) : new Date();
  const deadline = new Date(goal.deadline);
  const daysLeft = Math.ceil((deadline - now)/86400000);
  const monthsLeft = daysLeft/30.44;
  const paychecksLeft = Math.max(0, Math.floor(daysLeft/14));
  const remaining = Math.max(0, goal.target - availableForGoal);

  const requiredPerPaycheck = paychecksLeft>0 ? remaining/paychecksLeft : remaining;
  const requiredPerMonth    = monthsLeft>0 ? remaining/monthsLeft : remaining;

  const sustainablePerPaycheck = baselines.sustainablePerPaycheck || 0;
  const sustainablePerMonth    = baselines.sustainableMonthlySurplus || 0;
  const shortfallPerPaycheck   = requiredPerPaycheck - sustainablePerPaycheck;
  const feasible = daysLeft>0 && remaining<=0 ? true
                 : (daysLeft>0 && requiredPerPaycheck <= sustainablePerPaycheck);

  const projectedAtDeadline = availableForGoal + sustainablePerPaycheck*paychecksLeft;
  const projectedShortfall  = Math.max(0, goal.target - projectedAtDeadline);

  // When could this realistically be met at the demonstrated rate?
  let monthsToTarget = null, feasibleDate = null;
  if(sustainablePerMonth > 0 && remaining > 0){
    monthsToTarget = remaining/sustainablePerMonth;
    const d = new Date(now); d.setMonth(d.getMonth()+Math.ceil(monthsToTarget));
    feasibleDate = d.toISOString().slice(0,10);
  }

  return {
    goal, target:goal.target, current:availableForGoal, remaining,
    daysLeft, monthsLeft, paychecksLeft,
    requiredPerPaycheck, requiredPerMonth,
    sustainablePerPaycheck, sustainablePerMonth,
    shortfallPerPaycheck, feasible, overdue: daysLeft<0,
    projectedAtDeadline, projectedShortfall,
    monthsToTarget, feasibleDate,
  };
}

// Concrete ways to close a gap, sized against real figures.
function goalScenarios(assessment, ctx){
  const s = [];
  const gap = assessment.projectedShortfall;
  if(gap<=0) return s;
  const {subsMonthly=0, discretionaryMonthly=0, owedToUser=0, hourlyRate=14.50} = ctx||{};
  const months = Math.max(1, assessment.monthsLeft);

  if(assessment.feasibleDate){
    s.push({type:'extend', label:'Move the deadline',
      detail:'At your demonstrated surplus this target is reachable around '+
        new Date(assessment.feasibleDate).toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'.',
      closes:gap});
  }
  s.push({type:'reduce_target', label:'Lower the target',
    detail:'A target of '+fmt(assessment.projectedAtDeadline)+' is what your current rate actually reaches by the deadline.',
    closes:gap});
  if(owedToUser>0) s.push({type:'recover_debt', label:'Collect what you are owed',
    detail:fmt(owedToUser)+' owed to you would cover '+Math.round(owedToUser/gap*100)+'% of the gap.',
    closes:Math.min(gap,owedToUser)});
  if(discretionaryMonthly>20){
    const halved = discretionaryMonthly/2*months;
    s.push({type:'cut_discretionary', label:'Halve discretionary spending',
      detail:'You spend '+fmt(discretionaryMonthly)+'/month on non-essentials; halving it frees '+fmt(halved)+' before the deadline.',
      closes:Math.min(gap,halved)});
  }
  if(subsMonthly>10){
    const saved = subsMonthly*months;
    s.push({type:'cut_subs', label:'Cancel subscriptions',
      detail:'Subscriptions cost '+fmt(subsMonthly)+'/month, or '+fmt(saved)+' before the deadline.',
      closes:Math.min(gap,saved)});
  }
  if(hourlyRate>0){
    const hrs = gap/hourlyRate;
    s.push({type:'earn_more', label:'Work extra hours',
      detail:Math.ceil(hrs)+' extra hours at '+fmt(hourlyRate)+'/hr closes the gap — about '+
        (hrs/Math.max(1,months*4.33)).toFixed(1)+' hours a week.',
      closes:gap});
  }
  return s.sort((a,b)=>b.closes-a.closes);
}

// Why does it feel tight? Rank the causes rather than listing symptoms.
function diagnose(model, baselines, ctx){
  ctx = ctx||{};
  const causes = [];
  const inc = model.monthlyIncome || 0;
  const push = (id,severity,title,detail,evidence)=>causes.push({id,severity,title,detail,evidence});

  if(ctx.goalRequiredPerMonth > 0 && inc > 0){
    const ratio = ctx.goalRequiredPerMonth / Math.max(baselines.sustainableMonthlySurplus, 1);
    if(ratio > 1.2) push('aggressive_goals', ratio>2?'high':'medium',
      'Your goals are outrunning your cash flow',
      'Your targets need '+fmt(ctx.goalRequiredPerMonth)+'/month but your demonstrated surplus is '+
      fmt(baselines.sustainableMonthlySurplus)+'/month.',
      'This is a target problem, not a spending problem.');
  }
  if(ctx.cardOwed > 0 && inc > 0 && ctx.cardOwed > inc*0.25)
    push('debt','high','Credit card debt is consuming cash flow',
      fmt(ctx.cardOwed)+' owed is '+Math.round(ctx.cardOwed/inc*100)+'% of a month\'s income.',
      'Clearing it releases that money every cycle.');
  if(model.monthlyDiscretionary > inc*0.35 && inc>0)
    push('discretionary','medium','Discretionary spending is high',
      fmt(model.monthlyDiscretionary)+'/month is '+Math.round(model.monthlyDiscretionary/inc*100)+'% of income.',null);
  if(ctx.subsMonthly > 0 && inc>0 && ctx.subsMonthly > inc*0.08)
    push('subscription_creep','medium','Subscriptions are a large fixed cost',
      fmt(ctx.subsMonthly)+'/month ('+fmt(ctx.subsMonthly*12)+'/year) is '+
      Math.round(ctx.subsMonthly/inc*100)+'% of income.',null);
  if(model.monthlyEssential > inc*0.6 && inc>0)
    push('fixed_costs','high','Essential costs leave little room',
      fmt(model.monthlyEssential)+'/month on essentials is '+Math.round(model.monthlyEssential/inc*100)+'% of income.',null);
  if(model.netCashFlow < 0)
    push('overspending','high','You are spending more than you earn',
      'Over this period you spent '+fmt(Math.abs(model.netCashFlow))+' more than came in.',null);
  if(ctx.owedToUser > 0 && inc>0 && ctx.owedToUser > inc*0.3)
    push('money_owed','medium','Money owed to you is tying up cash',
      fmt(ctx.owedToUser)+' is roughly '+(ctx.owedToUser/Math.max(inc,1)).toFixed(1)+' months of income.',null);
  if(ctx.availableCash!=null && ctx.committedSoon>0 && ctx.availableCash < ctx.committedSoon)
    push('timing','high','Timing, not shortage',
      'You hold '+fmt(ctx.availableCash)+' but '+fmt(ctx.committedSoon)+' is committed before payday.',
      'Your savings could cover it — the money is in the wrong pot.');

  const order = {high:0, medium:1, low:2};
  causes.sort((a,b)=>order[a.severity]-order[b.severity]);

  // The verdict: is this person a poor saver, or just over-committed?
  let verdict;
  if(model.savingsRate >= 20 && causes.some(c=>c.id==='aggressive_goals'))
    verdict = 'You are not a poor saver — you save '+Math.round(model.savingsRate)+
      '% of income. Your goals are simply demanding more than your income comfortably supports right now.';
  else if(model.netCashFlow < 0)
    verdict = 'You are spending more than you earn over this period, so the gap is genuine rather than a matter of timing.';
  else if(causes.some(c=>c.id==='timing'))
    verdict = 'You have the money, just not in the account that needs it before payday.';
  else if(model.savingsRate >= 20)
    verdict = 'Your finances are fundamentally sound — you save '+Math.round(model.savingsRate)+'% of what you earn.';
  else
    verdict = 'Your surplus is thin, so small changes in spending have an outsized effect.';

  return {causes, verdict, primaryCause: causes[0]||null};
}

async function buildAnalytics(periodMonths, opts){
  opts = opts||{};
  const now = new Date();
  const cutoff = new Date(now);
  if(periodMonths > 0) cutoff.setMonth(cutoff.getMonth() - periodMonths);
  const cutoffStr = cutoff.toISOString().slice(0,10);

  const snap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
  const all = Object.values(snap.val() || {});
  const txns = all.filter(t => periodMonths === 0 || (t.postingDate||'') >= cutoffStr);

  const model = buildFinancialModel(txns, opts);
  const baselines = buildBaselines(all, opts);

  const byMerchant = {};
  for(const t of txns){
    if(classifyForModel(t).bucket !== 'spending') continue;
    const m = t.normalisedMerchant || t.rawDescription || 'Unknown';
    if(!byMerchant[m]) byMerchant[m] = {total:0,count:0};
    byMerchant[m].total += Math.abs(t.amount||0); byMerchant[m].count++;
  }

  return {
    model, baselines,
    totalIncome: model.grossIncome,
    totalExpenses: model.netSpending,
    totalSavings: model.savingsOut,
    netIncome: model.netCashFlow,
    savingsRate: model.savingsRate,
    savingsTransferRate: model.savingsTransferRate,
    avgMonthlyIncome: model.monthlyIncome,
    avgMonthlyExpenses: model.monthlySpending,
    txnCount: model.txnCount,
    incomeCount: txns.filter(t=>classifyForModel(t).bucket==='income').length,
    expenseCount: txns.filter(t=>classifyForModel(t).bucket==='spending').length,
    byCategory: Object.entries(model.byCategory)
      .sort((a,b)=>b[1].total-a[1].total).slice(0,10),
    byMerchant: Object.entries(byMerchant).sort((a,b)=>b[1].total-a[1].total).slice(0,10),
    monthly: Object.entries(model.byMonth).sort((a,b)=>a[0].localeCompare(b[0])),
    hasTxnData: txns.length > 0,
  };
}

    // Averages
    resultsWrap.append(
      el('div',{class:'section-hdr'},'Averages'),
      el('div',{class:'card'},

          el('div',{class:'balance-value',style:{color:'var(--green)'}},fmt(a.avgMonthlyIncome))
        ),
        el('div',{class:'balance-row',style:{border:'none'}},
          el('div',{class:'balance-label'},'Avg monthly spending'),
          el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(a.avgMonthlyExpenses))
        )
      )
    );
  }

  // Period selector
  const periodBar = el('div',{style:{display:'flex',gap:'6px',marginBottom:'12px',flexWrap:'wrap'}});
  const periods = [[1,'1M'],[3,'3M'],[6,'6M'],[12,'12M'],[0,'All']];
  for(const [months,label] of periods){
    const btn = el('button',{style:{
      background:period===months?'var(--green)':'var(--surface2)',
      color:period===months?'#000':'var(--text2)',
      border:'none',borderRadius:'100px',padding:'6px 14px',fontSize:'12px',fontWeight:'600'
    }},label);
    btn.addEventListener('click',()=>{
      period=months;
      periodBar.querySelectorAll('button').forEach((b,i)=>{
        b.style.background=periods[i][0]===months?'var(--green)':'var(--surface2)';
        b.style.color=periods[i][0]===months?'#000':'var(--text2)';
      });
      render();
    });
    periodBar.append(btn);
  }

  content.append(periodBar, resultsWrap);
  render();
  return content;
}
