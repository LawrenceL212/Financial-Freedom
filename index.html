/* ------------------------------ engine (same math as your sheet) ------------------------------ */
const DEFAULT_SETTINGS = {
  currencySymbol: "£", tripName: "Florasii Fund", tripGoal: 15179,
  spendingPct: 0.20, ccApr: 0.2461,
  motherLabel: "Personal Debt", motherPct: 0.20, motherLeftoverShare: 0.30,
  tripPct: 0.10, tripLeftoverShare: 0.80,
  initialSpending: 629.02, initialCC: 1187.59, initialMother: 1917,
  initialTrip: 1973.24, initialSavings: 0.51,
};
const DEFAULT_FIXED_COSTS = [
  { id: "c1", name: "Transport", amount: 20, cadence: "Monthly", note: "" },
  { id: "c2", name: "Crunchyroll", amount: 5.99, cadence: "Monthly", note: "25th" },
  { id: "c3", name: "iCloud+", amount: 8.99, cadence: "Monthly", note: "13th" },
  { id: "c4", name: "Spotify", amount: 5.99, cadence: "Monthly", note: "17th" },
];
const DEFAULT_OTHER_DEBT = { name: "Phone Unlock", original: 1800, paid: 300 };

let CURRENCY = "£";
const fmt = (n) => (n < 0 ? `-${CURRENCY}` : CURRENCY) + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtShort = (n) => CURRENCY + Math.round(n).toLocaleString();
const uid = () => Math.random().toString(36).slice(2, 10);

function computeSeries(entries, s) {
  const sorted = [...entries].sort((a, b) => new Date(a.date) - new Date(b.date));
  let spending = s.initialSpending, cc = s.initialCC, mother = s.initialMother, trip = s.initialTrip, savings = s.initialSavings;
  const rows = [];
  for (const e of sorted) {
    const income = Number(e.income) || 0, expenses = Number(e.expenses) || 0;
    const spendAdd = income * s.spendingPct;
    spending = spending + spendAdd - expenses;
    const ccGrown = cc * (1 + (s.ccApr / 365) * 14);
    const ccPayment = Math.max(0, Math.min(ccGrown, income * 0.5));
    const newCC = Math.max(ccGrown - ccPayment, 0);
    const leftover = income * 0.5 - ccPayment;
    const motherShare = income * s.motherPct + leftover * s.motherLeftoverShare;
    let motherPayment = 0, redirectToTrip = 0;
    if (mother > 0) motherPayment = Math.min(mother, motherShare);
    else redirectToTrip = motherShare;
    const newMother = Math.max(mother - motherPayment, 0);
    const tripAdd = income * s.tripPct + leftover * s.tripLeftoverShare + redirectToTrip;
    trip = trip + tripAdd;
    savings = savings + (Number(e.savings) || 0);
    cc = newCC; mother = newMother;
    rows.push({ ...e, income, expenses, spendAdd, spending, ccPayment, cc, motherPayment, mother, tripAdd, trip, savings, pctToGoal: s.tripGoal > 0 ? trip / s.tripGoal : 0 });
  }
  return rows;
}

/* ---------------------------------- small pieces ---------------------------------- */
function StatCard({ icon: Icn, label, value, tone = "ink", sub }) {
  const toneMap = { ink: "text-[#24261F]", moss: "text-[#3E5B44]", rust: "text-[#93463A]", gold: "text-[#96751A]" };
  return (
    <div className="rounded-2xl border border-[#E4DEC9] bg-white/70 px-4 py-3 flex flex-col gap-1 min-w-0">
      <div className="flex items-center gap-1.5 text-[#6B6552] text-[11px] uppercase tracking-wider font-medium">
        <Icn size={13} /><span className="truncate">{label}</span>
      </div>
      <div className={`font-mono text-lg font-semibold ${toneMap[tone]} truncate`}>{value}</div>
      {sub && <div className="text-[11px] text-[#8A836C] -mt-0.5">{sub}</div>}
    </div>
  );
}

function FreedomMeter({ debtTotal, debtStart, saved, goal }) {
  const debtPct = debtStart > 0 ? Math.max(0, Math.min(1, debtTotal / debtStart)) : 0;
  const savePct = goal > 0 ? Math.max(0, Math.min(1, saved / goal)) : 0;
  return (
    <div className="w-full">
      <div className="flex justify-between text-[11px] uppercase tracking-wider text-[#6B6552] mb-1.5 font-medium">
        <span>Debt remaining</span><span>Trip fund</span>
      </div>
      <div className="relative h-3 rounded-full bg-[#EDE7D6] overflow-hidden">
        <div className="absolute left-0 top-0 h-full bg-gradient-to-r from-[#93463A] to-[#B5695D] rounded-r-full transition-all duration-700" style={{ width: `${debtPct * 50}%` }} />
        <div className="absolute right-0 top-0 h-full bg-gradient-to-l from-[#3E5B44] to-[#6E8F6F] rounded-l-full transition-all duration-700" style={{ width: `${savePct * 50}%` }} />
        <div className="absolute left-1/2 top-0 h-full w-[2px] bg-[#24261F]/20 -translate-x-1/2" />
      </div>
      <div className="flex justify-between text-[12px] font-mono mt-1 text-[#4A473C]">
        <span>{fmtShort(debtTotal)}</span><span>{fmtShort(saved)} / {fmtShort(goal)}</span>
      </div>
    </div>
  );
}

function GoalDial({ pct, label }) {
  const clamped = Math.max(0, Math.min(1, pct));
  const r = 42, c = 2 * Math.PI * r;
  return (
    <div className="relative w-28 h-28 shrink-0">
      <svg viewBox="0 0 100 100" className="w-28 h-28 -rotate-90">
        <circle cx="50" cy="50" r={r} fill="none" stroke="#EDE7D6" strokeWidth="9" />
        <circle cx="50" cy="50" r={r} fill="none" stroke="#96751A" strokeWidth="9" strokeDasharray={c} strokeDashoffset={c * (1 - clamped)} strokeLinecap="round" className="transition-all duration-700" />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className="font-mono text-xl font-bold text-[#24261F]">{Math.round(clamped * 100)}%</span>
        <span className="text-[10px] text-[#8A836C] uppercase tracking-wide">{label}</span>
      </div>
    </div>
  );
}

/* ---------------------------------- screens ---------------------------------- */
function Dashboard({ rows, settings, otherDebt }) {
  const latest = rows[rows.length - 1];
  const spending = latest ? latest.spending : settings.initialSpending;
  const cc = latest ? latest.cc : settings.initialCC;
  const mother = latest ? latest.mother : settings.initialMother;
  const trip = latest ? latest.trip : settings.initialTrip;
  const savings = latest ? latest.savings : settings.initialSavings;
  const otherRemainder = Math.max(0, otherDebt.original - otherDebt.paid);
  const totalDebt = cc + mother + otherRemainder;
  const startDebt = settings.initialCC + settings.initialMother + Math.max(0, otherDebt.original);

  return (
    <div className="space-y-5 pb-4">
      <div className="rounded-3xl bg-gradient-to-br from-[#F7F4EB] to-[#EDE7D6] border border-[#E4DEC9] p-5 flex items-center gap-4">
        <GoalDial pct={latest ? latest.pctToGoal : trip / settings.tripGoal} label="to goal" />
        <div className="flex-1 min-w-0">
          <div className="text-[11px] uppercase tracking-wider text-[#8A836C] font-medium">{settings.tripName}</div>
          <div className="font-mono text-2xl font-bold text-[#24261F] truncate">{fmt(trip)}</div>
          <div className="text-[12px] text-[#6B6552]">of {fmtShort(settings.tripGoal)} goal</div>
        </div>
      </div>
      <div className="rounded-2xl border border-[#E4DEC9] bg-white/60 p-4">
        <FreedomMeter debtTotal={totalDebt} debtStart={startDebt} saved={trip + savings} goal={settings.tripGoal} />
      </div>
      <div className="grid grid-cols-2 gap-3">
        <StatCard icon={IWallet} label="Spending account" value={fmt(spending)} tone="ink" />
        <StatCard icon={IPiggy} label="Savings" value={fmt(savings)} tone="moss" />
        <StatCard icon={ICard} label="Credit card" value={fmt(cc)} tone="rust" sub={`${(settings.ccApr * 100).toFixed(2)}% APR`} />
        <StatCard icon={IUsers} label={settings.motherLabel} value={fmt(mother)} tone="rust" />
      </div>
      {!latest && (
        <div className="rounded-2xl border border-dashed border-[#C9C2A6] p-4 text-center text-[#6B6552] text-sm">
          No paychecks logged yet. Add your first entry in the <b>Add</b> tab.
        </div>
      )}
      {latest && (
        <div className="rounded-2xl border border-[#E4DEC9] bg-white/60 p-4">
          <div className="text-[11px] uppercase tracking-wider text-[#8A836C] font-medium mb-2">Last paycheck split</div>
          <div className="text-sm text-[#3D3A2D] space-y-1 font-mono">
            <div className="flex justify-between"><span>Income</span><span>{fmt(latest.income)}</span></div>
            <div className="flex justify-between"><span>→ Spending</span><span>{fmt(latest.spendAdd)}</span></div>
            <div className="flex justify-between"><span>→ Credit card</span><span>{fmt(latest.ccPayment)}</span></div>
            <div className="flex justify-between"><span>→ {settings.motherLabel}</span><span>{fmt(latest.motherPayment)}</span></div>
            <div className="flex justify-between"><span>→ {settings.tripName}</span><span>{fmt(latest.tripAdd)}</span></div>
          </div>
        </div>
      )}
    </div>
  );
}

function AddEntry({ onAdd, settings }) {
  const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [source, setSource] = useState("");
  const [income, setIncome] = useState("");
  const [expenses, setExpenses] = useState("");
  const [savings, setSavings] = useState("");
  const [notes, setNotes] = useState("");
  const [lastPreview, setLastPreview] = useState(null);

  const preview = useMemo(() => {
    const inc = Number(income) || 0;
    if (!inc) return null;
    return computeSeries([{ date, income: inc, expenses: Number(expenses) || 0, savings: Number(savings) || 0 }], settings)[0];
  }, [income, expenses, savings, date, settings]);

  function submit(e) {
    e.preventDefault();
    if (!income) return;
    const entry = { id: uid(), date, source: source.trim() || "Paycheck", income: Number(income) || 0, expenses: Number(expenses) || 0, savings: Number(savings) || 0, notes: notes.trim() };
    onAdd(entry);
    setLastPreview({ ...preview, source: entry.source });
    setSource(""); setIncome(""); setExpenses(""); setSavings(""); setNotes("");
  }

  const field = "w-full rounded-xl border border-[#E4DEC9] bg-white/80 px-3 py-2.5 text-[15px] text-[#24261F] outline-none focus:border-[#96751A] focus:ring-2 focus:ring-[#96751A]/20 transition";

  return (
    <div className="space-y-5 pb-4">
      <form onSubmit={submit} className="rounded-2xl border border-[#E4DEC9] bg-white/70 p-4 space-y-3">
        <div className="text-[11px] uppercase tracking-wider text-[#8A836C] font-medium">New paycheck</div>
        <div className="grid grid-cols-2 gap-3">
          <label className="text-xs text-[#6B6552] space-y-1"><span>Date</span>
            <input type="date" className={field} value={date} onChange={(e) => setDate(e.target.value)} /></label>
          <label className="text-xs text-[#6B6552] space-y-1"><span>Source</span>
            <input className={field} placeholder="Employer" value={source} onChange={(e) => setSource(e.target.value)} /></label>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <label className="text-xs text-[#6B6552] space-y-1"><span>Income</span>
            <input inputMode="decimal" className={field} placeholder="0.00" value={income} onChange={(e) => setIncome(e.target.value)} /></label>
          <label className="text-xs text-[#6B6552] space-y-1"><span>Expenses this period</span>
            <input inputMode="decimal" className={field} placeholder="0.00" value={expenses} onChange={(e) => setExpenses(e.target.value)} /></label>
        </div>
        <label className="text-xs text-[#6B6552] space-y-1 block"><span>Extra to savings (optional)</span>
          <input inputMode="decimal" className={field} placeholder="0.00" value={savings} onChange={(e) => setSavings(e.target.value)} /></label>
        <label className="text-xs text-[#6B6552] space-y-1 block"><span>Notes</span>
          <input className={field} placeholder="What this covered" value={notes} onChange={(e) => setNotes(e.target.value)} /></label>
        {preview && (
          <div className="rounded-xl bg-[#F7F4EB] border border-[#E4DEC9] p-3 text-sm font-mono space-y-1">
            <div className="flex justify-between text-[#3D3A2D]"><span>Spending</span><span>+{fmt(preview.spendAdd)}</span></div>
            <div className="flex justify-between text-[#93463A]"><span>Credit card</span><span>-{fmt(preview.ccPayment)}</span></div>
            <div className="flex justify-between text-[#93463A]"><span>{settings.motherLabel}</span><span>-{fmt(preview.motherPayment)}</span></div>
            <div className="flex justify-between text-[#3E5B44]"><span>{settings.tripName}</span><span>+{fmt(preview.tripAdd)}</span></div>
          </div>
        )}
        <button type="submit" className="w-full rounded-xl bg-[#24261F] text-[#F7F4EB] font-medium py-3 flex items-center justify-center gap-2 active:scale-[0.98] transition">
          <IPlus size={16} /> Log paycheck
        </button>
      </form>
      {lastPreview && (
        <div className="text-center text-[13px] text-[#6B6552]">Logged {lastPreview.source} — split across spending, debt, and {settings.tripName.toLowerCase()}.</div>
      )}
    </div>
  );
}

function History({ rows, onDelete }) {
  const [openId, setOpenId] = useState(null);
  const ordered = [...rows].reverse();
  if (!ordered.length) {
    return <div className="rounded-2xl border border-dashed border-[#C9C2A6] p-6 text-center text-[#6B6552] text-sm">Your ledger is empty. Paychecks you log will appear here, newest first.</div>;
  }
  return (
    <div className="space-y-2.5 pb-4">
      {ordered.map((r) => {
        const open = openId === r.id;
        return (
          <div key={r.id} className="rounded-2xl border border-[#E4DEC9] bg-white/70 overflow-hidden">
            <button className="w-full flex items-center justify-between px-4 py-3 text-left" onClick={() => setOpenId(open ? null : r.id)}>
              <div className="min-w-0">
                <div className="text-sm font-medium text-[#24261F] truncate">{r.source}</div>
                <div className="text-[11px] text-[#8A836C]">{new Date(r.date).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <span className="font-mono text-sm text-[#24261F]">{fmt(r.income)}</span>
                {open ? <IChevU size={16} className="text-[#8A836C]" /> : <IChevD size={16} className="text-[#8A836C]" />}
              </div>
            </button>
            {open && (
              <div className="px-4 pb-4 space-y-2 border-t border-[#EDE7D6] pt-3">
                <div className="text-sm font-mono space-y-1 text-[#3D3A2D]">
                  <div className="flex justify-between"><span>Expenses logged</span><span>{fmt(r.expenses)}</span></div>
                  <div className="flex justify-between"><span>→ Spending</span><span>+{fmt(r.spendAdd)}</span></div>
                  <div className="flex justify-between"><span>→ Credit card</span><span>-{fmt(r.ccPayment)}</span></div>
                  <div className="flex justify-between"><span>→ Personal debt</span><span>-{fmt(r.motherPayment)}</span></div>
                  <div className="flex justify-between"><span>→ Trip fund</span><span>+{fmt(r.tripAdd)}</span></div>
                </div>
                {r.notes && <div className="text-[13px] text-[#6B6552] italic">"{r.notes}"</div>}
                <button onClick={() => onDelete(r.id)} className="flex items-center gap-1.5 text-[#93463A] text-[13px] font-medium mt-1"><ITrash size={14} /> Delete entry</button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function DebtsAndCosts({ fixedCosts, setFixedCosts, otherDebt, setOtherDebt }) {
  const [name, setName] = useState(""); const [amount, setAmount] = useState(""); const [cadence, setCadence] = useState("Monthly");
  const monthlyTotal = fixedCosts.reduce((sum, c) => sum + c.amount * (c.cadence === "Weekly" ? 4.33 : c.cadence === "Two months" ? 0.5 : 1), 0);
  function addCost(e) {
    e.preventDefault();
    if (!name.trim() || !amount) return;
    setFixedCosts([...fixedCosts, { id: uid(), name: name.trim(), amount: Number(amount), cadence, note: "" }]);
    setName(""); setAmount("");
  }
  const remainder = Math.max(0, otherDebt.original - otherDebt.paid);
  const pctPaid = otherDebt.original > 0 ? Math.min(1, otherDebt.paid / otherDebt.original) : 0;
  const field = "rounded-xl border border-[#E4DEC9] bg-white/80 px-3 py-2 text-[14px] text-[#24261F] outline-none focus:border-[#96751A]";
  return (
    <div className="space-y-5 pb-4">
      <div className="rounded-2xl border border-[#E4DEC9] bg-white/70 p-4 space-y-3">
        <div className="flex items-center gap-1.5 text-[11px] uppercase tracking-wider text-[#8A836C] font-medium"><ILandmark size={13} /> {otherDebt.name}</div>
        <div className="h-2.5 rounded-full bg-[#EDE7D6] overflow-hidden">
          <div className="h-full bg-gradient-to-r from-[#6E8F6F] to-[#3E5B44] rounded-full transition-all" style={{ width: `${pctPaid * 100}%` }} />
        </div>
        <div className="flex justify-between font-mono text-sm text-[#3D3A2D]"><span>{fmt(otherDebt.paid)} paid</span><span>{fmt(remainder)} left</span></div>
        <div className="grid grid-cols-2 gap-2">
          <input type="number" inputMode="decimal" className={field} placeholder="Original amount" value={otherDebt.original} onChange={(e) => setOtherDebt({ ...otherDebt, original: Number(e.target.value) || 0 })} />
          <input type="number" inputMode="decimal" className={field} placeholder="Paid so far" value={otherDebt.paid} onChange={(e) => setOtherDebt({ ...otherDebt, paid: Number(e.target.value) || 0 })} />
        </div>
      </div>
      <div className="rounded-2xl border border-[#E4DEC9] bg-white/70 p-4 space-y-3">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-1.5 text-[11px] uppercase tracking-wider text-[#8A836C] font-medium"><IReceipt size={13} /> Fixed costs</div>
          <span className="font-mono text-sm text-[#24261F]">{fmt(monthlyTotal)}/mo</span>
        </div>
        <div className="divide-y divide-[#EDE7D6]">
          {fixedCosts.map((c) => (
            <div key={c.id} className="flex items-center justify-between py-2 text-sm">
              <div><div className="text-[#24261F]">{c.name}</div><div className="text-[11px] text-[#8A836C]">{c.cadence}{c.note ? ` · ${c.note}` : ""}</div></div>
              <div className="flex items-center gap-2">
                <span className="font-mono text-[#24261F]">{fmt(c.amount)}</span>
                <button onClick={() => setFixedCosts(fixedCosts.filter((x) => x.id !== c.id))}><ITrash size={14} className="text-[#B5695D]" /></button>
              </div>
            </div>
          ))}
          {!fixedCosts.length && <div className="py-3 text-sm text-[#8A836C]">No fixed costs added yet.</div>}
        </div>
        <form onSubmit={addCost} className="flex flex-wrap gap-2 pt-1">
          <input className={`${field} flex-1 min-w-[110px]`} placeholder="Name" value={name} onChange={(e) => setName(e.target.value)} />
          <input className={`${field} w-24`} placeholder="Amount" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)} />
          <select className={field} value={cadence} onChange={(e) => setCadence(e.target.value)}><option>Weekly</option><option>Monthly</option><option>Two months</option></select>
          <button className="rounded-xl bg-[#24261F] text-[#F7F4EB] px-3 flex items-center gap-1 text-sm font-medium"><IPlus size={14} /> Add</button>
        </form>
      </div>
    </div>
  );
}

function SettingsPane({ settings, setSettings, onSignOut }) {
  const [local, setLocal] = useState(settings);
  useEffect(() => setLocal(settings), [settings]);
  const num = (v) => (v === "" ? "" : Number(v));
  const field = "w-full rounded-xl border border-[#E4DEC9] bg-white/80 px-3 py-2 text-[14px] text-[#24261F] outline-none focus:border-[#96751A]";
  const row = "grid grid-cols-2 gap-3 items-center";
  const lbl = "text-[13px] text-[#4A473C]";
  function save() {
    setSettings({
      ...local,
      tripGoal: Number(local.tripGoal) || 0, spendingPct: Number(local.spendingPct) || 0, ccApr: Number(local.ccApr) || 0,
      motherPct: Number(local.motherPct) || 0, motherLeftoverShare: Number(local.motherLeftoverShare) || 0,
      tripPct: Number(local.tripPct) || 0, tripLeftoverShare: Number(local.tripLeftoverShare) || 0,
      initialSpending: Number(local.initialSpending) || 0, initialCC: Number(local.initialCC) || 0,
      initialMother: Number(local.initialMother) || 0, initialTrip: Number(local.initialTrip) || 0,
      initialSavings: Number(local.initialSavings) || 0,
    });
  }
  return (
    <div className="space-y-5 pb-4">
      <div className="rounded-2xl border border-[#E4DEC9] bg-white/70 p-4 space-y-3">
        <div className="text-[11px] uppercase tracking-wider text-[#8A836C] font-medium">Currency</div>
        <div className={row}><span className={lbl}>Symbol</span><input className={field} value={local.currencySymbol} onChange={(e) => setLocal({ ...local, currencySymbol: e.target.value })} maxLength={2} /></div>
      </div>
      <div className="rounded-2xl border border-[#E4DEC9] bg-white/70 p-4 space-y-3">
        <div className="text-[11px] uppercase tracking-wider text-[#8A836C] font-medium">Trip fund</div>
        <div className={row}><span className={lbl}>Fund name</span><input className={field} value={local.tripName} onChange={(e) => setLocal({ ...local, tripName: e.target.value })} /></div>
        <div className={row}><span className={lbl}>Goal amount</span><input className={field} inputMode="decimal" value={local.tripGoal} onChange={(e) => setLocal({ ...local, tripGoal: num(e.target.value) })} /></div>
      </div>
      <div className="rounded-2xl border border-[#E4DEC9] bg-white/70 p-4 space-y-3">
        <div className="text-[11px] uppercase tracking-wider text-[#8A836C] font-medium">How each paycheck splits</div>
        <div className={row}><span className={lbl}>% to spending account</span><input className={field} inputMode="decimal" value={local.spendingPct} onChange={(e) => setLocal({ ...local, spendingPct: num(e.target.value) })} /></div>
        <div className={row}><span className={lbl}>Credit card APR</span><input className={field} inputMode="decimal" value={local.ccApr} onChange={(e) => setLocal({ ...local, ccApr: num(e.target.value) })} /></div>
        <div className={row}><span className={lbl}>{local.motherLabel} label</span><input className={field} value={local.motherLabel} onChange={(e) => setLocal({ ...local, motherLabel: e.target.value })} /></div>
        <div className={row}><span className={lbl}>% of income to it</span><input className={field} inputMode="decimal" value={local.motherPct} onChange={(e) => setLocal({ ...local, motherPct: num(e.target.value) })} /></div>
        <div className={row}><span className={lbl}>Its share of leftover</span><input className={field} inputMode="decimal" value={local.motherLeftoverShare} onChange={(e) => setLocal({ ...local, motherLeftoverShare: num(e.target.value) })} /></div>
        <div className={row}><span className={lbl}>% of income to trip fund</span><input className={field} inputMode="decimal" value={local.tripPct} onChange={(e) => setLocal({ ...local, tripPct: num(e.target.value) })} /></div>
        <div className={row}><span className={lbl}>Its share of leftover</span><input className={field} inputMode="decimal" value={local.tripLeftoverShare} onChange={(e) => setLocal({ ...local, tripLeftoverShare: num(e.target.value) })} /></div>
        <p className="text-[11px] text-[#8A836C] leading-relaxed">Leftover = half of income minus that period's credit card payment. Once {local.motherLabel.toLowerCase()} hits 0, its share redirects to the trip fund automatically.</p>
      </div>
      <div className="rounded-2xl border border-[#E4DEC9] bg-white/70 p-4 space-y-3">
        <div className="text-[11px] uppercase tracking-wider text-[#8A836C] font-medium">Starting balances</div>
        <p className="text-[11px] text-[#8A836C] leading-relaxed -mt-1">Update these whenever your real balances change, e.g. after checking your banking app.</p>
        <div className={row}><span className={lbl}>Spending account</span><input className={field} inputMode="decimal" value={local.initialSpending} onChange={(e) => setLocal({ ...local, initialSpending: num(e.target.value) })} /></div>
        <div className={row}><span className={lbl}>Credit card debt</span><input className={field} inputMode="decimal" value={local.initialCC} onChange={(e) => setLocal({ ...local, initialCC: num(e.target.value) })} /></div>
        <div className={row}><span className={lbl}>{local.motherLabel}</span><input className={field} inputMode="decimal" value={local.initialMother} onChange={(e) => setLocal({ ...local, initialMother: num(e.target.value) })} /></div>
        <div className={row}><span className={lbl}>Trip fund</span><input className={field} inputMode="decimal" value={local.initialTrip} onChange={(e) => setLocal({ ...local, initialTrip: num(e.target.value) })} /></div>
        <div className={row}><span className={lbl}>Savings</span><input className={field} inputMode="decimal" value={local.initialSavings} onChange={(e) => setLocal({ ...local, initialSavings: num(e.target.value) })} /></div>
      </div>
      <button onClick={save} className="w-full rounded-xl bg-[#24261F] text-[#F7F4EB] font-medium py-3 active:scale-[0.98] transition">Save settings</button>
      <button onClick={onSignOut} className="w-full rounded-xl border border-[#E4DEC9] text-[#6B6552] font-medium py-3">Sign out</button>
    </div>
  );
}

/* ------------------------------------- Auth gate ------------------------------------- */
function AuthGate({ onReady }) {
  const [mode, setMode] = useState("signin"); // signin | signup
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const field = "w-full rounded-xl border border-[#E4DEC9] bg-white/80 px-3 py-2.5 text-[15px] text-[#24261F] outline-none focus:border-[#96751A]";

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setError("");
    try {
      if (mode === "signin") {
        await auth.signInWithEmailAndPassword(email, password);
      } else {
        await auth.createUserWithEmailAndPassword(email, password);
      }
      onReady();
    } catch (err) {
      setError(err.message);
    }
    setBusy(false);
  }

  return (
    <div className="min-h-screen bg-[#FAF8F1] flex items-center justify-center px-6">
      <form onSubmit={submit} className="w-full max-w-sm space-y-4">
        <div className="text-center mb-2">
          <div className="font-display text-2xl font-semibold text-[#24261F]">Financial Freedom</div>
          <div className="text-[13px] text-[#8A836C]">{mode === "signin" ? "Sign in to your private ledger" : "Create your account"}</div>
        </div>
        <input type="email" required className={field} placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} />
        <input type="password" required minLength={6} className={field} placeholder="Password (6+ characters)" value={password} onChange={(e) => setPassword(e.target.value)} />
        {error && <div className="text-[13px] text-[#93463A]">{error}</div>}
        <button disabled={busy} type="submit" className="w-full rounded-xl bg-[#24261F] text-[#F7F4EB] font-medium py-3 active:scale-[0.98] transition disabled:opacity-60">
          {busy ? "Please wait…" : mode === "signin" ? "Sign in" : "Sign up"}
        </button>
        <button type="button" onClick={() => setMode(mode === "signin" ? "signup" : "signin")} className="w-full text-center text-[13px] text-[#6B6552]">
          {mode === "signin" ? "No account yet? Sign up" : "Already have an account? Sign in"}
        </button>
      </form>
    </div>
  );
}

/* ------------------------------------- App ------------------------------------- */
function App() {
  const [session, setSession] = useState(undefined); // undefined = checking, null = signed out
  const [entries, setEntries] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  CURRENCY = settings.currencySymbol || "£";
  const [fixedCosts, setFixedCosts] = useState(DEFAULT_FIXED_COSTS);
  const [otherDebt, setOtherDebt] = useState(DEFAULT_OTHER_DEBT);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [saveError, setSaveError] = useState(false);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((user) => setSession(user));
    return unsub;
  }, []);

  useEffect(() => {
    if (!session) return;
    (async () => {
      try {
        const snap = await db.ref(`users/${session.uid}`).once("value");
        const d = snap.val();
        if (d) {
          if (d.entries) setEntries(d.entries);
          if (d.settings) setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
          if (d.fixedCosts) setFixedCosts(d.fixedCosts);
          if (d.otherDebt) setOtherDebt(d.otherDebt);
        }
      } catch (err) {
        // no saved data yet, or a permissions/config issue — defaults stand
      } finally {
        setLoaded(true);
      }
    })();
  }, [session]);

  const persist = useCallback(async (next) => {
    if (!session) return;
    try {
      await db.ref(`users/${session.uid}`).set(next);
      setSaveError(false);
    } catch (err) {
      setSaveError(true);
    }
  }, [session]);

  useEffect(() => {
    if (!loaded) return;
    persist({ entries, settings, fixedCosts, otherDebt });
  }, [loaded, entries, settings, fixedCosts, otherDebt, persist]);

  const rows = useMemo(() => computeSeries(entries, settings), [entries, settings]);

  if (session === undefined) {
    return <div className="min-h-screen bg-[#FAF8F1] flex items-center justify-center text-[#8A836C] text-sm">Loading…</div>;
  }
  if (!session) {
    return <AuthGate onReady={() => {}} />;
  }

  function addEntry(entry) { setEntries((prev) => [...prev, entry]); }
  function deleteEntry(id) { setEntries((prev) => prev.filter((e) => e.id !== id)); }
  function signOut() { auth.signOut(); setLoaded(false); }

  const tabs = [
    { id: "dashboard", label: "Overview", icon: ICompass },
    { id: "add", label: "Add", icon: IPlus },
    { id: "history", label: "Ledger", icon: IReceipt },
    { id: "debts", label: "Debts", icon: ICard },
    { id: "settings", label: "Settings", icon: IGear },
  ];

  return (
    <div className="min-h-screen bg-[#FAF8F1] flex flex-col">
      <header className="px-5 pt-6 pb-4 border-b border-[#E4DEC9] bg-[#FAF8F1] sticky top-0 z-10">
        <div className="font-display text-[22px] font-semibold text-[#24261F] leading-tight">Financial Freedom</div>
        <div className="text-[12px] text-[#8A836C]">
          {loaded ? "Every paycheck, split automatically." : "Loading your ledger…"}
          {saveError && <span className="text-[#93463A]"> · couldn't save — check connection</span>}
        </div>
      </header>
      <main className="flex-1 px-5 pt-4 max-w-lg w-full mx-auto">
        {tab === "dashboard" && <Dashboard rows={rows} settings={settings} otherDebt={otherDebt} />}
        {tab === "add" && <AddEntry onAdd={addEntry} settings={settings} />}
        {tab === "history" && <History rows={rows} onDelete={deleteEntry} />}
        {tab === "debts" && <DebtsAndCosts fixedCosts={fixedCosts} setFixedCosts={setFixedCosts} otherDebt={otherDebt} setOtherDebt={setOtherDebt} />}
        {tab === "settings" && <SettingsPane settings={settings} setSettings={setSettings} onSignOut={signOut} />}
      </main>
      <nav className="sticky bottom-0 bg-[#FAF8F1]/95 backdrop-blur border-t border-[#E4DEC9] px-2 py-2 flex justify-around max-w-lg w-full mx-auto">
        {tabs.map((t) => {
          const Icn = t.icon; const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)} className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition ${active ? "text-[#24261F]" : "text-[#B0A98F]"}`}>
              <Icn size={19} /><span className="text-[10px] font-medium">{t.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
