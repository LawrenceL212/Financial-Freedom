<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  /* ── Surfaces: four steps, no more ── */
  --bg:#0A0A0B;
  --surface:#131315;
  --surface-2:#1B1B1E;
  --surface-3:#242428;
  --line:#26262B;
  --line-soft:#1E1E22;

  /* ── Semantic colour. Meaning only, never decoration ── */
  --accent:#00E676;              /* identity + healthy */
  --accent-ink:#00110A;
  --accent-wash:rgba(0,230,118,.10);
  --accent-edge:rgba(0,230,118,.28);
  --warn:#F5A524;                /* attention */
  --warn-wash:rgba(245,165,36,.10);
  --danger:#FF5A5A;              /* problem */
  --danger-wash:rgba(255,90,90,.10);
  --info:#5B9DFF;                /* committed / neutral emphasis */
  --info-wash:rgba(91,157,255,.10);

  /* ── Text: four weights of emphasis ── */
  --ink:#F5F5F7;
  --ink-2:#A0A0AB;
  --ink-3:#6C6C78;
  --ink-4:#43434D;

  /* ── Spacing: 4px base ── */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:32px; --s8:40px; --s9:56px;

  /* ── Radii ── */
  --r-sm:8px; --r:12px; --r-lg:16px; --r-pill:999px;

  --maxw:520px;
  --ease:cubic-bezier(.2,.6,.2,1);
}

html{-webkit-text-size-adjust:100%}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  min-height:100dvh; overscroll-behavior:none;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:15px; line-height:1.45;
}
::-webkit-scrollbar{width:0;height:0}
input,button,select,textarea{font-family:inherit}

/* Money must align in columns. Tabular figures are non-negotiable here. */
.num,.balance-value,.stat-chip-value,.big-input,.hero-figure,
.instruction-amount,.prog-num{
  font-family:'Space Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
  letter-spacing:-.02em;
}

/* ── Type scale ── */
.t-hero    {font-size:38px; font-weight:700; letter-spacing:-1.4px; line-height:1.02}
.t-figure  {font-size:26px; font-weight:700; letter-spacing:-.6px; line-height:1.1}
.t-title   {font-size:20px; font-weight:700; letter-spacing:-.4px; line-height:1.2}
.t-section {font-size:15px; font-weight:650; letter-spacing:-.2px}
.t-body    {font-size:14px; font-weight:450; color:var(--ink-2); line-height:1.55}
.t-label   {font-size:12px; font-weight:550; color:var(--ink-2)}
.t-meta    {font-size:11.5px; font-weight:450; color:var(--ink-3); line-height:1.45}
.t-eyebrow {font-size:10px; font-weight:700; letter-spacing:1.6px; text-transform:uppercase; color:var(--ink-3)}

/* ── Layout ── */
.screen{min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.content{flex:1;padding:var(--s5) var(--s5) var(--s9);max-width:var(--maxw);margin:0 auto;width:100%}
@media (min-width:600px){ :root{--maxw:600px} .content{padding-left:var(--s6);padding-right:var(--s6)} }

.page-header{
  padding:max(var(--s5),env(safe-area-inset-top)) var(--s5) var(--s4);
  max-width:var(--maxw);margin:0 auto;width:100%;
  display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);
}
.page-eyebrow{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.page-title{font-size:24px;font-weight:700;letter-spacing:-.6px;line-height:1.1}

/* ── Sections: rhythm from hairlines and space, not from boxing everything ── */
.section-hdr{
  font-size:10px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;margin:var(--s7) 0 var(--s3);
}
.section-hdr:first-child{margin-top:var(--s2)}
.sec{margin-bottom:var(--s6)}
.rule{height:1px;background:var(--line-soft);border:0;margin:var(--s5) 0}

/* ── Card: a discrete object, not a wrapper for every paragraph ── */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s3);
}
.card-flush{padding:var(--s5) var(--s5) var(--s2)}
.card-quiet{background:transparent;border-color:var(--line-soft)}

/* ── Rows ── */
.balance-row{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line-soft)}
.balance-row:last-child{border-bottom:none;padding-bottom:0}
.balance-row:first-child{padding-top:0}
.balance-label{font-size:14px;color:var(--ink-2);font-weight:500}
.balance-value{font-size:15px;font-weight:700}

/* ── Allocation bar: the signature. Composition of your money in one line ── */
.alloc{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-2);gap:2px}
.alloc-seg{height:100%;transition:width .7s var(--ease)}
.alloc-key{display:flex;flex-wrap:wrap;gap:var(--s4);margin-top:var(--s3)}
.alloc-item{display:flex;align-items:baseline;gap:6px;font-size:12px}
.alloc-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;transform:translateY(-1px)}

/* ── Severity chip ── */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.3px}
.chip-healthy {background:var(--accent-wash);color:var(--accent)}
.chip-watch   {background:var(--info-wash);color:var(--info)}
.chip-warning {background:var(--warn-wash);color:var(--warn)}
.chip-critical{background:var(--danger-wash);color:var(--danger)}

/* ── Progress ── */
.prog-wrap{background:var(--surface-2);border-radius:var(--r-pill);height:6px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width .7s var(--ease)}
.prog-track-lg{height:8px}

/* ── Buttons ── */
button{cursor:pointer;border:none;border-radius:var(--r);font-size:15px;font-weight:600;
  transition:background .15s var(--ease),opacity .12s,transform .08s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.985)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);padding:14px;width:100%;font-size:15px;font-weight:700;border-radius:var(--r)}
.btn-primary:hover{background:#1BEE85}
.btn-primary:disabled{opacity:.35;pointer-events:none}
.btn-ghost{background:var(--surface-2);color:var(--ink-2);padding:12px;width:100%;border:1px solid var(--line);border-radius:var(--r)}
.btn-ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn-sm{padding:7px 13px;font-size:12.5px;font-weight:650;border-radius:var(--r-sm);width:auto}
.btn-quiet{background:none;color:var(--ink-3);padding:6px 0;font-size:12px;width:auto}
.btn-quiet:hover{color:var(--ink-2)}

/* ── Inputs ── */
input,select{
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r);padding:13px 14px;font-size:15px;width:100%;outline:none;
  transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;
}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
input::placeholder{color:var(--ink-4)}

/* ── Chips / filters ── */
.filter-row{display:flex;gap:6px;margin-bottom:var(--s4);flex-wrap:wrap}
.filter-chip{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
  border-radius:var(--r-pill);padding:7px 14px;font-size:12.5px;font-weight:600;width:auto}
.filter-chip:hover{background:var(--surface-3);color:var(--ink)}
.filter-chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ── Transaction row: scan merchant → amount, everything else recedes ── */
.txn{display:flex;align-items:center;gap:var(--s3);padding:12px var(--s3);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:6px;cursor:pointer;transition:background .15s,border-color .15s}
.txn:hover{background:var(--surface-2);border-color:var(--surface-3)}
.txn-date{font-size:10.5px;color:var(--ink-3);min-width:30px;text-align:center;line-height:1.25;flex-shrink:0}
.txn-main{flex:1;min-width:0}
.txn-merchant{font-weight:550;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn-cat{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.txn-amt{text-align:right;flex-shrink:0;font-size:14px;font-weight:700}
.txn-large{border-left:2px solid var(--warn)}

/* ── Nav ── */
.nav{
  display:flex;justify-content:space-around;
  padding:var(--s2) 0 max(var(--s3),env(safe-area-inset-bottom));
  background:rgba(10,10,11,.94);border-top:1px solid var(--line);
  position:sticky;bottom:0;
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;
  background:none;color:var(--ink-4);font-size:9.5px;border-radius:var(--r-sm);
  min-width:52px;white-space:nowrap;letter-spacing:.3px;font-weight:650;text-transform:uppercase;
  transition:color .15s var(--ease)}
.nav-btn:hover{color:var(--ink-2)}
.nav-btn.active{color:var(--accent)}
.nav-btn.active svg{stroke:var(--accent)}
.nav-pay-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 var(--s1);flex-shrink:0;background:none;border:none}
.nav-pay-circle{width:46px;height:46px;background:var(--accent);border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin-top:-18px;
  box-shadow:0 0 0 4px var(--bg),0 6px 18px rgba(0,230,118,.25);
  transition:transform .12s var(--ease)}
.nav-pay-wrap:active .nav-pay-circle{transform:scale(.93)}
.nav-pay-label{font-size:9.5px;color:var(--ink-4);font-weight:650;text-transform:uppercase;letter-spacing:.3px}

/* ── Steps (payday flow) ── */
.step-num{font-size:10px;color:var(--ink-3);letter-spacing:1.6px;text-transform:uppercase;font-weight:700;margin-bottom:var(--s2)}
.step-title{font-size:28px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin-bottom:var(--s2)}
.step-sub{font-size:14px;color:var(--ink-2);margin-bottom:var(--s6);line-height:1.5}
.big-wrap{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s6);
  background:var(--surface-2);border-radius:var(--r-lg);padding:var(--s4) var(--s5);border:1px solid var(--line)}
.big-input{background:none;border:none;font-size:38px;font-weight:700;color:var(--ink);padding:0;width:100%;outline:none}
.big-input:focus{box-shadow:none}
.sym{font-family:'Space Mono',monospace;font-size:30px;font-weight:700;color:var(--ink-4)}

/* ── Auth ── */
.auth-wrap{display:flex;flex-direction:column;justify-content:center;min-height:100dvh;padding:var(--s8) var(--s6);max-width:400px;margin:0 auto}
.auth-logo{font-size:32px;font-weight:700;letter-spacing:-1px;margin-bottom:var(--s1)}
.auth-sub{font-size:14px;color:var(--ink-2);margin-bottom:var(--s8)}

/* ── States ── */
.state{text-align:center;padding:var(--s8) var(--s5);color:var(--ink-2)}
.state-title{font-size:15px;font-weight:650;color:var(--ink);margin-bottom:6px}
.state-body{font-size:13px;color:var(--ink-3);line-height:1.6;max-width:300px;margin:0 auto}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skel-line{height:12px;margin-bottom:var(--s2)}

/* ── Misc kept for compatibility ── */
.sub-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.sub-item:last-child{border-bottom:none}
.instruction{display:flex;justify-content:space-between;align-items:center;padding:var(--s4);
  background:var(--surface-2);border-radius:var(--r);margin-bottom:var(--s2);border-left:2px solid var(--accent)}
.instruction-label{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:3px}
.instruction-action{font-size:14px;font-weight:600}
.instruction-amount{font-size:19px;font-weight:700;color:var(--accent)}
.info-box{background:var(--surface-2);border-radius:var(--r);padding:var(--s3) var(--s4);margin-bottom:var(--s4);
  font-size:13px;color:var(--ink-2);line-height:1.6;border:1px solid var(--line)}
.row{display:flex;gap:var(--s2);margin-top:var(--s3)}
.done-icon{width:60px;height:60px;background:var(--accent-wash);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto var(--s5)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s3)}
.stat-chip{background:var(--surface-2);border-radius:var(--r);padding:var(--s3) var(--s4);border:1px solid var(--line)}
.stat-chip-label{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:5px}
.stat-chip-value{font-size:17px;font-weight:700;line-height:1}
.stat-chip-sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:var(--s4);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s2)}

/* ── Legacy variable aliases so existing inline styles keep working ── */
:root{
  --surface2:var(--surface-2); --surface3:var(--surface-3);
  --border:var(--line); --border2:var(--line);
  --text:var(--ink); --text2:var(--ink-2); --text3:var(--ink-3);
  --green:var(--accent); --green-dim:var(--accent-wash); --green-glow:var(--accent-edge);
  --red:var(--danger); --red-dim:var(--danger-wash);
  --amber:var(--warn); --amber-dim:var(--warn-wash);
  --blue:var(--info); --blue-dim:var(--info-wash); --purple:#A78BFA;
  --radius:var(--r); --radius-sm:var(--r-sm); --radius-lg:var(--r-lg); --radius-xl:20px;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

<script>

// WebSocket is dead and reads return undefined. Force a reload instead.

const auth = firebase.auth();
const db = firebase.database();

const fmt = n => (n<0?'-£':'£') + Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,10);
const el = (tag, props={}, ...kids) => {
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='class') e.className=v;
    else if(k==='style'){
      if(typeof v === 'string') e.setAttribute('style', v);
      else Object.assign(e.style, v);
    }
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const k of kids){
    if(k==null||k===false) continue;
    e.append(typeof k==='string'||typeof k==='number' ? document.createTextNode(String(k)) : k);
  }
  return e;
};

const DEFAULT_DATA = {
  balances:{current:0,creditCard:0,florasii:0,personalSavings:0}, // legacy — kept for migration
  accounts:[], // user-defined accounts
  paychecks:[],
  subscriptions:[]
};

// ── Account helpers ──
function getAccounts(){ return appData.accounts||[]; }
function getAccountBalance(type){
  // legacy fallback for payday flow compatibility
  const acc = getAccounts().find(a=>a.type===type||a.legacyKey===type);
  return acc ? acc.balance : (appData.balances?.[type]||0);
}
function getTotalByType(types){
  if(!getAccounts().length) return types.reduce((s,t)=>s+(appData.balances?.[t]||0),0);
  return getAccounts().filter(a=>types.includes(a.type)).reduce((s,a)=>s+a.balance,0);
}
function getNetWorth(){
  if(!getAccounts().length){
    const b=appData.balances||{};
    return (b.current||0)+(b.florasii||0)+(b.personalSavings||0)-(b.creditCard||0);
  }
  return getAccounts().reduce((s,a)=>a.type==='credit_card'?s-a.balance:s+a.balance,0);
}
// ── Pot model: every account has a JOB ──
// spending  → day-to-day money
// card_pot  → money set aside to clear the credit card
// goals     → money for savings goals
// card      → the credit card debt itself
function inferRole(a){
  if(a.role) return a.role;
  if(a.type==='current') return 'spending';
  if(a.type==='credit_card') return 'card';
  if(a.type==='savings'){
    // Legacy key is the most reliable signal — set explicitly during migration
    if(a.legacyKey==='florasii') return 'goals';
    if(a.legacyKey==='personalSavings') return 'card_pot';
    // Name-based: "Florasii", "Holiday", "Goal" → goals pot
    // "Personal Savings", "Bills", "Card" → card pot
    if(/flora|goal|holiday|travel|trip/i.test(a.name||'')) return 'goals';
    if(/personal|bill|card pot|pot/i.test(a.name||'')) return 'card_pot';
    // "Everyday Saver", "Easy Saver" etc — Barclays saver accounts are often goals
    if(/saver/i.test(a.name||'')) return 'goals';
    return 'card_pot';
  }
  if(a.type==='cash') return 'spending';
  return 'other';
}

function getPots(){
  const accs = appData.accounts||[];
  const b = appData.balances||{};
  const mk = (label,accounts,fallback)=>({
    label,
    accounts,
    balance: accounts.length ? accounts.reduce((s,a)=>s+(a.balance||0),0) : fallback,
    names: accounts.length ? accounts.map(a=>a.name).join(' + ') : label,
    exists: accounts.length>0,
  });
  const of = r => accs.filter(a=>inferRole(a)===r);
  return {
    spending: mk('Spending',  of('spending'),  b.current||0),
    cardPot:  mk('Card pot',  of('card_pot'),  b.personalSavings||0),
    goals:    mk('Goals',     of('goals'),     b.florasii||0),
    card:     mk('Card owed', of('card'),      b.creditCard||0),
  };
}

async function saveAccountBalance(accountId, newBalance){
  const accounts = getAccounts().map(a=>a.id===accountId?{...a,balance:newBalance,updatedAt:new Date().toISOString()}:a);
  appData.accounts=accounts;
  await save({...appData,accounts});
}

let appData = null;
let currentUser = null;

// ── render engine ──
const app = document.getElementById('app');
function render(node){ app.innerHTML=''; app.append(node); }

// ── persist ──
// Every sign-in starts a new session. Async work started under an old session
// must never write, or one user's data can land in another user's account.
let sessionId = 0;

// Figures derived from the signed-in user's own history. Reset on every auth
// change so one user's spending baseline can never inform another's advice.
let userDerived = {};
function resetUserDerived(){ userDerived = {}; }

async function save(data, expectedUid){
  if(!currentUser) return;                                   // never write signed out
  if(expectedUid && expectedUid !== currentUser.uid) return;  // stale caller, abandon
  appData = data;
  await db.ref('users/'+currentUser.uid).set(data);
}

  const content = el('div',{class:'auth-wrap'});

  const heading = el('div',{style:{marginBottom:'40px'}},

  );

  const passInput = el('input',{type:'password',placeholder:'Password',autocomplete:'current-password',required:true,minlength:'6',style:{marginBottom:'10px'}});
  const errDiv = el('div',{style:{fontSize:'13px',color:'var(--red)',minHeight:'20px',marginBottom:'4px'}});

function paydayFlow(){
  let step = 0;
  let income = 0;
  let newBalances = {};
  const prev = {...(appData?.balances||{})};
  const wrap = el('div',{class:'screen'});

  // ── Calculate smart allocation ──
  async function calcAllocation(inc){
    const now = new Date();
    const nextPay = new Date(now.getTime() + 14*86400000); // ~2 weeks
    const subs = appData.subscriptions||[];
    const goals = (appData.goals||[]).filter(g=>g.active!==false&&g.target&&g.deadline);
    const accounts = appData.accounts||[];

    // ── PRIORITY 1: Credit card DDR ──
    // Reserve the statement balance (what actually leaves the bank), not the live total.
    const ccBalance = accounts.find(a=>a.type==='credit_card')?.balance || (prev.creditCard||0);
    const stmtSnap = await db.ref('users/'+currentUser.uid+'/statements').once('value');
    const cardStmts = Object.values(stmtSnap.val()||{})
      .filter(s=>(s.statementKind==='credit_card'||s.sourceBank==='Barclaycard')&&s.statementBalance!=null&&s.paymentDue)
      .sort((a,b)=>(b.periodEnd||'').localeCompare(a.periodEnd||''));
    const latestDue = cardStmts[0];
    const dueDate = latestDue ? new Date(latestDue.paymentDue) : null;
    const daysUntilDue = dueDate && !isNaN(dueDate) ? Math.ceil((dueDate-now)/86400000) : null;

    // Has the DDR already cleared? Check if a matching debit left the current account
    const txSnap2 = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
    const allTxns2 = Object.values(txSnap2.val()||{});
    const ddAmount = latestDue?.statementBalance || 0;
    const alreadyPaid = ddAmount > 0 && dueDate && allTxns2.some(t=>
      t.direction==='debit' && t.sourceType!=='credit_card' &&
      Math.abs(t.amount - ddAmount) < 1 &&
      Math.abs(new Date(t.postingDate) - dueDate) / 86400000 <= 7
    );

    // If already paid, reserve the NEXT statement's amount (current live balance minus what was paid)
    const amountDue = alreadyPaid
      ? Math.max(0, ccBalance) // what remains is next month's debt
      : (latestDue && daysUntilDue!=null && daysUntilDue>=-3 && daysUntilDue<=42)
        ? latestDue.statementBalance
        : ccBalance;
    const ccReserve = Math.min(amountDue, inc);
    const afterCard = Math.max(0, inc - ccReserve);

    // ── PRIORITY 2: Florasii / active goal ──
    const savingsAccounts = accounts.filter(a=>a.type==='savings');
    const goalsAcct = accounts.find(a=>inferRole(a)==='goals');
    const currentSavings = goalsAcct?.balance || (prev.florasii||0);
    const goalMode = appData.goalMode || 'sequential';
    const sortedGoals = [...goals].sort((a,b)=>String(a.deadline).localeCompare(String(b.deadline)));
    let goalAllocations = [], totalGoalRequired = 0, poolLeft = currentSavings, activeAssigned = false;
    for(const g of sortedGoals){
      const deadline = new Date(g.deadline);
      const daysLeft = Math.ceil((deadline-now)/86400000);
      const overdue = daysLeft < 0;
      const payPeriodsLeft = overdue ? 0 : Math.max(1,Math.floor(daysLeft/14));
      const myShare = Math.min(poolLeft, g.target); poolLeft = Math.max(0,poolLeft-myShare);
      const remaining = Math.max(0, g.target - myShare); const met = remaining <= 0;
      let isActive;
      if(goalMode==='parallel') isActive = !met&&!overdue;
      else { isActive = !met&&!overdue&&!activeAssigned; if(isActive) activeAssigned=true; }
      const required = (isActive&&payPeriodsLeft>0) ? remaining/payPeriodsLeft : 0;
      if(isActive) totalGoalRequired += required;
      goalAllocations.push({name:g.name,required:Math.round(required*100)/100,
        remaining,payPeriodsLeft,isActive,met,overdue});
    }
    totalGoalRequired = Math.round(totalGoalRequired*100)/100;

    // ── PRIORITY 3: Subscriptions — ONLY what bills in the next 14 days ──
    // Not the full monthly amount — only what will actually leave the account
    // before the next paycheck arrives.
    const subsThisFortnight = subs.filter(s => {
      if(!s.billingDay) return false; // unknown billing date — reserve next paycheck
      const day = parseInt(s.billingDay);
      // Check if it bills between today and next payday
      const thisMonth = new Date(now.getFullYear(), now.getMonth(), day);
      const nextMonth = new Date(now.getFullYear(), now.getMonth()+1, day);
      const billDate = thisMonth >= now ? thisMonth : nextMonth;
      return billDate <= nextPay;
    });
    const subsUnknown = subs.filter(s => !s.billingDay); // no billing date known
    const subBuffer = Math.round([...subsThisFortnight, ...subsUnknown.slice(0,1)]
      .reduce((s,x)=>s+x.amount,0)*100)/100;
    const afterCardAndGoal = Math.max(0, afterCard - Math.min(totalGoalRequired, afterCard));

    // ── PRIORITY 4: Transport budget (2 weeks) ──
    const transportBudget = Math.round((appData.transportBudget||20)*2*100)/100; // fortnightly
    
    // ── PRIORITY 4+5: Florasii vs personal spending ──
    // Florasii always comes before personal fun.
    // If the goal needs more than the formula gives, personal = £0.
    // Only when the goal is fully covered does personal get anything.
    const afterTransport = Math.max(0, afterCard - Math.min(transportBudget, afterCard));
    const afterMandatory = Math.max(0, afterTransport - subBuffer); // true discretionary

    // The formula split (what we'd do if the goal is under-demanding)
    const florasiiFormula = Math.ceil((afterMandatory + subBuffer) / 2 * 100) / 100;

    let goalAffordable, actualSpending;
    if(totalGoalRequired <= 0){
      // No active goal — save the larger half anyway, personal gets the rest
      goalAffordable = florasiiFormula;
      actualSpending = Math.max(0, afterMandatory - goalAffordable);
    } else if(totalGoalRequired >= afterMandatory){
      // Goal needs everything — personal = £0
      goalAffordable = afterMandatory;
      actualSpending = 0;
    } else if(totalGoalRequired >= florasiiFormula){
      // Goal needs more than formula — give exactly what it needs, personal gets crumbs
      goalAffordable = totalGoalRequired;
      actualSpending = Math.max(0, afterMandatory - goalAffordable);
    } else {
      // Goal is under-demanding — apply formula, give surplus to personal
      goalAffordable = totalGoalRequired;
      actualSpending = Math.max(0, afterMandatory - goalAffordable);
    }

    const constraintMet = goalAffordable > (actualSpending + subBuffer);

    const scaleFactor = totalGoalRequired > 0 ? goalAffordable / totalGoalRequired : 1;
    const scaledGoalAllocations = goalAllocations.map(g=>({
      ...g,
      required: g.isActive ? Math.round(g.required * scaleFactor * 100) / 100 : 0,
      capped: g.isActive && scaleFactor < 0.999,
      needed: g.required,
    }));

    const shortfall = totalGoalRequired > goalAffordable
      ? Math.round((totalGoalRequired - goalAffordable) * 100) / 100 : 0;

    // What each account should look like AFTER you make the transfers
    // Spending: receives the pay, then sends out ccReserve + goalAffordable + subBuffer + transport
    const cardPotAcct = accounts.find(a=>inferRole(a)==='card_pot');
    const spendingAcct = accounts.find(a=>inferRole(a)==='spending');
    const currentSpending = spendingAcct?.balance || (prev.current||0);
    const currentFlorasii = goalsAcct?.balance || (prev.florasii||0);
    const currentSavingsPot = cardPotAcct?.balance || (prev.personalSavings||0);
    const projectedBalances = {
      spending: Math.round((currentSpending + inc - ccReserve - goalAffordable - subBuffer - Math.min(transportBudget, afterTransport))*100)/100,
      florasii: Math.round((currentFlorasii + goalAffordable)*100)/100,
      savings:  Math.round((currentSavingsPot + ccReserve)*100)/100,
      card:     Math.round(amountDue*100)/100,
    };

    const subTotal = subs.reduce((s,x)=>s+x.amount,0);

    return {
      income: inc, ccReserve: Math.round(ccReserve*100)/100,
      ccBalance, amountDue, alreadyPaid,
      dueDate: latestDue?.paymentDue||null, daysUntilDue,
      goalAllocations: scaledGoalAllocations,
      totalGoalRequired: Math.round(goalAffordable*100)/100,
      subBuffer: Math.round(subBuffer*100)/100,
      subsThisFortnight, subTotal,
      transportBudget, transportReserve: Math.min(transportBudget, afterTransport),
      actualSpending: Math.round(actualSpending*100)/100,
      buffer: 0, shortfall, canAffordSpending: true,
      remaining: Math.round(actualSpending*100)/100,
      afterMandatory: Math.round(afterMandatory*100)/100,
      projectedBalances,
    };
  }

  function showStep0(){
    wrap.innerHTML = '';
    wrap.style.position = 'relative';
    const exitBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'14px',
      padding:'4px 8px',position:'absolute',top:'20px',right:'16px'}},'✕');
    exitBtn.addEventListener('click',()=>mainScreen());
    wrap.append(exitBtn);

    const content = el('div',{class:'content',style:{display:'flex',flexDirection:'column',
      justifyContent:'center',flex:'1',paddingBottom:'32px'}});
    const inp = el('input',{class:'big-input',inputmode:'decimal',placeholder:'0.00'});
    const btn = el('button',{class:'btn-primary'},'See my plan →');
    btn.disabled = true;
    inp.addEventListener('input',()=>{ btn.disabled=!parseFloat(inp.value); });
    btn.addEventListener('click',()=>{
      income = parseFloat(inp.value)||0;
      step = 1;
      show();
    });
    content.append(
      el('div',{class:'step-num'},'Step 1 of 3'),
      el('div',{class:'step-title'},'You got paid 💰'),
      el('div',{class:'step-sub'},'How much landed in your account?'),
      el('div',{class:'big-wrap'}, el('span',{class:'sym'},'£'), inp),
      btn
    );
    wrap.append(content);
  }

  async function show(){
    wrap.innerHTML='';
    const content = el('div',{class:'content',style:{display:'flex',flexDirection:'column',justifyContent:'center',flex:'1',paddingBottom:'32px'}});

    if(step!==3){
      const exitBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'14px',padding:'4px 8px',position:'absolute',top:'20px',right:'16px'}},'✕');
      exitBtn.addEventListener('click',()=>mainScreen());
      wrap.style.position='relative';
      wrap.append(exitBtn);
    }

    // step 0 handled by showStep0() — no async needed for the entry screen
    if(step===0){ showStep0(); return; }

    // ── Step 1: Smart allocation plan ──
    if(step===1){
      let alloc;
      try {
        alloc = await calcAllocation(income);
      } catch(err) {
        content.append(
          el('div',{class:'step-num'},'Step 2 of 3'),
          el('div',{class:'card',style:{borderLeft:'3px solid var(--danger)',marginTop:'var(--s4)'}},
            el('div',{style:{fontWeight:'700',color:'var(--danger)',marginBottom:'6px'}},'Could not build your plan'),
            el('div',{style:{fontSize:'13px',color:'var(--ink-2)',lineHeight:'1.6',marginBottom:'12px'}},
              err.message || 'Unknown error in calcAllocation'),
            el('button',{class:'btn-ghost'},  '← Back').addEventListener ? 
              (() => { const b=el('button',{class:'btn-ghost'},'← Back'); b.addEventListener('click',()=>{step=0;showStep0();}); return b; })()
              : el('span')
          )
        );
        return;
      }
      if(!alloc){ content.append(el('div',{style:{padding:'20px',color:'var(--danger)'}},'Plan calculation returned empty — tap Back and try again.')); return; }
      content.style.justifyContent='flex-start';

      // Header
      content.append(
        el('div',{class:'step-num'},'Step 2 of 3'),
        el('div',{class:'step-title'},'Here\'s the plan'),
        el('div',{class:'step-sub'},'Based on your spending history. Tap More → Spending Insights to review your weekly costs.')
      );

      const pots = getPots();
      const cardPotName  = pots.cardPot.exists  ? pots.cardPot.names  : 'your card pot';
      const goalsName    = pots.goals.exists     ? pots.goals.names    : 'your savings pot';
      const spendingName = pots.spending.exists  ? pots.spending.names : 'Spending';

      // Each row = one physical transfer you need to make right now
      const mkRow = (icon, action, account, amount, color, note) => {
        const row = el('div',{style:{background:'var(--surface2)',borderRadius:'14px',
          marginBottom:'8px',borderLeft:'3px solid '+color,overflow:'hidden'}});
        const top = el('div',{style:{display:'flex',justifyContent:'space-between',
          alignItems:'flex-start',padding:'14px 16px 10px'}});
        top.append(
          el('div',{style:{flex:'1',minWidth:'0'}},
            el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'3px'}},
              el('span',{},icon),
              el('div',{style:{fontWeight:'700',fontSize:'13px',color:'var(--ink-3)',
                textTransform:'uppercase',letterSpacing:'0.5px'}},action)
            ),
            el('div',{style:{fontWeight:'600',fontSize:'15px',paddingLeft:'26px'}},account)
          ),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',
            fontSize:'18px',color,flexShrink:'0',paddingLeft:'12px'}},fmt(amount))
        );
        row.append(top);
        if(note) row.append(el('div',{style:{fontSize:'11.5px',color:'var(--ink-3)',
          padding:'0 16px 12px 42px',lineHeight:'1.5'}},note));
        return row;
      };

      // Summary line at top
      content.append(el('div',{style:{display:'flex',justifyContent:'space-between',
        alignItems:'baseline',marginBottom:'var(--s4)'}},
        el('div',{class:'t-label'},'You earned'),
        el('div',{class:'num',style:{fontSize:'22px',fontWeight:'700',color:'var(--accent)'}},fmt(income))
      ));

      // DDR already cleared?
      if(alloc.alreadyPaid){
        content.append(el('div',{style:{background:'var(--accent-wash)',border:'1px solid var(--accent-edge)',
          borderRadius:'12px',padding:'11px 14px',marginBottom:'var(--s3)',fontSize:'13px',color:'var(--accent)'}},
          '✓ Last card statement already paid — reserving '+fmt(alloc.amountDue)+' for next month\'s DDR'));
      }

      content.append(el('div',{class:'t-eyebrow',style:{marginBottom:'var(--s2)'}},'Move money'));

      // Priority 1: Card → Savings
      if(alloc.ccReserve > 0){
        content.append(mkRow('💳','Transfer to', cardPotName, alloc.ccReserve,'var(--danger)',
          alloc.alreadyPaid
            ? 'Next DDR due ~'+(alloc.dueDate||'next month')+' — get it in Savings now'
            : alloc.dueDate
              ? 'DDR due '+alloc.dueDate+' — pay in full, no interest'
              : 'Full balance — pay in full, no interest'));
      }

      // Priority 2: Florasii
      for(const g of alloc.goalAllocations){
        if(!g.isActive || g.required <= 0) continue;
        const note = g.capped
          ? g.name+' needs '+fmt(g.needed)+' — only '+fmt(g.required)+' available this paycheck'
          : g.name+' · '+g.payPeriodsLeft+' paychecks left · '+fmt(g.remaining)+' to go';
        content.append(mkRow('🌸','Transfer to', goalsName, g.required,'var(--info)', note));
      }

      content.append(el('div',{class:'t-eyebrow',style:{margin:'var(--s4) 0 var(--s2)'}},'Leave in '+spendingName));

      // Priority 3: Subs due THIS fortnight only
      if(alloc.subBuffer > 0){
        const subNames = (alloc.subsThisFortnight||[]).map(s=>s.name).join(', ') || 'subscriptions';
        content.append(mkRow('📋','Ring-fence for', 'Subscriptions', alloc.subBuffer,'var(--warn)',
          subNames+' bill before your next payday — do not touch this'));
      }

      // Priority 4: Transport
      if(alloc.transportReserve > 0){
        content.append(mkRow('🚲','Budget for', 'Transport (2 weeks)', alloc.transportReserve,'var(--info)',
          'Beryl + bus · £'+Math.round(alloc.transportReserve/2)+'/week'));
      }

      // Priority 5: Personal spending
      if(alloc.actualSpending > 0){
        content.append(mkRow('💸','Yours to spend','Food, life, fun', alloc.actualSpending,'var(--accent)',
          'Florasii ('+fmt(alloc.totalGoalRequired)+') > subs ('+fmt(alloc.subBuffer)+') + spending ('+fmt(alloc.actualSpending)+') ✓'));
      } else {
        content.append(el('div',{style:{background:'var(--surface2)',borderRadius:'12px',
          padding:'12px 14px',marginBottom:'8px',fontSize:'13px',color:'var(--ink-3)',lineHeight:'1.5'}},
          'Nothing left for personal spending this fortnight. Pick up extra shifts to create headroom.'));
      }

      // ── What your Barclays app should look like after doing this ──
      if(alloc.projectedBalances){
        const pb = alloc.projectedBalances;
        const proj = el('div',{style:{background:'var(--surface2)',borderRadius:'14px',
          padding:'14px 16px',marginTop:'var(--s4)',marginBottom:'var(--s3)'}});
        proj.append(el('div',{style:{fontSize:'10px',fontWeight:'700',letterSpacing:'1.6px',
          textTransform:'uppercase',color:'var(--ink-3)',marginBottom:'10px'}},'Your Barclays app should show'));
        for(const [label,val,col] of [
          [spendingName,   pb.spending,  'var(--ink)'],
          [goalsName,      pb.florasii,  'var(--accent)'],
          [cardPotName,    pb.savings,   'var(--info)'],
          ['Barclaycard', -pb.card,      'var(--danger)'],
        ]){
          proj.append(el('div',{style:{display:'flex',justifyContent:'space-between',
            padding:'5px 0',borderBottom:'1px solid var(--line-soft)',fontSize:'13px'}},
            el('span',{style:{color:'var(--ink-2)'}},label),
            el('span',{class:'num',style:{fontWeight:'700',color:col}},
              (val<0?'-':'')+fmt(Math.abs(val)))));
        }
        proj.lastChild.style.borderBottom='none';
        content.append(proj);
      }

      if(alloc.shortfall > 0){
        content.append(el('div',{style:{background:'var(--danger-wash)',border:'1px solid var(--danger)',
          borderRadius:'14px',padding:'14px',marginBottom:'8px'}},
          el('div',{style:{fontWeight:'700',color:'var(--danger)',marginBottom:'4px'}},'⚠ Tight paycheck'),
          el('div',{style:{fontSize:'13px',color:'var(--ink-2)',lineHeight:'1.5'}},
            'Card + goals need more than you earned. Extra shifts before next payday would help.')
        ));
      }

      const backBtn = el('button',{class:'btn-ghost',style:{flex:'1'}},'← Back');
      const nextBtn = el('button',{class:'btn-primary',style:{flex:'2'}},'Done →');
      backBtn.addEventListener('click',()=>{step=0;showStep0();});
      nextBtn.addEventListener('click',()=>{step=2;show();});
      content.append(el('div',{class:'row'},backBtn,nextBtn));
    }
    // ── Step 2: Confirm balances — app pre-fills from known data ──
    if(step===2){
      content.style.justifyContent='flex-start';
      const fldStyle = {width:'100%',background:'var(--surface2)',border:'1px solid var(--border)',
        color:'var(--text)',borderRadius:'12px',padding:'12px 14px',fontSize:'16px',outline:'none',
        fontFamily:'Space Mono,monospace',fontWeight:'700'};

      // Pull known values from accounts — each one separately
      const accts = appData.accounts||[];

      // Match by role first, then by legacy key, then by type
      const current   = accts.find(a=>inferRole(a)==='spending') || accts.find(a=>a.type==='current');
      const cardPotAc = accts.find(a=>inferRole(a)==='card_pot') || accts.find(a=>a.legacyKey==='personalSavings');
      const goalsAc   = accts.find(a=>inferRole(a)==='goals')    || accts.find(a=>a.legacyKey==='florasii');
      const cardAc    = accts.find(a=>a.type==='credit_card');

      const knownCurrent  = current?.balance   ?? prev.current;
      const knownCardPot  = cardPotAc?.balance  ?? prev.personalSavings;
      const knownFlorasii = goalsAc?.balance    ?? prev.florasii;

      // Card: statement balance is due, live total is what you actually owe
      const stSnap = await db.ref('users/'+currentUser.uid+'/statements').once('value');
      const cardStmts2 = Object.values(stSnap.val()||{})
        .filter(s=>(s.statementKind==='credit_card'||s.sourceBank==='Barclaycard')&&s.statementBalance!=null)
        .sort((a,b)=>(b.periodEnd||'').localeCompare(a.periodEnd||''));
      const latestStmt2  = cardStmts2[0];
      const stmtBalance  = latestStmt2?.statementBalance ?? prev.creditCard;
      const stmtEnd      = latestStmt2?.periodEnd;
      let spentSinceStmt = 0;
      if(stmtEnd){
        const txSnap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
        spentSinceStmt = Object.values(txSnap.val()||{})
          .filter(t=>t.sourceType==='credit_card'&&t.direction==='debit'&&(t.postingDate||'')>stmtEnd)
          .reduce((s,t)=>s+t.amount,0);
      }
      const estimatedLiveCard = Math.round((stmtBalance+spentSinceStmt)*100)/100;

      const mkField = (label, knownVal, hint, role) => {
        const wrap = el('div',{style:{marginBottom:'14px'}});
        const top  = el('div',{style:{display:'flex',justifyContent:'space-between',
          alignItems:'baseline',marginBottom:'5px'}});
        top.append(
          el('div',{style:{fontSize:'13px',fontWeight:'600',color:'var(--ink-2)'}},label),
          hint ? el('div',{style:{fontSize:'11px',color:'var(--ink-3)'}},hint) : el('span')
        );
        const inp = el('input',{inputmode:'decimal',value:String(knownVal||''),style:fldStyle});
        if(role) wrap.setAttribute('data-role',role);
        wrap.append(top, inp);
        return {wrap, inp};
      };

      const fCurrent  = mkField(
        (current?.name||'Spending'),
        knownCurrent, 'spending account');

      const fCardPot  = mkField(
        (cardPotAc?.name||'Savings'),
        knownCardPot, 'card pot — covers the DDR');

      const fFlorasii = mkField(
        (goalsAc?.name||'Florasii'),
        knownFlorasii, 'goals savings');

      // Card field with statement context
      const ccWrap = el('div',{style:{marginBottom:'14px'}});
      ccWrap.append(
        el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'5px'}},
          el('div',{style:{fontSize:'13px',fontWeight:'600',color:'var(--ink-2)'}},
            (cardAc?.name||'Barclaycard')),
          el('div',{style:{fontSize:'11px',color:'var(--ink-3)'}},'total owed')));
      const ccInp = el('input',{inputmode:'decimal',value:String(estimatedLiveCard||''),style:fldStyle});
      const ccNote = el('div',{style:{marginTop:'5px',fontSize:'12px',color:'var(--ink-3)',lineHeight:'1.5'}});
      if(latestStmt2){
        const covered = knownCardPot >= stmtBalance;
        ccNote.innerHTML =
          '<span style="color:var('+(covered?'--accent':'--warn')+');font-weight:600">£'+stmtBalance.toFixed(2)+'</span>'+
          ' due '+latestStmt2.paymentDue+' · '+
          (covered
            ? '<span style="color:var(--accent)">✓ covered by '+
              (cardPotAc?.name||'Savings')+'</span>'
            : '<span style="color:var(--warn)">'+
              (cardPotAc?.name||'Savings')+' has £'+knownCardPot.toFixed(2)+
              ' — short by £'+(stmtBalance-knownCardPot).toFixed(2)+'</span>')+
          (spentSinceStmt>0?' · £'+spentSinceStmt.toFixed(2)+' since last statement rolls to next month':'');
      }
      ccWrap.append(ccInp, ccNote);

      const backBtn = el('button',{class:'btn-ghost',style:{flex:'1'}},'← Back');
      const nextBtn = el('button',{class:'btn-primary',style:{flex:'2'}},'Save →');
      backBtn.addEventListener('click',()=>{step=1;show();});
      nextBtn.addEventListener('click',()=>{
        newBalances = {
          current:         parseFloat(fCurrent.inp.value)  || knownCurrent,
          florasii:        parseFloat(fFlorasii.inp.value) || knownFlorasii,
          creditCard:      parseFloat(ccInp.value)         || estimatedLiveCard,
          personalSavings: parseFloat(fCardPot.inp.value)  || knownCardPot,
        };
        // Also update the individual account records
        const updatedAccts = accts.map(a=>{
          if(a.id===current?.id)   return {...a, balance:newBalances.current,         updatedAt:new Date().toISOString()};
          if(a.id===goalsAc?.id)   return {...a, balance:newBalances.florasii,        updatedAt:new Date().toISOString()};
          if(a.id===cardAc?.id)    return {...a, balance:newBalances.creditCard,       updatedAt:new Date().toISOString()};
          if(a.id===cardPotAc?.id) return {...a, balance:newBalances.personalSavings, updatedAt:new Date().toISOString()};
          return a;
        });
        if(updatedAccts.length) appData.accounts=updatedAccts;
        step=3; show();
      });

      content.append(
        el('div',{class:'step-num'},'Step 3 of 3'),
        el('div',{class:'step-title'},'Confirm your balances'),
        el('div',{class:'step-sub'},'Open Barclays and enter each account. We\'ve pre-filled what we know.'),
        fCurrent.wrap, fCardPot.wrap, fFlorasii.wrap, ccWrap,
        el('div',{class:'row'}, backBtn, nextBtn)
      );
    }

    // ── Step 3: What actually happened ──
    if(step===3){
      content.style.justifyContent='flex-start';
      const florasiiChange = newBalances.florasii - prev.florasii;
      const ccChange = newBalances.creditCard - prev.creditCard;
      const savingsChange = newBalances.personalSavings - prev.personalSavings;
      const currentChange = newBalances.current - prev.current;
      const spent = income - florasiiChange - savingsChange - currentChange + Math.max(0, ccChange);

      const changeRow = (label, value, invert) => {
        const positive = invert ? value < 0 : value > 0;
        const color = value === 0 ? 'var(--text2)' : positive ? 'var(--green)' : 'var(--red)';
        const prefix = value > 0 ? '+' : '';
        return el('div',{style:{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--border)'}},
          el('div',{style:{fontSize:'14px',color:'var(--text2)'}},label),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color}},prefix+fmt(value))
        );
      };

      const confirmBtn = el('button',{class:'btn-primary',style:{marginTop:'16px'}},'Save & update ✓');
      const backBtn = el('button',{class:'btn-ghost',style:{marginTop:'8px'}},'← Back');
      backBtn.addEventListener('click',()=>{step=2;show();});

      confirmBtn.addEventListener('click',async()=>{
        const habits = appData.habits||{streak:0,xp:0,level:1,achievements:[],rewardedPaychecks:[]};
        const rewardedIds = Array.isArray(habits.rewardedPaychecks) ? habits.rewardedPaychecks : [];
        const newPay = {
          id:uid(), date:new Date().toISOString(), income, spent,
          split:{florasii:florasiiChange, savings:savingsChange},
          snapshot:{florasii:newBalances.florasii, current:newBalances.current,
                    creditCard:newBalances.creditCard, personalSavings:newBalances.personalSavings,
                    accountSnapshot:(appData.accounts||[]).map(a=>({id:a.id,name:a.name,type:a.type,balance:a.balance}))}
        };
        const alreadyRewarded = rewardedIds.includes(newPay.id);
        const newXP = alreadyRewarded?(habits.xp||0):(habits.xp||0)+50;
        const newHabits = {...habits,xp:newXP,level:Math.floor(newXP/200)+1,
                          lastPaycheckLog:new Date().toISOString(),
                          rewardedPaychecks:alreadyRewarded?rewardedIds:[...rewardedIds,newPay.id]};
        let updAccts = appData.accounts||[];
        if(updAccts.length){
          updAccts = updAccts.map(a=>{
            if(a.type==='current'||a.legacyKey==='current') return {...a,balance:newBalances.current,updatedAt:new Date().toISOString()};
            if(a.type==='savings'||a.legacyKey==='florasii') return {...a,balance:newBalances.florasii,updatedAt:new Date().toISOString()};
            if(a.type==='credit_card'||a.legacyKey==='creditCard') return {...a,balance:newBalances.creditCard,updatedAt:new Date().toISOString()};
            return a;
          });
        }
        await save({...appData,balances:newBalances,accounts:updAccts,
                    paychecks:[newPay,...(appData.paychecks||[])],habits:newHabits});
        step=4; show();
      });

      content.append(
        el('div',{class:'step-num'},'Summary'),
        el('div',{class:'step-title'},'What happened'),
        el('div',{class:'card',style:{padding:'4px 16px'}},
          changeRow('Savings', florasiiChange, false),
          changeRow('Current account', currentChange, false),
          changeRow('Credit card', ccChange, true),
          changeRow('Personal savings', savingsChange, false),
          el('div',{style:{display:'flex',justifyContent:'space-between',padding:'10px 0'}},
            el('div',{style:{fontSize:'14px',color:'var(--text2)'}},'Estimated spending'),
            el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--amber)'}},fmt(spent))
          )
        ),
        confirmBtn, backBtn
      );
    }

    // ── Step 4: Done ──
    if(step===4){
      content.style.textAlign='center';
      const doneBtn = el('button',{class:'btn-primary'},'Back to overview');
      doneBtn.addEventListener('click',()=>mainScreen());
      content.append(
        el('div',{class:'done-icon'},
          el('svg',{width:'36',height:'36',viewBox:'0 0 24 24',fill:'none',stroke:'var(--green)','stroke-width':'2.5','stroke-linecap':'round','stroke-linejoin':'round'},
            el('path',{d:'M20 6L9 17l-5-5'})
          )
        ),
        el('div',{style:{fontSize:'26px',fontWeight:'700',marginBottom:'8px'}},'All sorted 🎉'),
        el('div',{style:{fontSize:'14px',color:'var(--text2)',marginBottom:'24px',lineHeight:'1.6'}},'Balances updated. Your priorities are handled.'),
        doneBtn
      );
    }

    wrap.append(content);
  }
  showStep0();
  return wrap;
}

function overviewScreen(){
  const balances = appData?.balances || {};
  const paychecks = appData?.paychecks || [];
  const subscriptions = appData?.subscriptions || [];
  const habits = appData?.habits||{xp:0,level:1};
  const subTotal = subscriptions.reduce((s,x)=>s+(x.amount||0),0);
  // pct removed - goals now user-defined
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  // ── Load transaction data async then render intelligence ──
  const intelligenceWrap = el('div',{});
  content.append(intelligenceWrap);

  async function renderIntelligence(){
    const snap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
    const txnVal = snap.val() || {};
    const txns = Object.values(txnVal);

    // Latest credit-card statement tells us what is actually due, and when
    const stmtSnap = await db.ref('users/'+currentUser.uid+'/statements').once('value');
    const cardStmts = Object.values(stmtSnap.val()||{})
      .filter(s=>s.statementKind==='credit_card')
      .sort((a,b)=>(b.periodEnd||'').localeCompare(a.periodEnd||''));
    const latestStmt = cardStmts[0]||null;
    const pots = getPots();

    // Reconciled model over all history, plus recency-weighted baselines
    const fmodel = buildFinancialModel(txns);
    const baselines = buildBaselines(txns);

    // Cache for other screens (payday flow). Session-scoped, cleared on sign-out.
    userDerived = {
      weeklySpend: fmodel.monthlySpending>0 ? fmodel.monthlySpending*12/52 : null,
      monthlySpending: fmodel.monthlySpending || null,
      monthlyIncome: fmodel.monthlyIncome || null,
      sustainableMonthlySurplus: baselines.sustainableMonthlySurplus || null,
      uid: currentUser.uid,
    };

    // Card commitment — needed by goals, safe-to-spend and the pots view
    const cardOwed = pots.card.balance;
    const dueAmount = latestStmt && latestStmt.statementBalance!=null ? latestStmt.statementBalance : cardOwed;
    const dueDateStr = latestStmt && latestStmt.paymentDue ? latestStmt.paymentDue : null;
    // dueGap = missing for the NEXT payment; uncoveredCard = total debt not backed by the pot
    const dueGap = Math.max(0, dueAmount - pots.cardPot.balance);
    const uncoveredCard = Math.max(0, cardOwed - pots.cardPot.balance);
    // What is genuinely available for goals once card debt is honoured
    const trueGoals = Math.max(0, pots.goals.balance - uncoveredCard);

    const now = new Date();
    const thisMonthStr = now.toISOString().slice(0,7);
    const lastMonthDate = new Date(now); lastMonthDate.setMonth(lastMonthDate.getMonth()-1);
    const lastMonthStr = lastMonthDate.toISOString().slice(0,7);
    const twoWeeksAgo = new Date(now); twoWeeksAgo.setDate(twoWeeksAgo.getDate()-14);

    // This period's transactions (last 14 days)
    const recentTxns = txns.filter(t=>new Date(t.postingDate)>=twoWeeksAgo && t.financialType==='EXPENSE');
    const recentSpend = recentTxns.reduce((s,t)=>s+t.amount,0);

    // This month's income and spending
    const thisMonthTxns = txns.filter(t=>t.postingDate?.startsWith(thisMonthStr));
    const thisMonthIncome = thisMonthTxns.filter(t=>t.financialType==='INCOME').reduce((s,t)=>s+t.amount,0);
    const thisMonthSpend = thisMonthTxns.filter(t=>t.financialType==='EXPENSE').reduce((s,t)=>s+t.amount,0);

    // Last month spending for comparison
    const lastMonthSpend = txns.filter(t=>t.postingDate?.startsWith(lastMonthStr)&&t.financialType==='EXPENSE').reduce((s,t)=>s+t.amount,0);
    const spendChange = lastMonthSpend > 0 ? ((thisMonthSpend-lastMonthSpend)/lastMonthSpend*100) : 0;

    // Upcoming commitments (next 30 days)
    const in30 = new Date(now); in30.setDate(in30.getDate()+30);
    const cashFlow = appData.cashFlow||[];
    const upcomingOut = cashFlow.filter(e=>{
      const d=new Date(e.date);
      return e.type==='out' && d>=now && d<=in30;
    }).reduce((s,e)=>s+e.amount,0);
    const upcomingSubCost = subTotal; // monthly subs

    // The card payment is the single largest thing leaving the account, so it
    // has to be committed money — safe-to-spend was previously ignoring it.
    const cardDueSoon = (dueAmount>0 && dueDateStr)
      ? (()=>{ const d=new Date(dueDateStr);
               if(isNaN(d)) return dueAmount;
               const days=(d-now)/86400000;
               return (days>=-3 && days<=35) ? dueAmount : 0; })()
      : 0;

    const totalCommitted = upcomingOut + upcomingSubCost + cardDueSoon;

    // ── HIDDEN SUBSCRIPTION DETECTION ──
    // Find recurring patterns not in subscriptions list AND not already reviewed
    const hiddenSubs = [];
    if(txns.length > 10){
      const patterns = detectRecurring(txns);
      const knownSubNames = subscriptions.map(s=>s.name.toLowerCase().split(' ')[0]);

      // Load already-reviewed recurring patterns from Firebase
      const recSnap = await db.ref('users/'+currentUser.uid+'/recurringPatterns').once('value');
      const recVal = recSnap.val() || {};
      const reviewedMerchants = new Set(Object.values(recVal).map(p=>p.merchant));

      for(const p of patterns){
        if(p.frequency !== 'Monthly' && p.frequency !== 'Weekly' && p.frequency !== 'Fortnightly') continue;
        if(p.confidence < 0.75) continue;
        if(p.observations < 2) continue;
        // Skip if already reviewed (confirmed or ignored)
        if(reviewedMerchants.has(p.merchant)) continue;
        // Skip if already in subscriptions list
        const alreadyKnown = knownSubNames.some(n=>
          p.merchant.toLowerCase().includes(n) || n.includes(p.merchant.toLowerCase().split(' ')[0])
        );
        if(alreadyKnown) continue;
        hiddenSubs.push(p);
      }
    }

    // Predicted next paycheck from hours
    const hoursLog = appData.hoursLog||[];
    const actualPay = appData.actualPay||{};
    const RATE = appData.hourlyRate||14.50;
    const parseLabel = l=>{const p=l.split('/');return new Date(`${p[2]}-${p[1]}-${p[0]}`);};
    const sortedH = [...hoursLog].sort((a,b)=>parseLabel(a.label)-parseLabel(b.label));
    const lastPair = sortedH.length>=2?{w1:sortedH[sortedH.length-2],w2:sortedH[sortedH.length-1]}:
                     sortedH.length===1?{w1:sortedH[0],w2:null}:null;
    const predictedPay = lastPair ? (lastPair.w1.total+(lastPair.w2?lastPair.w2.total:0))*RATE : 0;

    // Avg savings per pay (from snapshot history)
    const avgFlorasiiPerPay = (()=>{
      const snaps = (paychecks||[]).filter(p=>p.snapshot).sort((a,b)=>new Date(a.date)-new Date(b.date));
      if(snaps.length<2) return predictedPay*0.25;
      // Use florasii snapshot for now (historical data), accounts system is additive
      const growth = (snaps[snaps.length-1].snapshot.florasii||0) - (snaps[0].snapshot.florasii||0);
      return Math.max(0, growth/Math.max(snaps.length-1,1));
    })();

    // User-specific goals from Firebase (not hardcoded)
    const GOALS = (appData.goals || []).filter(g=>g.active!==false&&g.target&&g.deadline);
    // Get savings total from user accounts (savings type) or fall back to legacy florasii
    // Only the goals pot counts toward goals — and only what is not propping up the card
    const florasiiNow = trueGoals;
    const now2 = new Date();

    // Goals are worked through one at a time by default: the nearest deadline is
    // funded first, and later goals only start once it is met. Set goalMode to
    // 'parallel' to fund everything at once instead.
    const goalMode = appData.goalMode || 'sequential';
    let totalRequiredPerPaycheck = 0;
    const sortedGoals = [...GOALS].sort((a,b)=>String(a.deadline).localeCompare(String(b.deadline)));
    let poolLeft = florasiiNow;
    let activeAssigned = false;

    const goalDetails = sortedGoals.map((g,idx)=>{
      const deadline = new Date(g.deadline);
      const daysLeft = Math.ceil((deadline - now2)/86400000);
      const overdue = daysLeft < 0;

      // Waterfall: nearer deadlines take from the pot first
      const myShare = Math.min(poolLeft, g.target);
      poolLeft = Math.max(0, poolLeft - myShare);
      const remaining = Math.max(0, g.target - myShare);
      const met = remaining <= 0;

      // Which goal am I actually saving into right now?
      let isActive;
      if(goalMode === 'parallel'){
        isActive = !met && !overdue;
      } else {
        isActive = !met && !overdue && !activeAssigned;
        if(isActive) activeAssigned = true;
      }
      const queued = !met && !overdue && !isActive;

      const payPeriodsLeft = overdue ? 0 : Math.max(1, Math.floor(daysLeft/14));
      const requiredPerPeriod = (overdue || met) ? 0 : remaining/payPeriodsLeft;
      // Only what you are actually saving into counts against this paycheck
      if(isActive) totalRequiredPerPaycheck += requiredPerPeriod;

      const pctDone = g.target>0 ? Math.min(100, Math.round(myShare/g.target*100)) : 0;
      const onTrack = met ? true : overdue ? false
                    : isActive ? avgFlorasiiPerPay >= requiredPerPeriod*0.9 : true;

      return {...g, remaining, requiredPerPeriod, payPeriodsLeft, pctDone, myShare,
              onTrack, daysLeft, overdue, met, isActive, queued,
              waitingFor: queued && idx>0 ? sortedGoals[idx-1].name : null,
              color:g.color||'var(--green)'};
    });

    // Safe to spend using goal-required savings (not just historical avg)
    const safeToSpend = Math.max(0,
      pots.spending.balance + predictedPay - totalCommitted - totalRequiredPerPaycheck
    );

    // Money leaks — top spending categories this month
    const byCat = {};
    for(const t of thisMonthTxns.filter(t=>t.financialType==='EXPENSE')){
      const cat = t.userCategory||t.category||'Other';
      if(!byCat[cat]) byCat[cat]={total:0,count:0};
      byCat[cat].total+=t.amount; byCat[cat].count++;
    }
    const topCats = Object.entries(byCat).sort((a,b)=>b[1].total-a[1].total).slice(0,4);

    // Top merchants this period
    const byMerchant = {};
    for(const t of recentTxns){
      const m=t.normalisedMerchant||t.rawDescription;
      if(!byMerchant[m]) byMerchant[m]={total:0,count:0};
      byMerchant[m].total+=t.amount; byMerchant[m].count++;
    }
    const topMerchants = Object.entries(byMerchant).sort((a,b)=>b[1].total-a[1].total).slice(0,4);

    // Why am I broke? — determine the main culprit
    const reasons = [];
    if(hiddenSubs.length > 0){
      const hiddenTotal = hiddenSubs.reduce((s,p)=>s+(p.frequency==='Weekly'?p.typicalAmount*4.33:p.frequency==='Fortnightly'?p.typicalAmount*2:p.typicalAmount),0);
      reasons.push({severity:'warning', msg:hiddenSubs.length+' possible unknown subscription'+(hiddenSubs.length>1?'s':'')+' detected — ~'+fmt(hiddenTotal)+'/mo you might not know about.'});
    }
    if(pots.spending.balance<0) reasons.push({severity:'critical',msg:'Your spending account is overdrawn by '+fmt(Math.abs(pots.spending.balance))+'.'});

    // The card is the lever: every pound on it is a pound not going to your goals
    if(dueGap>0){
      reasons.push({severity:'critical',
        msg:'Your card pot is '+fmt(dueGap)+' short of the '+fmt(dueAmount)+' due'+(dueDateStr?' on '+dueDateStr:'')+
            '. Paying less than the full amount starts interest on everything.'});
    }
    if(uncoveredCard>0){
      reasons.push({severity:'warning',
        msg:fmt(uncoveredCard)+' of card debt is being propped up by your goals pot — so '+fmt(pots.goals.balance)+
            ' is really '+fmt(trueGoals)+'.'});
    }
    if(subTotal>predictedPay*0.2) reasons.push({severity:'warning',msg:'Subscriptions cost £'+subTotal.toFixed(0)+'/mo — '+Math.round(subTotal/Math.max(predictedPay,1)*100)+'% of your typical paycheck.'});
    if(thisMonthSpend>thisMonthIncome&&thisMonthIncome>0) reasons.push({severity:'warning',msg:'Spent more than earned this month.'});
    if(spendChange>20&&lastMonthSpend>0) reasons.push({severity:'info',msg:'Spending is up '+Math.round(spendChange)+'% vs last month.'});
    if(topCats.length&&topCats[0][1].total>predictedPay*0.3) reasons.push({severity:'info',msg:topCats[0][0]+' is your biggest cost this month at '+fmt(topCats[0][1].total)+'.'});

    intelligenceWrap.innerHTML='';

    // ── HERO: composition of your money, not just its total ──
    // A single net worth figure misleads when most of it is committed, so the
    // allocation bar shows what the money is FOR before showing how much it is.
    const netPos = getNetWorth();
    const availableCash = pots.spending.balance;
    const committedSavings = pots.goals.balance + pots.cardPot.balance;
    const totalAssets = Math.max(0, availableCash) + Math.max(0, committedSavings);
    const barTotal = totalAssets + Math.max(0, cardOwed);
    const pctOf = v => barTotal>0 ? Math.max(v>0?3:0, v/barTotal*100) : 0;

    const hero = el('div',{class:'card',style:{padding:'var(--s6) var(--s5) var(--s5)'}});

    hero.append(
      el('div',{class:'t-eyebrow',style:{marginBottom:'var(--s2)'}},'Net worth'),
      el('div',{class:'t-hero num',style:{color:netPos>=0?'var(--ink)':'var(--danger)',marginBottom:'var(--s5)'}},fmt(netPos))
    );

    // The signature element
    const bar = el('div',{class:'alloc'});
    const segs = [
      {v:Math.max(0,availableCash), c:'var(--accent)'},
      {v:Math.max(0,committedSavings), c:'var(--info)'},
      {v:Math.max(0,cardOwed), c:'var(--danger)'},
    ];
    for(const sg of segs){ if(sg.v>0) bar.append(el('div',{class:'alloc-seg',style:{width:pctOf(sg.v)+'%',background:sg.c}})); }
    hero.append(bar);

    const key = el('div',{class:'alloc-key'});
    const keyItem=(colour,label,val)=>{
      const i=el('div',{class:'alloc-item'});
      i.append(
        el('div',{class:'alloc-dot',style:{background:colour}}),
        el('div',{},
          el('div',{class:'num',style:{fontWeight:'700',fontSize:'13px'}},fmt(val)),
          el('div',{style:{fontSize:'11px',color:'var(--ink-3)',marginTop:'1px'}},label))
      );
      return i;
    };
    key.append(keyItem('var(--accent)','Available', availableCash));
    if(committedSavings>0) key.append(keyItem('var(--info)','Goal savings', committedSavings));
    if(cardOwed>0)         key.append(keyItem('var(--danger)','Card debt', cardOwed));
    hero.append(key);

    if(uncoveredCard>0){
      hero.append(el('div',{style:{marginTop:'var(--s4)',paddingTop:'var(--s4)',borderTop:'1px solid var(--line-soft)',
        fontSize:'12.5px',color:'var(--ink-2)',lineHeight:'1.55'}},
        el('span',{},'Of your '+fmt(pots.goals.balance)+' in savings, '),
        el('span',{style:{color:'var(--warn)',fontWeight:'650'}},fmt(uncoveredCard)),
        el('span',{},' is really covering card debt. '),
        el('span',{style:{color:'var(--ink)',fontWeight:'650'}},fmt(trueGoals)),
        el('span',{},' is genuinely yours.')));
    }
    intelligenceWrap.append(hero);

    // ── SAFE TO SPEND: the number you act on ──
    const stsTone = safeToSpend>200?'accent':safeToSpend>0?'warn':'danger';
    const stsCol  = 'var(--'+stsTone+')';
    const sts = el('div',{class:'card'});
    sts.append(
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'var(--s2)'}},
        el('div',{class:'t-eyebrow'},'Safe to spend'),
        predictedPay>0?el('div',{class:'t-meta'},'next pay '+fmt(predictedPay)):el('span')),
      el('div',{class:'t-figure num',style:{color:stsCol}},fmt(safeToSpend)),
      el('div',{class:'t-meta',style:{marginTop:'3px'}},'until your next payday')
    );

    // Show the deduction as a stack rather than a run-on sentence
    const wk = el('div',{style:{marginTop:'var(--s4)',paddingTop:'var(--s4)',borderTop:'1px solid var(--line-soft)'}});
    const wkRow=(label,val,neg)=>el('div',{style:{display:'flex',justifyContent:'space-between',padding:'5px 0',fontSize:'12.5px'}},
      el('span',{style:{color:'var(--ink-3)'}},label),
      el('span',{class:'num',style:{color:neg?'var(--ink-2)':'var(--ink)',fontWeight:'600'}},(neg?'−':'')+fmt(Math.abs(val))));
    wk.append(wkRow('In your spending pot', pots.spending.balance, false));
    if(predictedPay>0) wk.append(wkRow('Expected pay', predictedPay, false));
    if(subTotal>0)     wk.append(wkRow('Subscriptions', subTotal, true));
    if(cardDueSoon>0)  wk.append(wkRow('Card payment due', cardDueSoon, true));
    if(upcomingOut>0)  wk.append(wkRow('Planned expenses', upcomingOut, true));
    if(totalRequiredPerPaycheck>0) wk.append(wkRow('Goal savings', totalRequiredPerPaycheck, true));
    sts.append(wk);
    intelligenceWrap.append(sts);

    // ── TRANSPORT BUDGET ──
    // Beryl + bus combined. One number, resets Monday.
    const transportBudget = appData.transportBudget || 20;
    const monStart = new Date(); monStart.setDate(monStart.getDate()-((monStart.getDay()+6)%7)); monStart.setHours(0,0,0,0);
    const monStr = monStart.toISOString().slice(0,10);

    const isTransport = t => {
      const h = ((t.normalisedMerchant||'')+(t.rawDescription||'')+(t.rawMemo||'')).toUpperCase();
      return t.direction==='debit' && /BERYL|GO SOUTH COAST|FIRST CYMRU|STAGECOACH/.test(h);
    };
    const isBeryl = t => /BERYL/.test(((t.normalisedMerchant||'')+(t.rawDescription||'')+(t.rawMemo||'')).toUpperCase());

    const transportThisWeek = txns.filter(t => {
      const d = t.transactionDate||t.postingDate||'';
      return d >= monStr && isTransport(t);
    });

    const berylTotal = transportThisWeek.filter(isBeryl).reduce((s,t)=>s+t.amount,0);
    const busTotal   = transportThisWeek.filter(t=>!isBeryl(t)).reduce((s,t)=>s+t.amount,0);
    const transTotal = berylTotal + busTotal;
    const transPct   = Math.min(100, Math.round(transTotal/transportBudget*100));
    const transOver  = transTotal > transportBudget;
    const transCol   = transOver ? 'var(--danger)' : transPct>75 ? 'var(--warn)' : 'var(--accent)';

    const transCard = el('div',{class:'card',style:{marginBottom:'12px'}});
    transCard.append(
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'var(--s2)'}},
        el('div',{class:'t-eyebrow'},'Transport this week'),
        el('div',{style:{fontSize:'11px',color:'var(--ink-3)'}},'Budget £'+transportBudget+'/wk · resets Mon')),
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'var(--s2)'}},
        el('div',{class:'num',style:{fontSize:'26px',fontWeight:'700',color:transCol}},'£'+transTotal.toFixed(2)),
        el('div',{style:{fontSize:'13px',color:'var(--ink-2)'}},
          transOver ? '£'+Math.abs(transportBudget-transTotal).toFixed(2)+' over' : '£'+(transportBudget-transTotal).toFixed(2)+' left')),
      el('div',{class:'prog-wrap',style:{marginBottom:'var(--s3)'}},
        el('div',{class:'prog-fill',style:{width:transPct+'%',background:transCol}}))
    );

    // Beryl vs bus split
    const splitRow = el('div',{style:{display:'flex',gap:'var(--s3)',marginBottom:'var(--s2)'}});
    for(const [label,val] of [['🚲 Beryl',berylTotal],['🚌 Bus',busTotal]]){
      const chip = el('div',{style:{flex:'1',background:'var(--surface-2)',borderRadius:'var(--r-sm)',padding:'8px 10px'}});
      chip.append(
        el('div',{style:{fontSize:'11px',color:'var(--ink-3)',marginBottom:'2px'}},label),
        el('div',{class:'num',style:{fontSize:'14px',fontWeight:'700'}},'£'+val.toFixed(2)));
      splitRow.append(chip);
    }
    transCard.append(splitRow);

    // Recent rides
    if(transportThisWeek.length){
      const rides = el('div',{style:{borderTop:'1px solid var(--line-soft)',paddingTop:'var(--s2)'}});
      for(const t of transportThisWeek.slice(-5).reverse()){
        rides.append(el('div',{style:{display:'flex',justifyContent:'space-between',
          fontSize:'12px',color:'var(--ink-3)',padding:'3px 0'}},
          el('span',{},(t.transactionDate||t.postingDate||'').slice(5).replace('-','/')+
            ' · '+(isBeryl(t)?'Beryl':'Bus')),
          el('span',{class:'num'},'£'+t.amount.toFixed(2))));
      }
      transCard.append(rides);
    } else {
      transCard.append(el('div',{style:{fontSize:'12px',color:'var(--ink-4)'}},'No transport spend yet this week'));
    }

    const editTransBtn = el('button',{class:'btn-quiet',style:{marginTop:'var(--s2)',fontSize:'11px',color:'var(--ink-3)'}},'Change budget');
    editTransBtn.addEventListener('click',()=>{
      const v = prompt('Weekly transport budget (£)?', String(transportBudget));
      if(v && !isNaN(parseFloat(v))){ appData.transportBudget=parseFloat(v); save({...appData,transportBudget:parseFloat(v)}); renderIntelligence(); }
    });
    transCard.append(editTransBtn);
    intelligenceWrap.append(el('div',{class:'section-hdr'},'Transport'), transCard);

    // ── DIAGNOSIS ──
    // Ranks causes and states a verdict. Deliberately non-judgemental: a
    // disciplined saver with ambitious goals is not the same as an overspender.
    const owedToUser = (appData.debts||[]).reduce((s,d)=>s+Math.max(0,(d.amount||0)-(d.paid||0)),0);
    const dx = diagnose(fmodel, baselines, {
      goalRequiredPerMonth: totalRequiredPerPaycheck*26/12,
      cardOwed, subsMonthly: subTotal, owedToUser,
      availableCash: pots.spending.balance,
      committedSoon: totalCommitted,
    });

    const highs = dx.causes.filter(c=>c.severity==='high').length;
    const meds  = dx.causes.filter(c=>c.severity==='medium').length;
    const level = highs>=2 ? 'critical' : highs===1 ? 'warning' : meds>0 ? 'watch' : 'healthy';
    const levelLabel = {critical:'Needs attention',warning:'Warning',watch:'Watch',healthy:'Healthy'}[level];
    const levelCol   = {critical:'var(--danger)',warning:'var(--warn)',watch:'var(--info)',healthy:'var(--accent)'}[level];

    const dxCard = el('div',{class:'card'});
    dxCard.append(
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'var(--s3)'}},
        el('div',{class:'t-section'},'Your position'),
        el('div',{class:'chip chip-'+level},levelLabel)),
      el('div',{class:'t-body',style:{color:'var(--ink)',marginBottom:'var(--s4)'}}, dx.verdict)
    );

    if(dx.causes.length){
      const list = el('div',{style:{borderTop:'1px solid var(--line-soft)',paddingTop:'var(--s3)'}});
      for(const c of dx.causes.slice(0,4)){
        const col = c.severity==='high'?'var(--danger)':c.severity==='medium'?'var(--warn)':'var(--info)';
        list.append(el('div',{style:{display:'flex',gap:'var(--s3)',padding:'var(--s3) 0',
          borderBottom:'1px solid var(--line-soft)'}},
          el('div',{style:{width:'3px',borderRadius:'2px',background:col,flexShrink:'0',alignSelf:'stretch'}}),
          el('div',{style:{flex:'1',minWidth:'0'}},
            el('div',{style:{fontSize:'13px',fontWeight:'600',marginBottom:'2px'}},c.title),
            el('div',{class:'t-meta'},c.detail),
            c.evidence?el('div',{class:'t-meta',style:{marginTop:'3px',color:'var(--ink-4)'}},c.evidence):el('span'))
        ));
      }
      list.lastChild.style.borderBottom='none';
      dxCard.append(list);
    }
    if(fmodel.grossIncome>0){
      dxCard.append(el('div',{class:'t-meta',style:{marginTop:'var(--s3)',paddingTop:'var(--s3)',
        borderTop:'1px solid var(--line-soft)'}},
        'Over '+fmodel.monthCount+' months: '+fmt(fmodel.monthlyIncome)+' in, '+fmt(fmodel.monthlySpending)+
        ' out, '+fmt(baselines.sustainableMonthlySurplus)+' surplus a month.'));
    }
    intelligenceWrap.append(dxCard);

    // ── SUPPORTING DETAIL ──
    if(reasons.length){
      const brokeCard = el('div',{class:'card',style:{marginBottom:'12px',borderLeft:'3px solid var(--red)'}});
      brokeCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px',color:'var(--red)'}},'⚡ Specifics'));
      for(const r of reasons){
        const color = r.severity==='critical'?'var(--red)':r.severity==='warning'?'var(--amber)':'var(--text2)';
        const icon = r.severity==='critical'?'🔴':r.severity==='warning'?'🟡':'💡';
        brokeCard.append(el('div',{style:{fontSize:'13px',color,marginBottom:'8px',display:'flex',gap:'8px',alignItems:'flex-start'}},
          el('span',{},icon),
          el('span',{},r.msg)
        ));
      }
      intelligenceWrap.append(brokeCard);
    }

    // ── HIDDEN SUBSCRIPTIONS ──
    if(hiddenSubs.length > 0){
      const hiddenCard = el('div',{class:'card',style:{marginBottom:'12px',borderLeft:'3px solid var(--amber)'}});
      hiddenCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'4px',color:'var(--amber)'}},'👀 Possible unknown subscriptions'));
      hiddenCard.append(el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'12px'}},'These recurring payments were found in your transactions but aren\'t in your subscriptions list. Did you know about these?'));

      const hiddenMonthly = hiddenSubs.reduce((s,p)=>{
        const m = p.frequency==='Weekly'?p.typicalAmount*4.33:p.frequency==='Fortnightly'?p.typicalAmount*2:p.typicalAmount;
        return s+m;
      },0);

      for(const p of hiddenSubs.slice(0,5)){
        const monthlyEq = p.frequency==='Weekly'?p.typicalAmount*4.33:p.frequency==='Fortnightly'?p.typicalAmount*2:p.typicalAmount;
        const row = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--border)'}});
        row.append(
          el('div',{},
            el('div',{style:{fontSize:'13px',fontWeight:'500'}},p.merchant),
            el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'1px'}},p.frequency+' · '+p.observations+' payments detected')
          ),
          el('div',{style:{textAlign:'right'}},
            el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--red)'}},fmt(p.typicalAmount)),
            el('div',{style:{fontSize:'10px',color:'var(--text3)',marginTop:'1px'}},'~'+fmt(monthlyEq)+'/mo')
          )
        );
        hiddenCard.append(row);
      }

      hiddenCard.append(
        el('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:'10px',fontSize:'13px'}},
          el('span',{style:{color:'var(--text2)'}},'Hidden monthly cost'),
          el('span',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--amber)'}},fmt(hiddenMonthly)+'/mo')
        )
      );
      const reviewBtn = el('button',{style:{width:'100%',marginTop:'10px',background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'8px',fontSize:'12px'}},'Review in Recurring tab');
      reviewBtn.addEventListener('click',()=>{ if(window._setTab) window._setTab('_recurring'); });
      hiddenCard.append(reviewBtn);
      intelligenceWrap.append(hiddenCard);
    }

    // ── UPCOMING COMMITMENTS ──
    const commitCard = el('div',{class:'card',style:{marginBottom:'12px'}});
    commitCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},'📅 Upcoming commitments'));
    commitCard.append(
      el('div',{class:'balance-row'},
        el('div',{class:'balance-label'},'Subscriptions this month'),
        el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(subTotal))
      )
    );
    if(upcomingOut>0) commitCard.append(
      el('div',{class:'balance-row'},
        el('div',{class:'balance-label'},'Planned expenses (30d)'),
        el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(upcomingOut))
      )
    );
    if(cardDueSoon>0) commitCard.append(
      el('div',{class:'balance-row'},
        el('div',{},
          el('div',{class:'balance-label'},'Credit card payment'),
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},
            'due '+dueDateStr+(cardOwed>dueAmount?' · '+fmt(cardOwed-dueAmount)+' more rolls over':''))
        ),
        el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(cardDueSoon))
      )
    );
    commitCard.append(
      el('div',{class:'balance-row',style:{borderTop:'1px solid var(--border)',paddingTop:'10px',marginTop:'4px',border:'none'}},
        el('div',{class:'balance-label',style:{fontWeight:'700'}},'Total committed'),
        el('div',{class:'balance-value',style:{color:'var(--red)',fontWeight:'700'}},fmt(totalCommitted))
      )
    );
    intelligenceWrap.append(commitCard);

    // ── FLORASII SUB-GOALS ──
    const florasiiCard = el('div',{class:'card',style:{marginBottom:'12px'}});
    florasiiCard.append(
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'14px'}},
        el('div',{style:{fontWeight:'700',fontSize:'15px'}},'🌸 '+(pots.goals.exists?pots.goals.names:'Savings Goals')),
        el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'18px',color:'var(--green)'}},fmt(florasiiNow))
      )
    );

    if(goalDetails.length === 0){
      florasiiCard.append(
        el('div',{style:{background:'var(--surface2)',borderRadius:'12px',padding:'14px',textAlign:'center'}},
          el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'10px'}},'No savings goals set yet.'),
          el('button',{style:{background:'var(--green)',color:'#000',borderRadius:'10px',padding:'8px 16px',fontWeight:'700',fontSize:'13px'}},'Add a goal')
        )
      );
      florasiiCard.querySelector('button').addEventListener('click',()=>{ if(window._setTab) window._setTab('_goals'); });
    } else {
      for(const g of goalDetails){
        const state = g.met ? 'healthy' : g.overdue ? 'critical' : g.queued ? 'watch' : g.onTrack ? 'healthy' : 'warning';
        const stateLabel = g.met?'Funded':g.overdue?'Date passed':g.queued?'Up next':g.onTrack?'On track':'Behind';
        const stateCol = {healthy:'var(--accent)',critical:'var(--danger)',watch:'var(--info)',warning:'var(--warn)'}[state];
        const deadlineStr = new Date(g.deadline).toLocaleDateString('en-GB',{month:'short',year:'numeric'});

        const block = el('div',{style:{padding:'var(--s4) 0',borderBottom:'1px solid var(--line-soft)',
          opacity: g.queued ? '.6' : '1'}});

        block.append(
          el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'var(--s3)',marginBottom:'var(--s3)'}},
            el('div',{style:{minWidth:'0'}},
              el('div',{style:{fontSize:'14px',fontWeight:'650',marginBottom:'2px'}},g.name),
              el('div',{class:'t-meta'},fmt(g.target)+' by '+deadlineStr)),
            el('div',{class:'chip chip-'+state},stateLabel))
        );

        // Progress: amount reads with the bar, not separately from it
        block.append(
          el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'6px'}},
            el('div',{class:'num',style:{fontSize:'19px',fontWeight:'700',color:stateCol}},fmt(g.myShare)),
            el('div',{class:'t-meta'},g.pctDone+'% · '+fmt(g.remaining)+' to go')),
          el('div',{class:'prog-wrap prog-track-lg'},
            el('div',{class:'prog-fill',style:{width:g.pctDone+'%',background:stateCol}}))
        );

        // When behind, show the gap as three numbers rather than one red word
