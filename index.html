function recurringScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const resultsWrap = el('div',{});
  const CONF_LABELS = {1:'High', 0.9:'High', 0.85:'High', 0.8:'Medium', 0.75:'Medium', 0.7:'Low'};
  const CONF_COLORS = {'High':'var(--green)','Medium':'var(--amber)','Low':'var(--text3)'};

  async function load(){
    resultsWrap.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:20px 0;text-align:center">Analysing transactions…</div>';

    const snap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
    const val = snap.val() || {};
    const txns = Object.values(val);

    if(!txns.length){
      resultsWrap.innerHTML = '';
      resultsWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'30px',color:'var(--text2)',fontSize:'13px'}},
        'No transactions yet. Import a statement first.'));
      return;
    }

    const patterns = detectRecurring(txns);
    const savedPatterns = await recurringDB.getAll();
    const savedIds = new Set(savedPatterns.map(p=>p.merchant));

    resultsWrap.innerHTML = '';

    if(!patterns.length){
      resultsWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'30px',color:'var(--text2)',fontSize:'13px'}},
        'No recurring patterns detected yet. More transaction history will improve detection.'));
      return;
    }

    // Confirmed patterns
    const confirmed = savedPatterns.filter(p=>p.status==='confirmed');
    if(confirmed.length){
      resultsWrap.append(el('div',{class:'section-hdr'},'Confirmed recurring'));
      for(const p of confirmed){
        const card = el('div',{class:'card',style:{marginBottom:'8px',borderLeft:'3px solid var(--green)'}});
        card.append(
          el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
            el('div',{},
              el('div',{style:{fontWeight:'600',fontSize:'14px'}},p.merchant),
              el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'2px'}},p.frequency+' · Next: '+p.nextExpected)
            ),
            el('div',{style:{textAlign:'right'}},
              el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--red)'}},fmt(p.typicalAmount)),
              el('div',{style:{fontSize:'11px',color:'var(--text3)'}},p.observations+' observed')
            )
          )
        );
        const delBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'12px',padding:'4px 0',marginTop:'8px'}},'Remove');
        delBtn.addEventListener('click',async()=>{ await recurringDB.delete(p.id); load(); });
        card.append(delBtn);
        resultsWrap.append(card);
      }
    }

    // Detected patterns (not yet confirmed)
    const unconfirmed = patterns.filter(p=>!savedIds.has(p.merchant));
    if(unconfirmed.length){
      resultsWrap.append(el('div',{class:'section-hdr'},'Possible recurring payments'));
      for(const p of unconfirmed){
        const confLabel = Object.entries(CONF_LABELS).find(([k])=>parseFloat(k)<=p.confidence)?.[1]||'Low';
        const confColor = CONF_COLORS[confLabel];
        const card = el('div',{class:'card',style:{marginBottom:'8px',borderLeft:'3px solid '+confColor}});
        card.append(
          el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}},
            el('div',{},
              el('div',{style:{fontWeight:'600',fontSize:'14px'}},p.merchant),
              el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'2px'}},
                p.frequency+' · '+p.observations+' observations')
            ),
            el('div',{style:{textAlign:'right'}},
              el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--red)'}},fmt(p.typicalAmount)),
              el('div',{style:{fontSize:'11px',color:confColor,marginTop:'2px'}},confLabel+' confidence')
            )
          ),
          el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'var(--text2)',marginBottom:'10px'}},
            el('span',{},'Last: '+p.lastPayment),
            el('span',{},'Next expected: '+p.nextExpected)
          )
        );
        const btnRow = el('div',{style:{display:'flex',gap:'8px'}});
        const confirmBtn = el('button',{style:{flex:'1',background:'var(--green)',color:'#000',border:'none',borderRadius:'10px',padding:'8px',fontWeight:'700',fontSize:'13px'}},'Confirm');
        const ignoreBtn = el('button',{style:{flex:'1',background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'8px',fontSize:'13px'}},'Ignore');
        confirmBtn.addEventListener('click',async()=>{
          await recurringDB.save({...p, status:'confirmed'});
          load();
        });
        ignoreBtn.addEventListener('click',async()=>{
          await recurringDB.save({...p, status:'ignored'});
          load();
        });
        btnRow.append(confirmBtn, ignoreBtn);
        card.append(btnRow);
        resultsWrap.append(card);
      }
    }

    if(!confirmed.length && !unconfirmed.length){
      resultsWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'24px',color:'var(--text2)',fontSize:'13px'}},
        'All recurring patterns have been reviewed.'));
    }
  }

  content.append(resultsWrap);
  load();
  return content;
}

// A transaction needs review only when there is still a decision to make —
// not merely because you have not tapped it. Anything with a usable category,
// however it got there, is settled.
function needsReview(t){
  if(!t) return false;
  if(t.userConfirmed) return false;
  const c = t.userCategory || t.category;
  if(!c) return true;
  return c === 'Uncategorised' || c === 'Other';
}

function autoCategorise(txn){
  // Never reclassify income as spending on the strength of a merchant match
  if(txn.financialType === 'INCOME') return {category:'Income', financialType:'INCOME'};
  if(txn.financialType === 'REFUND') return {category:'Refund', financialType:'REFUND'};
  const hay = ((txn.normalisedMerchant||'')+' '+(txn.rawDescription||'')+' '+(txn.rawMemo||'')).toUpperCase();
  for(const [pat, category, ftype] of AUTO_RULES){
    if(pat.test(hay)){
      return {category, financialType: ftype || txn.financialType};
    }
  }
  return null;
}

// ── Bulk categorisation ──
// Categorise a merchant once and apply it to every matching transaction,
// past and future. Turns hundreds of individual edits into a handful.
const STANDARD_CATEGORIES = ['Housing','Groceries','Eating out','Transport','Shopping','Health',
  'Entertainment','Bars & Nights out','Travel','Bills','Subscriptions',
  'Personal care','Education','Gifts','Other'];

async function applyCategoryToMerchant(merchant, category, txnsForMerchant){
  const now = new Date().toISOString();
  // Update every matching transaction, in batches
  const updates = {};
  for(const t of txnsForMerchant){
    updates['users/'+currentUser.uid+'/transactions/'+t.transactionId] = {
      ...t, userCategory:category, category, userConfirmed:true, updatedAt:now,
    };
  }
  const keys = Object.keys(updates);
  for(let i=0;i<keys.length;i+=100){
    const slice = {};
    for(const k of keys.slice(i,i+100)) slice[k]=updates[k];
    await db.ref().update(slice);
  }
  // Remember the decision for future imports
  const ruleId = 'mr_'+merchant.replace(/\W/g,'').toLowerCase();
  const ex = await db.ref('users/'+currentUser.uid+'/merchantRules/'+ruleId).once('value');
  await db.ref('users/'+currentUser.uid+'/merchantRules/'+ruleId).set({
    id:ruleId, matchPattern:merchant.toUpperCase(), normalisedMerchant:merchant,
    preferredCategory:category, preferredSubcategory:null, financialType:'EXPENSE',
    confirmationCount:(ex.val()&&ex.val().confirmationCount||0)+1, active:true,
    createdAt:(ex.val()&&ex.val().createdAt)||now, updatedAt:now,
  });
  return txnsForMerchant.length;
}

function bulkCategoriseScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const wrap = el('div',{});
  content.append(wrap);
  wrap.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:30px">Grouping your uncategorised transactions…</div>';

  let groups = [];
  let doneCount = 0;

  async function load(){
    const snap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
    const all = Object.values(snap.val()||{});
    const pending = all.filter(t=>t.direction==='debit' && needsReview(t));

    const byMerchant = {};
    for(const t of pending){
      const m = t.normalisedMerchant || t.rawDescription || 'Unknown';
      if(!byMerchant[m]) byMerchant[m]={merchant:m, txns:[], total:0};
      byMerchant[m].txns.push(t);
      byMerchant[m].total += t.amount;
    }
    groups = Object.values(byMerchant).sort((a,b)=>b.txns.length-a.txns.length || b.total-a.total);
    render();
  }

  function render(){
    wrap.innerHTML='';
    const remaining = groups.reduce((s,g)=>s+g.txns.length,0);

    const head = el('div',{class:'card',style:{marginBottom:'12px'}});

    // How many can be sorted without any input from you?
    let autoable = 0;
    for(const g of groups) if(autoCategorise(g.txns[0])) autoable += g.txns.length;

    if(remaining===0){
      head.append(
        el('div',{style:{fontSize:'28px',textAlign:'center',marginBottom:'8px'}},'✅'),
        el('div',{style:{fontWeight:'700',fontSize:'16px',textAlign:'center',marginBottom:'6px'}},'Everything is categorised'),
        el('div',{style:{fontSize:'13px',color:'var(--text2)',textAlign:'center'}},
          doneCount?doneCount+' transactions sorted this session.':'Nothing left to review.')
      );
      wrap.append(head);
      return;
    }

    head.append(
      el('div',{style:{fontWeight:'700',fontSize:'16px',marginBottom:'4px'}},remaining+' transactions to sort'),
      el('div',{style:{fontSize:'13px',color:'var(--text2)',lineHeight:'1.6'}},
        'Grouped by merchant, biggest first. Choosing a category files every transaction from that merchant at once and remembers it for future imports.'+
        (doneCount?' '+doneCount+' done so far.':''))
    );
    wrap.append(head);

    // One tap handles every merchant the app already recognises
    if(autoable>0){
      const autoCard = el('div',{class:'card',style:{marginBottom:'12px',borderLeft:'3px solid var(--green)'}});
      autoCard.append(
        el('div',{style:{fontWeight:'700',fontSize:'14px',marginBottom:'4px'}},'Sort '+autoable+' automatically'),
        el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'10px',lineHeight:'1.6'}},
          'Beryl, buses, Tesco, Apple, Uber and the other merchants the app recognises can be filed without your input. You can change any of them afterwards.')
      );
      const autoBtn = el('button',{class:'btn-primary'},'Auto-sort '+autoable+' transactions');
      const autoStatus = el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'8px',minHeight:'14px'}});
      autoBtn.addEventListener('click',async()=>{
        autoBtn.disabled=true;
        let done=0;
        try{
          for(const g of [...groups]){
            const guess = autoCategorise(g.txns[0]);
            if(!guess) continue;
            autoStatus.textContent='Filing '+g.merchant+'…';
            const now=new Date().toISOString();
            const updates={};
            for(const t of g.txns){
              updates['users/'+currentUser.uid+'/transactions/'+t.transactionId]={
                ...t, userCategory:guess.category, category:guess.category,
                financialType:guess.financialType||t.financialType,
                userConfirmed:true, updatedAt:now,
              };
            }
            const keys=Object.keys(updates);
            for(let i=0;i<keys.length;i+=100){
              const slice={}; for(const k of keys.slice(i,i+100)) slice[k]=updates[k];
              await db.ref().update(slice);
            }
            done+=g.txns.length;
            groups=groups.filter(x=>x.merchant!==g.merchant);
          }
          doneCount+=done;
          render();
        }catch(err){
          autoStatus.textContent='Stopped after '+done+' — '+(err.message||'try again');
          autoStatus.style.color='var(--red)';
          autoBtn.disabled=false;
        }
      });
      autoCard.append(autoBtn, autoStatus);
      wrap.append(autoCard);
    }

    for(const g of groups.slice(0,25)){
      const card = el('div',{class:'card',style:{marginBottom:'8px'}});
      card.append(
        el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px',gap:'10px'}},
          el('div',{style:{minWidth:'0'}},
            el('div',{style:{fontWeight:'600',fontSize:'14px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},g.merchant),
            el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},
              g.txns.length+' transaction'+(g.txns.length===1?'':'s')+' · avg '+fmt(g.total/g.txns.length))
          ),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'15px',color:'var(--red)',flexShrink:'0'}},fmt(g.total))
        )
      );

      const status = el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'6px',minHeight:'14px'}});
      const chips = el('div',{style:{display:'flex',flexWrap:'wrap',gap:'5px'}});
      for(const c of STANDARD_CATEGORIES){
        const chip = el('button',{style:{background:'var(--surface2)',color:'var(--text2)',
          border:'1px solid var(--border)',borderRadius:'100px',padding:'5px 11px',
          fontSize:'11px',fontWeight:'600'}},c);
        chip.addEventListener('click',async()=>{
          chips.querySelectorAll('button').forEach(b=>b.disabled=true);
          chip.style.background='var(--green)'; chip.style.color='#000'; chip.style.border='none';
          status.textContent='Filing '+g.txns.length+' transactions…';
          try{
            const n = await applyCategoryToMerchant(g.merchant, c, g.txns);
            doneCount += n;
            groups = groups.filter(x=>x.merchant!==g.merchant);
            render();
          }catch(err){
            status.textContent='Could not save — '+(err.message||'try again');
            status.style.color='var(--red)';
            chips.querySelectorAll('button').forEach(b=>b.disabled=false);
          }
        });
        chips.append(chip);
      }
      card.append(chips, status);
      wrap.append(card);
    }

    if(groups.length>25){
      wrap.append(el('div',{style:{fontSize:'12px',color:'var(--text3)',textAlign:'center',padding:'12px'}},
        '+'+(groups.length-25)+' more merchants — sort these first and reopen.'));
    }
  }

  load().catch(err=>{
    wrap.innerHTML='';
    wrap.append(el('div',{class:'card',style:{color:'var(--red)'}},'Could not load transactions: '+err.message));
  });
  return content;
}

function merchantRulesScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const rulesWrap = el('div',{});

  async function loadRules(){
    rulesWrap.innerHTML='';
    const rules = await merchantRulesDB.getAll();
    if(!rules.length){
      rulesWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'24px',color:'var(--text2)',fontSize:'13px'}},
        'No merchant rules yet. Rules are created when you edit a transaction\'s category or merchant.'));
      return;
    }
    rulesWrap.append(el('div',{class:'section-hdr'},'Your merchant rules'));
    for(const rule of rules.filter(r=>r.active).sort((a,b)=>b.confirmationCount-a.confirmationCount)){
      const card = el('div',{class:'card',style:{marginBottom:'8px'}});
      card.append(
        el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
          el('div',{},
            el('div',{style:{fontWeight:'600',fontSize:'14px'}},rule.normalisedMerchant),
            el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'2px'}},
              'Pattern: "'+rule.matchPattern+'" → '+rule.preferredCategory+(rule.preferredSubcategory?' / '+rule.preferredSubcategory:'')),
            el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},
              rule.confirmationCount+' confirmation'+(rule.confirmationCount!==1?'s':''))
          ),
          el('button',{style:{background:'none',color:'var(--red)',fontSize:'18px',padding:'0',flexShrink:'0'}},'×')
        )
      );
      card.querySelector('button').addEventListener('click',async()=>{ await merchantRulesDB.delete(rule.id); loadRules(); });
      rulesWrap.append(card);
    }
  }

  // Add rule manually
  const formCard = el('div',{class:'card',style:{marginBottom:'12px'}});
  formCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;font-family:'Space Grotesk',sans-serif">Add merchant rule</div>`;
  const patternInp = el('input',{placeholder:'Match pattern (e.g. TESCO)',style:{marginBottom:'10px'}});
  const merchantInp = el('input',{placeholder:'Display name (e.g. Tesco)',style:{marginBottom:'10px'}});
  const catInp = el('input',{placeholder:'Category (e.g. Groceries)',style:{marginBottom:'10px'}});
  const subCatInp = el('input',{placeholder:'Subcategory (optional)',style:{marginBottom:'14px'}});
  const addBtn = el('button',{class:'btn-primary',style:{fontSize:'14px',padding:'11px'}},'Add rule');
  addBtn.addEventListener('click',async()=>{
    if(!patternInp.value.trim()||!merchantInp.value.trim()) return;
    const rule = {
      id:'mr_'+Date.now(),
      matchPattern:patternInp.value.trim().toUpperCase(),
      normalisedMerchant:merchantInp.value.trim(),
      preferredCategory:catInp.value.trim()||'Uncategorised',
      preferredSubcategory:subCatInp.value.trim()||null,
      financialType:'EXPENSE',
      confirmationCount:1,
      active:true,
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString(),
    };
    await merchantRulesDB.save(rule);
    patternInp.value=''; merchantInp.value=''; catInp.value=''; subCatInp.value='';
    addBtn.textContent='Added ✓';
    setTimeout(()=>{addBtn.textContent='Add rule'; loadRules();},1500);
  });
  formCard.append(patternInp,merchantInp,catInp,subCatInp,addBtn);

  content.append(
    el('div',{class:'section-hdr'},'Merchant Rules'),
    el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'12px',lineHeight:'1.6'}},'Rules are user-specific — your classifications never affect other users. When you edit a transaction, the rule is automatically suggested for future imports.'),
    formCard,
    rulesWrap
  );
  loadRules();
  return content;
}

function trendsScreen(){
  const paychecks = (appData.paychecks || []).filter(p => p.snapshot);
  const hoursLog = appData.hoursLog || [];
  const actualPay = appData.actualPay || {};
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const subTotal = (appData.subscriptions||[]).reduce((s,x)=>s+x.amount,0);

  if(paychecks.length < 2 && hoursLog.length < 4){
    content.append(el('div',{class:'card',style:{textAlign:'center',padding:'40px 20px'}},
      el('div',{style:{fontSize:'32px',marginBottom:'12px'}},'📈'),
      el('div',{style:{fontWeight:'600'}},'Not enough data yet')
    ));
    return content;
  }

  const fmtK = v => {
    const abs = Math.abs(v);
    if(abs>=1000) return (v<0?'-':'')+'£'+(abs/1000).toFixed(1)+'k';
    return (v<0?'-£':'£')+Math.round(abs);
  };

  function makeGraph(label, color, values, dates, fromZero){
    if(values.length < 2) return el('div',{});
    const W=Math.min(window.innerWidth-40,440),H=150;
    const PAD={top:10,right:16,bottom:28,left:52};
    const iW=W-PAD.left-PAD.right, iH=H-PAD.top-PAD.bottom;
    const min=fromZero?0:Math.min(...values), max=Math.max(...values,1), range=max-min||1;
    const xStep=values.length>1?iW/(values.length-1):iW;
    const yScale=v=>iH-((v-min)/range)*iH;
    const pts=values.map((v,i)=>[PAD.left+i*xStep,PAD.top+yScale(v)]);
    const polyline=pts.map(p=>p.join(',')).join(' ');
    const fillPath=`M${pts[0][0]},${PAD.top+iH} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${PAD.top+iH} Z`;
    const yLabels=[min,min+range*0.5,max].map(v=>{
      const y=PAD.top+yScale(v);
      return `<text x="${PAD.left-4}" y="${y+3}" text-anchor="end" fill="#555" font-size="9" font-family="Space Mono,monospace">${fmtK(v)}</text>`;
    }).join('');
    const xLabels=dates.map((d,i)=>{
      if(values.length>8&&i%Math.ceil(values.length/5)!==0&&i!==values.length-1) return '';
      const x=PAD.left+i*xStep;
      const parts=d.includes('/')?d.split('/'):[]; 
      const lbl=parts.length>=2?parts[0]+'/'+parts[1]:new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
      return `<text x="${x}" y="${H-4}" text-anchor="middle" fill="#555" font-size="8" font-family="Space Grotesk,sans-serif">${lbl}</text>`;
    }).join('');
    const dots=values.map((v,i)=>{
      const [x,y]=pts[i];
      const isMax=v===Math.max(...values),isMin=v===Math.min(...values);
      const c=isMax?'var(--green)':isMin?'var(--red)':color;
      return `<circle cx="${x}" cy="${y}" r="${isMax||isMin?4:2.5}" fill="${c}" stroke="#0D0D0D" stroke-width="1.5"/>`;
    }).join('');
    const gid='g'+Math.random().toString(36).slice(2,6);
    const svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${fillPath}" fill="url(#${gid})"/>
      <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${yLabels}${xLabels}${dots}</svg>`;
    const wrap=el('div',{class:'card',style:{overflowX:'auto',padding:'16px 20px'}});
    wrap.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${color};margin-bottom:10px;font-family:'Space Grotesk',sans-serif">${label}</div>${svg}`;
    return wrap;
  }

  function makeBarChart(label, color, values, labels){
    if(values.length===0) return el('div',{});
    const W=Math.min(window.innerWidth-40,440),H=150;
    const PAD={top:10,right:8,bottom:28,left:52};
    const iW=W-PAD.left-PAD.right,iH=H-PAD.top-PAD.bottom;
    const max=Math.max(...values,1);
    const barW=Math.max(4,iW/values.length*0.7),gap=iW/values.length;
    const bars=values.map((v,i)=>{
      const x=PAD.left+i*gap+(gap-barW)/2;
      const bh=(v/max)*iH, y=PAD.top+iH-bh;
      const isMax=v===Math.max(...values),isMin=v>0&&v===Math.min(...values.filter(x=>x>0));
      const c=isMax?'var(--green)':isMin?'var(--red)':color;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${c}" rx="3"/>`;
    }).join('');
    const xLbls=labels.map((l,i)=>{
      if(values.length>10&&i%Math.ceil(values.length/8)!==0&&i!==values.length-1) return '';
      return `<text x="${PAD.left+i*gap+gap/2}" y="${H-4}" text-anchor="middle" fill="#555" font-size="8" font-family="Space Grotesk,sans-serif">${l}</text>`;
    }).join('');
    const yLbls=[0,Math.round(max/2),Math.round(max)].map(v=>{
      const y=PAD.top+iH-(v/max)*iH;
      return `<text x="${PAD.left-4}" y="${y+3}" text-anchor="end" fill="#555" font-size="9" font-family="Space Mono,monospace">${fmtK(v)}</text>`;
    }).join('');
    const svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">${bars}${yLbls}${xLbls}</svg>`;
    const wrap=el('div',{class:'card',style:{overflowX:'auto',padding:'16px 20px'}});
    wrap.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${color};margin-bottom:10px;font-family:'Space Grotesk',sans-serif">${label}</div>${svg}`;
    return wrap;
  }

  const sorted=[...paychecks].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const dates=sorted.map(p=>p.date.slice(0,10));
  const florasiiSeries=sorted.map(p=>p.snapshot.florasii);
  const currentSeries=sorted.map(p=>p.snapshot.current);
  const ccSeries=sorted.map(p=>p.snapshot.creditCard);
  const realPays=sorted.filter(p=>p.income>0);
  const incomeSeries=realPays.map(p=>p.income);
  const incomeDates=realPays.map(p=>p.date.slice(0,10));
  const spentSeries=realPays.map(p=>p.spent||0);
  const totalIncome=realPays.reduce((s,p)=>s+p.income,0);
  const totalSpent=realPays.reduce((s,p)=>s+(p.spent||0),0);
  const avgIncome=totalIncome/Math.max(realPays.length,1);
  const netWorthSeries=sorted.map(p=>p.snapshot.florasii+(p.snapshot.personalSavings||0)-p.snapshot.creditCard);

  const monthlyIncome={},monthlySpend={};
  for(const p of realPays){
    const d=new Date(p.date);
    const key=d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
    monthlyIncome[key]=(monthlyIncome[key]||0)+p.income;
    monthlySpend[key]=(monthlySpend[key]||0)+(p.spent||0);
  }
  const monthKeys=Object.keys(monthlyIncome);

  const parseLabel=l=>{const p=l.split('/');return new Date(`${p[2]}-${p[1]}-${p[0]}`);};
  const sortedHours=[...hoursLog].sort((a,b)=>parseLabel(a.label)-parseLabel(b.label));
  const pairs=[];
  for(let i=0;i<sortedHours.length;i+=2) pairs.push({w1:sortedHours[i],w2:sortedHours[i+1]});
  const pairsWithActual=pairs.filter(({w1})=>actualPay[w1.id+'_actual']);
  const predictedVals=pairsWithActual.map(({w1,w2})=>(w1.total+(w2?w2.total:0))*14.5);
  const actualVals=pairsWithActual.map(({w1})=>actualPay[w1.id+'_actual']);
  const pairLabels=pairsWithActual.map(({w1})=>w1.label.slice(0,5));
  const predVsActualDiff=pairsWithActual.map((_,i)=>actualVals[i]-predictedVals[i]);

  const florasiiNow=appData.balances?.florasii||0;
  const florasiiGoal=(appData.goals||[]).filter(g=>g.active!==false)
    .reduce((s,g)=>s+(g.target||0),0) || 0;
  const florasiiRemaining=Math.max(0,florasiiGoal-florasiiNow);
  const florasiiGrowth=florasiiSeries.length>1?florasiiSeries[florasiiSeries.length-1]-florasiiSeries[0]:0;
  const avgFlorasiiPerPay=florasiiGrowth/Math.max(realPays.length,1);
  const paysToGoal=avgFlorasiiPerPay>0?Math.ceil(florasiiRemaining/avgFlorasiiPerPay):'?';
  const weeksToGoal=typeof paysToGoal==='number'?paysToGoal*2:'?';
  const subPct=avgIncome>0?((subTotal/avgIncome)*100).toFixed(1):0;
  const pct=Math.min(100,Math.round(florasiiNow/florasiiGoal*100));
  const r=42,c=2*Math.PI*r;
  const bestMonth=monthKeys.length?monthKeys[Object.values(monthlyIncome).indexOf(Math.max(...Object.values(monthlyIncome)))]:'-';

  const countdownCard=el('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'16px'}});
  const dialDiv=el('div',{style:{position:'relative',width:'100px',height:'100px',flexShrink:'0'}});
  dialDiv.innerHTML=`<svg width="100" height="100" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="9"/>
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--green)" stroke-width="9"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct/100)).toFixed(1)}" stroke-linecap="round"/>
  </svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
    <span style="font-family:'Space Mono',monospace;font-size:20px;font-weight:700">${pct}%</span>
    <span style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px">to goal</span>
  </div>`;
  countdownCard.append(dialDiv, el('div',{style:{flex:'1'}},
    el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'4px'}},'Savings'),
    el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'22px',fontWeight:'700',color:'var(--green)'}},fmt(florasiiNow)),
    el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'4px'}},fmt(florasiiRemaining)+' remaining'),
    el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'6px'}},
      typeof paysToGoal==='number'?`~${paysToGoal} paychecks (${weeksToGoal} weeks) at current rate`:'Log more paychecks to estimate')
  ));

  const subCard=el('div',{class:'card'});
  subCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:12px;font-family:'Space Grotesk',sans-serif">Subscriptions impact</div>
    <div class="balance-row"><span class="balance-label">Monthly cost</span><span class="balance-value" style="color:var(--red)">${fmt(subTotal)}</span></div>
    <div class="balance-row"><span class="balance-label">% of avg paycheck</span><span class="balance-value" style="color:var(--red)">${subPct}%</span></div>
    <div class="balance-row"><span class="balance-label">Annual cost</span><span class="balance-value" style="color:var(--red)">${fmt(subTotal*12)}</span></div>
    <div class="balance-row" style="border:none"><span class="balance-label">Paychecks/year on subs</span><span class="balance-value">${(subTotal*12/avgIncome).toFixed(1)}</span></div>`;

  const statsCard=el('div',{class:'card'});
  statsCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:12px;font-family:'Space Grotesk',sans-serif">All time</div>
    <div class="balance-row"><span class="balance-label">Total income tracked</span><span class="balance-value" style="color:var(--green)">${fmt(totalIncome)}</span></div>
    <div class="balance-row"><span class="balance-label">Total spent (logged)</span><span class="balance-value" style="color:var(--amber)">${fmt(totalSpent)}</span></div>
    <div class="balance-row"><span class="balance-label">Avg income / paycheck</span><span class="balance-value">${fmt(avgIncome)}</span></div>
    <div class="balance-row"><span class="balance-label">Best month</span><span class="balance-value" style="color:var(--green)">${bestMonth}</span></div>
    <div class="balance-row" style="border:none"><span class="balance-label">Paychecks logged</span><span class="balance-value">${realPays.length}</span></div>`;

  let accuracyCard=null;
  if(predVsActualDiff.length>=3){
    const avgDiff=predVsActualDiff.reduce((s,v)=>s+v,0)/predVsActualDiff.length;
    const W=Math.min(window.innerWidth-40,440),H=130;
    const PAD={top:10,right:8,bottom:28,left:52};
    const iW=W-PAD.left-PAD.right,iH=H-PAD.top-PAD.bottom;
    const maxAbs=Math.max(...predVsActualDiff.map(Math.abs),1);
    const midY=PAD.top+iH/2,gap=iW/predVsActualDiff.length;
    const barW=Math.max(4,gap*0.7);
    const bars=predVsActualDiff.map((v,i)=>{
      const x=PAD.left+i*gap+(gap-barW)/2,bh=(Math.abs(v)/maxAbs)*(iH/2);
      const y=v>=0?midY-bh:midY;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="${v>=0?'var(--green)':'var(--red)'}" rx="2"/>`;
    }).join('');
    const xLbls=pairLabels.map((l,i)=>{
      if(predVsActualDiff.length>8&&i%Math.ceil(predVsActualDiff.length/6)!==0) return '';
      return `<text x="${PAD.left+i*gap+gap/2}" y="${H-4}" text-anchor="middle" fill="#555" font-size="7" font-family="Space Grotesk,sans-serif">${l}</text>`;
    }).join('');
    accuracyCard=el('div',{class:'card',style:{overflowX:'auto',padding:'16px 20px'}});
    accuracyCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#CE93D8;margin-bottom:4px;font-family:'Space Grotesk',sans-serif">Actual vs predicted pay</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px">Avg ${avgDiff>=0?'+':''}${fmt(avgDiff)} per paycheck vs estimate</div>
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">
      <line x1="${PAD.left}" y1="${midY}" x2="${PAD.left+iW}" y2="${midY}" stroke="var(--border)" stroke-width="1"/>
      <text x="${PAD.left-4}" y="${midY+3}" text-anchor="end" fill="#555" font-size="8" font-family="Space Mono,monospace">0</text>
      ${bars}${xLbls}</svg>`;
  }

  content.append(
    el('div',{class:'section-hdr'},'Savings Goal'),
    countdownCard,
    el('div',{class:'section-hdr'},'Net Worth over time'),
    makeGraph('Net worth (savings − credit card)','#64B5F6',netWorthSeries,dates),
    el('div',{class:'section-hdr'},'Savings'),
    makeGraph('Savings — running balance','var(--green)',florasiiSeries,dates),
    el('div',{class:'section-hdr'},'Spending'),
    makeGraph('Spending — running balance','#4FC3F7',currentSeries,dates)
  );
  if(ccSeries.some(v=>v>0)) content.append(
    el('div',{class:'section-hdr'},'Credit Card'),
    makeGraph('Credit Card — amount owed','var(--red)',ccSeries,dates)
  );
  content.append(
    el('div',{class:'section-hdr'},'Monthly income'),
    makeBarChart('Income by month','var(--amber)',monthKeys.map(k=>monthlyIncome[k]),monthKeys),
    el('div',{class:'section-hdr'},'Monthly spending'),
    makeBarChart('Spending by month','#CE93D8',monthKeys.map(k=>monthlySpend[k]),monthKeys),
    el('div',{class:'section-hdr'},'Income per paycheck'),
    makeGraph('Income per paycheck','var(--amber)',incomeSeries,incomeDates,true),
    el('div',{class:'section-hdr'},'Spending per paycheck'),
    makeGraph('Spending per paycheck','#CE93D8',spentSeries,incomeDates,true),
  );
  // ── Pay consistency score ──
  const consistencyCard = el('div',{class:'card'});
  if(incomeSeries.length >= 3){
    const mean = avgIncome;
    const variance = incomeSeries.reduce((s,v)=>s+Math.pow(v-mean,2),0)/incomeSeries.length;
    const stdDev = Math.sqrt(variance);
    const cv = (stdDev/mean*100); // coefficient of variation
    const score = Math.max(0,Math.round(100 - cv));
    const scoreColor = score>=75?'var(--green)':score>=50?'var(--amber)':'var(--red)';
    const scoreLabel = score>=75?'Consistent':'Moderate variance';
    const W=Math.min(window.innerWidth-40,440), barW=Math.max(0,Math.min(1,score/100))*((W-40));
    consistencyCard.innerHTML=`
      <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:${scoreColor};margin-bottom:12px;font-family:'Space Grotesk',sans-serif">Pay consistency</div>
      <div style="display:flex;align-items:flex-end;gap:12px;margin-bottom:12px">
        <div style="font-family:'Space Mono',monospace;font-size:48px;font-weight:700;color:${scoreColor};line-height:1">${score}</div>
        <div style="padding-bottom:8px">
          <div style="font-size:14px;font-weight:600">${scoreLabel}</div>
          <div style="font-size:12px;color:var(--text2)">out of 100</div>
        </div>
      </div>
      <div style="background:var(--surface2);border-radius:100px;height:8px;overflow:hidden;margin-bottom:16px">
        <div style="height:100%;width:${barW}px;background:${scoreColor};border-radius:100px;transition:width .6s"></div>
      </div>
      <div class="balance-row"><span class="balance-label">Avg paycheck</span><span class="balance-value">${fmt(mean)}</span></div>
      <div class="balance-row"><span class="balance-label">Std deviation</span><span class="balance-value">${fmt(stdDev)}</span></div>
      <div class="balance-row"><span class="balance-label">Lowest paycheck</span><span class="balance-value" style="color:var(--red)">${fmt(Math.min(...incomeSeries))}</span></div>
      <div class="balance-row" style="border:none"><span class="balance-label">Highest paycheck</span><span class="balance-value" style="color:var(--green)">${fmt(Math.max(...incomeSeries))}</span></div>
    `;
  } else {
    consistencyCard.innerHTML='<div style="color:var(--text3);font-size:13px">Log more paychecks to see your consistency score.</div>';
  }

  // ── Trip savings planner ──
  const tripCard = el('div',{class:'card'});
  tripCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:14px;font-family:'Space Grotesk',sans-serif">Trip savings planner</div>`;
  const tripNameInp = el('input',{placeholder:'Trip name (e.g. Philippines Nov)',style:{marginBottom:'10px'}});
  const tripGoalInp = el('input',{inputmode:'decimal',placeholder:'Target amount (£)',style:{marginBottom:'10px'}});
  const tripDateInp = el('input',{type:'date',style:{marginBottom:'10px'}});
  const tripResult = el('div',{style:{background:'var(--surface2)',borderRadius:'12px',padding:'14px',marginTop:'4px',display:'none'}});
  const tripCalcBtn = el('button',{class:'btn-primary',style:{fontSize:'14px',padding:'12px'}},'Calculate');
  tripCalcBtn.addEventListener('click',()=>{
    const target = parseFloat(tripGoalInp.value)||0;
    const tripDate = new Date(tripDateInp.value);
    const now = new Date();
    if(!target||!tripDateInp.value||tripDate<=now){
      tripResult.style.display='block';
      tripResult.innerHTML='<div style="color:var(--red);font-size:13px">Enter a valid target and future date.</div>';
      return;
    }
    const msPerDay = 86400000;
    const daysLeft = Math.ceil((tripDate-now)/msPerDay);
    const payPeriods = Math.max(1,Math.floor(daysLeft/14));
    const florasiiNow = appData.balances?.florasii||0;
    const still = Math.max(0,target-florasiiNow);
    const perPaycheck = still/payPeriods;
    const pctOfAvg = avgIncome>0?(perPaycheck/avgIncome*100).toFixed(1):0;
    tripResult.style.display='block';
    tripResult.innerHTML=`
      <div style="font-size:13px;color:var(--text2);margin-bottom:10px">${tripNameInp.value||'Trip'} · ${daysLeft} days away</div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">Already saved</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--green)">${fmt(florasiiNow)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">Still needed</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700">${fmt(still)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">Paychecks remaining</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700">${payPeriods}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0">
        <span style="font-size:13px;color:var(--text2)">Save per paycheck</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:${perPaycheck>avgIncome*0.8?'var(--red)':'var(--green)'}">${fmt(perPaycheck)} <span style="font-size:11px;color:var(--text3)">(${pctOfAvg}% of avg pay)</span></span>
      </div>
      ${perPaycheck>avgIncome*0.75?'<div style="margin-top:10px;padding:10px;background:var(--red-dim);border-radius:10px;font-size:12px;color:var(--red)">⚠️ This is more than 75% of your average paycheck — consider a lower target or later date.</div>':''}
    `;
  });
  tripCard.append(tripNameInp,tripGoalInp,tripDateInp,tripCalcBtn,tripResult);

  // ── What-if calculator ──
  const whatifCard = el('div',{class:'card'});
  whatifCard.innerHTML=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:14px;font-family:'Space Grotesk',sans-serif">"What if" calculator</div>`;
  const wiHoursInp = el('input',{inputmode:'decimal',placeholder:'Extra hours this period',style:{marginBottom:'10px'}});
  const wiResult = el('div',{style:{background:'var(--surface2)',borderRadius:'12px',padding:'14px',marginTop:'4px',display:'none'}});
  const wiBtn = el('button',{style:{background:'var(--amber)',color:'#000',borderRadius:'12px',padding:'13px',width:'100%',fontWeight:'700',fontSize:'14px'}},'Calculate');
  const RATE = appData.hourlyRate||14.50;
  wiBtn.addEventListener('click',()=>{
    const extraH = parseFloat(wiHoursInp.value)||0;
    if(!extraH){ wiResult.style.display='none'; return; }
    const extraGross = extraH * RATE;
    const extraFlorasii = extraGross * 0.75; // 75% split to Florasii when no CC
    const extraSpending = extraGross * 0.25;
    const florasiiNow = appData.balances?.florasii||0;
    const newFlorasii = florasiiNow + extraFlorasii;
    const goalTarget = ((appData.goals||[]).filter(g=>g.active!==false&&g.target)
      .reduce((s,g)=>s+g.target,0)) || 15000;
    const newPct = Math.min(100,(newFlorasii/goalTarget*100)).toFixed(1);
    wiResult.style.display='block';
    wiResult.innerHTML=`
      <div style="font-size:13px;color:var(--text2);margin-bottom:10px">${extraH}h extra at £${RATE}/hr</div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">Extra take-home</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--amber)">${fmt(extraGross)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">→ Extra to savings (75%)</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--green)">${fmt(extraFlorasii)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:13px;color:var(--text2)">→ Extra spending (25%)</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700">${fmt(extraSpending)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0">
        <span style="font-size:13px;color:var(--text2)">Savings would reach</span>
        <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--green)">${fmt(newFlorasii)} <span style="font-size:11px;color:var(--text3)">(${newPct}%)</span></span>
      </div>
    `;
  });
  whatifCard.append(wiHoursInp,wiBtn,wiResult);

  if(accuracyCard) content.append(
    el('div',{class:'section-hdr'},'Prediction accuracy'),
    accuracyCard
  );
  content.append(
    el('div',{class:'section-hdr'},'Pay consistency'),
    consistencyCard,
    el('div',{class:'section-hdr'},'Trip savings planner'),
    tripCard,
    el('div',{class:'section-hdr'},'"What if" calculator'),
    whatifCard,
    el('div',{class:'section-hdr'},'Subscriptions'),
    subCard,
    el('div',{class:'section-hdr'},'All time stats'),
    statsCard
  );
  return content;
}

function hoursScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const RATE = appData.hourlyRate || 14.50;

  // ── Clock in / clock out ──
  // Active shift stored in Firebase so it survives page reloads.
  // Path: users/{uid}/activeShift  → {clockedIn: ISO string, note: string}
  const shiftRef = ()=> db.ref('users/'+currentUser.uid+'/activeShift');

  const clockCard = el('div',{class:'card',style:{marginBottom:'var(--s3)'}});
  const clockStatus   = el('div',{style:{fontSize:'13px',color:'var(--ink-2)',marginBottom:'var(--s3)',lineHeight:'1.6'}});
  const clockBtn      = el('button',{class:'btn-primary',style:{marginBottom:'var(--s2)'}},'Clock in');
  const clockNote     = el('input',{placeholder:'What are you working on? (optional)',style:{marginBottom:'var(--s3)',display:'none'}});
  const clockDuration = el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'28px',fontWeight:'700',
    color:'var(--accent)',letterSpacing:'-0.5px',marginBottom:'var(--s2)',display:'none'}});
  let ticker = null;

  function fmt2(n){ return String(Math.floor(n)).padStart(2,'0'); }
  function durStr(ms){
    const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=t%60;
    return fmt2(h)+':'+fmt2(m)+':'+fmt2(s);
  }

  async function loadShiftState(){
    const snap = await shiftRef().once('value');
    const shift = snap.val();
    if(shift && shift.clockedIn){
      renderClockedIn(shift);
    } else {
      renderClockedOut();
    }
  }

  function renderClockedOut(){
    if(ticker){ clearInterval(ticker); ticker=null; }
    clockDuration.style.display='none';
    clockNote.style.display='block';
    clockNote.value='';
    clockStatus.textContent='You are clocked out.';
    clockBtn.textContent='Clock in';
    clockBtn.style.background='var(--accent)';
    clockBtn.onclick=async()=>{
      const now=new Date().toISOString();
      await shiftRef().set({clockedIn:now, note:clockNote.value.trim()||null});
      renderClockedIn({clockedIn:now, note:clockNote.value.trim()||null});
    };
  }

  function renderClockedIn(shift){
    const start=new Date(shift.clockedIn);
    clockNote.style.display='none';
    clockDuration.style.display='block';
    if(shift.note) clockStatus.textContent='Working on: '+shift.note;
    else clockStatus.textContent='Clocked in at '+start.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    clockBtn.textContent='Clock out';
    clockBtn.style.background='var(--danger)';

    // Live ticker
    if(ticker) clearInterval(ticker);
    function tick(){ clockDuration.textContent=durStr(Date.now()-start); }
    tick(); ticker=setInterval(tick,1000);

    clockBtn.onclick=async()=>{
      clearInterval(ticker); ticker=null;
      const end=new Date();
      const hoursWorked=(end-start)/3600000;
      await shiftRef().remove();

      // Which day did this shift fall on?
      const dayNames=['sun','mon','tue','wed','thu','fri','sat'];
      const dayKey=dayNames[start.getDay()];
      const weekStart=new Date(start);
      weekStart.setDate(weekStart.getDate()-(weekStart.getDay()===0?6:weekStart.getDay()-1));
      const weekLabel=weekStart.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});

      // Find an existing week entry for this week or create one
      const log=[...(appData.hoursLog||[])];
      let week=log.find(w=>w.label===weekLabel);
      if(!week){
        week={id:uid(),label:weekLabel,mon:0,tue:0,wed:0,thu:0,fri:0,sat:0,sun:0,total:0,predicted:0};
        log.unshift(week);
      }
      week[dayKey]=Math.round(((week[dayKey]||0)+hoursWorked)*100)/100;
      week.total=Math.round(['mon','tue','wed','thu','fri','sat','sun'].reduce((s,d)=>s+(week[d]||0),0)*100)/100;
      week.predicted=Math.round(week.total*(appData.hourlyRate||14.50)*100)/100;

      await save({...appData,hoursLog:log});
      renderClockedOut();
      renderAll();

      // Show a summary
      clockStatus.textContent='✓ Shift saved — '+hoursWorked.toFixed(2)+'h on '+
        dayKey.charAt(0).toUpperCase()+dayKey.slice(1)+
        ' ('+fmt(hoursWorked*(appData.hourlyRate||14.50))+' earned)';
    };
  }

  clockCard.append(
    el('div',{class:'t-eyebrow',style:{marginBottom:'var(--s2)'}},'Time tracker'),
    clockDuration, clockStatus, clockNote, clockBtn
  );
  content.append(clockCard);

  loadShiftState();

  // ── Existing hours tracker below ──

  const weeks = appData.hoursLog || [];
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  // Current week being logged
  let currentHours = {mon:0,tue:0,wed:0,thu:0,fri:0,sat:0,sun:0};
  let weekLabel = '';

  function totalHours(w){ return ['mon','tue','wed','thu','fri','sat','sun'].reduce((s,d)=>s+(parseFloat(w[d])||0),0); }
  function predictedPay(h){ return h * RATE; }

  // Rate editor
  const rateWrap = el('div',{class:'card',style:{marginBottom:'0'}});
  const rateLabel = el('div',{style:{fontSize:'12px',color:'var(--text3)',marginBottom:'6px',letterSpacing:'0.5px'}},'Hourly rate (after tax, £)');
  const rateInput = el('input',{inputmode:'decimal',value:String(RATE),style:{marginBottom:'8px'}});
  const saveRateBtn = el('button',{class:'btn-primary',style:{fontSize:'14px',padding:'12px'}},'Save rate');
  saveRateBtn.addEventListener('click',async()=>{
    const r = parseFloat(rateInput.value)||14.50;
    await save({...appData, hourlyRate:r});
    saveRateBtn.textContent='Saved ✓';
    setTimeout(()=>{saveRateBtn.textContent='Save rate'; renderAll();},1500);
  });
  rateWrap.append(rateLabel, rateInput, saveRateBtn);

  // Log new week
  const logWrap = el('div',{class:'card'});
  const logTitle = el('div',{style:{fontSize:'14px',fontWeight:'600',marginBottom:'14px',color:'var(--text)'}},'Log a week');
  const weekInput = el('input',{placeholder:'Week starting (e.g. 04/08/2026)',style:{marginBottom:'12px'}});

  const dayInputs = {};
  const dayGrid = el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'6px',marginBottom:'12px'}});
  for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
    const label = el('div',{style:{fontSize:'10px',color:'var(--text3)',textAlign:'center',marginBottom:'3px',textTransform:'uppercase'}}, d.slice(0,2));
    const inp = el('input',{inputmode:'decimal',placeholder:'0',style:{padding:'10px 4px',textAlign:'center',fontSize:'14px',borderRadius:'10px'}});
    dayInputs[d] = inp;
    const col = el('div',{},label,inp);
    dayGrid.append(col);
  }

  const previewDiv = el('div',{style:{background:'var(--surface2)',borderRadius:'12px',padding:'12px',marginBottom:'12px',display:'none'}});

  function updatePreview(){
    const h = ['mon','tue','wed','thu','fri','sat','sun'].reduce((s,d)=>s+(parseFloat(dayInputs[d].value)||0),0);
    if(h>0){
      previewDiv.style.display='block';
      previewDiv.innerHTML = `<span style="color:var(--text2);font-size:13px">Total: </span><span style="font-family:'Space Mono',monospace;font-weight:700">${h.toFixed(2)}h</span><span style="color:var(--text2);font-size:13px;margin-left:12px">Predicted: </span><span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--green)">${fmt(predictedPay(h))}</span>`;
    } else {
      previewDiv.style.display='none';
    }
  }

  for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
    dayInputs[d].addEventListener('input', updatePreview);
  }

  const addWeekBtn = el('button',{class:'btn-primary',style:{fontSize:'14px',padding:'12px'}},'Add week');
  addWeekBtn.addEventListener('click',async()=>{
    if(!weekInput.value) return;
    const hrs = {};
    for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
      hrs[d] = parseFloat(dayInputs[d].value)||0;
    }
    const total = totalHours(hrs);
    if(total===0) return;
    const week = {
      id: uid(),
      label: weekInput.value.trim(),
      ...hrs,
      total,
      predicted: predictedPay(total)
    };
    const newLog = [week, ...(appData.hoursLog||[])];
    await save({...appData, hoursLog:newLog});
    weekInput.value='';
    for(const d of ['mon','tue','wed','thu','fri','sat','sun']) dayInputs[d].value='';
    previewDiv.style.display='none';
    renderAll();
  });

  logWrap.append(logTitle, weekInput, dayGrid, previewDiv, addWeekBtn);

  // History
  const histWrap = el('div',{});
  const graphWrap = el('div',{});

  let filterYear = 'all';
  let filterMonth = 'all';

  // Filter bar
  const filterBar = el('div',{style:{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap'}});
  const yearSel = el('select',{style:{flex:'1',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'10px',padding:'8px 10px',fontSize:'13px'}});
  const monthSel = el('select',{style:{flex:'1',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'10px',padding:'8px 10px',fontSize:'13px'}});

  const years = ['all','2025','2026','2027'];
  const months = ['all','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  years.forEach(y => { const o = el('option',{value:y},y==='all'?'All years':y); yearSel.append(o); });
  months.forEach((m,i) => { const o = el('option',{value:i===0?'all':String(i)},m==='all'?'All months':m); monthSel.append(o); });

  yearSel.addEventListener('change',()=>{ filterYear=yearSel.value; renderAll(); });
  monthSel.addEventListener('change',()=>{ filterMonth=monthSel.value; renderAll(); });
  filterBar.append(yearSel, monthSel);

  function renderAll(){
    histWrap.innerHTML='';
    const log = appData.hoursLog||[];
    if(log.length===0){
      histWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'30px 20px',color:'var(--text2)',fontSize:'13px'}},'No weeks logged yet — add your first week above.'));
      return;
    }

    // Sort by date ascending, then pair oldest→newest into pay periods
    const parseLabel = l => {
      const parts = l.split('/');
      return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
    };
    const sorted = [...log].sort((a,b) => parseLabel(a.label) - parseLabel(b.label));

    const pairs = [];
    for(let i=0;i<sorted.length;i+=2){
      pairs.push({w1: sorted[i], w2: sorted[i+1]});
    }

    // Apply filter
    const filtered = pairs.filter(({w1}) => {
      const d = parseLabel(w1.label);
      if(filterYear !== 'all' && String(d.getFullYear()) !== filterYear) return false;
      if(filterMonth !== 'all' && String(d.getMonth()+1) !== filterMonth) return false;
      return true;
    });

    if(filtered.length === 0){
      histWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'20px',color:'var(--text2)',fontSize:'13px'}},'No pay periods match this filter.'));
    }

    for(const {w1,w2} of filtered){
      const totalH = w1.total + (w2?w2.total:0);
      const predicted = predictedPay(totalH);
      const actualKey = w1.id + '_actual';
      const savedActual = appData.actualPay && appData.actualPay[actualKey] ? appData.actualPay[actualKey] : 0;
      const card = el('div',{class:'card',style:{marginBottom:'10px'}});

      const header = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'12px'}});
      const labelDiv = el('div',{},
        el('div',{style:{fontWeight:'600',fontSize:'14px'}}, w1.label + (w2?' → '+w2.label:' (in progress)')),
        el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'2px'}},totalH.toFixed(2)+'h total')
      );
      const payDiv = el('div',{style:{textAlign:'right'}},
        el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--green)',fontSize:'16px'}},fmt(predicted)),
        el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},'predicted')
      );
      header.append(labelDiv,payDiv);

      // day breakdown — two separate week rows with edit toggle
      let editMode = false;
      const dayInputs1 = {}, dayInputs2 = {};
      const breakdown = el('div',{style:{marginBottom:'8px'}});

      function renderBreakdown(){
        breakdown.innerHTML='';
        const days = ['mon','tue','wed','thu','fri','sat','sun'];

        // header row
        const hdrRow = el('div',{style:{display:'grid',gridTemplateColumns:'52px repeat(7,1fr)',gap:'4px',marginBottom:'4px'}});
        hdrRow.append(el('div',{}));
        for(const d of days){
          hdrRow.append(el('div',{style:{textAlign:'center',fontSize:'9px',color:'var(--text3)',textTransform:'uppercase'}},d.slice(0,2)));
        }
        breakdown.append(hdrRow);

        // week 1 row
        const w1Row = el('div',{style:{display:'grid',gridTemplateColumns:'52px repeat(7,1fr)',gap:'4px',marginBottom:'4px'}});
        const w1LabelEl = el('div',{style:{fontSize:'9px',color:'var(--text2)',display:'flex',alignItems:'center',paddingRight:'4px',whiteSpace:'nowrap',overflow:'hidden'}}, w1.label.slice(0,5));
        w1Row.append(w1LabelEl);
        for(const d of days){
          const h = w1[d]||0;
          const col = el('div',{style:{textAlign:'center'}});
          if(editMode){
            const inp = el('input',{inputmode:'decimal',value:h||'',style:{padding:'3px 2px',textAlign:'center',fontSize:'11px',borderRadius:'6px',width:'100%'}});
            dayInputs1[d]=inp; col.append(inp);
          } else {
            col.append(el('div',{style:{fontSize:'11px',fontFamily:"'Space Mono',monospace",color:h>0?'var(--text)':'var(--text3)'}},h>0?h.toFixed(1):'—'));
          }
          w1Row.append(col);
        }
        breakdown.append(w1Row);

        // week 1 total
        const w1TotalRow = el('div',{style:{display:'flex',justifyContent:'flex-end',fontSize:'11px',color:'var(--text2)',marginBottom:'6px',paddingRight:'2px'}});
        w1TotalRow.textContent = w1.total.toFixed(1)+'h';
        breakdown.append(w1TotalRow);

        if(w2){
          // week 2 row
          const w2Row = el('div',{style:{display:'grid',gridTemplateColumns:'52px repeat(7,1fr)',gap:'4px',marginBottom:'4px',borderTop:'1px solid var(--border)',paddingTop:'6px'}});
          const w2LabelEl = el('div',{style:{fontSize:'9px',color:'var(--text2)',display:'flex',alignItems:'center',paddingRight:'4px',whiteSpace:'nowrap',overflow:'hidden'}}, w2.label.slice(0,5));
          w2Row.append(w2LabelEl);
          for(const d of days){
            const h = w2[d]||0;
            const col = el('div',{style:{textAlign:'center'}});
            if(editMode){
              const inp = el('input',{inputmode:'decimal',value:h||'',style:{padding:'3px 2px',textAlign:'center',fontSize:'11px',borderRadius:'6px',width:'100%'}});
              dayInputs2[d]=inp; col.append(inp);
            } else {
              col.append(el('div',{style:{fontSize:'11px',fontFamily:"'Space Mono',monospace",color:h>0?'var(--text)':'var(--text3)'}},h>0?h.toFixed(1):'—'));
            }
            w2Row.append(col);
          }
          breakdown.append(w2Row);
          const w2TotalRow = el('div',{style:{display:'flex',justifyContent:'flex-end',fontSize:'11px',color:'var(--text2)',marginBottom:'4px',paddingRight:'2px'}});
          w2TotalRow.textContent = w2.total.toFixed(1)+'h';
          breakdown.append(w2TotalRow);
        }
      }
      renderBreakdown();

      // edit/save row
      const editRow = el('div',{style:{display:'flex',gap:'8px',marginBottom:'10px'}});
      const editBtn = el('button',{style:{background:'var(--surface2)',color:'var(--text2)',borderRadius:'10px',padding:'6px 12px',fontSize:'12px',border:'1px solid var(--border)'}},'Edit hours');
      editBtn.addEventListener('click',async()=>{
        if(!editMode){
          editMode=true;
          editBtn.textContent='Save hours';
          editBtn.style.background='var(--green)';
          editBtn.style.color='#000';
          renderBreakdown();
        } else {
          const newLog = (appData.hoursLog||[]).map(w => {
            if(w.id === w1.id){
              const updated = {...w};
              for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
                updated[d] = parseFloat(dayInputs1[d]?.value)||0;
              }
              updated.total = Math.round(['mon','tue','wed','thu','fri','sat','sun'].reduce((s,d)=>s+updated[d],0)*100)/100;
              updated.predicted = predictedPay(updated.total);
              return updated;
            }
            if(w2 && w.id === w2.id){
              const updated = {...w};
              for(const d of ['mon','tue','wed','thu','fri','sat','sun']){
                updated[d] = parseFloat(dayInputs2[d]?.value)||0;
              }
              updated.total = Math.round(['mon','tue','wed','thu','fri','sat','sun'].reduce((s,d)=>s+updated[d],0)*100)/100;
              updated.predicted = predictedPay(updated.total);
              return updated;
            }
            return w;
          });
          await save({...appData, hoursLog:newLog});
          editMode=false;
          editBtn.textContent='Edit hours';
          editBtn.style.background='var(--surface2)';
          editBtn.style.color='var(--text2)';
          renderBreakdown();
        }
      });
      editRow.append(editBtn);

      // Actual pay row
      const actualWrap = el('div',{style:{display:'flex',alignItems:'center',gap:'8px',borderTop:'1px solid var(--border)',paddingTop:'10px'}});
      const actualInput = el('input',{inputmode:'decimal',placeholder:'Actual pay received (£)',value:savedActual||'',style:{flex:'1',padding:'8px 12px',fontSize:'13px'}});
      const saveActualBtn = el('button',{style:{background:'var(--green)',color:'#000',borderRadius:'10px',padding:'8px 12px',fontWeight:'700',fontSize:'12px',whiteSpace:'nowrap'}},'Save');
      saveActualBtn.addEventListener('click',async()=>{
        const val = parseFloat(actualInput.value)||0;
        const newActual = {...(appData.actualPay||{}), [actualKey]: val};
        await save({...appData, actualPay:newActual});
        const diff = val - predicted;
        varianceDiv.textContent = val > 0 ? (diff >= 0 ? '+' : '') + fmt(diff) + ' vs predicted' : '';
        varianceDiv.style.color = diff >= 0 ? 'var(--green)' : 'var(--red)';
        saveActualBtn.textContent = '✓';
        setTimeout(()=>saveActualBtn.textContent='Save', 1500);
      });
      const diff = savedActual ? savedActual - predicted : 0;
      const varianceDiv = el('div',{style:{fontSize:'11px',color:diff>=0?'var(--green)':'var(--red)',minWidth:'80px',textAlign:'right'}},
        savedActual > 0 ? (diff>=0?'+':'')+fmt(diff)+' vs predicted' : ''
      );
      actualWrap.append(actualInput, saveActualBtn, varianceDiv);

      // delete button
      const delBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'12px',padding:'4px 0',marginTop:'8px'}},'Remove period');
      delBtn.addEventListener('click',async()=>{
        const ids = [w1.id, w2&&w2.id].filter(Boolean);
        const newLog = (appData.hoursLog||[]).filter(w=>!ids.includes(w.id));
        await save({...appData,hoursLog:newLog});
        renderAll();
      });

      card.append(header, breakdown, editRow, actualWrap, delBtn);
      histWrap.append(card);
    }

    // Hours graph
    const sortedForGraph = [...log].sort((a,b) => parseLabel(a.label) - parseLabel(b.label));
    if(sortedForGraph.length >= 2){
      const values = sortedForGraph.map(w => w.total);
      const dates = sortedForGraph.map(w => w.label);
      const W = Math.min(window.innerWidth - 40, 440);
      const H = 150;
      const PAD = {top:10, right:16, bottom:28, left:36};
      const iW = W - PAD.left - PAD.right;
      const iH = H - PAD.top - PAD.bottom;
      const min = 0;
      const max = Math.max(...values, 1);
      const xStep = values.length > 1 ? iW / (values.length - 1) : iW;
      const yScale = v => iH - ((v - min) / (max - min)) * iH;
      const pts = values.map((v,i) => [PAD.left + i*xStep, PAD.top + yScale(v)]);
      const polyline = pts.map(p=>p.join(',')).join(' ');
      const fillPath = `M${pts[0][0]},${PAD.top+iH} L${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${PAD.top+iH} Z`;

      const avgH = values.reduce((s,v)=>s+v,0)/values.length;
      const avgY = PAD.top + yScale(avgH);

      const xLabels = dates.map((d,i) => {
        if(values.length > 8 && i % Math.ceil(values.length/6) !== 0 && i !== values.length-1) return '';
        const x = PAD.left + i*xStep;
        const parts = d.split('/');
        const lbl = parts[0]+'/'+parts[1];
        return `<text x="${x}" y="${H-4}" text-anchor="middle" fill="#555" font-size="8" font-family="Space Grotesk,sans-serif">${lbl}</text>`;
      }).join('');

      const yLabels = [0, Math.round(max/2), Math.round(max)].map(v => {
        const y = PAD.top + yScale(v);
        return `<text x="${PAD.left-4}" y="${y+3}" text-anchor="end" fill="#555" font-size="9" font-family="Space Mono,monospace">${v}h</text>`;
      }).join('');

      const dots = values.map((v,i) => {
        const [x,y] = pts[i];
        const isHigh = v === Math.max(...values);
        const isLow = v === Math.min(...values);
        const color = isHigh ? 'var(--green)' : isLow ? 'var(--red)' : '#64B5F6';
        return `<circle cx="${x}" cy="${y}" r="${isHigh||isLow?4:2.5}" fill="${color}" stroke="#0D0D0D" stroke-width="1.5"/>`;
      }).join('');

      const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible">
        <defs><linearGradient id="hoursGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#64B5F6" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#64B5F6" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${fillPath}" fill="url(#hoursGrad)"/>
        <line x1="${PAD.left}" y1="${avgY}" x2="${PAD.left+iW}" y2="${avgY}" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="${PAD.left+iW+2}" y="${avgY+3}" fill="#555" font-size="8" font-family="Space Mono,monospace">avg</text>
        <polyline points="${polyline}" fill="none" stroke="#64B5F6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${yLabels}${xLabels}${dots}
      </svg>`;

      const graphCard = el('div',{class:'card',style:{overflowX:'auto',padding:'16px 20px',marginBottom:'12px'}});
      graphCard.innerHTML = `<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#64B5F6;margin-bottom:12px;font-family:'Space Grotesk',sans-serif">Hours per week · avg ${avgH.toFixed(1)}h</div>${svg}`;
      graphWrap.innerHTML = '';
      graphWrap.append(graphCard);
    }

    // Summary — use sorted (chronological) to get most recent weeks
    const totalAllHours = log.reduce((s,w)=>s+w.total,0);
    const recentTwo = sortedForGraph.slice(-2);
    const nextPredicted = recentTwo.reduce((s,w)=>s+w.total,0);
    histWrap.append(
      el('div',{class:'section-hdr'},'Summary'),
      el('div',{class:'card'},
        el('div',{class:'balance-row'},
          el('div',{class:'balance-label'},'Total hours tracked'),
          el('div',{class:'balance-value'},totalAllHours.toFixed(1)+'h')
        ),
        el('div',{class:'balance-row'},
          el('div',{class:'balance-label'},'Effective rate (after tax)'),
          el('div',{class:'balance-value'},fmt(RATE)+'/hr')
        ),
        el('div',{class:'balance-row'},
          el('div',{class:'balance-label'},'Current period predicted'),
          el('div',{class:'balance-value',style:{color:'var(--green)'}},
            recentTwo.length >= 1 ? fmt(predictedPay(nextPredicted)) : '—'
          )
        )
      )
    );
  }

  renderAll();

  content.append(
    el('div',{class:'section-hdr'},'Hours per week'),
    graphWrap,
    el('div',{class:'section-hdr'},'Hourly Rate'),
    rateWrap,
    el('div',{class:'section-hdr'},'Log Hours'),
    logWrap,
    el('div',{class:'section-hdr'},'Pay Periods'),
    filterBar,
    histWrap
  );
  return content;
}

function calendarScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();
  let selectedDate = null;

  // ── Load all events for the calendar ──
  async function loadCalendarData(){
    // 1. Manual cash flow events
    const cashFlow = appData.cashFlow || [];
    const paychecks = (appData.paychecks || []).filter(p=>p.income>0);
    const subs = appData.subscriptions || [];

    // 2. Actual transactions from Firebase
    const snap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
    const txnVal = snap.val() || {};
    const txns = Object.values(txnVal);

    // 3. Recurring patterns (confirmed)
    const recSnap = await db.ref('users/'+currentUser.uid+'/recurringPatterns').once('value');
    const recVal = recSnap.val() || {};
    const confirmed = Object.values(recVal).filter(p=>p.status==='confirmed');

    // 3b. Credit card payments due — the biggest committed outgoing there is.
    // Statements imported by older versions may be missing some fields, so
    // identify card statements loosely and derive anything absent.
    const stmtSnap = await db.ref('users/'+currentUser.uid+'/statements').once('value');
    const cardStmts = Object.values(stmtSnap.val()||{})
      .filter(s =>
        s.statementKind==='credit_card' ||
        s.sourceBank==='Barclaycard' ||
        /barclaycard/i.test(s.sourceFormat||'') ||
        s.statementBalance!=null || s.creditLimit!=null
      )
      .map(s=>{
        // Barclaycard collects roughly 25 days after the statement date
        let due = s.paymentDue;
        if(!due && s.periodEnd){
          const d=new Date(s.periodEnd);
          if(!isNaN(d)){ d.setDate(d.getDate()+25); due=d.toISOString().slice(0,10); }
        }
        return {...s, paymentDue:due, _derivedDue:!s.paymentDue};
      })
      .filter(s=>s.paymentDue && s.statementBalance!=null && s.statementBalance>0)
      .sort((a,b)=>(b.periodEnd||'').localeCompare(a.periodEnd||''));

    // Fallback: no usable statement, but a card account with a balance exists
    const cardAcct = (appData.accounts||[]).find(a=>a.type==='credit_card' && a.balance>0);
    if(!cardStmts.length && cardAcct){
      const d=new Date(); d.setMonth(d.getMonth()+1); d.setDate(1);
      cardStmts.push({
        statementId:'derived_card', paymentDue:d.toISOString().slice(0,10),
        statementBalance:cardAcct.balance, _derivedDue:true, _derivedFromAccount:true,
      });
    }

    // 4. Hours-based predicted paychecks
    const hoursLog = appData.hoursLog || [];
    const actualPay = appData.actualPay || {};
    const RATE = appData.hourlyRate || 14.50;
    const parseLabel = l => { const p=l.split('/'); return new Date(`${p[2]}-${p[1]}-${p[0]}`); };
    const sortedHours = [...hoursLog].sort((a,b)=>parseLabel(a.label)-parseLabel(b.label));

    // Pair weeks into pay periods
    const hoursPairs = [];
    for(let i=0;i<sortedHours.length;i+=2){
      const w1 = sortedHours[i];
      const w2 = sortedHours[i+1];
      const totalH = w1.total + (w2?w2.total:0);
      const predicted = Math.round(totalH * RATE * 100)/100;
      const actual = actualPay[w1.id+'_actual'] || null;

      // Estimate payday = end of second week + 2 days (Friday pattern)
      const w2Date = w2 ? parseLabel(w2.label) : parseLabel(w1.label);
      const paydayDate = new Date(w2Date);
      paydayDate.setDate(paydayDate.getDate() + 11); // ~end of 2nd week + fri
      // Find the nearest Friday
      while(paydayDate.getDay() !== 5) paydayDate.setDate(paydayDate.getDate()+1);
      const paydayStr = paydayDate.toISOString().slice(0,10);

      // Check if this period already has a logged paycheck (within 5 days)
      const alreadyLogged = paychecks.some(p=>{
        const pd = new Date(p.date);
        return Math.abs(pd-paydayDate)/86400000 < 5 && Math.abs(p.income-predicted) < 50;
      });

      hoursPairs.push({w1, w2, totalH, predicted, actual, paydayStr, alreadyLogged});
    }

    return {cashFlow, paychecks, subs, txns, confirmed, hoursPairs, cardStmts};
  }

  function buildDayEvents(data, year, month){
    const {cashFlow, paychecks, subs, txns, confirmed, hoursPairs, cardStmts} = data;
    const days = {};

    const addEvent = (dateStr, event) => {
      if(!days[dateStr]) days[dateStr] = [];
      days[dateStr].push(event);
    };

    // ── ACTUAL: transactions from statement import ──
    for(const t of txns){
      // transactionDate is extracted from the "ON DD MON" in the memo — the day
      // you actually spent the money. postingDate is when Barclays batched it,
      // which can be 1-3 days later and groups multiple purchases into one day.
      const d = (t.transactionDateInferred === false && t.transactionDate)
                  ? t.transactionDate
                  : (t.transactionDate || t.postingDate);
      if(!d || d.length < 7) continue;
      const parts = d.split('-').map(Number);
      if(parts.length < 3 || isNaN(parts[0])) continue;
      const [y,m] = parts;
      if(y !== year || m-1 !== month) continue;
      if(!t.financialType) continue;
      if((t.financialType||'').includes('TRANSFER') || (t.financialType||'') === 'SAVINGS_TRANSFER') continue;
      const onCard = t.sourceType === 'credit_card';
      addEvent(d, {
        onCard,
        type: 'actual',
        label: t.normalisedMerchant || t.rawDescription,
        amount: t.amount,
        direction: t.direction,
        financialType: t.financialType,
        source: 'transaction',
        transactionId: t.transactionId,
      });
    }

    // ── ACTUAL: logged paychecks ──
    for(const p of paychecks){
      const d = p.date ? p.date.slice(0,10) : null;
      if(!d) continue;
      const [y,m] = d.split('-').map(Number);
      if(y !== year || m-1 !== month) continue;
      addEvent(d, {
        type: 'actual',
        label: 'Payday',
        amount: p.income,
        direction: 'credit',
        financialType: 'INCOME',
        source: 'paycheck',
        paycheckId: p.id,
      });
    }

    // ── EXPECTED: hours-predicted paychecks ──
    for(const pair of (hoursPairs||[])){
      const {paydayStr, predicted, actual, alreadyLogged, totalH} = pair;
      if(!paydayStr) continue;
      const [y,m] = paydayStr.split('-').map(Number);
      if(y !== year || m-1 !== month) continue;
      if(alreadyLogged) continue; // already showing as actual paycheck

      const isPast = new Date(paydayStr) < now;
      addEvent(paydayStr, {
        type: actual ? 'actual' : (isPast ? 'expected' : 'expected'),
        label: 'Predicted payday',
        amount: actual || predicted,
        direction: 'credit',
        financialType: 'INCOME',
        source: 'hours',
        detail: `${totalH.toFixed(1)}h × £${(appData.hourlyRate||14.50).toFixed(2)}/hr`
          + (actual ? ` · Actual: £${actual.toFixed(2)}` : ' · estimated'),
      });
    }

    // ── EXPECTED: future subscriptions ──
    const futureStart = new Date(year, month, 1);
    const futureEnd = new Date(year, month+1, 0);

    for(const sub of subs){
      // Use stored billing day from statement analysis, fallback to last txn, then day 1
      let billingDay = sub.billingDay || null;

      if(!billingDay){
        // Try to find from transactions
        const matchingTxns = txns.filter(t=>
          t.direction==='debit' && (
            t.normalisedMerchant.toLowerCase().includes(sub.name.toLowerCase().split(' ')[0]) ||
            sub.name.toLowerCase().includes(t.normalisedMerchant.toLowerCase().split(' ')[0])
          )
        ).sort((a,b)=>b.postingDate.localeCompare(a.postingDate));
        billingDay = matchingTxns.length ? parseInt(matchingTxns[0].postingDate.split('-')[2]) : null;
      }

      if(!billingDay) continue; // skip if we have no idea when it comes out

      // Cap to days in this month
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const day = Math.min(billingDay, daysInMonth);
      const expectedDate = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

      // Check if actual payment already exists this month
      const hasActual = txns.some(t=>
        t.postingDate.startsWith(`${year}-${String(month+1).padStart(2,'0')}`) &&
        t.direction==='debit' &&
        (t.normalisedMerchant.toLowerCase().includes(sub.name.toLowerCase().split(' ')[0]) ||
         sub.name.toLowerCase().includes(t.normalisedMerchant.toLowerCase().split(' ')[0]))
      );
      if(hasActual) continue;

      const d = new Date(expectedDate);
      if(d >= futureStart && d <= futureEnd){
        addEvent(expectedDate, {
          type: 'expected',
          label: sub.name,
          amount: sub.amount,
          direction: 'debit',
          financialType: 'EXPENSE',
          source: 'subscription',
          subscriptionId: sub.id,
          detail: sub.billingDay ? 'billing day '+sub.billingDay : 'estimated',
        });
      }
    }

    // ── CREDIT CARD PAYMENT DUE ──
    // Shown as ACTUAL once a matching debit has left the current account,
    // otherwise as EXPECTED so you can see it coming.
    for(const s of (cardStmts||[])){
      const due = new Date(s.paymentDue);
      if(isNaN(due)) continue;
      if(due.getFullYear()!==year || due.getMonth()!==month) continue;
      const dueStr = due.toISOString().slice(0,10);
      const amount = s.statementBalance!=null ? s.statementBalance : 0;
      if(!amount) continue;

      // Did a payment of roughly this size already leave the account?
      const settled = txns.some(t=>
        t.direction==='debit' && t.sourceType!=='credit_card' &&
        Math.abs(t.amount-amount) < 1 &&
        Math.abs(new Date(t.postingDate)-due)/86400000 <= 5
      );

      addEvent(dueStr, {
        type: settled ? 'actual' : 'expected',
        label: 'Credit card payment',
        amount,
        direction: 'debit',
        financialType: settled ? 'TRANSFER_OUT' : 'EXPENSE',
        source: 'credit card',
        detail: settled ? 'Paid in full'
                : s._derivedFromAccount ? 'Estimated from your card balance — import a statement for the exact date'
                : s._derivedDue ? 'Date estimated from the statement period'
                : 'Full balance — pay this to avoid interest',
        statementId: s.statementId,
      });
    }

    // ── EXPECTED: confirmed recurring patterns ──
    for(const p of confirmed){
      const next = p.nextExpected;
      if(!next) continue;
      const [y,m] = next.split('-').map(Number);
      if(y !== year || m-1 !== month) continue;
      // Don't double-show if subscription already covers it
      const alreadyCovered = subs.some(s=>s.name.toLowerCase().includes(p.merchant.toLowerCase().split(' ')[0]));
      if(alreadyCovered) continue;
      addEvent(next, {
        type: 'expected',
        label: p.merchant,
        amount: p.typicalAmount,
        direction: 'debit',
        financialType: 'EXPENSE',
        source: 'recurring',
      });
    }

    // ── EXPECTED: future cash flow events ──
    for(const e of cashFlow){
      const d = e.date;
      if(!d) continue;
      const [y,m] = d.split('-').map(Number);
      if(y !== year || m-1 !== month) continue;
      addEvent(d, {
        type: new Date(d) < now ? 'actual' : 'expected',
        label: e.label,
        amount: e.amount,
        direction: e.type === 'in' ? 'credit' : 'debit',
        financialType: e.type === 'in' ? 'INCOME' : 'EXPENSE',
        source: 'cashflow',
      });
    }

    return days;
  }

  // ── Year at a glance ──
  // Answers "when did I have transactions" across the whole history, rather
  // than making you page through months one at a time.
  const yearWrap = el('div',{style:{marginBottom:'var(--s4)'}});
  let yearShown = null;

  function renderYearStrip(txns){
    yearWrap.innerHTML='';
    if(!txns || !txns.length) return;

    const spend = {}, income = {};
    let earliest=null, latest=null;
    for(const t of txns){
      const d = (t.transactionDateInferred === false && t.transactionDate)
                  ? t.transactionDate
                  : (t.transactionDate || t.postingDate);
      if(!d || d.length < 7) continue;
      if(t.financialType && ((t.financialType||'').includes('TRANSFER')||(t.financialType||'')==='SAVINGS_TRANSFER')) continue;
      const key=d.slice(0,7);
      if(t.direction==='credit') income[key]=(income[key]||0)+t.amount;
      else spend[key]=(spend[key]||0)+t.amount;
      if(!earliest||d<earliest) earliest=d;
      if(!latest||d>latest) latest=d;
    }
    if(!earliest) return;

    const firstYear=parseInt(earliest.slice(0,4)), lastYear=parseInt(latest.slice(0,4));
    if(yearShown===null) yearShown=viewYear;
    if(yearShown<firstYear) yearShown=firstYear;
    if(yearShown>lastYear)  yearShown=lastYear;

    const head=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'var(--s3)'}});
    const back=el('button',{class:'btn-quiet',style:{padding:'4px 8px'}},'‹');
    const fwd =el('button',{class:'btn-quiet',style:{padding:'4px 8px'}},'›');
    back.disabled = yearShown<=firstYear; fwd.disabled = yearShown>=lastYear;
