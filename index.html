<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Financial Freedom</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0D0D0D" />
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;
  --surface:#111;
  --surface2:#181818;
  --surface3:#202020;
  --border:#252525;
  --border2:#2e2e2e;
  --green:#00E676;--green-dim:#00E67614;--green-glow:#00E67628;
  --red:#FF4444;--red-dim:#FF444414;
  --amber:#F59E0B;--amber-dim:#F59E0B14;
  --blue:#60A5FA;--blue-dim:#60A5FA14;
  --purple:#A78BFA;
  --text:#F2F2F3;--text2:#6B6B75;--text3:#38383F;
  --radius:14px;--radius-sm:10px;--radius-lg:20px;--radius-xl:28px;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:0;height:0}
input,button,select,textarea{font-family:inherit}

/* ── Inputs ── */
input,select{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:var(--radius-sm);
  padding:13px 15px;font-size:15px;width:100%;outline:none;
  transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;
}
input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-glow)}
input::placeholder{color:var(--text3)}

/* ── Buttons ── */
button{cursor:pointer;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;transition:opacity .12s,transform .1s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.96);opacity:.8}
.btn-primary{background:var(--green);color:#000;padding:15px;width:100%;font-size:16px;border-radius:var(--radius);font-weight:700;letter-spacing:.3px}
.btn-ghost{background:var(--surface2);color:var(--text2);padding:13px;width:100%;border:1px solid var(--border);border-radius:var(--radius-sm)}
.btn-primary:disabled{opacity:.35;pointer-events:none}

/* ── Layout ── */
.screen{min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.content{flex:1;padding:16px 16px 32px;max-width:480px;margin:0 auto;width:100%}

/* ── Cards ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:12px;
}

/* ── Rows ── */
.balance-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.balance-row:last-child{border-bottom:none;padding-bottom:0}
.balance-row:first-child{padding-top:0}
.balance-label{font-size:14px;color:var(--text2);font-weight:500}
.balance-value{font-family:'Space Mono',monospace;font-size:15px;font-weight:700}

/* ── Section headers ── */
.section-hdr{
  font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--text3);font-weight:700;
  margin:28px 0 10px;font-family:'Space Grotesk',sans-serif;
}
.section-hdr:first-child{margin-top:4px}

/* ── Nav ── */
.nav{
  display:flex;justify-content:space-around;
  padding:6px 0 max(12px,env(safe-area-inset-bottom));
  background:rgba(10,10,10,.97);border-top:1px solid var(--border);
  position:sticky;bottom:0;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 11px;background:none;color:var(--text3);font-size:9.5px;
  border-radius:12px;min-width:52px;flex-shrink:0;white-space:nowrap;
  letter-spacing:.3px;font-weight:600;text-transform:uppercase;transition:color .15s,background .15s;
}
.nav-btn svg{transition:stroke .15s}
.nav-btn.active{color:var(--green);background:var(--green-dim)}
.nav-btn.active svg{stroke:var(--green)}

/* ── Pay button ── */
.nav-pay-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 4px;flex-shrink:0}
.nav-pay-circle{
  width:46px;height:46px;background:var(--green);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin-top:-18px;box-shadow:0 0 0 3px var(--bg),0 0 20px var(--green-glow);
  transition:transform .1s,box-shadow .15s;
}
.nav-pay-circle:active{transform:scale(.92)}
.nav-pay-label{font-size:9.5px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}

/* ── Page header ── */
.page-header{
  padding:max(16px,env(safe-area-inset-top)) 20px 16px;
  max-width:480px;margin:0 auto;width:100%;
  display:flex;justify-content:space-between;align-items:center;
}
.page-eyebrow{font-size:10px;color:var(--green);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.1}

/* ── Stat chips ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-chip{background:var(--surface2);border-radius:var(--radius);padding:14px;border:1px solid var(--border)}
.stat-chip-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:5px}
.stat-chip-value{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;line-height:1}
.stat-chip-sub{font-size:11px;color:var(--text3);margin-top:3px}

/* ── Progress bars ── */
.prog-wrap{background:var(--surface2);border-radius:100px;height:6px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:100px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* ── List items ── */
.sub-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.sub-item:last-child{border-bottom:none}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px}

/* ── Steps ── */
.step-num{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.step-title{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-bottom:8px}
.step-sub{font-size:14px;color:var(--text2);margin-bottom:28px;line-height:1.5}
.big-wrap{display:flex;align-items:center;gap:8px;margin-bottom:24px;background:var(--surface2);border-radius:var(--radius);padding:16px 20px;border:1px solid var(--border)}
.big-input{background:none;border:none;font-family:'Space Mono',monospace;font-size:40px;font-weight:700;color:var(--text);padding:0;width:100%;outline:none;letter-spacing:-1px}
.sym{font-family:'Space Mono',monospace;font-size:32px;font-weight:700;color:var(--text3)}

/* ── Auth ── */
.auth-wrap{display:flex;flex-direction:column;justify-content:center;min-height:100dvh;padding:40px 24px;max-width:400px;margin:0 auto}
.auth-logo{font-size:36px;font-weight:700;letter-spacing:-1px;margin-bottom:4px}
.auth-sub{font-size:14px;color:var(--text2);margin-bottom:40px}

/* ── Done icon ── */
.done-icon{width:64px;height:64px;background:var(--green-dim);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}

/* ── Instructions ── */
.instruction{display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--surface2);border-radius:var(--radius);margin-bottom:10px;border-left:3px solid var(--green)}
.instruction-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:3px}
.instruction-action{font-size:14px;font-weight:600}
.instruction-amount{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--green)}

/* ── Info box ── */
.info-box{background:var(--surface2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--text2);line-height:1.6;border:1px solid var(--border)}

/* ── Row layout ── */
.row{display:flex;gap:10px;margin-top:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── AI Worker URL ──
// Set this to your Cloudflare Worker URL to enable Ask My Finances.

// See ff_worker/README.md for setup instructions.

firebase.initializeApp({
  apiKey:"AIzaSyBqjVFKGnQujQQ0rQqsPZ2px1DCCkjlzyA",
  authDomain:"financial-freedom-eb995.firebaseapp.com",
  databaseURL:"https://financial-freedom-eb995-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"financial-freedom-eb995",
  storageBucket:"financial-freedom-eb995.firebasestorage.app",
  messagingSenderId:"610515737665",
  appId:"1:610515737665:web:7f497468aaa3d484aafac0"
});
const auth = firebase.auth();
const db = firebase.database();

const fmt = n => (n<0?'-£':'£') + Math.abs(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,10);
const el = (tag, props={}, ...kids) => {
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='class') e.className=v;
    else if(k==='style'){
      if(typeof v === 'string') e.setAttribute('style', v);
      else Object.assign(e.style, v);
    }
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const k of kids){
    if(k==null||k===false) continue;
    e.append(typeof k==='string'||typeof k==='number' ? document.createTextNode(String(k)) : k);
  }
  return e;
};

const DEFAULT_DATA = {
  balances:{current:0,creditCard:0,florasii:0,personalSavings:0}, // legacy — kept for migration
  accounts:[], // user-defined accounts
  paychecks:[],
  subscriptions:[]
};

// ── Account helpers ──
function getAccounts(){ return appData.accounts||[]; }
function getAccountBalance(type){
  // legacy fallback for payday flow compatibility
  const acc = getAccounts().find(a=>a.type===type||a.legacyKey===type);
  return acc ? acc.balance : (appData.balances?.[type]||0);
}
function getTotalByType(types){
  if(!getAccounts().length) return types.reduce((s,t)=>s+(appData.balances?.[t]||0),0);
  return getAccounts().filter(a=>types.includes(a.type)).reduce((s,a)=>s+a.balance,0);
}
function getNetWorth(){
  if(!getAccounts().length){
    const b=appData.balances||{};
    return (b.current||0)+(b.florasii||0)+(b.personalSavings||0)-(b.creditCard||0);
  }
  return getAccounts().reduce((s,a)=>a.type==='credit_card'?s-a.balance:s+a.balance,0);
}
async function saveAccountBalance(accountId, newBalance){
  const accounts = getAccounts().map(a=>a.id===accountId?{...a,balance:newBalance,updatedAt:new Date().toISOString()}:a);
  appData.accounts=accounts;
  await save({...appData,accounts});
}

let appData = null;
let currentUser = null;

// ── render engine ──
const app = document.getElementById('app');
function render(node){ app.innerHTML=''; app.append(node); }

// ── persist ──
async function save(data){
  appData = data;
  if(currentUser) await db.ref('users/'+currentUser.uid).set(data);
}

// ── screens ──
function authScreen(){
  let mode = 'signin';
  const wrap = el('div',{class:'screen',style:{justifyContent:'center'}});
  const content = el('div',{class:'auth-wrap'});

  const heading = el('div',{style:{marginBottom:'40px'}},
    el('div',{class:'auth-logo'},'Financial Freedom'),
    el('div',{class:'auth-sub'},'Your money, your data, your goals.')
  );

  const emailInput = el('input',{type:'email',placeholder:'Email',autocomplete:'email',required:true,style:{marginBottom:'10px'}});
  const passInput = el('input',{type:'password',placeholder:'Password',autocomplete:'current-password',required:true,minlength:'6',style:{marginBottom:'10px'}});
  const errDiv = el('div',{style:{fontSize:'13px',color:'var(--red)',minHeight:'20px',marginBottom:'4px'}});
  const submitBtn = el('button',{class:'btn-primary',style:{marginBottom:'10px'}},'Sign in');
  const toggleBtn = el('button',{class:'btn-ghost'},'No account? Sign up');

  submitBtn.addEventListener('click', async()=>{
    const email = emailInput.value.trim();
    const pass = passInput.value;
    if(!email||!pass) return;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Please wait…';
    errDiv.textContent = '';
    try{
      if(mode==='signin') await auth.signInWithEmailAndPassword(email,pass);
      else await auth.createUserWithEmailAndPassword(email,pass);
    }catch(e){
      errDiv.textContent = e.message;
      submitBtn.disabled = false;
      submitBtn.textContent = mode==='signin'?'Sign in':'Create account';
    }
  });

  toggleBtn.addEventListener('click',()=>{
    mode = mode==='signin'?'signup':'signin';
    submitBtn.textContent = mode==='signin'?'Sign in':'Create account';
    toggleBtn.textContent = mode==='signin'?'No account? Sign up':'Already have an account';
  });

  content.append(heading, emailInput, passInput, errDiv, submitBtn, toggleBtn);
  wrap.append(content);
  return wrap;
}

function paydayFlow(){
  let step = 0;
  let income = 0;
  let newBalances = {};
  const prev = {...appData.balances};
  const wrap = el('div',{class:'screen'});

  function show(){
    wrap.innerHTML='';
    const content = el('div',{class:'content',style:{display:'flex',flexDirection:'column',justifyContent:'center',flex:'1'}});

    if(step!==3){
      const exitBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'14px',padding:'4px 8px',position:'absolute',top:'20px',right:'16px'}},'✕ Exit');
      exitBtn.addEventListener('click',()=>mainScreen());
      wrap.style.position='relative';
      wrap.append(exitBtn);
    }

    // ── Step 0: income ──
    if(step===0){
      const inp = el('input',{class:'big-input',inputmode:'decimal',placeholder:'0.00'});
      const btn = el('button',{class:'btn-primary'},'Next →');
      btn.disabled = true;
      inp.addEventListener('input',()=>{ btn.disabled=!parseFloat(inp.value); });
      btn.addEventListener('click',()=>{ income=parseFloat(inp.value)||0; step=1; show(); });
      content.append(
        el('div',{class:'step-num'},'Step 1 of 3'),
        el('div',{class:'step-title'},'You got paid 💰'),
        el('div',{class:'step-sub'},'How much landed in your account?'),
        el('div',{class:'big-wrap'}, el('span',{class:'sym'},'£'), inp),
        btn
      );
    }

    // ── Step 1: enter current Barclays balances ──
    if(step===1){
      content.style.justifyContent='flex-start';
      const fieldStyle = {width:'100%',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'12px',padding:'12px 14px',fontSize:'16px',outline:'none',fontFamily:'Space Mono,monospace',fontWeight:'700'};

      const curInp  = el('input',{inputmode:'decimal',placeholder:fmt(prev.current), style:fieldStyle});
      const florInp = el('input',{inputmode:'decimal',placeholder:fmt(prev.florasii), style:fieldStyle});
      const ccInp   = el('input',{inputmode:'decimal',placeholder:fmt(prev.creditCard), style:fieldStyle});
      const savInp  = el('input',{inputmode:'decimal',placeholder:fmt(prev.personalSavings), style:fieldStyle});

      const backBtn = el('button',{class:'btn-ghost',style:{flex:'1'}},'← Back');
      const nextBtn = el('button',{class:'btn-primary',style:{flex:'2'}},'Calculate →');
      backBtn.addEventListener('click',()=>{step=0;show();});
      nextBtn.addEventListener('click',()=>{
        newBalances = {
          current:       parseFloat(curInp.value)  ?? prev.current,
          florasii: (()=>{
            const val = parseFloat(florInp.value);
            return isNaN(val) ? prev.florasii : val;
          })(),
          creditCard:    parseFloat(ccInp.value)   ?? prev.creditCard,
          personalSavings: parseFloat(savInp.value) ?? prev.personalSavings,
        };
        // fill blanks with previous
        if(isNaN(newBalances.current))         newBalances.current = prev.current;
        if(isNaN(newBalances.florasii))        newBalances.florasii = prev.florasii;
        if(isNaN(newBalances.creditCard))      newBalances.creditCard = prev.creditCard;
        if(isNaN(newBalances.personalSavings)) newBalances.personalSavings = prev.personalSavings;
        step=2; show();
      });

      const mkRow = (label, prevVal, inp) => {
        const row = el('div',{style:{marginBottom:'14px'}});
        row.append(
          el('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'6px'}},
            el('div',{style:{fontSize:'13px',color:'var(--text2)',fontWeight:'600'}},label),
            el('div',{style:{fontSize:'12px',color:'var(--text3)'}},'was '+fmt(prevVal))
          ),
          inp
        );
        return row;
      };

      content.append(
        el('div',{class:'step-num'},'Step 2 of 3'),
        el('div',{class:'step-title'},'Open Barclays'),
        el('div',{class:'step-sub'},'Enter what each account shows right now.'),
        mkRow('Current Account (after income landed)', prev.current, curInp),
        mkRow((()=>{ const sa=(appData.accounts||[]).filter(a=>a.type==='savings'); return sa.length?sa.map(a=>a.name).join(' + '):'Savings Fund'; })(), prev.florasii, florInp),
        mkRow('Credit Card (owed)', prev.creditCard, ccInp),
        mkRow('Personal Savings', prev.personalSavings, savInp),
        el('div',{class:'row',style:{marginTop:'8px'}}, backBtn, nextBtn)
      );
    }

    // ── Step 2: show calculated breakdown ──
    if(step===2){
      content.style.justifyContent='flex-start';

      const florasiiChange = newBalances.florasii - prev.florasii;
      const ccChange = newBalances.creditCard - prev.creditCard;
      const savingsChange = newBalances.personalSavings - prev.personalSavings;
      const currentChange = newBalances.current - prev.current;
      const ccPaid = Math.max(0, -ccChange);

      // Income lands in current first, then you transfer to Florasii + Savings
      // Whatever remains in current vs before (minus income) is what you kept
      // Spending = income - what you moved to Florasii - what you moved to Savings - net current increase
      // If Florasii went DOWN, you withdrew from it (adds to what you had available)
      // CC growing means you spent on it (adds to spending)
      const spent = income - florasiiChange - savingsChange - currentChange + Math.max(0, ccChange);

      const changeRow = (label, value, invert) => {
        const positive = invert ? value < 0 : value > 0;
        const color = value === 0 ? 'var(--text2)' : positive ? 'var(--green)' : 'var(--red)';
        const prefix = value > 0 ? '+' : '';
        return el('div',{style:{display:'flex',justifyContent:'space-between',padding:'10px 0',borderBottom:'1px solid var(--border)'}},
          el('div',{style:{fontSize:'14px',color:'var(--text2)'}},label),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color}},prefix+fmt(value))
        );
      };

      const confirmBtn = el('button',{class:'btn-primary',style:{marginTop:'16px'}},'Save & update balances →');
      const backBtn = el('button',{class:'btn-ghost',style:{marginTop:'8px'}},'← Back');
      backBtn.addEventListener('click',()=>{step=1;show();});

      confirmBtn.addEventListener('click',async()=>{
        const hasCC = prev.creditCard > 0 || newBalances.creditCard > 0;
        const split = {
          florasii: florasiiChange,
          spending: income * 0.25,
          creditCard: ccPaid,
        };
        const newPay = {
          id: uid(),
          date: new Date().toISOString(),
          income, spent, split,
          snapshot: {
            florasii: newBalances.florasii,
            current: newBalances.current,
            creditCard: newBalances.creditCard,
            personalSavings: newBalances.personalSavings,
          }
        };
        // Award XP only for genuinely new paychecks (idempotency via paycheck ID)
        const habits = appData.habits||{streak:0,xp:0,level:1,achievements:[],rewardedPaychecks:[]};
        const rewardedIds = Array.isArray(habits.rewardedPaychecks) ? habits.rewardedPaychecks : [];
        const alreadyRewarded = rewardedIds.includes(newPay.id);
        const newXP = alreadyRewarded ? (habits.xp||0) : (habits.xp||0) + 50;
        const newLevel = Math.floor(newXP/200)+1;
        const newRewardedIds = alreadyRewarded ? rewardedIds : [...rewardedIds, newPay.id];
        const newHabits = {...habits, xp:newXP, level:newLevel, lastPaycheckLog:new Date().toISOString(), rewardedPaychecks:newRewardedIds};
        // Update user-defined accounts if they exist (in addition to legacy balances)
        let updatedAccounts = appData.accounts||[];
        if(updatedAccounts.length){
          updatedAccounts = updatedAccounts.map(a=>{
            if(a.type==='current'||a.legacyKey==='current') return {...a,balance:newBalances.current,updatedAt:new Date().toISOString()};
            if(a.type==='savings'||a.legacyKey==='florasii') return {...a,balance:newBalances.florasii,updatedAt:new Date().toISOString()};
            if(a.type==='credit_card'||a.legacyKey==='creditCard') return {...a,balance:newBalances.creditCard,updatedAt:new Date().toISOString()};
            return a;
          });
        }
        await save({...appData, balances:newBalances, accounts:updatedAccounts, paychecks:[newPay,...(appData.paychecks||[])], habits:newHabits});
        step=3; show();
      });

      content.append(
        el('div',{class:'step-num'},'Step 3 of 3'),
        el('div',{class:'step-title'},'Here\'s what happened'),
        el('div',{class:'step-sub'},'Calculated from your Barclays balances.'),
        el('div',{class:'card',style:{padding:'4px 16px'}},
          changeRow('Savings', florasiiChange, false),
          changeRow('Current account', currentChange, false),
          changeRow('Credit card', ccChange, true),
          changeRow('Personal savings', savingsChange, false),
          el('div',{style:{display:'flex',justifyContent:'space-between',padding:'10px 0'}},
            el('div',{style:{fontSize:'14px',color:'var(--text2)'}},'Estimated spending'),
            el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--amber)'}},fmt(spent))
          )
        ),
        el('div',{class:'info-box',style:{background:'var(--surface2)',color:'var(--text2)',margin:'12px 0',fontSize:'12px',lineHeight:'1.6'}},
          'Income: '+fmt(income)
          +(florasiiChange>0?' · Savings +'+fmt(florasiiChange):'')
          +(florasiiChange<0?' · Savings withdrawn: '+fmt(Math.abs(florasiiChange)):'')
          +(ccPaid>0?' · CC paid: '+fmt(ccPaid):'')
          +(ccChange>0?' · CC grew: '+fmt(ccChange):'')
        ),
        confirmBtn,
        backBtn
      );
    }

    // ── Step 3: done ──
    if(step===3){
      content.style.textAlign='center';
      const doneBtn = el('button',{class:'btn-primary'},'Back to overview');
      doneBtn.addEventListener('click',()=>mainScreen());
      content.append(
        el('div',{class:'done-icon'},
          el('svg',{width:'36',height:'36',viewBox:'0 0 24 24',fill:'none',stroke:'var(--green)','stroke-width':'2.5','stroke-linecap':'round','stroke-linejoin':'round'},
            el('path',{d:'M20 6L9 17l-5-5'})
          )
        ),
        el('div',{style:{fontSize:'26px',fontWeight:'700',marginBottom:'8px'}},'All sorted 🎉'),
        el('div',{style:{fontSize:'14px',color:'var(--text2)',marginBottom:'12px',lineHeight:'1.6'}},
          'Balances updated from your Barclays figures.'),
        doneBtn
      );
    }

    wrap.append(content);
  }
  show();
  return wrap;
}

function overviewScreen(){
  const {balances, paychecks, subscriptions} = appData;
  const habits = appData.habits||{xp:0,level:1};
  const subTotal = subscriptions.reduce((s,x)=>s+x.amount,0);
  // pct removed - goals now user-defined
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  // ── Load transaction data async then render intelligence ──
  const intelligenceWrap = el('div',{});
  content.append(intelligenceWrap);

  async function renderIntelligence(){
    const snap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
    const txnVal = snap.val() || {};
    const txns = Object.values(txnVal);

    const now = new Date();
    const thisMonthStr = now.toISOString().slice(0,7);
    const lastMonthDate = new Date(now); lastMonthDate.setMonth(lastMonthDate.getMonth()-1);
    const lastMonthStr = lastMonthDate.toISOString().slice(0,7);
    const twoWeeksAgo = new Date(now); twoWeeksAgo.setDate(twoWeeksAgo.getDate()-14);

    // This period's transactions (last 14 days)
    const recentTxns = txns.filter(t=>new Date(t.postingDate)>=twoWeeksAgo && t.financialType==='EXPENSE');
    const recentSpend = recentTxns.reduce((s,t)=>s+t.amount,0);

    // This month's income and spending
    const thisMonthTxns = txns.filter(t=>t.postingDate?.startsWith(thisMonthStr));
    const thisMonthIncome = thisMonthTxns.filter(t=>t.financialType==='INCOME').reduce((s,t)=>s+t.amount,0);
    const thisMonthSpend = thisMonthTxns.filter(t=>t.financialType==='EXPENSE').reduce((s,t)=>s+t.amount,0);

    // Last month spending for comparison
    const lastMonthSpend = txns.filter(t=>t.postingDate?.startsWith(lastMonthStr)&&t.financialType==='EXPENSE').reduce((s,t)=>s+t.amount,0);
    const spendChange = lastMonthSpend > 0 ? ((thisMonthSpend-lastMonthSpend)/lastMonthSpend*100) : 0;

    // Upcoming commitments (next 30 days)
    const in30 = new Date(now); in30.setDate(in30.getDate()+30);
    const cashFlow = appData.cashFlow||[];
    const upcomingOut = cashFlow.filter(e=>{
      const d=new Date(e.date);
      return e.type==='out' && d>=now && d<=in30;
    }).reduce((s,e)=>s+e.amount,0);
    const upcomingSubCost = subTotal; // monthly subs
    const totalCommitted = upcomingOut + upcomingSubCost;

    // ── HIDDEN SUBSCRIPTION DETECTION ──
    // Find recurring patterns not in subscriptions list AND not already reviewed
    const hiddenSubs = [];
    if(txns.length > 10){
      const patterns = detectRecurring(txns);
      const knownSubNames = subscriptions.map(s=>s.name.toLowerCase().split(' ')[0]);

      // Load already-reviewed recurring patterns from Firebase
      const recSnap = await db.ref('users/'+currentUser.uid+'/recurringPatterns').once('value');
      const recVal = recSnap.val() || {};
      const reviewedMerchants = new Set(Object.values(recVal).map(p=>p.merchant));

      for(const p of patterns){
        if(p.frequency !== 'Monthly' && p.frequency !== 'Weekly' && p.frequency !== 'Fortnightly') continue;
        if(p.confidence < 0.75) continue;
        if(p.observations < 2) continue;
        // Skip if already reviewed (confirmed or ignored)
        if(reviewedMerchants.has(p.merchant)) continue;
        // Skip if already in subscriptions list
        const alreadyKnown = knownSubNames.some(n=>
          p.merchant.toLowerCase().includes(n) || n.includes(p.merchant.toLowerCase().split(' ')[0])
        );
        if(alreadyKnown) continue;
        hiddenSubs.push(p);
      }
    }

    // Predicted next paycheck from hours
    const hoursLog = appData.hoursLog||[];
    const actualPay = appData.actualPay||{};
    const RATE = appData.hourlyRate||14.50;
    const parseLabel = l=>{const p=l.split('/');return new Date(`${p[2]}-${p[1]}-${p[0]}`);};
    const sortedH = [...hoursLog].sort((a,b)=>parseLabel(a.label)-parseLabel(b.label));
    const lastPair = sortedH.length>=2?{w1:sortedH[sortedH.length-2],w2:sortedH[sortedH.length-1]}:
                     sortedH.length===1?{w1:sortedH[0],w2:null}:null;
    const predictedPay = lastPair ? (lastPair.w1.total+(lastPair.w2?lastPair.w2.total:0))*RATE : 0;

    // Avg savings per pay (from snapshot history)
    const avgFlorasiiPerPay = (()=>{
      const snaps = (paychecks||[]).filter(p=>p.snapshot).sort((a,b)=>new Date(a.date)-new Date(b.date));
      if(snaps.length<2) return predictedPay*0.25;
      // Use florasii snapshot for now (historical data), accounts system is additive
      const growth = (snaps[snaps.length-1].snapshot.florasii||0) - (snaps[0].snapshot.florasii||0);
      return Math.max(0, growth/Math.max(snaps.length-1,1));
    })();

    // User-specific goals from Firebase (not hardcoded)
    const GOALS = (appData.goals || []).filter(g=>g.active!==false&&g.target&&g.deadline);
    // Get savings total from user accounts (savings type) or fall back to legacy florasii
    const savingsAccounts = (appData.accounts||[]).filter(a=>a.type==='savings');
    const florasiiNow = savingsAccounts.length 
      ? savingsAccounts.reduce((s,a)=>s+a.balance,0)
      : (balances.florasii||0);
    const now2 = new Date();

    let totalRequiredPerPaycheck = 0;
    const goalDetails = GOALS.map(g=>{
      const deadline = new Date(g.deadline);
      const daysLeft = Math.max(1, Math.ceil((deadline-now2)/86400000));
      const payPeriodsLeft = Math.max(1, Math.floor(daysLeft/14));
      const share = g.target / Math.max(GOALS.reduce((s,x)=>s+x.target,0),1);
      const myShare = florasiiNow * share;
      const remaining = Math.max(0, g.target - myShare);
      const requiredPerPeriod = remaining / payPeriodsLeft;
      totalRequiredPerPaycheck += requiredPerPeriod;
      const pctDone = Math.min(100, Math.round(myShare/g.target*100));
      const onTrack = avgFlorasiiPerPay * share >= requiredPerPeriod * 0.9;
      return {...g, remaining, requiredPerPeriod, payPeriodsLeft, pctDone, myShare, onTrack, daysLeft, color:g.color||'var(--green)'};
    });

    // Safe to spend using goal-required savings (not just historical avg)
    const safeToSpend = Math.max(0,
      (balances.current||0) + predictedPay - totalCommitted - totalRequiredPerPaycheck
    );

    // Money leaks — top spending categories this month
    const byCat = {};
    for(const t of thisMonthTxns.filter(t=>t.financialType==='EXPENSE')){
      const cat = t.userCategory||t.category||'Other';
      if(!byCat[cat]) byCat[cat]={total:0,count:0};
      byCat[cat].total+=t.amount; byCat[cat].count++;
    }
    const topCats = Object.entries(byCat).sort((a,b)=>b[1].total-a[1].total).slice(0,4);

    // Top merchants this period
    const byMerchant = {};
    for(const t of recentTxns){
      const m=t.normalisedMerchant||t.rawDescription;
      if(!byMerchant[m]) byMerchant[m]={total:0,count:0};
      byMerchant[m].total+=t.amount; byMerchant[m].count++;
    }
    const topMerchants = Object.entries(byMerchant).sort((a,b)=>b[1].total-a[1].total).slice(0,4);

    // Why am I broke? — determine the main culprit
    const reasons = [];
    if(hiddenSubs.length > 0){
      const hiddenTotal = hiddenSubs.reduce((s,p)=>s+(p.frequency==='Weekly'?p.typicalAmount*4.33:p.frequency==='Fortnightly'?p.typicalAmount*2:p.typicalAmount),0);
      reasons.push({severity:'warning', msg:hiddenSubs.length+' possible unknown subscription'+(hiddenSubs.length>1?'s':'')+' detected — ~'+fmt(hiddenTotal)+'/mo you might not know about.'});
    }
    if(balances.current<0) reasons.push({severity:'critical',msg:'Your current account is overdrawn by '+fmt(Math.abs(balances.current||0))+'.'});
    if(balances.creditCard>200) reasons.push({severity:'warning',msg:'£'+Math.round(balances.creditCard)+' on your credit card needs clearing.'});
    if(subTotal>predictedPay*0.2) reasons.push({severity:'warning',msg:'Subscriptions cost £'+subTotal.toFixed(0)+'/mo — '+Math.round(subTotal/Math.max(predictedPay,1)*100)+'% of your typical paycheck.'});
    if(thisMonthSpend>thisMonthIncome&&thisMonthIncome>0) reasons.push({severity:'warning',msg:'Spent more than earned this month.'});
    if(spendChange>20&&lastMonthSpend>0) reasons.push({severity:'info',msg:'Spending is up '+Math.round(spendChange)+'% vs last month.'});
    if(topCats.length&&topCats[0][1].total>predictedPay*0.3) reasons.push({severity:'info',msg:topCats[0][0]+' is your biggest cost this month at '+fmt(topCats[0][1].total)+'.'});

    intelligenceWrap.innerHTML='';

    // ── HEADER: Net position ──
    const netPos = getNetWorth();
    const posCard = el('div',{style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'16px',padding:'20px',marginBottom:'12px'}});
    posCard.append(
      el('div',{style:{fontSize:'11px',color:'var(--text3)',letterSpacing:'2px',textTransform:'uppercase',marginBottom:'4px'}},'Net worth'),
      el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'36px',fontWeight:'700',color:netPos>=0?'var(--green)':'var(--red)',lineHeight:'1'}},fmt(netPos)),
      el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'6px',display:'flex',gap:'12px',flexWrap:'wrap'}},
        ...((appData.accounts||[]).length ? (appData.accounts||[]).map(a=>
          el('span',{style:{color:a.type==='credit_card'?'var(--red)':a.type==='savings'?'var(--green)':'var(--text)'}},
            a.name+': '+(a.type==='credit_card'?'-':'')+fmt(a.balance))
        ) : [
          el('span',{},'Current: '+fmt(balances.current||0)),
          ...((appData.accounts||[]).length ? [] : [
          el('span',{style:{color:'var(--green)'}},'Florasii: '+fmt(balances.florasii||0))
        ]),
          balances.creditCard>0?el('span',{style:{color:'var(--red)'}},'CC: -'+fmt(balances.creditCard)):el('span')
        ])
      )
    );
    intelligenceWrap.append(posCard);

    // ── WHY AM I BROKE? ──
    if(reasons.length){
      const brokeCard = el('div',{class:'card',style:{marginBottom:'12px',borderLeft:'3px solid var(--red)'}});
      brokeCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px',color:'var(--red)'}},'⚡ Why am I broke?'));
      for(const r of reasons){
        const color = r.severity==='critical'?'var(--red)':r.severity==='warning'?'var(--amber)':'var(--text2)';
        const icon = r.severity==='critical'?'🔴':r.severity==='warning'?'🟡':'💡';
        brokeCard.append(el('div',{style:{fontSize:'13px',color,marginBottom:'8px',display:'flex',gap:'8px',alignItems:'flex-start'}},
          el('span',{},icon),
          el('span',{},r.msg)
        ));
      }
      intelligenceWrap.append(brokeCard);
    }

    // ── HIDDEN SUBSCRIPTIONS ──
    if(hiddenSubs.length > 0){
      const hiddenCard = el('div',{class:'card',style:{marginBottom:'12px',borderLeft:'3px solid var(--amber)'}});
      hiddenCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'4px',color:'var(--amber)'}},'👀 Possible unknown subscriptions'));
      hiddenCard.append(el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'12px'}},'These recurring payments were found in your transactions but aren\'t in your subscriptions list. Did you know about these?'));

      const hiddenMonthly = hiddenSubs.reduce((s,p)=>{
        const m = p.frequency==='Weekly'?p.typicalAmount*4.33:p.frequency==='Fortnightly'?p.typicalAmount*2:p.typicalAmount;
        return s+m;
      },0);

      for(const p of hiddenSubs.slice(0,5)){
        const monthlyEq = p.frequency==='Weekly'?p.typicalAmount*4.33:p.frequency==='Fortnightly'?p.typicalAmount*2:p.typicalAmount;
        const row = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--border)'}});
        row.append(
          el('div',{},
            el('div',{style:{fontSize:'13px',fontWeight:'500'}},p.merchant),
            el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'1px'}},p.frequency+' · '+p.observations+' payments detected')
          ),
          el('div',{style:{textAlign:'right'}},
            el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--red)'}},fmt(p.typicalAmount)),
            el('div',{style:{fontSize:'10px',color:'var(--text3)',marginTop:'1px'}},'~'+fmt(monthlyEq)+'/mo')
          )
        );
        hiddenCard.append(row);
      }

      hiddenCard.append(
        el('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:'10px',fontSize:'13px'}},
          el('span',{style:{color:'var(--text2)'}},'Hidden monthly cost'),
          el('span',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--amber)'}},fmt(hiddenMonthly)+'/mo')
        )
      );
      const reviewBtn = el('button',{style:{width:'100%',marginTop:'10px',background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border)',borderRadius:'10px',padding:'8px',fontSize:'12px'}},'Review in Recurring tab');
      reviewBtn.addEventListener('click',()=>{ if(window._setTab) window._setTab('_recurring'); });
      hiddenCard.append(reviewBtn);
      intelligenceWrap.append(hiddenCard);
    }

    // ── SAFE TO SPEND ──
    const safeCard = el('div',{class:'card',style:{marginBottom:'12px'}});
    safeCard.append(
      el('div',{style:{fontSize:'11px',color:'var(--text3)',letterSpacing:'2px',textTransform:'uppercase',marginBottom:'8px'}},'Safe to spend'),
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:'12px'}},
        el('div',{},
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'32px',fontWeight:'700',color:safeToSpend>200?'var(--green)':safeToSpend>0?'var(--amber)':'var(--red)',lineHeight:'1'}},fmt(safeToSpend)),
          el('div',{style:{fontSize:'12px',color:'var(--text2)',marginTop:'4px'}},'before next payday')
        ),
        predictedPay>0?el('div',{style:{textAlign:'right'}},
          el('div',{style:{fontSize:'11px',color:'var(--text3)'}},'Next paycheck'),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:'var(--green)'}},fmt(predictedPay))
        ):el('span')
      ),
      el('div',{style:{fontSize:'11px',color:'var(--text3)',lineHeight:'1.6'}},
        'Current £'+Math.round(balances.current||0)+
        (predictedPay>0?' + next pay £'+Math.round(predictedPay):'') +
        ' − subs £'+Math.round(subTotal)+
        (upcomingOut>0?' − committed £'+Math.round(upcomingOut):'')+
        ' − goal savings £'+Math.round(totalRequiredPerPaycheck)
      )
    );
    intelligenceWrap.append(safeCard);

    // ── UPCOMING COMMITMENTS ──
    const commitCard = el('div',{class:'card',style:{marginBottom:'12px'}});
    commitCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},'📅 Upcoming commitments'));
    commitCard.append(
      el('div',{class:'balance-row'},
        el('div',{class:'balance-label'},'Subscriptions this month'),
        el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(subTotal))
      )
    );
    if(upcomingOut>0) commitCard.append(
      el('div',{class:'balance-row'},
        el('div',{class:'balance-label'},'Planned expenses (30d)'),
        el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(upcomingOut))
      )
    );
    if(balances.creditCard>0) commitCard.append(
      el('div',{class:'balance-row'},
        el('div',{class:'balance-label'},'Credit card owed'),
        el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(balances.creditCard))
      )
    );
    commitCard.append(
      el('div',{class:'balance-row',style:{borderTop:'1px solid var(--border)',paddingTop:'10px',marginTop:'4px',border:'none'}},
        el('div',{class:'balance-label',style:{fontWeight:'700'}},'Total committed'),
        el('div',{class:'balance-value',style:{color:'var(--red)',fontWeight:'700'}},fmt(totalCommitted+(balances.creditCard||0)))
      )
    );
    intelligenceWrap.append(commitCard);

    // ── FLORASII SUB-GOALS ──
    const florasiiCard = el('div',{class:'card',style:{marginBottom:'12px'}});
    florasiiCard.append(
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:'14px'}},
        el('div',{style:{fontWeight:'700',fontSize:'15px'}},'🌸 Florasii Fund'),
        el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'18px',color:'var(--green)'}},fmt(florasiiNow))
      )
    );

    if(goalDetails.length === 0){
      florasiiCard.append(
        el('div',{style:{background:'var(--surface2)',borderRadius:'12px',padding:'14px',textAlign:'center'}},
          el('div',{style:{fontSize:'13px',color:'var(--text2)',marginBottom:'10px'}},'No savings goals set yet.'),
          el('button',{style:{background:'var(--green)',color:'#000',borderRadius:'10px',padding:'8px 16px',fontWeight:'700',fontSize:'13px'}},'Add a goal')
        )
      );
      florasiiCard.querySelector('button').addEventListener('click',()=>{ if(window._setTab) window._setTab('_goals'); });
    } else {
      for(const g of goalDetails){
        const STATUS = g.onTrack ? '✓ On track' : '⚠ Behind';
        const statusColor = g.onTrack ? 'var(--green)' : 'var(--amber)';
        const deadlineStr = new Date(g.deadline).toLocaleDateString('en-GB',{month:'short',year:'numeric'});
        const goalBlock = el('div',{style:{marginBottom:'14px',paddingBottom:'14px',borderBottom:'1px solid var(--border)'}});
        goalBlock.append(
          el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'6px'}},
            el('div',{},
              el('div',{style:{fontSize:'13px',fontWeight:'600'}},g.name),
              el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'1px'}},'Target: '+fmt(g.target)+' by '+deadlineStr)
            ),
            el('div',{style:{textAlign:'right'}},
              el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'14px',color:g.color||'var(--green)'}},fmt(g.myShare)),
              el('div',{style:{fontSize:'10px',color:statusColor,marginTop:'2px'}},STATUS)
            )
          ),
          el('div',{style:{background:'var(--surface2)',borderRadius:'100px',height:'6px',overflow:'hidden',marginBottom:'6px'}},
            el('div',{style:{height:'100%',width:g.pctDone+'%',background:g.color||'var(--green)',borderRadius:'100px'}})
          ),
          el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'11px',color:'var(--text3)'}},
            el('span',{},g.pctDone+'% · '+fmt(g.remaining)+' to go'),
            el('span',{},g.daysLeft+'d · need '+fmt(g.requiredPerPeriod)+'/paycheck')
          )
        );
        florasiiCard.append(goalBlock);
      }
      florasiiCard.append(
        el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'13px',paddingTop:'2px'}},
          el('span',{style:{color:'var(--text2)'}},'Required per paycheck (combined)'),
          el('span',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',color:totalRequiredPerPaycheck>avgFlorasiiPerPay?'var(--red)':'var(--green)'}},
            fmt(totalRequiredPerPaycheck))
        ),
        totalRequiredPerPaycheck>avgFlorasiiPerPay?
          el('div',{style:{fontSize:'11px',color:'var(--red)',marginTop:'6px'}},'Saving rate of '+fmt(avgFlorasiiPerPay)+'/paycheck is below target.'):
          el('div',{style:{fontSize:'11px',color:'var(--green)',marginTop:'6px'}},'Current saving rate covers all goals.')
      );
    }
    intelligenceWrap.append(florasiiCard);

    // ── MONEY LEAKS ──
    if(topCats.length||topMerchants.length){
      const leakCard = el('div',{class:'card',style:{marginBottom:'12px'}});
      leakCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},'💸 Where is your money going?'));

      if(thisMonthSpend>0){
        leakCard.append(el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'10px'}},
          'This month: '+fmt(thisMonthSpend)+' spent'+(thisMonthIncome>0?' · '+fmt(thisMonthIncome)+' earned':'')+
          (lastMonthSpend>0?' · '+(spendChange>0?'+':'')+Math.round(spendChange)+'% vs last month':'')));
      }

      for(const [cat,data] of topCats){
        const pctOfSpend = thisMonthSpend>0?Math.round(data.total/thisMonthSpend*100):0;
        const row = el('div',{style:{marginBottom:'10px'}});
        row.innerHTML=`<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
          <span>${cat}</span>
          <span style="font-family:'Space Mono',monospace;font-weight:700;color:var(--red)">${fmt(data.total)}</span>
        </div>
        <div style="background:var(--surface2);border-radius:100px;height:5px;overflow:hidden">
          <div style="height:100%;width:${pctOfSpend}%;background:var(--red);border-radius:100px"></div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${data.count} transactions · ${pctOfSpend}% of spending</div>`;
        leakCard.append(row);
      }

      if(topMerchants.length&&thisMonthSpend===0){
        leakCard.append(el('div',{style:{fontSize:'12px',color:'var(--text2)',marginBottom:'8px'}},'Last 14 days:'));
        for(const [merchant,data] of topMerchants){
          leakCard.append(el('div',{class:'balance-row'},
            el('div',{},el('div',{class:'balance-label'},merchant),el('div',{style:{fontSize:'11px',color:'var(--text3)'}},data.count+' transactions')),
            el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(data.total))
          ));
        }
      }
      intelligenceWrap.append(leakCard);
    }

    // ── RECOMMENDED ACTIONS ──
    const actions = [];
    if(balances.current<0) actions.push({icon:'🚨',text:'Your account is overdrawn — avoid spending until next payday',urgent:true});
    if(balances.creditCard>0&&balances.personalSavings>balances.creditCard) actions.push({icon:'💳',text:'You have enough in savings to clear your £'+Math.round(balances.creditCard)+' credit card balance',urgent:false});
    if(subTotal>150) actions.push({icon:'✂️',text:'Review your subscriptions — £'+Math.round(subTotal)+'/mo is significant',urgent:false});
    if(totalRequiredPerPaycheck>avgFlorasiiPerPay) actions.push({icon:'💰',text:'You need £'+Math.round(totalRequiredPerPaycheck)+'/paycheck to hit your Florasii goals — currently saving £'+Math.round(avgFlorasiiPerPay),urgent:false});
    const behindGoals = goalDetails.filter(g=>!g.onTrack);
    if(behindGoals.length) actions.push({icon:'⏰',text:behindGoals.map(g=>g.name).join(' and ')+' '+( behindGoals.length>1?'are':'is')+' behind target',urgent:false});
    if(txns.length===0) actions.push({icon:'📥',text:'Import your bank statement to unlock spending insights',urgent:false});

    if(actions.length){
      const actCard = el('div',{class:'card',style:{marginBottom:'12px'}});
      actCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},'💡 Recommended actions'));
      for(const a of actions){
        actCard.append(el('div',{style:{display:'flex',gap:'10px',alignItems:'flex-start',marginBottom:'10px',fontSize:'13px',
          color:a.urgent?'var(--red)':'var(--text2)',lineHeight:'1.5'}},
          el('span',{style:{flexShrink:'0'}},a.icon),
          el('span',{},a.text)
        ));
      }
      intelligenceWrap.append(actCard);
    }

    // ── SUBSCRIPTIONS (collapsed summary) ──
    intelligenceWrap.append(
      el('div',{class:'section-hdr'},'Subscriptions · '+fmt(subTotal)+'/mo'),
      el('div',{class:'card'},
        ...subscriptions.map(s=>el('div',{class:'sub-item'},
          el('div',{style:{fontSize:'14px'}},s.name),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'14px',color:'var(--text2)'}},fmt(s.amount))
        )),
        el('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:'14px',marginTop:'4px',borderTop:'1px solid var(--border)'}},
          el('div',{style:{fontSize:'13px',color:'var(--text2)',fontWeight:'600'}},'Annual cost'),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontSize:'14px',fontWeight:'700',color:'var(--amber)'}},fmt(subTotal*12))
        )
      )
    );
  }

  // Show balances immediately — use user-defined accounts if available, fallback to legacy
  const accs = appData.accounts||[];
  const legacyBalances = appData.balances||{};
  const balanceItems = accs.length ? accs.map(a=>({
    label:a.name, val:a.type==='credit_card'?-a.balance:a.balance,
    color:a.type==='credit_card'?'var(--red)':a.type==='savings'?'var(--green)':'var(--text)'
  })) : [
    {label:'Current', val:legacyBalances.current||0, color:(legacyBalances.current||0)<0?'var(--red)':'var(--text)'},
    {label:'Florasii', val:legacyBalances.florasii||0, color:'var(--green)'},
    {label:'Savings', val:legacyBalances.personalSavings||0, color:'var(--text)'},
    ...(legacyBalances.creditCard>0?[{label:'Credit Card', val:-(legacyBalances.creditCard||0), color:'var(--red)'}]:[]),
  ];

  content.append(
    el('div',{class:'card',style:{marginBottom:'12px'}},
      el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'}},
        ...balanceItems.map(({label,val,color})=>{
          const b=el('div',{style:{background:'var(--surface2)',borderRadius:'10px',padding:'10px 12px',cursor:'pointer'}});
          b.append(
            el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'2px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},label),
            el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'15px',color}},fmt(val))
          );
          b.addEventListener('click',()=>{ if(window._setTab) window._setTab('_accounts'); });
          return b;
        })
      ),
      accs.length===0?el('div',{style:{marginTop:'10px',textAlign:'center',fontSize:'12px',color:'var(--text3)',cursor:'pointer'}},'Tap to manage accounts →'):el('span')
    )
  );

  intelligenceWrap.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Analysing your finances…</div>';
  renderIntelligence();
  return content;
}

  const descInp = el('input',{placeholder:'Description (optional)',style:{marginBottom:'10px'}});
  const costInp = el('input',{inputmode:'decimal',placeholder:'Estimated cost (£)',style:{marginBottom:'10px'}});
  const dateInp = el('input',{type:'date',style:{marginBottom:'10px'}});

  const priSel = el('select',{style:{width:'100%',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'12px',padding:'12px 14px',fontSize:'15px',outline:'none',marginBottom:'10px'}});

  const freqSel = el('select',{style:{width:'100%',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'12px',padding:'12px 14px',fontSize:'15px',outline:'none',marginBottom:'14px'}});
  for(const f of FREQS) freqSel.append(el('option',{value:f},f));

  );
  return content;
}

// ── PHASE 4/5: Financial Intelligence Engine ──
function askScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  // ── deterministic financial context builder ──
  function buildFinancialContext(){
    const paychecks = (appData.paychecks||[]).filter(p=>p.income>0);
    const sorted = [...paychecks].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const balances = appData.balances||{};
    const subs = appData.subscriptions||[];
    const cashFlow = appData.cashFlow||[];
    const goals = appData.goals||[];
    const lifestyle = appData.lifestyleRequirements||[];
    const hoursLog = appData.hoursLog||[];
    const actualPay = appData.actualPay||{};
    const now = new Date();

    // Income stats
    const incomes = sorted.map(p=>p.income);
    const avgIncome = incomes.length?incomes.reduce((s,v)=>s+v,0)/incomes.length:0;
    const recentIncomes = incomes.slice(-6);
    const recentAvg = recentIncomes.length?recentIncomes.reduce((s,v)=>s+v,0)/recentIncomes.length:0;
    const lastPaycheck = sorted[sorted.length-1];
    const subTotal = subs.reduce((s,x)=>s+x.amount,0);

    // Florasii growth rate
    const snapshots = (appData.paychecks||[]).filter(p=>p.snapshot).sort((a,b)=>new Date(a.date)-new Date(b.date));
    let avgFlorasiiPerPay = 0;
    if(snapshots.length>=2){
      const growth = snapshots[snapshots.length-1].snapshot.florasii - snapshots[0].snapshot.florasii;
      avgFlorasiiPerPay = growth/Math.max(snapshots.length-1,1);
    }

    // Upcoming cash flow events (next 60 days)
    const upcoming = cashFlow.filter(e=>{
      const d = new Date(e.date);
      return d>=now && d<=new Date(now.getTime()+60*86400000);
    }).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const upcomingOut = upcoming.filter(e=>e.type==='out').reduce((s,e)=>s+e.amount,0);
    const upcomingIn = upcoming.filter(e=>e.type==='in').reduce((s,e)=>s+e.amount,0);

    // Savings rate
    const totalSaved = avgFlorasiiPerPay>0?avgFlorasiiPerPay:0;
    const savingsRate = recentAvg>0?((totalSaved/recentAvg)*100).toFixed(1):0;

    // Hours data
    const parseLabel = l=>{const p=l.split('/');return new Date(`${p[2]}-${p[1]}-${p[0]}`);};
    const sortedH=[...hoursLog].sort((a,b)=>parseLabel(a.label)-parseLabel(b.label));
    const pairs=[];
    for(let i=0;i<sortedH.length;i+=2) pairs.push({w1:sortedH[i],w2:sortedH[i+1]});
    const latestPair = pairs[pairs.length-1];
    const currentPeriodHours = latestPair?(latestPair.w1.total+(latestPair.w2?latestPair.w2.total:0)):0;
    const predictedNextPay = currentPeriodHours*(appData.hourlyRate||14.5);

    return {
      currentDate: now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
      balances: {
        currentAccount: balances.current||0,
        savings: (()=>{ const sa=(appData.accounts||[]).filter(a=>a.type==='savings'); return sa.length?sa.reduce((s,a)=>s+a.balance,0):(balances.florasii||0); })(),
        personalSavings: balances.personalSavings||0,
        creditCard: balances.creditCard||0,
      },
      income: {
        averagePaycheck: Math.round(avgIncome*100)/100,
        recentAverage: Math.round(recentAvg*100)/100,
        totalPaychecksLogged: paychecks.length,
        lastPaycheckAmount: lastPaycheck?lastPaycheck.income:0,
        lastPaycheckDate: lastPaycheck?lastPaycheck.date:null,
        predictedNextPaycheck: Math.round(predictedNextPay*100)/100,
        currentPeriodHoursWorked: currentPeriodHours,
      },
      subscriptions: {
        total: Math.round(subTotal*100)/100,
        monthly: Math.round(subTotal*100)/100,
        annual: Math.round(subTotal*12*100)/100,
        list: subs.map(s=>({name:s.name,amount:s.amount})),
      },
      savings: {
        florasiiGoal: 15000,
        florasiiCurrent: balances.florasii||0,
        florasiiRemaining: Math.max(0,15000-(balances.florasii||0)),
        avgSavedPerPaycheck: Math.round(avgFlorasiiPerPay*100)/100,
        estimatedSavingsRate: savingsRate+'%',
      },
      cashFlow: {
        upcomingCommittedExpenses: Math.round(upcomingOut*100)/100,
        upcomingExpectedIncome: Math.round(upcomingIn*100)/100,
        next60DaysEvents: upcoming.slice(0,10).map(e=>({label:e.label,amount:e.amount,type:e.type,date:e.date})),
      },
      lifestyle: lifestyle.filter(r=>r.active!==false).map(r=>({
        name:r.name, priority:r.priority, estimatedCost:r.estimatedCost, frequency:r.frequency
      })),
      goals: goals.map(g=>({name:g.name,target:g.target,current:g.current,targetDate:g.targetDate})),
      userName: appData.profile?.displayName || currentUser?.email?.split('@')[0] || 'User',
    };
  }

  // ── affordability engine ──
  function calculateAffordability(amount){
    const ctx = buildFinancialContext();
    const goals = appData.goals || [];

    // Step 1: Projected cash = current balance + expected income - committed expenses - subscriptions
    const projectedCash = ctx.balances.currentAccount
      + ctx.income.predictedNextPaycheck
      - ctx.cashFlow.upcomingCommittedExpenses
      - ctx.subscriptions.monthly;

    // Step 2: Required additional savings = savings needed to stay on goal
    // Only count if there's a goal with a target date that hasn't been reached
    let requiredSavings = 0;
    const goalDetails = [];
    for(const g of goals){
      if(!g.targetDate || !g.target) continue;
      const remaining = Math.max(0, (g.target||0) - (g.current||0));
      if(remaining <= 0) continue;
      const daysLeft = Math.max(1, Math.ceil((new Date(g.targetDate) - new Date()) / 86400000));
      const payPeriodsLeft = Math.max(1, Math.floor(daysLeft / 14));
      const requiredPerPeriod = remaining / payPeriodsLeft;
      requiredSavings += requiredPerPeriod;
      goalDetails.push({name:g.name, requiredPerPeriod:Math.round(requiredPerPeriod*100)/100});
    }
    // If no explicit goals, use historical Florasii savings rate as target
    if(goals.length === 0 && ctx.savings.avgSavedPerPaycheck > 0){
      requiredSavings = ctx.savings.avgSavedPerPaycheck;
    }

    // Step 3: Flexible money = projected cash minus required savings
    const flexibleMoney = projectedCash - requiredSavings;
    const canAfford = flexibleMoney >= amount;
    const wouldLeave = flexibleMoney - amount;

    return {
      // Components (shown to user)
      currentBalance: ctx.balances.currentAccount,
      expectedIncome: ctx.income.predictedNextPaycheck,
      upcomingCommitments: ctx.cashFlow.upcomingCommittedExpenses,
      subscriptions: ctx.subscriptions.monthly,
      projectedCash: Math.round(projectedCash*100)/100,
      requiredSavings: Math.round(requiredSavings*100)/100,
      flexibleMoney: Math.round(flexibleMoney*100)/100,
      // Result
      canAfford,
      wouldLeave: Math.round(wouldLeave*100)/100,
      goalDetails,
      hasGoals: goals.length > 0,
    };
  }

  // ── chat UI ──
  const messages = [];
  const chatWrap = el('div',{style:{display:'flex',flexDirection:'column',gap:'12px',marginBottom:'16px'}});

  function addMessage(role, text){

        method:'POST',
        headers:{
          'Content-Type':'application/json',

        },

// ── Transaction write layer (bypasses save() for scalability) ──
const txnDB = {
  async write(txn){
    const ref = db.ref('users/'+currentUser.uid+'/transactions/'+txn.transactionId);
    await ref.set(txn);
  },
  async writeBatch(txns){
    const updates = {};
    for(const t of txns) updates['users/'+currentUser.uid+'/transactions/'+t.transactionId] = t;
    await db.ref().update(updates);
  },
  async writeStatement(stmt){
    await db.ref('users/'+currentUser.uid+'/statements/'+stmt.statementId).set(stmt);
  },
  async getStatements(){
    const snap = await db.ref('users/'+currentUser.uid+'/statements').once('value');
    const val = snap.val();
    return val ? Object.values(val) : [];
  },
  async getTransactions(limitToLast=200){
    const snap = await db.ref('users/'+currentUser.uid+'/transactions').limitToLast(limitToLast).once('value');
    const val = snap.val();
    return val ? Object.values(val).sort((a,b)=>b.postingDate.localeCompare(a.postingDate)) : [];
  },
  async getFingerprints(){
    const stmts = await this.getStatements();
    return stmts.map(s=>s.fileFingerprint).filter(Boolean);
  },
  async deleteStatement(statementId){
    // Get all transactions for this statement
    const snap = await db.ref('users/'+currentUser.uid+'/transactions')
      .orderByChild('statementId').equalTo(statementId).once('value');
    const val = snap.val();
    if(val){
      const updates = {};
      for(const key of Object.keys(val)) updates['users/'+currentUser.uid+'/transactions/'+key] = null;
      await db.ref().update(updates);
    }
    await db.ref('users/'+currentUser.uid+'/statements/'+statementId).remove();
  }
};

const PAYMENT_CODE_MAP = {
  CPM: 'Card Purchase',
  BCC: 'Barclays Card',
  BGC: 'Bank Credit',
  FT:  'Funds Transfer',
  DDR: 'Direct Debit',
  UNP: 'Unpaid',
  WOT: 'Wire/Online Transfer',
  SO:  'Standing Order',
  SV:  'Internal Savings',
  BBP: 'Bill Payment',
};

function normaliseMerchant(rawDesc){
  const upper = rawDesc.toUpperCase();
  for(const [pat, name] of MERCHANT_PATTERNS){
    if(pat.test(upper)) return name;
  }
  // Generic cleanup: remove trailing reference numbers, ON DD MON, codes
  return rawDesc
    .replace(/\s+(ON \d{1,2} [A-Z]{3})\s*$/i, '')
    .replace(/\s+[A-Z0-9]{8,}\s*$/,'')
    .replace(/\s+\d{4,}\s*$/, '')
    .replace(/\t.*/,'')
    .trim()
    .split(/\s+/)
    .slice(0, 4)
    .join(' ')
    .replace(/\s+/,' ')
    .trim() || rawDesc.trim();
}

// ── Financial type classifier ──
function classifyFinancialType(row, amount, subcat, memo){
  const INTERNAL_ACCOUNTS = ['201139 03562921','201139 93224309'];
  const isInternal = INTERNAL_ACCOUNTS.some(a => memo.includes(a.replace(' ','')||a));

  if(subcat === 'Counter Credit' || subcat === 'Bill Payment'){
    // BGC = bank giro credit = incoming payment
    if(memo.includes(' BGC') && amount > 0) return 'INCOME';
  }
  if(subcat === 'Funds Transfer'){
    if(isInternal || memo.match(/FLORASII|FLOLOSII|FLOLOSIII|FLORAIII|FLORA|SAVINGS|CREDIT CARD|SP\b|SV\b|SO\b/i)){
      return amount < 0 ? 'SAVINGS_TRANSFER' : 'TRANSFER_IN';
    }
    return amount < 0 ? 'TRANSFER_OUT' : 'TRANSFER_IN';
  }
  if(subcat === 'Direct Debit') return 'EXPENSE';
  if(subcat === 'Unpaid') return 'TRANSFER_IN'; // reversed payment
  if(subcat === 'Cash Withdrawal') return 'EXPENSE';
  if(['Card Purchase','Contactless Card Purchase','Debit'].includes(subcat)){
    return amount < 0 ? 'EXPENSE' : 'REFUND';
  }
  if(amount > 0) return 'UNKNOWN_CREDIT';
  return 'EXPENSE';
}

function suggestCategory(merchant, financialType){
  if(financialType === 'INCOME') return ['Income', 'Employment'];
  if(financialType.includes('TRANSFER') || financialType === 'SAVINGS_TRANSFER') return ['Transfer', null];
  if(financialType === 'REFUND') return ['Refund', null];
  for(const [m, cat, sub] of CATEGORY_RULES){
    if(merchant === m) return [cat, sub];
  }
  return ['Uncategorised', null];

// ── File fingerprinting ──
async function hashFile(content){
  const buf = new TextEncoder().encode(content);
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── CSV Parser (Barclays format) ──
function parseBarclaysCSV(content){
  const lines = content.split('\n');
  const header = lines[0].trim();

  if(!header.includes('Number') || !header.includes('Subcategory') || !header.includes('Memo')){
    throw new Error('Unrecognised CSV format. Expected Barclays format with columns: Number, Date, Account, Amount, Subcategory, Memo');
  }

  const ON_DATE_PAT = /\bON (\d{1,2}) ([A-Z]{3})\b/;
  const CODE_PAT = /\b(CPM|BCC|BGC|FT|DDR|UNP|WOT|SO|SV|BBP|DEB)\b/g;

  const MONTH_MAP = {JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};

  function parseDate(str){
    // DD/MM/YYYY
    const p = str.trim().split('/');
    if(p.length===3) return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
    return str.trim();
  }

  function extractTransactionDate(postingDateStr, memo, year){
    const m = ON_DATE_PAT.exec(memo);
    if(!m) return null;
    const day = parseInt(m[1]);
    const mon = MONTH_MAP[m[2]];
    if(mon === undefined) return null;
    // Handle year rollover: if posting is Jan and txn is Dec, txn year = posting year - 1
    const postingParts = postingDateStr.split('-');
    let txnYear = parseInt(postingParts[0]);
    const postingMon = parseInt(postingParts[1]) - 1;
    if(postingMon === 0 && mon === 11) txnYear--;
    // Conversely if posting is Dec and txn is Jan (very rare for card transactions)
    if(postingMon === 11 && mon === 0) txnYear++;
    return `${txnYear}-${String(mon+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  const txns = [];
  let account = null;
  let minDate = null, maxDate = null;

  for(const rawLine of lines.slice(1)){
    const line = rawLine.replace(/^\t+/,'').trim();
    if(!line) continue;

    const parts = line.split(',', 5);
    if(parts.length < 5) continue;
    const [rawNum, rawDate, rawAccount, rawAmount] = parts;
    const rawMemo = line.slice(parts.slice(0,4).join(',').length + 1).replace(/\t/g,' ').trim();
    const rawSubcat = parts[4].trim();

    const amountVal = parseFloat(rawAmount);
    if(isNaN(amountVal)) continue;

    if(!account && rawAccount.trim()) account = rawAccount.trim();

    const postingDate = parseDate(rawDate);
    const txnDate = extractTransactionDate(postingDate, rawMemo, parseInt(postingDate.split('-')[0])) || postingDate;
    const txnDateInferred = txnDate === postingDate;

    // Extract payment codes
    const codes = [];
    let codeMatch;
    CODE_PAT.lastIndex = 0;
    while((codeMatch = CODE_PAT.exec(rawMemo)) !== null) codes.push(codeMatch[1]);
    const primaryCode = codes[0] || null;

    // Clean raw description (memo minus codes and date suffix)
    const rawDesc = rawMemo
      .replace(/\bON \d{1,2} [A-Z]{3}\b/g,'')
      .replace(/\b(CPM|BCC|BGC|FT|DDR|UNP|WOT|SO|SV|BBP|DEB|FIRST|PISP\w+|OBA\w+|212T\w+|BHL\w+|4929\w+)\b/g,'')
      .replace(/\s+/,' ').trim();

    const merchant = normaliseMerchant(rawMemo);
    const financialType = classifyFinancialType({}, amountVal, rawSubcat, rawMemo);
    const [category, subcategory] = suggestCategory(merchant, financialType);

    // Stable ID: we use a hash of key fields since Number is often 0
    const idSource = `${rawAccount.trim()}|${rawDate.trim()}|${rawAmount.trim()}|${rawMemo.trim()}`;
    const txnId = 'txn_' + btoa(idSource).replace(/[^a-z0-9]/gi,'').slice(0,20) + '_' + Math.random().toString(36).slice(2,6);

    const now = new Date().toISOString();
    const txn = {
      transactionId: txnId,
      statementId: null, // set when statement is saved
      accountId: rawAccount.trim(),
      postingDate,
      transactionDate: txnDate,
      transactionDateInferred: txnDateInferred,
      amount: Math.abs(amountVal),
      currency: 'GBP',
      direction: amountVal < 0 ? 'debit' : 'credit',
      bankTransactionNumber: rawNum.trim() || null,
      bankTransactionType: rawSubcat,
      bankPaymentCode: primaryCode,
      rawDescription: rawDesc,
      rawMemo: rawMemo,
      raw: { number: rawNum.trim(), date: rawDate.trim(), account: rawAccount.trim(), amount: rawAmount.trim(), subcategory: rawSubcat, memo: rawMemo },
      normalisedMerchant: merchant,
      financialType,
      category,
      subcategory: subcategory || null,
      purpose: null,
      goalId: null,
      tags: [],
      notes: '',
      reconciliationStatus: 'unmatched',
      matchedTransactionId: null,
      paycheckId: null,
      subscriptionId: null,
      confidence: financialType === 'UNKNOWN_CREDIT' || financialType === 'TRANSFER_IN' ? 0.5 : 0.8,
      source: 'statement',
      userConfirmed: false,
      userCategory: null,
      createdAt: now,
      updatedAt: now,
    };

    txns.push(txn);

    if(!minDate || postingDate < minDate) minDate = postingDate;
    if(!maxDate || postingDate > maxDate) maxDate = postingDate;
  }

  return { txns, account, minDate, maxDate };
}

// ── Duplicate detection ──
async function detectDuplicates(newTxns, existingFingerprints, statementId){
  // We check against existing transactions in Firebase
  const existingSnap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
  const existingVal = existingSnap.val() || {};
  const existing = Object.values(existingVal);

  const results = { strong: [], possible: [], clean: [] };

  for(const txn of newTxns){
    let strongMatch = false, possibleMatch = false;

    for(const ex of existing){
      if(ex.statementId === statementId) { strongMatch = true; break; } // same file
      // Possible duplicate: same account, date, amount, direction
      if(ex.accountId === txn.accountId &&
         ex.postingDate === txn.postingDate &&
         ex.amount === txn.amount &&
         ex.direction === txn.direction &&
         ex.rawDescription === txn.rawDescription){
        possibleMatch = true;
      }
    }

    if(strongMatch) results.strong.push(txn);
    else if(possibleMatch) results.possible.push({...txn, _duplicateWarning: true});
    else results.clean.push(txn);
  }

  return results;
}

// ── Paycheck reconciliation ──
function findPaycheckMatches(txns, paychecks){
  const matches = [];
  const incomeTxns = txns.filter(t => t.financialType === 'INCOME' && t.direction === 'credit');

  for(const txn of incomeTxns){
    for(const p of paychecks){
      const pDate = p.date ? p.date.slice(0,10) : null;
      const pAmount = p.income;
      const txnDate = txn.postingDate;
      const txnAmount = txn.amount;

      // Date within 3 days
      if(!pDate) continue;
      const daysDiff = Math.abs((new Date(txnDate) - new Date(pDate)) / 86400000);
      if(daysDiff > 3) continue;

      // Amount exact or within £5
      const amtDiff = Math.abs(txnAmount - pAmount);
      if(amtDiff > 5) continue;

      matches.push({
        txn,
        paycheck: p,
        amountDiff: amtDiff,
        daysDiff: Math.round(daysDiff),
        exact: amtDiff < 0.01,
        discrepancy: amtDiff > 0.01 ? amtDiff : null,
      });
    }
  }
  return matches;
}

// ── Subscription reconciliation ──
function findSubscriptionMatches(txns, subscriptions){
  const matches = [];
  const debitTxns = txns.filter(t => t.direction === 'debit' && ['Direct Debit','Bill Payment','Debit'].includes(t.bankTransactionType));

  for(const txn of debitTxns){
    for(const sub of subscriptions){
      const amtDiff = Math.abs(txn.amount - sub.amount);
      if(amtDiff > 2) continue; // within £2
      // Merchant name match
      const merchantMatch = txn.normalisedMerchant.toLowerCase().includes(sub.name.toLowerCase().split(' ')[0]) ||
                            sub.name.toLowerCase().includes(txn.normalisedMerchant.toLowerCase().split(' ')[0]);
      if(!merchantMatch) continue;

      matches.push({
        txn,
        subscription: sub,
        amountDiff: amtDiff,
        priceChanged: amtDiff > 0.01,
      });
    }
  }
  return matches;
}

// ── Update subscription billing dates from all transactions ──
async function updateSubscriptionBillingDates(allTxns){
  if(!allTxns || !allTxns.length) return;
  const debitTxns = allTxns.filter(t=>t.direction==='debit');

  const updatedSubs = appData.subscriptions.map(sub=>{
    const firstWord = sub.name.toLowerCase().split(' ')[0];
    const matchingTxns = debitTxns
      .filter(t=>
        t.normalisedMerchant.toLowerCase().includes(firstWord) ||
        firstWord.includes(t.normalisedMerchant.toLowerCase().split(' ')[0]) ||
        (t.rawDescription||'').toLowerCase().includes(firstWord) ||
        (t.rawMemo||'').toLowerCase().includes(firstWord)
      )
      .sort((a,b)=>b.postingDate.localeCompare(a.postingDate));

    if(!matchingTxns.length) return sub;

    // Most common billing day across all history
    const dayCount = {};
    for(const t of matchingTxns){
      const d = parseInt(t.postingDate.split('-')[2]);
      dayCount[d] = (dayCount[d]||0)+1;
    }
    const billingDay = parseInt(Object.entries(dayCount).sort((a,b)=>b[1]-a[1])[0][0]);
    const lastPaid = matchingTxns[0];
    const amountChanged = Math.abs(lastPaid.amount - sub.amount) > 0.5;

    return {
      ...sub,
      billingDay,
      lastPaidDate: lastPaid.postingDate,
      lastPaidAmount: lastPaid.amount,
      amountChangedFromStatement: amountChanged,
    };
  });

  await save({...appData, subscriptions: updatedSubs});
  // Update in-memory too
  appData.subscriptions = updatedSubs;
}
