    back.style.opacity = back.disabled?'.3':'1'; fwd.style.opacity = fwd.disabled?'.3':'1';
    back.addEventListener('click',()=>{ if(yearShown>firstYear){yearShown--; renderYearStrip(txns);} });
    fwd .addEventListener('click',()=>{ if(yearShown<lastYear){yearShown++;  renderYearStrip(txns);} });
    head.append(el('div',{class:'t-eyebrow'},'Activity in '+yearShown),
      el('div',{style:{display:'flex',gap:'2px'}},back,fwd));
    yearWrap.append(head);

    const yearKeys=Array.from({length:12},(_,i)=>yearShown+'-'+String(i+1).padStart(2,'0'));
    const maxSpend=Math.max(1,...yearKeys.map(k=>spend[k]||0));

    const strip=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(12,1fr)',gap:'3px',alignItems:'end',height:'54px'}});
    const labels=el('div',{style:{display:'grid',gridTemplateColumns:'repeat(12,1fr)',gap:'3px',marginTop:'5px'}});

    yearKeys.forEach((k,i)=>{
      const s=spend[k]||0, has=s>0||(income[k]||0)>0;
      const isCurrent = (yearShown===viewYear && i===viewMonth);
      const h=has?Math.max(6,Math.round(s/maxSpend*44)):3;
      const col=el('div',{style:{
        height:h+'px', borderRadius:'3px', cursor:has?'pointer':'default',
        background: isCurrent?'var(--accent)':has?'var(--surface-3)':'var(--line-soft)',
        transition:'background .15s var(--ease),height .4s var(--ease)'}});
      if(has){
        col.title=k+' · '+fmt(s)+' spent';
        col.addEventListener('click',()=>{ viewYear=yearShown; viewMonth=i; cachedData=null; renderCalendar(); });
      }
      strip.append(col);
      labels.append(el('div',{style:{fontSize:'8.5px',textAlign:'center',
        color:isCurrent?'var(--accent)':has?'var(--ink-3)':'var(--ink-4)',fontWeight:isCurrent?'700':'400'}},
        'JFMAMJJASOND'[i]));
    });

    yearWrap.append(strip,labels);

    const yTotal=yearKeys.reduce((s,k)=>s+(spend[k]||0),0);
    const yIn=yearKeys.reduce((s,k)=>s+(income[k]||0),0);
    const active=yearKeys.filter(k=>(spend[k]||0)>0||(income[k]||0)>0).length;
    yearWrap.append(el('div',{class:'t-meta',style:{marginTop:'var(--s2)',textAlign:'center'}},
      active+' active month'+(active===1?'':'s')+' · '+fmt(yIn)+' in · '+fmt(yTotal)+' out'));
  }

  const calWrap = el('div',{});
  const dayDetailWrap = el('div',{});
  const legendWrap = el('div',{style:{display:'flex',gap:'16px',marginBottom:'12px',fontSize:'11px',color:'var(--text2)',flexWrap:'wrap'}});
  legendWrap.innerHTML = `
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block"></span>Income actual</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block"></span>Expense actual</span>
    <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--amber);border:1.5px dashed var(--amber);display:inline-block"></span>Expected</span>
    <span style="display:flex;align-items:center;gap:4px">💳 Card payment due</span>`;

  let cachedData = null;

  async function renderCalendar(){
    calWrap.innerHTML = '<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">Loading…</div>';
    if(!cachedData) cachedData = await loadCalendarData();
    const dayEvents = buildDayEvents(cachedData, viewYear, viewMonth);

    renderYearStrip(cachedData.txns);

    calWrap.innerHTML = '';
    const firstDay = new Date(viewYear, viewMonth, 1);
    const lastDay = new Date(viewYear, viewMonth+1, 0);
    const startDow = (firstDay.getDay()+6)%7; // Mon=0
    const totalDays = lastDay.getDate();
    const monthName = firstDay.toLocaleDateString('en-GB',{month:'long',year:'numeric'});

    // Nav header
    const hdr = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}});
    const prevBtn = el('button',{style:{background:'var(--surface2)',color:'var(--text)',border:'none',borderRadius:'10px',padding:'8px 14px',fontSize:'18px'}},'‹');
    const nextBtn = el('button',{style:{background:'var(--surface2)',color:'var(--text)',border:'none',borderRadius:'10px',padding:'8px 14px',fontSize:'18px'}},'›');
    prevBtn.addEventListener('click',()=>{ viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} cachedData=null; renderCalendar(); });
    nextBtn.addEventListener('click',()=>{ viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} cachedData=null; renderCalendar(); });
    hdr.append(prevBtn, el('div',{style:{fontWeight:'700',fontSize:'16px'}},monthName), nextBtn);
    calWrap.append(hdr);

    // Day-of-week labels
    const dayNames = el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'2px',marginBottom:'4px'}});
    for(const d of ['M','T','W','T','F','S','S'])
      dayNames.append(el('div',{style:{textAlign:'center',fontSize:'10px',color:'var(--text3)',fontWeight:'600',padding:'4px 0'}},d));
    calWrap.append(dayNames);

    // Calendar grid
    const grid = el('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'2px'}});
    for(let i=0;i<startDow;i++) grid.append(el('div',{}));

    for(let d=1;d<=totalDays;d++){
      const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const events = dayEvents[dateStr] || [];
      const isToday = dateStr === now.toISOString().slice(0,10);
      const isSelected = selectedDate === dateStr;
      const isPast = new Date(dateStr) < new Date(now.toISOString().slice(0,10));

      const hasIncome = events.some(e=>e.direction==='credit');
      const hasExpense = events.some(e=>e.direction==='debit' && e.type==='actual');
      const hasExpected = events.some(e=>e.type==='expected');
      const hasCardDue = events.some(e=>e.source==='credit card' && e.type==='expected');

      const cell = el('div',{style:{
        borderRadius:'8px',
        padding:'4px 2px',
        minHeight:'52px',
        cursor: events.length ? 'pointer':'default',
        background: isSelected ? 'var(--surface)' : isToday ? 'var(--surface2)' : hasCardDue ? 'var(--red-dim)' : 'transparent',
        border: isToday ? '1px solid var(--green)' : isSelected ? '1px solid var(--text2)' : hasCardDue ? '1px solid var(--red)' : '1px solid transparent',
        opacity: isPast && !events.length ? '0.35' : '1',
      }});

      cell.append(el('div',{style:{
        textAlign:'center',
        fontSize:'12px',
        fontWeight: isToday ? '700':'400',
        color: isToday ? 'var(--green)' : 'var(--text)',
        marginBottom:'3px',
      }},String(d)));

      // Event dots
      const dots = el('div',{style:{display:'flex',flexWrap:'wrap',gap:'2px',justifyContent:'center',minHeight:'14px'}});
      if(hasIncome) dots.append(el('div',{style:{width:'6px',height:'6px',borderRadius:'50%',background:'var(--green)',flexShrink:'0'}}));
      if(hasExpense) dots.append(el('div',{style:{width:'6px',height:'6px',borderRadius:'50%',background:'var(--red)',flexShrink:'0'}}));
      if(hasExpected && !hasExpense) dots.append(el('div',{style:{width:'6px',height:'6px',borderRadius:'50%',border:'1.5px dashed var(--amber)',flexShrink:'0'}}));
      if(hasCardDue) dots.append(el('div',{style:{fontSize:'8px',lineHeight:'6px',flexShrink:'0'}},'💳'));

      // Amount preview for days with events
      if(events.length === 1){
        const e = events[0];
        const amtEl = el('div',{style:{fontSize:'9px',textAlign:'center',fontFamily:"'Space Mono',monospace",color:e.direction==='credit'?'var(--green)':e.type==='expected'?'var(--amber)':'var(--red)',marginTop:'2px',lineHeight:'1.1'}},
          (e.direction==='credit'?'+':'-')+'£'+e.amount.toFixed(0));
        cell.append(amtEl);
      } else if(events.length > 1){
        cell.append(el('div',{style:{fontSize:'9px',textAlign:'center',color:'var(--text3)',marginTop:'2px'}},events.length+'×'));
      }

      cell.append(dots);

      if(events.length){
        cell.addEventListener('click',()=>{ selectedDate=dateStr; renderDayDetail(dateStr, events); renderCalendar(); });
      }
      grid.append(cell);
    }
    calWrap.append(grid);

    // Monthly summary bar
    const allEvents = Object.values(dayEvents).flat();
    const monthIn = allEvents.filter(e=>e.direction==='credit'&&e.type==='actual').reduce((s,e)=>s+e.amount,0);
    // Cash out = what actually left the bank. Card purchases are excluded here
    // because the card payment already represents them — counting both would
    // show the same spending twice.
    const monthOut = allEvents.filter(e=>e.direction==='debit'&&e.type==='actual'&&!e.onCard).reduce((s,e)=>s+e.amount,0);
    const monthOnCard = allEvents.filter(e=>e.direction==='debit'&&e.onCard).reduce((s,e)=>s+e.amount,0);
    const monthExpected = allEvents.filter(e=>e.type==='expected'&&e.direction==='debit').reduce((s,e)=>s+e.amount,0);

    const summaryBar = el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px',marginTop:'12px'}});
    const mstat = (label,val,color)=>{
      const c=el('div',{style:{background:'var(--surface2)',borderRadius:'10px',padding:'8px',textAlign:'center'}});
      c.append(
        el('div',{style:{fontSize:'10px',color:'var(--text3)',marginBottom:'2px'}},label),
        el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'13px',color}},val)
      );
      return c;
    };
    summaryBar.append(
      mstat('In (actual)', '+£'+Math.round(monthIn), 'var(--green)'),
      mstat('Out of bank', '-£'+Math.round(monthOut), 'var(--red)'),
      monthOnCard>0
        ? mstat('On card', '£'+Math.round(monthOnCard), 'var(--amber)')
        : mstat('Expected out', '~£'+Math.round(monthExpected), 'var(--amber)')
    );
    if(monthOnCard>0){
      calWrap.append(el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'8px',lineHeight:'1.5',textAlign:'center'}},
        'Card spending is shown separately — it leaves your bank later as the card payment, so it is not added to "Out of bank".'));
    }
    calWrap.append(summaryBar);
  }

  function renderDayDetail(dateStr, events){
    dayDetailWrap.innerHTML = '';
    const d = new Date(dateStr);
    const dayLabel = d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    const panel = el('div',{class:'card',style:{marginTop:'12px'}});
    panel.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},dayLabel));

    for(const e of events){
      const row = el('div',{style:{
        display:'flex',justifyContent:'space-between',alignItems:'center',
        padding:'10px 0',borderBottom:'1px solid var(--border)'
      }});
      const statusDot = e.type==='actual'?
        el('div',{style:{width:'8px',height:'8px',borderRadius:'50%',background:e.direction==='credit'?'var(--green)':'var(--red)',flexShrink:'0',marginRight:'10px'}}):
        el('div',{style:{width:'8px',height:'8px',borderRadius:'50%',border:'1.5px dashed var(--amber)',flexShrink:'0',marginRight:'10px'}});
      const info = el('div',{style:{flex:'1'}},
        el('div',{style:{fontSize:'13px',fontWeight:'500'}},e.label),
        el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'1px'}},
          (e.type==='actual'?'✓ Actual':'Expected')+(e.onCard?' · on card':'')+(e.detail?' · '+e.detail:e.source?' · '+e.source:''))
      );
      const amt = el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',
        color:e.direction==='credit'?'var(--green)':e.type==='expected'?'var(--amber)':'var(--red)'}},
        (e.direction==='credit'?'+':'-')+'£'+e.amount.toFixed(2));
      row.append(statusDot, info, amt);
      panel.append(row);
    }

    const closeBtn = el('button',{class:'btn-ghost',style:{marginTop:'10px'}},'Close');
    closeBtn.addEventListener('click',()=>{ selectedDate=null; dayDetailWrap.innerHTML=''; });
    panel.append(closeBtn);
    dayDetailWrap.append(panel);
    dayDetailWrap.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  // ── Add event form (kept for manual entries) ──
  const addToggle = el('button',{class:'btn-ghost',style:{width:'100%',marginBottom:'8px'}},'+ Add custom event');
  const formCard = el('div',{class:'card',style:{display:'none',marginBottom:'12px'}});
  addToggle.addEventListener('click',()=>{
    formCard.style.display = formCard.style.display==='none'?'block':'none';
    addToggle.textContent = formCard.style.display==='none'?'+ Add custom event':'− Hide form';
  });

  const nameInp = el('input',{placeholder:'Label (e.g. Rent, Payday)',style:{marginBottom:'10px'}});
  const amtInp  = el('input',{inputmode:'decimal',placeholder:'Amount (£)',style:{marginBottom:'10px'}});
  const dateInp = el('input',{type:'date',style:{marginBottom:'10px'}});
  dateInp.value = now.toISOString().slice(0,10);
  const recurSel = el('select',{style:{width:'100%',background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'12px',padding:'12px 14px',fontSize:'15px',outline:'none',marginBottom:'10px'}});
  for(const opt of ['Once','Weekly','Every 2 weeks','Monthly']) recurSel.append(el('option',{value:opt},opt));

  let selectedType = 'in';
  const typeRow = el('div',{style:{display:'flex',gap:'8px',marginBottom:'14px'}});
  const inBtn  = el('button',{style:{flex:'1',padding:'10px',borderRadius:'12px',fontWeight:'700',fontSize:'14px',background:'var(--green)',color:'#000',border:'none'}},'💰 In');
  const outBtn = el('button',{style:{flex:'1',padding:'10px',borderRadius:'12px',fontWeight:'700',fontSize:'14px',background:'var(--surface2)',color:'var(--text2)',border:'1px solid var(--border)'}},'💸 Out');
  inBtn.addEventListener('click',()=>{ selectedType='in'; inBtn.style.background='var(--green)'; inBtn.style.color='#000'; outBtn.style.background='var(--surface2)'; outBtn.style.color='var(--text2)'; });
  outBtn.addEventListener('click',()=>{ selectedType='out'; outBtn.style.background='var(--red)'; outBtn.style.color='#fff'; inBtn.style.background='var(--surface2)'; inBtn.style.color='var(--text2)'; });
  typeRow.append(inBtn, outBtn);

  const addBtn = el('button',{class:'btn-primary'},'Add event');
  addBtn.addEventListener('click',()=>{
    if(!nameInp.value||!amtInp.value||!dateInp.value) return;
    const newEvent = {id:uid(), label:nameInp.value.trim(), amount:parseFloat(amtInp.value)||0, date:dateInp.value, type:selectedType, recur:recurSel.value};
    const updated = [...(appData.cashFlow||[]), newEvent];
    save({...appData, cashFlow:updated});
    nameInp.value=''; amtInp.value='';
    cachedData=null;
    addBtn.textContent='Added ✓';
    setTimeout(()=>{ addBtn.textContent='Add event'; renderCalendar(); },1000);
  });
  formCard.append(nameInp,amtInp,dateInp,recurSel,typeRow,addBtn);

  // If no card payment can be shown, say why rather than showing nothing
  const cardNote = el('div',{style:{display:'none'}});
  loadCalendarData().then(d=>{
    if(d.cardStmts && d.cardStmts.length) return;
    const hasCardAcct = (appData.accounts||[]).some(a=>a.type==='credit_card');
    cardNote.style.display='block';
    cardNote.className='card';
    cardNote.style.borderLeft='3px solid var(--amber)';
    cardNote.style.marginTop='12px';
    cardNote.append(
      el('div',{style:{fontWeight:'600',fontSize:'13px',marginBottom:'6px',color:'var(--amber)'}},'No card payment shown'),
      el('div',{style:{fontSize:'12px',color:'var(--text2)',lineHeight:'1.6'}},
        hasCardAcct
          ? 'Your imported statements are missing the balance or due date, so the payment cannot be placed on a day. Set your card balance in Money → Accounts, or import a recent statement, and it will appear.'
          : 'Add your credit card in Money → Accounts, or import a Barclaycard PDF, and its payment date will show here.')
    );
  }).catch(()=>{});

  content.append(yearWrap, legendWrap, calWrap, dayDetailWrap, cardNote, addToggle, formCard);
  renderCalendar();
  return content;
}

function accountsScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});

  // ── Barclays sync banner — renders immediately, updates async ──
  const syncBanner = el('div',{class:'card',style:{marginBottom:'var(--s3)'}});
  const connectBtn = el('button',{class:'btn-primary',style:{width:'100%',marginTop:'10px'}},
    '🏦 Connect Barclays — sync balances automatically');
  connectBtn.addEventListener('click',()=>connectBarclays());
  syncBanner.append(
    el('div',{style:{fontWeight:'600',fontSize:'13px',marginBottom:'4px'}},'Sync with Barclays'),
    el('div',{style:{fontSize:'12px',color:'var(--ink-3)',lineHeight:'1.5'}},
      'Connect once and your balances update automatically every time you open the app.'),
    connectBtn);
  content.append(syncBanner);
  // Check if already connected and update banner async
  getValidAccessToken().then(token=>{
    if(!token) return;
    const lastSync = (appData.accounts||[]).find(a=>a.syncedFromBank)?.updatedAt;
    const syncBtn = el('button',{class:'btn-ghost',style:{fontSize:'12px'}},'Sync now');
    syncBtn.addEventListener('click',async()=>{
      syncBtn.textContent='Syncing…'; syncBtn.disabled=true;
      const changed = await syncBankingBalances().catch(()=>false);
      syncBtn.textContent=changed?'✓ Updated':'✓ Up to date';
      setTimeout(()=>{ syncBtn.textContent='Sync now'; syncBtn.disabled=false; },2000);
      if(changed) renderAccounts();
    });
    syncBanner.innerHTML='';
    syncBanner.append(
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        el('div',{},
          el('div',{style:{fontWeight:'600',fontSize:'13px'}},'🔗 Barclays connected'),
          el('div',{style:{fontSize:'11px',color:'var(--ink-3)',marginTop:'2px'}},
            lastSync?'Last synced '+new Date(lastSync).toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Connected')),
        syncBtn));
  }).catch(()=>{});
  const TYPES = [
    {key:'current',      label:'Spending', icon:'🏦', sign:1},
    {key:'savings',      label:'Savings Account',  icon:'💰', sign:1},
    {key:'credit_card',  label:'Credit Card',       icon:'💳', sign:-1},
    {key:'investment',   label:'Investment',         icon:'📈', sign:1},
    {key:'cash',         label:'Cash',              icon:'💵', sign:1},
    {key:'other',        label:'Other',             icon:'📁', sign:1},
  ];
  let accounts = [...(appData.accounts||[])];
  const listWrap = el('div',{});

  function renderAccounts(){
    listWrap.innerHTML='';
    if(!accounts.length){
      listWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'24px',color:'var(--text2)',fontSize:'13px'}},
        'No accounts yet. Add your bank accounts, savings pots, and credit cards below.'));
      return;
    }
    const netWorth = accounts.reduce((s,a)=>a.type==='credit_card'?s-a.balance:s+a.balance,0);
    listWrap.append(el('div',{class:'card',style:{marginBottom:'12px'}},
      el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        el('div',{style:{fontSize:'13px',color:'var(--text2)'}},'Net worth'),
        el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'20px',color:netWorth>=0?'var(--green)':'var(--red)'}},fmt(netWorth))
      )
    ));
    for(const a of accounts){
      const typeInfo = TYPES.find(t=>t.key===a.type)||TYPES[5];
      const card = el('div',{class:'card',style:{marginBottom:'8px'}});
      const balanceInp = el('input',{inputmode:'decimal',value:a.balance.toFixed(2),style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'18px',background:'none',border:'none',color:a.type==='credit_card'?'var(--red)':'var(--green)',padding:'0',width:'120px',textAlign:'right',outline:'none'}});
      balanceInp.addEventListener('change',async()=>{
        const val = parseFloat(balanceInp.value)||0;
        const stamp = new Date().toISOString();
        accounts = accounts.map(x=>x.id===a.id?{...x,balance:val,balanceAsOf:stamp,updatedAt:stamp}:x);
        appData.accounts=accounts;
        await save({...appData,accounts});
        renderAccounts();
      });
      const row = el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
      row.append(
        el('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
          el('div',{style:{fontSize:'20px'}},typeInfo.icon),
          el('div',{},
            el('div',{style:{fontWeight:'600',fontSize:'14px'}},a.name),
            el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'1px'}},typeInfo.label)
          )
        ),
        el('div',{style:{display:'flex',alignItems:'center',gap:'4px'}},
          el('span',{style:{fontSize:'16px',color:'var(--text3)',fontFamily:"'Space Mono',monospace"}},'£'),
          balanceInp
        )
      );
      // How current is this figure, and can it self-update?
      const stampStr = a.balanceAsOf || a.updatedAt;
      const stampDate = stampStr ? new Date(stampStr) : null;
      const daysOld = stampDate && !isNaN(stampDate)
        ? Math.floor((Date.now()-stampDate)/86400000) : null;
      const isCard = a.type==='credit_card';
      const freshness = el('div',{style:{fontSize:'11px',marginTop:'6px',
        color: daysOld!=null && daysOld>14 ? 'var(--amber)' : 'var(--text3)'}},
        isCard
          ? 'Syncs from your latest imported card statement'
          : (daysOld==null ? 'Enter your balance from the Barclays app'
             : daysOld===0 ? 'Updated today'
             : 'Last updated '+daysOld+' day'+(daysOld===1?'':'s')+' ago — statements do not carry a balance, so this one is yours to keep current'));
      card.append(freshness);

      if(isCard){
        const syncBtn = el('button',{style:{background:'var(--surface2)',color:'var(--text2)',
          border:'1px solid var(--border)',borderRadius:'10px',padding:'7px 12px',
          fontSize:'12px',fontWeight:'600',marginTop:'8px'}},'Update from latest statement');
        syncBtn.addEventListener('click',async()=>{
          syncBtn.textContent='Checking…'; syncBtn.disabled=true;
          try{
            const snap=await db.ref('users/'+currentUser.uid+'/statements').once('value');
            const cardStmts=Object.values(snap.val()||{})
              .filter(s=>s.statementKind==='credit_card' && s.statementBalance!=null)
              .sort((a2,b2)=>(b2.periodEnd||'').localeCompare(a2.periodEnd||''));
            if(!cardStmts.length){ syncBtn.textContent='No card statements imported'; return; }
            const latest=cardStmts[0];
            const stamp=new Date().toISOString();
            accounts=accounts.map(x=>x.id===a.id
              ? {...x,balance:latest.statementBalance,
                 creditLimit:latest.creditLimit!=null?latest.creditLimit:x.creditLimit,
                 balanceAsOf:latest.periodEnd||stamp,updatedAt:stamp}:x);
            appData.accounts=accounts;
            await save({...appData,accounts,balances:{...appData.balances,creditCard:latest.statementBalance}});
            renderAccounts();
          }catch(err){
            syncBtn.textContent='Could not sync'; syncBtn.disabled=false;
          }
        });
        card.append(syncBtn);
        card.append(el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'6px',lineHeight:'1.5'}},
          'Your statement balance is only correct up to the statement date. Anything you have spent since will not show until the next statement — check the Barclaycard app for the live figure.'));
      }

      // What is this account FOR? Drives the pots view on Home.
      const ROLES=[['spending','💷 Day-to-day spending'],['card_pot','🏦 Money to clear the card'],
                   ['goals','🌸 Savings goals'],['card','💳 Credit card debt']];
      const currentRole = inferRole(a);
      const roleWrap = el('div',{style:{marginTop:'10px'}});
      roleWrap.append(el('div',{style:{fontSize:'10px',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'1px',fontWeight:'700',marginBottom:'5px'}},'What is it for?'));
      const roleChips = el('div',{style:{display:'flex',flexWrap:'wrap',gap:'5px'}});
      for(const [key,label] of ROLES){
        const on = currentRole===key;
        const chip = el('button',{style:{
          background:on?'var(--green)':'var(--surface2)', color:on?'#000':'var(--text2)',
          border:on?'none':'1px solid var(--border)', borderRadius:'100px',
          padding:'4px 10px', fontSize:'11px', fontWeight:'600'}},label);
        chip.addEventListener('click',async()=>{
          accounts = accounts.map(x=>x.id===a.id?{...x,role:key,updatedAt:new Date().toISOString()}:x);
          appData.accounts=accounts;
          await save({...appData,accounts});
          renderAccounts();
        });
        roleChips.append(chip);
      }

  for(const [key,label] of modes){

// ── Spending Intelligence ──
async function buildSpendingInsights(){
  const snap = await db.ref('users/'+currentUser.uid+'/transactions').once('value');
  const val = snap.val()||{};
  const allTxns = Object.values(val);

  const SKIP_TYPES = ['INCOME','SAVINGS_TRANSFER','TRANSFER_OUT','TRANSFER_IN','REFUND'];
  const expenses = allTxns.filter(t=>!SKIP_TYPES.includes(t.financialType) && t.direction==='debit');

  if(expenses.length < 20) return null;

  const now = new Date();

  // Group into 4-week periods
  function periodKey(dateStr){
    const d = new Date(dateStr);
    const msAgo = now - d;
    const weeksAgo = Math.floor(msAgo / (7*86400000));
    const period = Math.floor(weeksAgo / 4);
    return period; // 0=most recent 4 weeks, 1=4-8 weeks ago, etc
  }

  // Only use last 6 months of data
  const sixMonthsAgo = new Date(now); sixMonthsAgo.setMonth(sixMonthsAgo.getMonth()-6);
  const recentExp = expenses.filter(t=>new Date(t.postingDate)>=sixMonthsAgo);

  // Weekly spend calculation
  const weeklyTotals = {};
  for(const t of recentExp){
    const d = new Date(t.postingDate);
    const dow = d.getDay();
    const monDay = new Date(d); monDay.setDate(d.getDate() - (dow===0?6:dow-1));
    const wk = monDay.toISOString().slice(0,10);
    weeklyTotals[wk] = (weeklyTotals[wk]||0) + t.amount;
  }
  const weeks = Object.entries(weeklyTotals).sort((a,b)=>a[0].localeCompare(b[0]));
  const avgWeekly = weeks.length ? weeks.reduce((s,[,v])=>s+v,0)/weeks.length : 0;

  // Recent 4 weeks vs previous 4 weeks
  const recent4 = weeks.slice(-4);
  const prev4   = weeks.slice(-8,-4);
  const recentAvg = recent4.length ? recent4.reduce((s,[,v])=>s+v,0)/recent4.length : 0;
  const prevAvg   = prev4.length   ? prev4.reduce((s,[,v])=>s+v,0)/prev4.length     : recentAvg;
  const weeklyTrend = prevAvg > 0 ? ((recentAvg-prevAvg)/prevAvg*100) : 0;

  // Category breakdown — recent 4 weeks vs previous 4 weeks
  const recentCutoff = new Date(now); recentCutoff.setDate(recentCutoff.getDate()-28);
  const prevCutoff   = new Date(now); prevCutoff.setDate(prevCutoff.getDate()-56);

  const recentBycat = {}, prevBycat = {};
  for(const t of recentExp){
    const d = new Date(t.postingDate);
    const cat = t.userCategory||t.category||'Other';
    if(d >= recentCutoff){ recentBycat[cat]=(recentBycat[cat]||0)+t.amount; }
    else if(d >= prevCutoff){ prevBycat[cat]=(prevBycat[cat]||0)+t.amount; }
  }

  // Build category insights
  const allCats = new Set([...Object.keys(recentBycat),...Object.keys(prevBycat)]);
  const catInsights = [];
  for(const cat of allCats){
    if(cat==='Transfer'||cat==='Savings') continue;
    const r = recentBycat[cat]||0;
    const p = prevBycat[cat]||0;
    const change = p>0 ? ((r-p)/p*100) : 0;
    catInsights.push({cat, recent:r, prev:p, change, weekly:r/4});
  }
  catInsights.sort((a,b)=>b.recent-a.recent);

  // Top merchants this month
  const merchantTotals = {};
  for(const t of recentExp.filter(t=>new Date(t.postingDate)>=recentCutoff)){
    const m = t.normalisedMerchant||t.rawDescription;
    if(!merchantTotals[m]) merchantTotals[m]={total:0,count:0};
    merchantTotals[m].total+=t.amount; merchantTotals[m].count++;
  }
  const topMerchants = Object.entries(merchantTotals).sort((a,b)=>b[1].total-a[1].total).slice(0,6);

  // Recommendations
  const recs = [];
  const risingCats = catInsights.filter(c=>c.change>30&&c.recent>20);
  for(const c of risingCats.slice(0,3)){
    recs.push({
      icon:'📈', severity:'warning',
      msg:`${c.cat} up ${Math.round(c.change)}% vs last month (£${c.recent.toFixed(0)} vs £${c.prev.toFixed(0)})`,
      saving: c.recent-c.prev,
    });
  }
  if(weeklyTrend > 15) recs.push({
    icon:'⚠️', severity:'warning',
    msg:`Weekly spend is up ${Math.round(weeklyTrend)}% recently — possible lifestyle inflation`,
    saving: recentAvg-prevAvg,
  });

  // Find merchant-specific cuts
  for(const [m, data] of topMerchants){
    if(m.toLowerCase().includes('uber')||m.toLowerCase().includes('bolt')){
      recs.push({icon:'🚕',severity:'tip',msg:`Taxis (${m}): £${data.total.toFixed(0)} this month, ${data.count} trips — could you bus/cycle some of these?`,saving:data.total*0.5});
    }
    if((m.toLowerCase().includes('deliveroo')||m.toLowerCase().includes('uber eats')||m.toLowerCase().includes('just eat'))&&data.total>20){
      recs.push({icon:'🍔',severity:'tip',msg:`Food delivery (${m}): £${data.total.toFixed(0)} this month — cooking saves 60-70% per meal`,saving:data.total*0.6});
    }
  }

  return {avgWeekly, recentAvg, prevAvg, weeklyTrend, weeks, catInsights, topMerchants, recs};
}

function spendingInsightsScreen(){
  const content = el('div',{class:'content',style:{paddingBottom:'100px'}});
  const wrap = el('div',{});
  wrap.innerHTML='<div style="color:var(--text3);font-size:13px;text-align:center;padding:30px">Analysing your spending…</div>';
  content.append(wrap);

  buildSpendingInsights().then(data=>{
    wrap.innerHTML='';
    if(!data){
      wrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'30px',color:'var(--text2)',fontSize:'13px'}},
        'Import your bank statement to unlock spending insights.'));
      return;
    }

    const {avgWeekly,recentAvg,prevAvg,weeklyTrend,weeks,catInsights,topMerchants,recs} = data;
    const trendColor = weeklyTrend > 15 ? 'var(--red)' : weeklyTrend < -10 ? 'var(--green)' : 'var(--amber)';
    const trendIcon = weeklyTrend > 15 ? '📈' : weeklyTrend < -10 ? '📉' : '➡️';

    // Weekly spend summary
    const summaryCard = el('div',{class:'card',style:{marginBottom:'12px'}});
    summaryCard.append(
      el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'14px'}},
        el('div',{},
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'4px',textTransform:'uppercase',letterSpacing:'1px'}},'Avg weekly spend'),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'24px'}},fmt(avgWeekly))
        ),
        el('div',{},
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'4px',textTransform:'uppercase',letterSpacing:'1px'}},'Trend'),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'24px',color:trendColor}},
            trendIcon+' '+(weeklyTrend>0?'+':'')+Math.round(weeklyTrend)+'%')
        )
      ),
      el('div',{style:{fontSize:'12px',color:'var(--text2)',lineHeight:'1.6'}},
        `Last 4 weeks: ${fmt(recentAvg)}/wk vs ${fmt(prevAvg)}/wk prior. `+
        (weeklyTrend>15?'Your spending is rising — check the breakdown below.':
         weeklyTrend<-10?'Good — your spending is trending down.':
         'Spending is relatively stable.')
      )
    );

    // Mini bar chart of weekly spend
    const W = Math.min(window.innerWidth-72, 420);
    const H = 80;
    const showWeeks = weeks.slice(-12);
    const maxAmt = Math.max(...showWeeks.map(([,v])=>v),1);
    const barW = Math.max(4, iW => iW/showWeeks.length*0.7);
    const iW2 = W-8;
    const gap2 = iW2/showWeeks.length;
    const bars = showWeeks.map(([wk,amt],i)=>{
      const x = 4+i*gap2+(gap2-Math.max(4,gap2*0.7))/2;
      const bw = Math.max(4,gap2*0.7);
      const bh = (amt/maxAmt)*(H-10);
      const isRecent = i>=showWeeks.length-4;
      return `<rect x="${x}" y="${H-bh}" width="${bw}" height="${bh}" fill="${isRecent?'var(--green)':'var(--surface3)'}" rx="3"/>`;
    }).join('');
    const chartSvg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="overflow:visible;margin:10px 0">${bars}
      <text x="4" y="${H+14}" fill="#555" font-size="9" font-family="Space Grotesk">12 weeks ago</text>
      <text x="${W}" y="${H+14}" text-anchor="end" fill="var(--green)" font-size="9" font-family="Space Grotesk">recent (green)</text>
    </svg>`;
    summaryCard.innerHTML += chartSvg;
    wrap.append(el('div',{class:'section-hdr'},'Weekly spending'), summaryCard);

    // Recommendations
    if(recs.length){
      const recCard = el('div',{class:'card',style:{marginBottom:'12px'}});
      recCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},'💡 Where you can cut'));
      for(const r of recs){
        const row = el('div',{style:{display:'flex',gap:'10px',alignItems:'flex-start',marginBottom:'12px',paddingBottom:'12px',borderBottom:'1px solid var(--border)'}});
        row.append(
          el('div',{style:{fontSize:'20px',flexShrink:'0'}},r.icon),
          el('div',{style:{flex:'1'}},
            el('div',{style:{fontSize:'13px',lineHeight:'1.5',color:'var(--text)'}},r.msg),
            r.saving>0?el('div',{style:{fontSize:'11px',color:'var(--green)',marginTop:'3px',fontWeight:'600'}},'Potential saving: '+fmt(r.saving)+'/mo'):el('span')
          )
        );
        recCard.append(row);
      }
      const totalSaving = recs.reduce((s,r)=>s+(r.saving||0),0);
      if(totalSaving>0) recCard.append(
        el('div',{style:{display:'flex',justifyContent:'space-between',paddingTop:'4px',fontWeight:'700',fontSize:'14px'}},
          el('span',{style:{color:'var(--text2)'}},'Total potential monthly saving'),
          el('span',{style:{color:'var(--green)'}},fmt(totalSaving))
        )
      );
      wrap.append(el('div',{class:'section-hdr'},'Recommendations'), recCard);
    }

    // Category breakdown
    const catCard = el('div',{class:'card',style:{marginBottom:'12px'}});
    catCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},'Spending by category (last 4 weeks)'));
    const maxCat = Math.max(...catInsights.map(c=>c.recent),1);
    for(const c of catInsights.filter(ci=>ci.recent>0).slice(0,8)){
      const pct = Math.round(c.recent/maxCat*100);
      const chgColor = c.change>30?'var(--red)':c.change>10?'var(--amber)':'var(--text3)';
      const row = el('div',{style:{marginBottom:'12px'}});
      row.innerHTML=`
        <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">
          <span style="font-weight:500">${c.cat}</span>
          <div style="text-align:right">
            <span style="font-family:'Space Mono',monospace;font-weight:700">${fmt(c.recent)}</span>
            ${c.prev>0?`<span style="font-size:11px;color:${chgColor};margin-left:6px">${c.change>0?'+':''}${Math.round(c.change)}%</span>`:''}
          </div>
        </div>
        <div style="background:var(--surface2);border-radius:100px;height:5px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${c.change>30?'var(--red)':'var(--green)'};border-radius:100px"></div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${fmt(c.weekly)}/week</div>`;
      catCard.append(row);
    }
    wrap.append(el('div',{class:'section-hdr'},'By category'), catCard);

    // Top merchants
    const mCard = el('div',{class:'card'});
    mCard.append(el('div',{style:{fontWeight:'700',fontSize:'15px',marginBottom:'12px'}},'Top merchants (last 4 weeks)'));
    for(const [m,data2] of topMerchants){
      mCard.append(el('div',{class:'balance-row'},
        el('div',{},
          el('div',{class:'balance-label'},m),
          el('div',{style:{fontSize:'11px',color:'var(--text3)'}},data2.count+' transactions · avg '+fmt(data2.total/data2.count))
        ),
        el('div',{class:'balance-value',style:{color:'var(--red)'}},fmt(data2.total))
      ));
    }
    wrap.append(el('div',{class:'section-hdr'},'Top merchants'), mCard);
  });

  return content;
}

    if(!debts.length){
      listWrap.append(el('div',{class:'card',style:{textAlign:'center',padding:'24px',color:'var(--text2)',fontSize:'13px'}},
        'No debts tracked yet. Add people who owe you money below.'));
      return;
    }

    const totalOwed = debts.reduce((s,d)=>s+Math.max(0,d.amount-d.paid),0);
    const totalPaid = debts.reduce((s,d)=>s+d.paid,0);
    const totalOriginal = debts.reduce((s,d)=>s+d.amount,0);

    // Summary card
    summaryWrap.append(el('div',{class:'card',style:{marginBottom:'12px'}},
      el('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}},
        el('div',{},
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'4px',textTransform:'uppercase',letterSpacing:'1px'}},'Total owed to you'),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'22px',color:'var(--green)'}},fmt(totalOwed))
        ),
        el('div',{},
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginBottom:'4px',textTransform:'uppercase',letterSpacing:'1px'}},'Received so far'),
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'22px',color:'var(--text)'}},fmt(totalPaid))
        )
      ),
      totalOwed>0?el('div',{style:{marginTop:'12px',fontSize:'13px',color:'var(--text2)',lineHeight:'1.6'}},
        'Once fully paid, your balance would be '+fmt((appData.balances?.current||0)+totalOwed)+
        '. If it goes to savings, your goals pot would reach '+fmt((appData.balances?.florasii||0)+totalOwed)+'.'):el('span')
    ));

    for(const d of debts){
      const remaining = Math.max(0, d.amount - d.paid);
      const pct = Math.min(100, Math.round(d.paid/d.amount*100));
      const isCleared = remaining === 0;

      const card = el('div',{class:'card',style:{marginBottom:'8px',borderLeft:'3px solid '+(isCleared?'var(--text3)':'var(--green)')}});

      // Header
      card.append(el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}},
        el('div',{},
          el('div',{style:{fontWeight:'700',fontSize:'15px',color:isCleared?'var(--text2)':'var(--text)'}},d.person),
          d.description?el('div',{style:{fontSize:'12px',color:'var(--text3)',marginTop:'1px'}},d.description):el('span')
        ),
        el('div',{style:{textAlign:'right'}},
          el('div',{style:{fontFamily:"'Space Mono',monospace",fontWeight:'700',fontSize:'16px',color:isCleared?'var(--text3)':'var(--green)'}},
            isCleared?'Cleared ✓':fmt(remaining)+' left'),
          el('div',{style:{fontSize:'11px',color:'var(--text3)',marginTop:'2px'}},fmt(d.paid)+' of '+fmt(d.amount)+' received')
        )
      ));

      // Progress bar
      card.append(
        el('div',{class:'prog-wrap',style:{marginBottom:'8px'}},
          el('div',{class:'prog-fill',style:{width:pct+'%',background:isCleared?'var(--text3)':'var(--green)'}})
        )
      );

      // Payment log
      if(d.payments&&d.payments.length){
        const logWrap = el('div',{style:{marginBottom:'10px'}});
        for(const p of d.payments.slice(-5)){
          logWrap.append(el('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'var(--text2)',padding:'3px 0'}},
            el('span',{},p.date+' — '+(p.note||'Payment')),
            el('span',{style:{color:'var(--green)',fontFamily:"'Space Mono',monospace"}},'+'+fmt(p.amount))
          ));
        }
        card.append(logWrap);
      }

      // Goal impact if earmarked for savings
      const florasiiNow2 = (appData.accounts||[]).filter(a=>a.type==='savings').reduce((s,a)=>s+a.balance,0) || (appData.balances?.florasii||0);
      const goals2 = (appData.goals||[]).filter(g=>g.active!==false&&g.target&&g.deadline);
      if(!isCleared && d.earmarkForSavings && remaining>0 && goals2.length){
        const newSavings = florasiiNow2 + remaining;
        const impactDiv = el('div',{style:{background:'var(--green-dim)',borderRadius:'10px',padding:'10px 12px',marginBottom:'10px',fontSize:'12px',lineHeight:'1.6'}});
        impactDiv.innerHTML = `💰 If ${fmt(remaining)} goes to savings: pot reaches <strong style="color:var(--green)">${fmt(newSavings)}</strong><br>`;
        for(const g of goals2){
          const share = g.target/goals2.reduce((s,x)=>s+x.target,0);
          const myShare = newSavings*share;
          const pct = Math.min(100,Math.round(myShare/g.target*100));
          const deadline = new Date(g.deadline);
          const daysLeft = Math.ceil((deadline-new Date())/86400000);
          impactDiv.innerHTML += `<span style="color:var(--text2)">${g.name}: ${pct}% of target · ${daysLeft}d remaining</span><br>`;
        }
        card.append(impactDiv);
      }

      // Earmark toggle
      if(!isCleared){
        const earmarkRow = el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}});
        const earmarkBtn = el('button',{style:{
          background: d.earmarkForSavings?'var(--green)':'var(--surface2)',
          color: d.earmarkForSavings?'#000':'var(--text2)',
          border: d.earmarkForSavings?'none':'1px solid var(--border)',
          borderRadius:'100px',padding:'5px 12px',fontSize:'12px',fontWeight:'600'
        }}, d.earmarkForSavings?'✓ Goes to savings':'Put toward savings?');
        earmarkBtn.addEventListener('click',async()=>{
          const updated = debts.map(x=>x.id===d.id?{...x,earmarkForSavings:!x.earmarkForSavings}:x);
          debts=updated; appData.debts=updated;
          await save({...appData,debts:updated});
          renderDebts();
        });
        earmarkRow.append(earmarkBtn);
        card.append(earmarkRow);
      }

      // Log payment button
      if(!isCleared){
        const payRow = el('div',{style:{display:'flex',gap:'8px',alignItems:'center'}});
        const payInp = el('input',{inputmode:'decimal',placeholder:'Amount received (£)',style:{flex:'1',fontSize:'13px',padding:'8px 12px'}});
        const payNoteInp = el('input',{placeholder:'Note (optional)',style:{flex:'1',fontSize:'13px',padding:'8px 12px'}});
        const logBtn = el('button',{style:{background:'var(--green)',color:'#000',borderRadius:'10px',padding:'8px 14px',fontWeight:'700',fontSize:'13px',flexShrink:'0'}},'Log');
        logBtn.addEventListener('click',async()=>{
          const amt = parseFloat(payInp.value)||0;
          if(!amt) return;
          const payment = {amount:amt, date:new Date().toISOString().slice(0,10), note:payNoteInp.value.trim()||null};
          const updated = debts.map(x=>x.id===d.id?{
            ...x,
            paid: x.paid+amt,
            payments:[...(x.payments||[]),payment]
          }:x);
          debts = updated;
          appData.debts = updated;
          await save({...appData, debts:updated});
          payInp.value=''; payNoteInp.value='';
          renderDebts();
        });
        payRow.append(payInp, payNoteInp, logBtn);
        card.append(payRow);
      }

      // Delete
      const delBtn = el('button',{style:{background:'none',color:'var(--text3)',fontSize:'12px',padding:'4px 0',marginTop:'8px'}},'Remove');
      delBtn.addEventListener('click',async()=>{
        if(!confirm('Remove debt for '+d.person+'?')) return;
        debts = debts.filter(x=>x.id!==d.id);
        appData.debts=debts;
        await save({...appData,debts});
        renderDebts();
      });
      card.append(delBtn);
      listWrap.append(card);
    }
  }
  renderDebts();

  // Add debt form
  const formCard = el('div',{class:'card'});
  formCard.innerHTML=`<div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;font-family:'Space Grotesk',sans-serif;font-weight:700">Add debt</div>`;
  const personInp = el('input',{placeholder:'Who owes you? (e.g. Mum, Dad)',style:{marginBottom:'10px'}});
  const amtInp   = el('input',{inputmode:'decimal',placeholder:'Total amount owed (£)',style:{marginBottom:'10px'}});
  const descInp  = el('input',{placeholder:'What for? (optional)',style:{marginBottom:'14px'}});
  const addBtn   = el('button',{class:'btn-primary'},'Add debt');
  addBtn.addEventListener('click',async()=>{
    if(!personInp.value.trim()||!amtInp.value) return;
    const newDebt = {
      id:uid(), person:personInp.value.trim(),
      amount:parseFloat(amtInp.value)||0, paid:0,
      description:descInp.value.trim()||null,
      payments:[], createdAt:new Date().toISOString()
    };
    debts=[...debts,newDebt];
    appData.debts=debts;
    await save({...appData,debts});
    personInp.value=''; amtInp.value=''; descInp.value='';
    addBtn.textContent='Added ✓';
    setTimeout(()=>{ addBtn.textContent='Add debt'; renderDebts(); },1200);
  });
  formCard.append(personInp,amtInp,descInp,addBtn);

  content.append(summaryWrap, listWrap, el('div',{class:'section-hdr'},'Add Debt'), formCard);
  return content;
}

        border: 'none', borderRadius:'100px', padding:'7px 16px',

      bar.append(btn);

      {icon:'🤝', label:'Money Owed to Me',  sub:'Track debts from family and friends',   tab:'_debts'},

      {icon:'🔍', label:'Spending Insights',   sub:'Weekly spend, trends, cut suggestions', tab:'_spending'},

  function setTab(t){
    tab=t;
    homeBtn.className ='nav-btn'+(t==='home'?' active':'');
    moneyBtn.className='nav-btn'+(['money','_accounts','_transactions','_analytics'].includes(t)?' active':'');
    planBtn.className ='nav-btn'+(['plan','_calendar','_goals'].includes(t)?' active':'');
    workBtn.className ='nav-btn'+(t==='work'?' active':'');
    moreBtn.className ='nav-btn'+(['more','_statements','_recurring','_merchants','_lifestyle','_ask','_trends','_settings','_bulkcat','_debts','_spending'].includes(t)?' active':'');

    body.innerHTML='';
    const userLabel = (appData.profile?.displayName || currentUser?.email?.split('@')[0] || 'My') + '\'s Account';
    const header = el('div',{class:'page-header'});
    const makeHeader = (title, action) => {
      header.append(el('div',{style:{flex:'1'}},

        el('div',{class:'page-title'},title)
      ));
      if(action) header.append(action);

      makeHeader('Financial Freedom', payBtn2);
      body.append(header, overviewScreen()); // always re-renders fresh from appData

        moneySubTab=id; setTab('_'+id);
      });
      body.append(header, subBar);
      if(moneySubTab==='accounts')     body.append(accountsScreen());
      else if(moneySubTab==='transactions') body.append(transactionsScreen());
      else body.append(analyticsScreen());

    } else if(t==='plan'||t==='_calendar'||t==='_goals'){
      if(t!=='plan') planSubTab = t.slice(1);
      makeHeader('Plan');
      const subBar = makeSubTabs([['calendar','Calendar'],['goals','Goals']], planSubTab, id=>{
        planSubTab=id; setTab('_'+id);

      body.append(header, subBar);
      if(planSubTab==='calendar') body.append(calendarScreen());
      else body.append(goalsScreen());

    } else if(t==='work'){
      makeHeader('Hours & Pay');
      body.append(header, hoursScreen());

    } else if(t==='more'){
      makeHeader('More');
      body.append(header, moreScreen());

    // ── More sub-screens ──
    } else if(t==='_bulkcat'){    makeHeader('Sort Transactions'); body.append(header, bulkCategoriseScreen());
    } else if(t==='_debts'){       makeHeader('Money Owed to Me'); body.append(header, debtScreen());
    } else if(t==='_spending'){     makeHeader('Spending Insights'); body.append(header, spendingInsightsScreen());
    } else if(t==='_statements'){ makeHeader('Import Statement'); body.append(header, statementsScreen());
    } else if(t==='_recurring'){  makeHeader('Recurring');        body.append(header, recurringScreen());
    } else if(t==='_merchants'){  makeHeader('Merchant Rules');   body.append(header, merchantRulesScreen());
    } else if(t==='_lifestyle'){  makeHeader('Lifestyle');        body.append(header, lifestyleScreen());
    } else if(t==='_ask'){        makeHeader('Ask My Finances');  body.append(header, askScreen());
    } else if(t==='_trends'){     makeHeader('Trends');           body.append(header, trendsScreen());
    } else if(t==='_settings'){   makeHeader('Settings');         body.append(header, settingsScreen());
    }
  }

  window._setTab = setTab;

  function scrollActiveTab(){
    const activeBtn = nav.querySelector('.nav-btn.active');
    if(activeBtn) activeBtn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  }

  homeBtn.addEventListener('click',()=>{  setTab('home');  setTimeout(scrollActiveTab,50); });
  moneyBtn.addEventListener('click',()=>{ setTab('money'); setTimeout(scrollActiveTab,50); });
  planBtn.addEventListener('click',()=>{  setTab('plan');  setTimeout(scrollActiveTab,50); });
  workBtn.addEventListener('click',()=>{  setTab('work');  setTimeout(scrollActiveTab,50); });
  moreBtn.addEventListener('click',()=>{  setTab('more');  setTimeout(scrollActiveTab,50); });
  payBtn.addEventListener('click',()=>render(paydayFlow()));

  const nav = el('div',{class:'nav'}, homeBtn, moneyBtn, payBtn, planBtn, workBtn, moreBtn);
  wrap.append(body, nav);
  setTab(startTab);
  setTimeout(scrollActiveTab, 100);
  render(wrap);
}

auth.onAuthStateChanged(async user => {
  const mySession = ++sessionId;   // supersedes anything the previous user started
  currentUser = user;
  appData = null;                  // drop the previous user's data immediately
  resetUserDerived();              // and anything computed from it
  if(window._setTab) window._setTab = null;
  if(!user){ render(authScreen()); return; }
  render(el('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh',color:'var(--text3)',fontSize:'14px'}},'Loading…'));
  const snap = await db.ref('users/'+user.uid).once('value');
  if(mySession !== sessionId) return;   // a different user signed in mid-load
  const val = snap.val();
  appData = val ? {
    ...DEFAULT_DATA,
    ...val,
    balances:{...DEFAULT_DATA.balances,...(val.balances||{})},
    subscriptions: Array.isArray(val.subscriptions) ? val.subscriptions : [],
    paychecks: Array.isArray(val.paychecks) ? val.paychecks : [],
    debts: Array.isArray(val.debts) ? val.debts : [],
    lifestyleRequirements: Array.isArray(val.lifestyleRequirements) ? val.lifestyleRequirements : [],
    goals: Array.isArray(val.goals) ? val.goals : [],
    habits: val.habits || {lastPaycheckLog:null, lastReview:null, streak:0, xp:0, level:1, achievements:[]},
  } : {
    ...DEFAULT_DATA,
    debts: [],
    lifestyleRequirements: [],
    goals: [],
    habits: {lastPaycheckLog:null, lastReview:null, streak:0, xp:0, level:1, achievements:[]},
  };
  // Ensure profile data (display name) is saved if new user
  if(!val || !val.profile){
    const displayName = user.displayName || user.email.split('@')[0];
    await db.ref('users/'+user.uid+'/profile').set({displayName, email:user.email, createdAt: new Date().toISOString()});
    appData.profile = {displayName, email:user.email};
  }
  mainScreen();
  // Sync banking balances if connected
  if(window.FF_BANKING_URL){
    getValidAccessToken().then(t=>{ if(t) syncBankingBalances().catch(()=>{}); }).catch(()=>{});
  }

  // ── Card settlement detection ──
  // Check if a card payment was due recently and prompt the user to confirm
  // whether it has cleared. Runs once per session, only after the due date.
  (async()=>{
    try {
      const stmtSnap = await db.ref('users/'+user.uid+'/statements').once('value');
      const cardStmts = Object.values(stmtSnap.val()||{})
        .filter(s=>(s.statementKind==='credit_card'||s.sourceBank==='Barclaycard')
                 && s.statementBalance!=null && s.paymentDue)
        .sort((a,b)=>(b.periodEnd||'').localeCompare(a.periodEnd||''));
      const latest = cardStmts[0];
      if(!latest) return;

      const due = new Date(latest.paymentDue);
      if(isNaN(due)) return;
      const now = new Date();
      const daysPast = Math.floor((now - due) / 86400000);

      // Only prompt if due date was 0-7 days ago
      if(daysPast < 0 || daysPast > 7) return;

      // Already confirmed cleared? Check a flag in appData
      const clearedKey = 'cardCleared_'+latest.statementId;
      if(appData[clearedKey]) return;

      // Check if a matching debit already exists (auto-detect)
      const txSnap = await db.ref('users/'+user.uid+'/transactions').once('value');
      const txns = Object.values(txSnap.val()||{});
      const alreadyCleared = txns.some(t=>
        t.direction==='debit' && t.sourceType!=='credit_card' &&
        Math.abs(t.amount - latest.statementBalance) < 1 &&
        Math.abs(new Date(t.postingDate) - due) / 86400000 <= 5
      );

      if(alreadyCleared){
        // Auto-detected — update silently without prompting
        const accts = appData.accounts||[];
        if(accts.length){
          const updated = accts.map(a=>{
            if(a.type==='credit_card')
              return {...a, balance:Math.max(0,(a.balance||0)-latest.statementBalance),
                updatedAt:now.toISOString()};
            if(inferRole(a)==='card_pot')
              return {...a, balance:Math.max(0,(a.balance||0)-latest.statementBalance),
                updatedAt:now.toISOString()};
            return a;
          });
          await save({...appData, accounts:updated, [clearedKey]:true});
        }
        return;
      }

      // Not auto-detected — show prompt after a short delay so the app loads first
      setTimeout(()=>{
        if(mySession !== sessionId) return; // user switched accounts

        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9000;display:flex;align-items:flex-end;justify-content:center;padding:20px';

        const sheet = document.createElement('div');
        sheet.style.cssText = 'background:var(--surface);border-radius:20px 20px 16px 16px;padding:24px 20px;width:100%;max-width:480px;border:1px solid var(--line)';

        const title = document.createElement('div');
        title.style.cssText = 'font-size:17px;font-weight:700;margin-bottom:8px';
        title.textContent = '💳 Card payment due '+latest.paymentDue;

        const body = document.createElement('div');
        body.style.cssText = 'font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:20px';
        body.textContent = 'Your '+fmt(latest.statementBalance)+' Barclaycard payment '+(daysPast===0?'is due today':daysPast===1?'was due yesterday':'was due '+daysPast+' days ago')+'. Has it left your account?';

        const yesBtn = document.createElement('button');
        yesBtn.style.cssText = 'width:100%;background:var(--accent);color:#000;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-bottom:10px';
        yesBtn.textContent = 'Yes — update my balances';

        const noBtn = document.createElement('button');
        noBtn.style.cssText = 'width:100%;background:var(--surface-2);color:var(--ink-2);padding:12px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--line);cursor:pointer';
        noBtn.textContent = 'Not yet — remind me later';

        yesBtn.addEventListener('click', async()=>{
          overlay.remove();
          const accts = appData.accounts||[];
          if(accts.length){
            const updated = accts.map(a=>{
              if(a.type==='credit_card')
                return {...a, balance:Math.max(0,(a.balance||0)-latest.statementBalance),
                  updatedAt:now.toISOString()};
              if(inferRole(a)==='card_pot')
                return {...a, balance:Math.max(0,(a.balance||0)-latest.statementBalance),
                  updatedAt:now.toISOString()};
              return a;
            });
            await save({...appData, accounts:updated, [clearedKey]:true});
          } else {
            // Legacy balances fallback
            const b = {...(appData.balances||{})};
            b.creditCard = Math.max(0,(b.creditCard||0)-latest.statementBalance);
            b.personalSavings = Math.max(0,(b.personalSavings||0)-latest.statementBalance);
            await save({...appData, balances:b, [clearedKey]:true});
          }
          // Refresh home screen
          if(window._setTab) window._setTab('home');
        });

        noBtn.addEventListener('click', ()=>{ overlay.remove(); });

        sheet.append(title, body, yesBtn, noBtn);
        overlay.append(sheet);
        document.body.appendChild(overlay);
      }, 2000);

    } catch(e){ console.error('Card settlement check failed:', e); }
  })();

  // Silently update subscription billing dates from all existing transactions
  db.ref('users/'+user.uid+'/transactions').limitToLast(500).once('value').then(snap=>{
    // By the time this resolves the user may have signed out or switched
    if(mySession !== sessionId || !currentUser || currentUser.uid !== user.uid) return;
    const val = snap.val();
    if(val) updateSubscriptionBillingDates(Object.values(val), user.uid);
  });

  // Seed default goals if none exist and this is Lawrence's account
  // (Each user sets their own goals — this only runs once when goals array is empty)
  if(!appData.goals || appData.goals.length === 0){
    // Leave empty — user will add their own via Goals screen
    // Lawrence can add his Florasii goals from the Goals tab
  }
});
</script>
</body>
</html>
